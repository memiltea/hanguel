.\\n♬ 민하다 - 좀 미련하다.\\n♬ 투미하다 - 어리석고 둔하다.\\n♬ 꼭하다 - 정직하고 안상하다.\\n♬ 꼼바지런하다 - 일을 잘 하지는 못하나, 놀지 않고 부지런하게 꼼꼼히 하다.\\n♬ 바자위다 - 성질이 너무 알뜰하여 너그러운 맛이 없다.\\n♬ 꼼꼼쟁이 - 성질이 괘 잘고 칠칠한 사람.\\n♬ 옹종하다 - 마음이 좁고 모양이 오종종하다.\\n♬ 깐지다 - 성질이 깐깐하고 다라지다.\\n♬ 괴까닭스럽다 - 괴상하고 까닭스럽다.\\n♬ 곰팡스럽다 - 사람의 하는 짓이 괴상하고 궁벽스럽다.\\n♬ 돈바르다 - 마음이나 성질이 너그럽지 못하고 까다롭다.\\n♬ 푸접없다 - 남에게 대하여 포용성, 붙임성, 또는 엉너리가 없고 쌀쌀하기만 하다.\\n♬ 성마르다 - 도량이 좁고 성질이 급하다.\\n♬ 아귀세다 - 뜻이 굳어 남에게 잘 휘어들지 아니하다.\\n♬ 암기 - 암상스러운 마음.\\n♬ 애성이 - 분나고 성나는 감정.\\n♬ 피새내다 - 작은 일에 성을 잘 내다.\\n- 사전속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"사람의 겉모습을 나타내는 말 3","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407431&page=27","sourceText":"▶ 옴포동이같다. - 어린애가 살이 올라 오목오목하고 포동포동하다.\\n▶ 메부수수하다 - 메떨어지고 시골뜨기의 모양이 있다.\\n▶ 선발 - 집 안에서 종일 서서 일하느라고 돌아다니는 발.\\n▶ 발샅 - 발가락의 사이.\\n▶ 보암보암 - 이모저모로 보아서 짐작할 수 있는 겉모양.\\n▶ 이렁성 저렁성 - 이런 모양인 듯 저런 모양인 듯.\\n▶ 몸맨두리 - 몸의 모양과 태도.\\n▶ 선바람 - 지금 차리고 나선 그대로의 차림새.\\n▶ 감궂다 - 음충맞게 험상궂다.\\n▶ 고비늙다 - 한도가 지나게 늙다.\\n▶ 배젊다 - 나이가 아주 젊다.\\n▶ 깨나른하다 - 기운이 없어 늘쩍지근하다.\\n▶ 날짝지근하다 - 더할 수 없이 나른하다.\\n▶ 나라지다 - 기운이 풀리어 제몸을 바로 빳빳이 가지지 못하고 나른하여지다.\\n▶ 노작지근하다 - 몹시 노곤하다.\\n▶ 딴기적다 - 기운이 모자라 냅뜰 힘이 없다.\\n▶ 머줍다 - 동작이 둔하고 느리다.\\n▶ 메뜨다 - 밉살스럽도록 동작이 둔하다.\\n▶ 아질아질하다 - 현기가 나서 정신이 자꾸 어지럽다.\\n▶ 끄레발 - 단정하지 못한 몸차림.\\n▶ 게접스럽다 - 조금 너절하고 더럽다.\\n▶ 홑지다 - 너더분하지 않고 홋홋하다.\\n▶ 몰골스럽다 - 모양새가 볼품이 없는 듯하다.\\n▶ 만조하다 - 생김새나 차림새가 초라하고 치신없다.\\n▶ 짱장하다 - 생김새가 옹골차고 동작이 매우 굳센 듯하다.\\n▶ 지러지다 - 훤출하게 자라지 못하고 오종종해지다.\\n▶ 둘되다 - 상냥하지 못하고 미련하고 무디게 생기다.\\n▶ 어험스럽다 - 짐짓 위엄 있어 보이다.\\n▶ 멋질리다 - 아주 멋들어진 기상을 지니다.\\n▶ 우환에 - 제 꼴에 게다가.\\n▶ 깨깨 - 몹시 여위어 마른 모양.\\n▶ 사시랑이 - 가늘고 약한 사람이나 물건.\\n▶ 무살 - 단단하지 못하고 물렁물렁하게 찐 살.\\n▶ 흐드러지다 - 썩 탐스럽다.\\n▶ 부둥하다 - 퉁퉁하게 살이 찌고 부드럽다.\\n▶ 흐벅지다 - 탐스럽게 두툼하고 부드럽다.\\n▶ 미렷하다 - 살이 쪄서 군턱이 져 있다.\\n▶ 걸때 - 사람의 몸피의 크기.\\n▶ 몸피 - 몸 둘레의 굵기.\\n▶ 모이다 - 작고도 여무지다.\\n▶ 걸까리지다 - 크고 실팍하다.\\n▶ 도담하다 - 어린애 따위가 탐스럽고 야무지다.\\n▶ 부얼부얼 - 살이 쪄서 탐스럽고 복스러운 모양.\\n▶ 애동대동하다 - 매우 젊다.\\n▶ 중씰하다 - 중년이 넘어 보이다.\\n▶ 늙바탕 - 늙어버린 판.\\n▶ 귀얄잡이 - 구레나룻이 많이 난 사람의 별명.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"사람의 겉모습을 나타내는 말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407335&page=27","sourceText":"▷ 데군하다 - 기운이 지쳐서 눈이 뒤로 달리고 정기가 없다.\\n▷ 만경되다 - 눈에 정기가 없어지다.\\n▷ 찔꺽눈 - 늘 진물진물한 눈.\\n▷ 눈씨 - 쏘아보는 시선의 힘.\\n▷ 도끼눈 - 미워서 쏘아보는 눈.\\n▷ 벽장코 - 콧등이 넓적하고 그 가가 우묵하게 팬 코.\\n▷ 밤볼 - 볼록하게 살이 많이 찐 뺨의 볼.\\n▷ 나릇 - 입가 · 턱 · 뺨에 난 털의 총칭.\\n▷ 털수세 - 털이 많이 나서 험상궂게 보이는 수염.\\n▷ 신관 - '얼굴'의 존칭.\\n▷ 조쌀하다 - 노인의 얼굴이 깨끗하고 조촐하다.\\n▷ 어글어글 - 얼굴의 각 구멍새가 널찍널찍한 모양.\\n▷ 너벳벳하다 - 큰 얼굴이 너부죽하고 덕스러워 보이다.\\n▷ 밀알지다 - 얼굴이 패등패등하게 생기다.\\n▷ 반주그레하다 - 얼굴의 생김새 같은 것이 겉으로 보기에 반반하다.\\n▷ 컁컁하다 - 얼굴이 몹시 여위다.\\n▷ 광대등걸 - 몹시 파리해져서 뼈만 남은 얼굴.\\n▷ 이쩍 - 오래 굳어 붙은 이똥.\\n▷ 잇집 - 이가 박힌 구멍.\\n▷ 새되다 - 목소리가 날카롭다.\\n▷ 탑소록하다 - 수염 같은 것이 어수선하게 나 있다.\\n▷ 감숭하다 - 드물게 난 짧은 털 같은 것이 가무스름하다.\\n▷ 회목 - 손목이나 발목의 잘록한 부분.\\n▷ 범아귀 - 엄지손가락과 둘쨰손가락과의 사이.\\n▷ 손샅 - 손가락 사이.\\n▷ 살손 - 무슨 일을 정성껏 하는 손.\\n▷ 살망하다 - 아랫도리가 가늘게 상큼하다.\\n▷ 설멍하다 - 아랫도리가 가늘고 길어 어울리지 아니하다.\\n▷ 봉충다리 - 사람이나 물건의 한족이 짧은 다리.\\n▷ 허전거리다 - 다리에 힘이 빠져서 쓰러질 듯이 걷다.\\n▷ 진허리 - 허리의 곱꺾이는 부분.\\n▷ 발주저리 - 해어진 버선을 신은 모양이 너줄너줄하게 주저리처럼 발을 덮은 모양.\\n▷ 타기다 - 닮다.\\n▷ 엄장 - 풍채 있는 큰 덩치.\\n▷ 거방지다 - 체격이 큼직하고 동작이 묵직하다.\\n▷ 끌밋하다 - 칠칠하고 시원스럽게 잘 생기다.\\n▷ 당차다 - 몸은 작고도 힘은 세다.\\n▷ 살팍지다 - 근육이 살이 찌고 단단하다.\\n▷ 아리잠직하다 - 키가 작고 외양이 얌전하고 어린 태도가 있다.\\n▷ 오동보동하다 - 오동통하고 보동보동하다.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"사람의 겉모습을 나타내는 말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407280&page=27","sourceText":"▶ 두께머리 - 머리를 잘못 깎아 층이 져서 뚜껑을 덮은 것처럼 보기 흉하게 된 머리.\\n▶ 활새머리 - 아래만 돌려 깎는 더벅머리.\\n▶ 가랑머리 - 두 가닥으로 갈라 땋아 늘인 머리.\\n▶ 떠꺼머리 - 장가나 시집갈 나이가 넘은 총각이나 처녀가 땋아늘인 긴 머리.\\n▶ 자분치 - 귀 앞의 짧은 머리.\\n▶ 살쩍 - 뺨 위 귀 앞에 난 머리털.\\n▶ 감태같다 - 머리가 까맣고 윤기가 나다.\\n▶ 꼭뒤 - 뒤통수의 한가운데.\\n▶ 몽구리 - 바싹 깎은 머리.\\n▶ 북상투 - 아무렇게나 끌어 올려서 짠 상투, 또는 여자의 아무렇게나 끌어 올려 뭉뚱그린 머리털.\\n▶ 나색 - 감정이 나타나는 얼굴빛.\\n▶ 민낯 - 단장을 하지 아니한 여자들의 얼굴.\\n▶ 고리눈 - 눈동자의 둘레에 흰 테가 둘린 눈.\\n▶ 알제기다 - 눈동자에 흰 점이 생기다.\\n▶ 눈부처 - 눈동자에 비치어 나타난 사람의 형상.\\n▶ 지꺼분하다 - 눈이 깨끗하지 못하고 흐릿하다.\\n▶ 깔뜨다 - 눈을 아래쪽으로 내려 뜨다.\\n▶ 갈퀴눈 - 화가 나서 눈시울에 모가 난 험상궂은 눈.\\n▶ 간잔지런하다 - 졸리거나 또는 술에 취하여 눈시울이 가늘게 처지다.\\n▶ 수리수리 - 열에 떠서 시력이 희미한 모양.\\n▶ 가량가량하다 - 얼굴이 야윈 듯하면서도 탄력성 있게 부드러워 보이다.\\n▶ 갈걍갈걍하다 - 얼굴에 나타난 체질이 강기있게 가량가량하다.\\n▶ 가칫하다 - 야위고 윤기가 없어 앙글어지지 못하다.\\n▶ 결곡하다 - 얼굴의 생김이나 마음 쓰는 것이 깨끗하고 여무져서 허술한 데가 없다.\\n▶ 나부대대하다 - 얼굴이 둥글반반하고 나부죽하다..\\n▶ 나뱃뱃하다 - 작은 얼굴이 나부죽하고 덕기가 있어 보이다.\\n▶ 납대대하다 - 얼굴이 동글반반하고 납작하다.\\n▶ 해납작하다 - 얼굴이 하얗고 납작하다.\\n▶ 해반주그레하다 - 얼굴이 해말쑥하고 반주그레하다.\\n▶ 도리암직하다 - 얼굴이 나부죽하고 키가 작달막하며 몸에 맵시가 있다.\\n▶ 초강초강하다 - 얼굴 생김이 갸름하고 살이 적다.\\n▶ 팔초하다 - 얼굴이 좁고 턱이 빠르다.\\n▶ 푼더분하다 - 얼굴이 두툼하고 탐스럽다.\\n▶ 해낙낙하다 - 마음이 흐뭇하여 기쁜 기색이 있다.\\n▶ 훔훔하다 - 얼굴에 만족한 표정을 띠다.\\n▶ 가선지다 - 눈시울에 주름이 생기다.\\n▶ 갈쌍하다 - 눈물이 거의 눈가에 넘칠 듯이 가득하다.\\n▶ 대꾼하다 - 기운이 지쳐 눈이 뒤로 달리고 정기가 없다.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"동물 기타 곤충에 관계되는 말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407127&page=27","sourceText":"◆ 우걱뿔 - 안으로 구부러진 뿔.\\n◆ 우바꾸리 - 아래로 뻗친 뿔.\\n◆ 엄니 - 사나운 식육동물의 송곳니.\\n◆ 깃주다 - 외양간, 마구간 같은 데에 짚이나 마른풀을 자리로 깔아 주다.\\n◆ 면내다 - 쥐나 개미, 게 따위가 흙구멍을 뚫느라고 흙을 보드랍게 갉아 파내어 놓다.\\n◆ 무이다 - 털이 빠져 살이 드러나다.\\n◆ 이지다 - 물고기나 닭, 돼지 따위가 살쪄서 기름지다.\\n◆ 졸들다 - 발육이 잘 되지 않고 주접이 들다.\\n◆ 자처울다 - 닭이 점점 재우쳐 울다.\\n◆ 일울다 - 일찍 울다.\\n◆ 젊음나다 - 마소가 다리를 저는 병이 생기다.\\n◆ 투그리다 - 짐승이 서로 틀려서 싸우려고 소리를 지르며, 용기를 잔뜩 내다.\\n◆ 장치다 - 말이 누워서 등을 땅에 대고 비비다.\\n◆ 석다 치다 - 재갈을 물리고 채치어 말을 달리다.\\n◆ 시태 - 소에게 실은 짐.\\n◆ 암구다 - 흘레를 붙이다.\\n◆ 자귀 짚다 - 짐승의 발자국을 좇아가다.\\n◆ 가루집 - 여름에 습기 있는 데 오래 둔 곡식가루나 약재 따위에 생긴 벌레가 거미줄 같은 물질을 분비하여 가루를 묻히어 놓고 그 속에서 사는 집.\\n◆ 석벌의 집 - 바위 틈에 지은 벌의 집.\\n◆ 시치미 - 매의 소유자를 밝히기 위하여 주소를 적어서 매꽁지 위 털 속에다 매어 둔 장방형의 뿔.\\n◆ 놀놀하다 - 털이나 싹 따위가 좀스럽고 노랗다.\\n◆ 눌눌하다 - 털이나 싹 따위가 빛이 흐리게 누르다.\\n◆ 함함하다 - 털이 부드럽고 반지르르하다.\\n◆ 부등깃 - 갓난 날짐승 새끼의 다 자라지 못한 약한 깃.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"동물 기타 곤충에 관계되는 말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407041&page=27","sourceText":"◆ 부룩소 - 작은 수소.\\n◆ 부룩송아지 - 길들지 않은 송아지.\\n◆ 엇송아지 - 아직다 자라지 못한 송아지.\\n◆ 엇부룩이 - 아직 큰소가 되지 못한 수송아지.\\n◆ 수냇소 - 송아지를 주고 그것을 기른 뒤에 소의 값을 제하고 도조로 내는 소.\\n◆ 어이 - 짐승의 어미.\\n◆ 불치 - 총으로 잡은 짐승이나 새.\\n◆ 자귀 - 짐승의 발자국.\\n◆ 발타다 - 강아지 같은 것이 처음으로 걸음을 걷기 시작하다.\\n◆ 아즐아즐 - 강아지 같은 것이 꼬리를 휘두르며 비틀비틀 걷는 모양.\\n◆ 동부레기 - 뿔이 날 만한 나이의 송아지.\\n◆ 대창 - 소와 같은 큰 짐승의 대장.\\n◆ 부사리 - 대가리로 잘 받는 버릇이 있는 황소.\\n◆ 악대말 - 불친말.\\n◆ 전나귀 - 발을 절어서 절름거리는 나귀.\\n◆ 본노루 - 오래 묵어서 늙고 큰 노루.\\n◆ 솥발이 - 한 배에 세 마리가 난 강아지.\\n◆ 왼쪽박이 - 뒷발 왼쪽이 흰 짐승.\\n◆ 둘치 - 새끼를 낳지 못하는 암짐승.\\n◆ 열쭝이 - 겨우 날기 시작한 어린 새 새끼.\\n◆ 후림 비둘기 - 동무 비둘기를 꾀어 후리어 들이는 비둘기.\\n◆ 수여리 - 꿀벌의 암컷.\\n◆ 추라치 - 굵고 큰 송사리.\\n◆ 이듭 - 소나 말의 두 살.\\n◆ 사릅 - 말 · 소 · 개 들의 나이의 세 살.\\n◆ 나릅 - 소나 말의 네 살.\\n◆ 아습 - 소나 말의 아홉 살.\\n◆ 삘기살 - 쇠고기의 한 가지.\\n◆ 쇠심떠깨 - 심줄이 섞이어 질긴 쇠고기.\\n◆ 수구레 - 쇠가죽 안에서 뜯어 낸 흠지러기.\\n◆ 아늠 - 뺨의 살을 싸고 있는 고기.\\n◆ 몬다위 - 마소의 어깻죽지.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"초목에 관계되는 말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406938&page=27","sourceText":"◎ 봄베기 - 봄에 벤 나무.\\n◎ 보득솔 - 작달막하고 가지가 많은 소나무.\\n◎ 다복솔 - 가지가 빈틈없이 많이 퍼져 소복하게 된 어린 소나무.\\n◎ 푸새 - 산과 들에 저절로 나서 자란 풀의 통칭.\\n◎ 푸나무 서리 - 풀과 나무가 우거진 사이.\\n◎ 단추 - 단으로 묶은 푸성귀.\\n◎ 모도록 - 채소 · 풀 등의 싹이 뻑뻑하게 난 모양.\\n◎ 땅가물 - 가물어서 푸성귀들이 마르는 재앙.\\n◎ 수리먹다 - 밤 · 도토리 등의 열매의 일부분이 상하여 퍼슬퍼슬하게 되다.\\n◎ 팥노굿 - 팥의 꽃.\\n◎ 풋장 - 가을에 억새, 참나무, 진달래, 그 밖에 잡목의 가지를 쳐서 모은 땔나무.\\n◎ 날단거리 - 풀이나 나숨가지를 베는 길로 곧 묶어서 말린 땐나무.\\n◎ 불땀 - 땔나무의 화력의 열의 정도.\\n◎ 뿔땀머리 - 나무 몸뚱이의 햇빛을 받아서 불땀이 좋게 된 남쪽 부분.\\n◎ 신신하다 - 과실이나 채소 따위가 새롭고 생기가 있다.\\n◎ 나슬나슬하다 - 가늘고 짧으며 보드라운 풀이나 털 따위가 곱게 성기다.\\n◎ 나스르르하다 - 가늘고 짧으며 보드라운 풀이나 털 따위가 성기고 일매져 보이다.\\n◎ 새득새득 - 약간 시들어서 윤기가 없고 빠득빠득한 모양.\\n◎ 소들소들 - 뿌리 따위가 심하게 시들어 마른 모양.\\n◎ 땅내 맡다 - 동물이나 식물이 직접 땅에 닿아서 삶을 얻다.\\n◎ 흙내 맡다 - 옮겨 심은 식물이 새 땅에 뿌리를 박아 생기가 붙다.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"초목에 관계되는 말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406887&page=27","sourceText":"◎ 갈청 - 갈대 줄기의 속에 대청같이 붙어 있는 얇고 흰 막.\\n◎ 갈목 - 갈대의 이삭.\\n◎ 갈품 - 아직 채 피지 아니한 갈꽃이나 꽃피기 전의 갈목.\\n◎ 보드기 - 크게 자라지 못한 어린 나무.\\n◎ 애채 - 나무의 새로 돋은 가지.\\n◎ 숭이 - 꽃 따위가 한 꼭지에 크게 달린 한 덩이.\\n◎ 보굿 - 굵은 나무의 비늘같이 생긴 껍질.\\n◎ 둥치 - 큰 나무의 밑동.\\n◎ 부들기 - 잇댄 부분의 뿌리 쪽.\\n◎ 섶 - 줄기가 가냘픈 식물을 버티느라고 곁들여 꽂아 두는 꼬챙이.\\n◎ 후중 - 품질이 썩 좋은 소나무의 널.\\n◎ 구새먹다 - 살아 있는 나무의 속이 저절로 썩어서 구멍이 뚫리다.\\n◎ 너겁 - 갇힌 물 위에 떠서 몰려 있는 티끌, 지푸라기, 잎사귀 따위.\\n◎ 심메보다 - 산삼의 싹을 찾다.\\n◎ 마들가리 - 나무의 가지가 없는 줄기.\\n◎ 아퀴쟁이 - 가장귀가 진 나무의 가지.\\n◎ 우듬지 - 나무의 꼭대기 줄기.\\n◎ 발매치 - 살아 있는 나무에서 가지아 잎을 베어낸 것이 아니고, 큰 나무를 베어 낸 데에서 쳐낸 굵고도 긴 가지로 된 땔나무.\\n◎ 발매놓다 - 촘촘히 있는 것을 한꺼번에 베어 없애버리다.\\n◎ 죽더끼 - 통나무 겉쪽에서 쪼개 낸 널쪽. 흔히 땔나무로 씀.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"지형 및 광물질에 관계 있는 말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406793&page=27","sourceText":"★ 외지다 - 사람의 왕래가 적어서 으슥하고 궁벽하다.\\n★ 섟 - 물가의 배를 매어 두기 좋은 곳.\\n★ 개어귀 - 강물이나 냇물이 바다로 들어가는 어귀.\\n★ 물목 - 물이 흘러나가거나 흘러들어오는 어귀.\\n★ 묵새 - 물결에 밀리어 한곳에 쌓인 보드라운 모세.\\n★ 면 - 개미 · 쥐 · 개 등이 갉아 파내어 놓은 보들아누 가루흙.\\n★ 명개 - 갯가나 흙탕물이 지나간 자리에 앉은 검고 보드라운 흙.\\n★ 놀란흙 - 한번 파서 손댄 흙.\\n★ 알땅 - 비나 바람을 막을 수 있는 준비가 없는 땅.\\n★ 푸서리 - 덩거칠게 잡풀이 무성한 땅.\\n★ 살피 - 두 땅의 경계선을 간단히 표시한 표.\\n★ 풀등 - 강물 속에 모래가 모여 쌓이고 그 위에 풀이 우거진 곳.\\n★ 솔수펑이 - 솔숲이 있는 곳.\\n★ 펀더기 - 넓은 들.\\n★ 활찐 - 너른 들 등이 매우 시원스럽게 벌어진 모양.\\n★ 버덩 - 높고 평평하며 나무는 없이 잡풀만 많이 우거진 거친들.\\n★ 들대 - 가까운 들녘\\n★ 휘뚤휘뚤 - 길 같은 것이 이리저리 구불구불한 모양.\\n★ 논틀밭틀 - 논두렁이나 밭두렁을 따라서 난, 구불구불한 모양.\\n★ 목목이 - 요긴한 길목마다\\n★ 길처 - 가는 길의 근처 지방.\\n★ 길체 - 한쪽으로 구석진 다리.\\n★ 오슬하다 - 사위가 괴괴하여 무서울 만큼 호젓하다.\\n★ 바깥짝 - 어떠한 표준 거리에서 더 가는 지점.\\n★ 앞대 - 어떤 지방에서 그 남쪽에 있는 지방을 일컫는 말.\\n★ 뒤대 - 어느 지방을 중심으로 하여 그 북쪽 지방을 일컫는 말.\\n★ 다릿목 - 다리가 놓이어 있는 길목.\\n★ 석비레 - 푸석들이 많이 섞인 흙.\\n★ 수수돌 - 금분이 섞인 붉은 차돌.\\n★ 씨다리 - 사금의 낱알.\\n★ 자박 - 사금광에서 캐어낸 생금의 큰 덩어리.\\n★ 재바닥 - 끊긴 광맥의 아래쪽에 다시 나타난 큰 광맥.\\n★ 한동먹다 - 한줄의 광맥에서 처음과 다음 사이가 얼마쯤 끊어지다.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"지형 및 광물질에 관계 있는 말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406696&page=27","sourceText":"☆ 반비알지다 - 땅이 약간 비탈지다.\\n☆ 가풀막 - 가파른 땅의 바닥.\\n☆ 안돌이 - 험한 산길에 바위 같은 것을 안고 겨우 돌아가게 된 곳.\\n☆ 지돌이 - 험한 산길에서 바위 같은 것에 등을 대고 겨우 돌아가게 된 곳.\\n☆ 너덜겅 - 돌이 많이 덮인 비탈.\\n☆ 너설 - 험한 바위나 돌 따위가 삐죽삐죽 무섭게 내밀어 있는 곳.\\n☆ 서덜 - 냇가나 강가의 산이 많은 곳.\\n☆ 더기 - 고원의 평평한 땅.\\n☆ 독메 - 들판에 외따로 떨어져 있는 조그만 산.\\n☆ 노해 - 바닷가에 퍼진 들판.\\n☆ 상사목 - 두드러진 턱이 있고, 그 다음이 잘록하게 된 골짜기.\\n☆ 노루막이 - 산의 막다른 꼭대기\\n☆ 멧발 - 여러 갈래로 뻗은 산의 줄기.\\n☆ 기스락 - 기슭의 가장자리.\\n☆ 자드락 - 나지막한 산기슭의 경사진 땅.\\n☆ 모롱이 - 산모퉁이의 휘어 둘린 곳.\\n☆ 높드리 - 골짜기의 높은 부분..\\n☆ 우근 - 시냇물이 급히 흐르는 가파르고 좁은 골짜기.\\n☆ 수구막이 - 계류가 산 속으로 멀리 돌아서 하류가 보이지 아니하는 땅의 형세.\\n☆ 오미 - 평지보다 조금 얕고 수초가 나고 또 물이 늘 괴어있는 곳.\\n☆ 움파리 - 우묵하게 들어가서 물이 괸 곳.\\n☆ 둔치 - 물이 있는 곳의 가장자리. 물가의 언덕.\\n☆ 갈개 - 땅에 괸 물이 빠지게 하기 위하여, 또는 땅의 경계를 짓기 위하여 얕고 가늘게 만든 도랑.\\n☆ 메숲지다 - 산에 나무가 많다.\\n☆ 숲정이 - 마을 부근의 수풀 있는 곳\\n☆ 거하다 - 산이 크고 웅장하다.\\n☆ 가력되다 - 사태 같은 것에 덮이어 묻히다.\\n☆ 벼루 - 낭떠러지의 아래가 강이나 바다로 통한 위태한 벼랑.\\n☆ 밀돌 - 납작하고 반들반들한 작은 돌.\\n☆ 두껍다리 - 골목 안의 도랑이나 시궁창에 걸쳐놓은 이름 없는 작은 돌다리.\\n☆ 여 - 물 속에 잠겨 있는 바위.\\n☆ 염 - 바윗돌로 된 작은 섬.\\n☆ 개력하다 - 산천이 무너지고 변하여 옛 모습이 없어지다.\\n☆ 과녁배기 - 외곬으로 똑바로 건너다보이는 곳.\\n☆ 에움길 - 굽은 길.\\n☆ 난달 - 길이 이리저리 통한 곳.\\n☆ 삼사미 - 세 갈래로 갈려진 곳.\\n☆ 도린곁 - 사람이 별로 개개지 않는 외진 곳.\\n☆ 후미 - 물가의 휘어져 굽이진 곳.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"물과 관계 있는 말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406532&page=28","sourceText":"※ 난바다 - 육지를 멀리 떠나 자유로운 바다.\\n※ 배래 - 육지에서 멀리 떨어진 바다 위.\\n※ 해미 - 바다 위에 낀 아주 짙은 안개.\\n※ 미세기 - 밀물과 썰물.\\n※ 잦감 - 밀물이 다 빠져 잦아진 상태.\\n※ 너울지다 - 멀리 보이는 바다의 물결이 거칠게 넘실거리다.\\n※ 물숨 - 떨어지거나 내뿜는 물의 세력.\\n※ 물참 - 조수가 잔뜩 밀어 들어왔을 때.\\n※ 벌창 - 물이 많아 넘침.\\n※ 물초 - 온통 물에 젖은 상태.\\n※ 쏠 - 작은 폭포.\\n※ 야거리 - 돛대가 하나 달린 작은 배.\\n※ 마상이 - 거루 따위 작은 배.\\n※ 위아랫물 지다 - 한 그릇 안에 두 가지의 액체가 잘 섞이지 아니하고, 위아래로 나누어지다.\\n※ 벌물 - 논이나 그릇에 물을 넣을 때에 한데로 나가는 물.\\n※ 놓아가다 - 배가 빨리 가다.\\n※ 거루다 - 배를 강가나 냇가에 대다.\\n※ 화치다 - 배가 좌우로 흔들리다.\\n※ 소쿠라지다 - 아주 빠른 물결이 굽이쳐 용솟음치다.\\n※ 엔굽이 치다 - 물이 굽이쳐 뭍으로 빙 돌아서 흐르다.\\n※ 여물 - 짠맛이 조금 있어 허드레물로 쓰이는 우물물.\\n※ 암물 - 보얀 빛을 띤 샘물.\\n※ 구죽 - 바닷가에 쌓인 굴껍데기.\\n※ 은어 받이 - 음력 시월 보름께 함경도 바다로 몰려오는 몸집이 큰 명태의 배.\\n※ 섣달받이 - 음력 섣달 초순에 바다로 몰려오는 명태의 떼.\\n※ 이리박이 - 뱃속에 이리가 있는 물고기\\n※ 가수알바람- 서풍\\n※ 갈마바람 - 서남풍\\n※ 갈바람 - 서풍\\n※ 된하늬 -서북풍\\n※ 시마 - 동남풍\\n※ 쓰리 - 잉어 따위의 고기를 낚기 위하여 얼음을끄는 쇠꼬챙이\\n※ 날찌 - 뱃간에 까는 엮은 나뭇가지.\\n※ 뱃지게 - 뱃짐을 져서 올리거나 내리는 데 쓰는 지게.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"날씨에 관계되는 말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceText":"# 실안개 - 흐릿하게 줄이 져서 끼인 안개.\\n# 매지구름 - 비를 머금은 검은 구름조각.\\n# 건들장마 - 첫가을에 비가 쏟아지다가 번쩍 개고 또 비가 오다가 다시 개는 장마.\\n# 조금치 - 조금 때 날씨가 궂은 일.\\n# 꽃샘잎샘 - 봄에 꽃과 잎이 피기 시작할 때 날이 추워짐.\\n# 잠포록하다 - 날이 흐리고 바람이 없다.\\n# 자오록하다 - 바람 없이 자욱하다.\\n# 물쿠다 - 날씨가 무척 찌다.\\n# 건들바람 - 초가을의 생량머리에 선들선들 부는 바람.\\n# 강쇠바람 - 초가을에 부는 동풍.\\n# 재넘이 - 산으로부터 내리부는 바람.\\n# 뒤바람 - 북풍 ↔ 마파람, 앞바람\\n# 살바람 - 좁은 틈에서 새어 들어오는 찬 바람.\\n# 강바람 - 비는 아니 오고 몹시 부는 바람.\\n# 소소리 바람 - 이른 봄에 살 속으로 스며드는 듯한 음산하고 찬 바람.\\n# 훌치다 - 촛불이나 등잔불의 불꽃이 바람에 쏠리다.\\n# 찬바람 머리 - 가을철에 싸늘한 바람이 불기 시작할 때.\\n# 득하다 - 날씨가 갑자기 추워지다.\\n# 치하다 - 그날 무렵의 날씨가 나빠지다.\\n# 너테 - 얼음 위에 더끔더끔 덧얼어 붙은 얼음.\\n# 성엣장 - 물 위에 떠서 흘러가는 얼음덩이.\\n# 석다 - 쌓여 있는 눈이 속으로 곯아서 녹다.\\n# 눈석임 - 눈이 속으로 녹아서 스러짐.\\n# 어녹다 - 얼다가 녹다가 하다.\\n# 얼마르다 - 얼어가면서 차차 마르다.\\n# 잔풀나기 - 작은 풀의 싹이 돋아나는 봄철.\\n# 철겹다 - 어느 철에 뒤지다.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"날씨에 관계되는 말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceText":"# 동살 - 동이 터서 훤하게 비치는 광선.\\n# 희붐하다 - 새벽의 밝은 빛이 약간 희다.\\n# 희번하다 - 동이 트면 허언 광선이 약간 비쳐서 번하다.\\n# 돋을볕 - 아침에 솟아오르는 햇볕.\\n# 햇귀 - 해가 처음 솟을 적의 빛.\\n# 낮결 - 한낮으로부터 해가 저물 때까지의 동안의 전반.\\n# 저뭇하다 - 날이 저물어 어스레하다.\\n# 해거름 - 해가 거의 넘어갈 무렵.\\n# 해껏 - 해가 질 때까지.\\n# 강더위 - 오랫동안 비가 아니 오고 볕이 쬐는 더위.\\n# 따지기 - 이른 봄 얼었던 흙이 풀리려고 할 무렵.\\n# 우리다 - 더운 기운이 있도록 볕이 들다.\\n# 불가물 - 아주 심한 가뭄.\\n# 보름치 - 음력 보름께에 비나 눈이 오는 날씨.\\n# 온달 - 음력 보름달\\n# 먼지잼 - 비가 겨우 먼지가 나지 아니할 정도로 조금 옴.\\n# 물마 - 비가 많이 와서 땅 위에 넘치는 물.\\n# 복물지다 - 복날에 비가 많이 오다.\\n# 시위 - 비가 많이 와서 강물이 넘쳐 흘러 육지를 침범하는 일.\\n# 지짐 거리다 - 비가 조금씩 자주 오다.\\n# 친친하다 - 축축한 중에도 끈끈하여 불쾌한 느낌이 있다.\\n# 첫물지다 - 그 해 들어 첫 홍수가 나다.\\n# 비설거지 - 비가 오려할 때에 비를 맞혀서는 안 될 물건을 미리 덮거나 치우는 일.\\n# 비거스름이 - 비가 갠 뒤에 바람이 불고 시원해지는 일.\\n# 개부심 - 장마에 큰물이 난 뒤 한동안 쉬었다가 한바탕 내리는 비가 명개를 부시어 냄.\\n# 작달비 - 굵직하고 억세게 퍼붓는 비.\\n# 빗밑 - 오던 비가 그치어 떨어지는 속도.\\n# 웃비 - 아직 빗기운이 그치지 않았으나 좍좍 내리다가 그친 비.\\n# 벗개다 - 구름이 벗어지고 날이 차차 개다.\\n# 웃날들다 - 날이 개다.\\n# 나무말미 - 여러 날 걸리는 장마 중에 날이 잠깐 들어서 풋나무를 말릴 만한 겨를.\\n# 빨래말미 - 여러 날 걸리는 장마 중에 날이 잠깐 들어서 옷을 빨아 말릴 만한 겨를.\\n# 암무지개 - 쌍무지개가 섰을 때에 다른 하나보다 빛깔이 묽고 흐릿한 무지개.\\n# 수무지개 - 쌍무지개가 섰을 때에 빛이 곱고 똑똑하게 보이는 무지개.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"에누리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406292&page=28","sourceText":"일본어인 줄 알기도 한다. 그러나 순수한 우리말이다. 상황에 따라 다른 뜻으로 쓰인다.“세상에 에누리 없는 장사가 어디 있어?” 이 말을 판매자가 했다면 ‘에누리’는 ‘물건값을 받을 값보다 더 많이 부르는 일’의 뜻이 된다. 사는 이가 했을 때는 ‘값을 깎는 일’이란 의미로 쓰일 수 있다. 보태거나 깎아서 말한다는 뜻도 있다.‘에누리 섞인 말.’\\n2008/11/21 서울신문","images":[]},{"word":"비나리, 추렴, 길놀이, 쥐불","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406196&page=28","sourceText":"▷ 비나리 - 앞길의 행복을 비는 말. 원래는 남사당패 놀이의 성주풀이 굿에서 곡식과 돈을 상 위에 받아놓고 외는 고사문이나, 그것을 외는 사람을 가리키는 말이었는데, 이후 사람들의 행복을 비는 말로 쓰이게 되었다. 그래서 앞날의 행복을 기원하는 것을 '비나리하다'라고 한다. 한편 '비나리치다'라고 하면 '아첨하여 환심을 사다'는 뜻이므로 구별해 써야 한다. 또한 구구한 말로 남에게 무엇을 청하는 짓을 '비라리'라고 한다. 어감은 비슷하지만 뜻은 상반되는 말들이다.\\n▷ 추렴 - 여러 사람이 돈이나 곡식 따위를 얼마씩 내어 거두는 것, 또는 그렇게 하여 무엇을 사먹는 일 '추렴'은 '출렴' 또는 '염출'이라는 한자말에서 비롯되었다. 흔히 서양식으로 '더치페이'라고 하는 것이다. 한자말로는 '갹금', '갹출'이라고도 한다. 각 사람에게서 똑같은 액수의 돈이나 물건을 걷는 것은 '각추렴'이라 하고, 먼저 추렴을 했는데 그것으로 부족하여 더하는 추렴을 '가추렴'이라 한다.\\n▷ 길놀이 - 탈춤놀이에 들어가기 전에 탈꾼들이 탈춤을 놀 자리까지 삼현육각을 잡히면서 가는 행렬\\n▷ 쥐불- 농가에서 음력 정월 첫 쥐날에 쥐를 쫓는다 하여 논둑이나 밭둑의 마른 풀에 붙이는 풀\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"달풀이, 동티, 물수제비 뜨기, 비김수","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406028&page=28","sourceText":"◆ 달풀이 - 정월부터 섣달까지 달마다의 절후나 행사를 노래로 풀어 부르거나, 또는 매달의 액이나 병을 노래하는 것. 지구가 삼백 예순 다섯 번을 정신없이 돌며 해의 둘레를 한 바퀴 도는데 걸리는 시간을 '해'라고 하듯이, 달이 지구를 한 바퀴 도는데 드는 시간을 '달'이라고 한다. '해'와 '달'은 천체의 이름이면서 곧 시간의 단위이기도 하다. 달의 주기를 이용한 시간 개념이 바로 음력인데, 이는 어로와 농경 사회에서는 필수적인 시간 셈법이다. '달풀이'는 액을 막기 위한 기복적인 내용을 포함하고 있지만 무엇보다도 각 절기별로 필요한 일을 환기시켜주는, 교훈적인 목적에서 행한 것으로 보인다.\\n◆ 동티 - 건드리지 않을 일을 공연히 건드려서 스스로 걱정이나 해를 입게 된 것. '동티'는 본디 '건드려서는 안 될 땅을 파는 일'을 뜻하는 한자말 '동토'가 변해서 우리말로 굳어진 것이다. 토목이나 건축 등의 일에서 흙 따위를 잘못 다루어, 지신의 노여움을 사서 재앙을 받는다고 믿는 것이다. 불가항력한 재앙이 일어나거나, 가만 두어야 할 것을 공연히 건드려 일이 잘못되는 것을 '동티나다'고 한다.\\n◆ 물수제비 뜨기 - 얇고 둥근 돌 같은 것을 물 위로 비껴가게 던져서 탐방탐방 수면을 스치며 가게 하는 장난질. 물수제비 뜨기를 하면서, 누가 던진 돌이 더 많이 튕겨오르는지 서로 내기를 하기도 한다. 물수제비 뜨기는 자맥질과 구별해야 한다. 자맥질은 물속에서 멱을 감으며 노는 놀이이고, 물수제비 뜨기는 물 밖에서 돌멩이를 수면에 던지며 노는 놀이이다. 지역에 따라서 '팔매치기', '물찰찰이', '물종개' 따위로 부르기도 한다.\\n◆ 비김수 - 장기, 바둑 따위에서 서로 비기게 되는 수. 무승부. 운동경기나 게임 등에서 승부가 나지 않은 것을 '무승부'라고 한다. '비김수'는 무승부에 갈음하여 쓸 수 있는 말이다. 비김수의 '수'는 '수가 나다', '수가 높다'고 할 때의 '수'와 같은 한자말이다. 비김수를 줄여서 '빅수'라고 하고, 바둑 애호가들은 흔히 이를 더 줄여서 '빅'이라고도 한다. 현대 바둑에서는 실제로 비김수가 없다. 다만 부분적인 '사활 싸움'을 할 때 흑과 백 어느 쪽도 상대를 잡을 수 없는 상태가 생기는데, 이것을 '빅수'라고 한다. 한편 축구나 야구 같은 운동경기에서 비김수는 예사로 일어나는 일이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"차림표, 밑글, 헛글","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405940&page=28","sourceText":"◇ 차림표 - 식당이나 찻집 같은 곳에서 음식이나 음료 따위의 종목과 값을 적은 표 식당에 가서 \\"여기 차림표 좀 주시오\\"하면 \\"메뉴판요?\\"라고 되물어오기 일쑤다. 식당이나 찻집 같은 곳에서 음식이나 음료 따위의 차림과 값을 적은 표를 우리말로 '차림표'라 한다. 요즘에는 거의 '메뉴판'이라는 말을 쓰는데, 그냥 '메뉴'나 '메뉴표'도 아니고, '메뉴판'이라고 하니 참으로 '엽기'적인 용어다.\\n◇ 밑글 - 이미 배운 글. 밑천이 되는 글 기본지식 또는 기초가 되는 학문을 말한다. 학벌사회에서는 이른바 명문대학을 나와야만 지도자가 된다고 생각하기 쉽지만, 사실은 고등학교 정도의 밑글만 가지면 세상을 이끌어가는데 필요한 밑글은 충분히 갖출 수 있다고 생각된다.\\n◇ 헛글 - 배워도 쓰지 못하는 지식. 배운 만큼 실천해야 한다는 것을 일깨우는 말이다. 사실 지식이란 꼭 실제 생활에 쓸모가 있어야 하는 것은 아니다. 사람의 정신세계를 퐁족하게 하는 것만으로도 지식의 가치가 있다. 다만 사람의 삶과 동떨어진, 죽어 있는 지식을 경계할 일이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"더위를 나타내는 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceText":"가마솥을 달굴 때의 아주 뜨거운 기운처럼 몹시 더운 가마솥더위,\\n가뭄으로 더 덥게 느껴지는 가뭄더위,\\n오랫동안 비가 오지 아니하고 볕만 내리쬐는 강더위,\\n습도와 온도가 매우 높아 찌는 듯 견디기 어려운 무더위,\\n햇볕이 몹시 뜨겁게 내리쬐는 불볕더위,\\n뜨거운 김을 쐬는 것 같은 찜통더위,\\n한창 심한 한더위,\\n여름이 다 가도록 가시지 않는 늦더위.\\n2008/08/11 서울신문","images":[]},{"word":"불목, 한뎃잠","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405746&page=28","sourceText":"☆ 불목 - 온돌방 아래의 가장 더운 자리 구들장에 불을 지펴서 난방을 하던 옛날식 온돌방은 아랫목과 윗목의 차이가 뚜렷했다. 그래서 한겨울에 손님이 오면 아랫목을 권하는 것이 예의였고, 집에서도 아랫목은 늘 집안 어른들의 차지였다. 그런데 명절 때나 잔치 준비를 할 때 음식을 만드느라 불을 너무 많이 지피게 되면, 부넘기에 가까운 자리는 장판이 검게 그을릴 정도로 뜨거워진다. 그 지점이 바로 '불목'이다.\\n☆ 한뎃잠 - 길거리나 다리 밑과 같이, 집이 아닌 추운 데서 자는 잠 '한데'서 자는 잠을 말한다. '한데'란 바람막이가 없는 추운 곳이다. 그런 곳에서 불어오는 바람을 '한뎃바람'이라 하고, 한데에서 밤을 보내는 것을 '한둔하다'라고 한다. 한뎃잠은 한마디로 '노숙'에 해당한다. 한뎃잠을 한 번이라도 자본 사람은 집의 고마움을 안다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"괭이잠, 나비잠, 대마루, 들창","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405618&page=28","sourceText":"※ 괭이잠 - 깊이 들지 못하고 자꾸 깨면서 드는 잠 한여름 밤 열대야 현상이 일어날 때면 깊이 잠들지도 못하고, 또 잠을 자다가도 자주 깨게 된다. 이렇게 선잠이 드는 것을 '괭이잠'이라 한다. '괭이'는 '고양이'의 줄임말이다. 고양이, 토끼 따위의 짐승들은 경계심이 많아서 깊이 잠들지 않는데서 유래된 말이다. 마음에 근심이 많은 사람들은 괭이잠을 자기 십상이다.\\n※ 나비잠 - 어린아이가 반듯이 누워 팔을 머리 위로 벌리고 자는 잠. 천진난만한 표정으로 새근새근 숨을 몰아쉬면서 두 팔을 머리 위로 벌리고 평화로운 표정으로 자고 있는 어린아이의 모습은, 말 그대로 한 마리의 나비가 사뿐히 앉았다가 날아가는 모습을 연상케 한다. 어린아이의 그런 모습을 표현하기에 '나비잠'보다 적당한 말은 없을 것이다.\\n※ 대마루 - 지붕 위의 가장 높게 마루턱이 진 부분. 우리 전통가옥의 지붕은 기와지붕이든 초가지붕이든 '대마루'를 중심으로 물매가 지도록 되어 있다. 시각적으로는 주변경관과 잘 어울리고, 실용적인 면에서는 빗물이 잘 흘러내릴수 있는 구조다. 지붕에 떨어진 빗방울은 대마루를 가운데로 하여 집의 앞쪽 처마와 뒤쪽 처마를 향하여 흘러내린다. 그런의미에서 보면 대마루는 '분수령'이다. 한편 일의 성패와 싸움의 승부가 결정되는 마지막 판을 '대마루판'이라고 한다.\\n※ 들창 - 바깥쪽으로 밀어 올려 열게 되어 있는 문. 문은 여는 방향에 따라 여러 가지가 있다. 그중 가장 흔한 것이 출입문으로 흔히 쓰이는 '여닫이문'이다. 그리고 창문은 보통 '미세기문'이 많다. '미세기'는 두 쪽의 문을 좌우로 겹치도록 밀어서 열거나 닫게 된 것이다. 같은 미세기라도 한쪽만 밀고 닫게 된 것은 '미닫이'라고 한다. 한편 '들창'은 창문 중에서도 밖으로 밀어 올려서 고정 시키도록 된 창문이다. 중앙 냉난방을 하는 대형 건물에서 흔히 볼 수 있는데, 열을 차단하기 위해서 창문을 붙박이로 만들고, 그 아래쪽에 환기를 위하여 작은 들창을 내는 것이다. 따라서 들창은 미세기에 비해서 대체로 창문의 크기가 작다. 이를 옛말로는 '벼락닫이'라고 부르기도 하였다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"도가니, 동그랑땡, 두루치기, 완자, 지짐이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405513&page=29","sourceText":"＊ 도가니 - 소 무릎의 종지뼈와 거기 붙은 살\\n＊ 동그랑땡 - 엽전 모양으로 생긴 저냐, 즉 '돈저냐'를 속되게 이르는말. '저냐'는 얇게 저민 고기나 생선 따위에 밀가루를 바르고 달걀을 입혀 기름에 지진 음식\\n＊ 두루치기 - 돼지고기, 조갯살, 낙지 따위를 슬쩍 데쳐서 갖은양념을 한 음식. ＊ 완자 - 다진 쇠고기를 기름에 지진음식 ＊ 지짐이 - 국물이 적고 간이 좀 짜게 끓인 음식의 총칭.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"고두밥, 다지기, 모둠밥, 강술, 너비아니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405418&page=29","sourceText":"♬ 고두밥 - 알갱이가 꼬들꼬들한 된밥. 밥은 지어진 상태나 조리방법에 따라 여러 가지 명칭으로 불린다. 물기가 많으면 '진밥'이라 하고 적으면 '된밥'이라 한다. 된밥 중에서도 그냥 먹기 힘들 정도로 쌀 알갱이가 '꼬들꼬들한' 된밥이 '고두밥'이다. 술을 빚으려면 찹쌀이나 멥쌀, 조 등을 시루에 쪄서 '지에밥'이라는 술밥을 지어야 한다. 이 지에밥이야말로 고두밥의 대표격이라 할 수 있다. 한편 그릇 위까지 수북이 퍼 담은 밥은 '감투밥' 또는 '고봉밥'이라 불렀다.\\n♬ 다지기 - 고추, 마늘 따위를 함께 섞어 다진 양념 김장을 할 때 절인 배추나 무를 버무리기 위하여, 여러 가지 재료를 다져서 만든 양념이 곧 '다지기'다. 또 국밥 따위를 말아서 먹을 때 넣어 먹는 양념도 다지기다. 얼큰한 음식을 좋아하는 사람들은 설렁탕이나 칼국수 따위 음식을 먹을 때도 벌겋게 다지기를 풀어서 먹는다. 이를 '다대기'라 부르는 사람들이 많은데 '다지기'가 맞는 말이다.\\n♬ 모둠밥 - 여러 사람이 내 것 네 것 없이 같이 먹기 위하여 많이 담은 밥 '모둠'은 여러 사람이 모인 단체를 말한다. 옛 농경사회에서 여럿이 함께 들일을 할 때, 일일이 별도의 밥그릇을 챙겨 가는 것이 번거로워서 큰 함지박에 한꺼번에 밥을 담아가지고 가서 일을 하다가 둘러앉아 먹는다. 이것이 바로 '모둠밥'이다.\\n♬강술 - 안주 없이 먹는 술\\n♬너비아니 - 얄팍얄팍하게 저며 갖은 양념을 해서 구운 고기.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"걸단추, 까치두루마기, 상답, 옷거리, 트임새","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405396&page=29","sourceText":"☞ 걸단추 - 걸어서 채우게 된 단추. 호크.\\n☞ 까치두루마기 - 까치설빔으로 아이들이 입는, 오색으로 지은 두루마기.\\n☞ 상답 - 자녀의 혼인 등 뒷날에 쓰려고 마련해두는 옷감.\\n☞ 옷거리 - 옷을 입은 맵시. 옷을 거는 도구를 뜻하는 '옷걸이'와 구별.\\n☞ 트임새 - 옷을 만들 때 앞이나 뒤를 터놓는 것, 또는 트인 모양새.\\n- 좋은 문장을 쓰기 위한 우리말 사전 중에서 -","images":[]},{"word":"가락지, 거들지, 두루주머니, 오지랖","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405223&page=29","sourceText":"▤ 가락지 - 여자가 손가락에 장식으로 끼우는 두 짝의 고리 '가락지'는 '반지'의 순우리말이다. '반'은 '나누다'는 뜻을 가진 한자말이고,'지'는 손가락을 가리킨다. 이처럼 반지는 사람들이 손가락을 걸고 뜻을 나누는 의미로 끼우는 물건이다. 보통 진주나 보석 따위를 끼워 장식을 한 것을 반지라고 한다면, 가락지는 그런 장식이 없는 고리를 말한다.\\n▤ 거들지 - 손을 감추기 위해 두루마기나 여자의 저고리 소매끝에 길게 덧대는 소매 이를 한자말로 '한삼'이라고 한다. 일상복보다는 춤 출때 입는 무용복에서 많이 볼 수 있다. 예컨대 탈춤을 출 때 한삼자락 휘날리며 덩실덩실 춤을 추는 모양새를 떠올려보면 그 모양이 생생하다. 또한 고구려 고분벽화에 거들지 자락을 휘달리며 춤추는 여인들의 모습이 그러져 있다.\\n▤ 두루주머니 - 아래는 둥글고 위는 모가 진, 허리에 차는 주머니. 염낭. 어린아이들의 한복 차림에서 흔히 볼 수 있다. 설날 세뱃돈을 넣는 '복주머니'도 두루주머니의 하나다. 아가리에 잔주름을 잡고 두 개의 끈을 좌우로 꿰어서 당기면 주머니 입구가 오므라지게 된 주머니다.\\n▤ 오지랖 - 웃옷이나 윗도리에 입는 겉옷의 앞자락. '오지랖이 넓다'는 말을 오늘날에도 종종 쓴다. 그런데 이 말이 그다지 좋은 뜻은 아니다 .옷의 앞자락이 넓으면 몸이나 다른 옷을 넓게 겹으로 감싸게 되는데, 간섭할 필요도 없는 일에 주제넘게 간섭하는 사람을 비꼬는 말이다. 그런 사람에게 '오지랖이 몇 폭이냐?'고 비아냥거리며 묻기도 한다. 그런데 오지랖이 넓다는 것은 가슴이 넓다는 말이다. 즉 남을 배려하고 감싸는 마음의 폭이 넓다는 것을 말한다. 그런 점에서 본다면 오지랖이 넓은 것이 미덕이다. 다만 그것이 지나쳐서 남에게 도움이 되기보다는 오히려 귀찮게 하는 결과를 가져올 때, 이를 경계하여 '오지랖이 넓다'고 하는 것이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"가락, 소수, 두레, 두름, 두매한짝","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405138&page=29","sourceText":"◐ 가락 - 기다란 물건의 도막을 세는 단위. 원래는 물레로 실을 지을 때 실이 감기는 쇠꼬챙이를 뜻하는 말이다. 이를 '가락꼬치'라고도 하는데, 그 쇠꼬챙이가 가느다랗고 길게 생겨서 비슷한 모양의 물건을 세는 단위로 쓰이게 된 것이다. 즉 기름하게 토막진 어떤 물건의 낱개가 '한 가락'이라고 한다. '손가락', '발가락', '엿가락' 등 올(오라기)보다 굵은 것의 도막을 '가락'이라 한다.\\n◐ 소수 - 몇 말, 몇 되, 몇 냥, 몇 달 등 어떤 단위보다 조금 넘음을 나타내는 말 '소수나다'고 하면 그 땅에서 소출이 늘거나 분량이 조금 남아도는 것을 말한다. 일반적으로 '소수'는 말, 되, 냥, 달과 같은 시간이나 분량, 수치의 단위에 붙어서 그보다 조금 넘음을 나타내는 말로 쓰인다. '말소수'는 한 말 남짓한 곡식의 양이며, '달소수'는 한 달 남짓한 기간을 말한다.\\n◐ 두레 - 둥근 켜로 된 시루떡 덩이, 또는 그것을 세는 단위.\\n◐ 두름 - 조기나 청어 같은 물고기를 두 줄로 열 마리씩 엮은 것, 또는 고사리 따위 산나물을 열 모숨가량 엮은 것\\n◐두매한짝 - 다섯 손가락을 가리키는 말\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"민날, 틀톱, 헛돌이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405053&page=29","sourceText":"▣ 민날 - 날카롭게 드러난 칼날이나 창날. '민날', '민낯', '민머리' 따위에서 '민-'은 덧씌워진 뭔가가 없는 상태를 말한다. 꼭 필요한 때가 아니면 칼날은 칼집 속에 들어 있어야 안전하다. 칼을 민날인 채로 간수하다 보면 드러난 칼날에 상처를 입을 수 있다. 날카로운 칼날의 위험을 되새기게 하는 말이다.\\n▣ 틀톱 - 두 사람이 밀고 당기면서 켜는 큰톱. 흥부가 큰 박을 타기 위해 형 놀부 집에서 빌려온 물건이 바로 '틀톱'이다. 틀톱은 양쪽에 손잡이가 달려 있으며 두 사람이 밀고 당기도록 되어 있다. 오늘날에는 전기톱이 나와서 틀톱을 쓸 일이 거의 없지만, 예전에는 굵고 큰 나무를 베거나 통나무 따위를 썰 때 요긴하게 쓰던 연모다.\\n▣ 헛돌이 - 바퀴나 엔진 따위가 헛도는 일. 멈추어 있는 자동차에 시동이 걸려 있거나, 어떤 기계가 필요없이 돌아가는 것을 '공회전'이라고 한다. '헛돌이'는 '공회전'에 갈음하여 쓸 수 있는 우리말이다. 헛돌이는 대기오염을 일으키므로 근래에는 일정 시간 이상 헛돌이하는 것을 법으로 금지하고 있다. 쓸모없이 버려지는 연료도 절감하고 대기오염도 조금이나마 줄여보자는 취지에서다.\\n- 좋은 문장을 쓰기 위한 우리말 사전 중에서 -","images":[]},{"word":"다림방, 에누리, 밭쟁이, 삯팔이, 저잣거리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404923&page=29","sourceText":"⊙ 다림방 - 푸줏간. 요즘의 정육점 조선 시대에는 돼지고기나 쇠고기 따위를 전문으로 팔던 가게를 '다림방'이라 하였다. 다림방을 '푸줏간'이라고도 하였는데, 지금의 '정육점'이 바로 그것이다. 요즘 정육점을 다림방이라 부르는 일은 거의 없지만 그 대신 '노래방', '빨래방', '놀이방'등의 신조어가 생겨나서 일상적으로 그리 어색하지 않게 쓰이고 있다. 이는 다림방과 같은 맥락이다.\\n⊙ 에누리 - 할인. 물건값을 깍는 일. 요즘에는 '에누리'를 '값을 깎아서 사는 것'을 가리키는 말로 쓰고 있지만, 원래는 '제값보다 높여 부르는 값'을 뜻하는 말이다. 정확하게 말하면 장사꾼의 입장에서는 에누리를 붙이는 것이고, 손님은 에누리를 하는 것이 아니라 에누리를 떼는 것이다. 당연히 깎아서 팔 것을 전제로 제값을 높여서 불렀으니 깎아서 사지 않으면 이른바 '바가지'를 쓴 셈이 된다. 그래서 이 에누리를 두고 흥정이 벌어진다. 물건을 사는 사람이 '에누리합시다'라고 하면 값을 깎아달라는 것이고, 파는 사람이 '에누리 없소!'라고 하면 제값에 보태어 부른 게 없다는 말이 된다.\\n⊙ 밭쟁이 - 채소 농사를 생업으로 하는 사람.\\n⊙ 삯팔이 - 삯을 받고 막일을 해주는 품팔이.\\n⊙ 저잣거리 - 가게들이 죽 늘어서 있는 거리. 상가\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"날일, 갈무리, 일쑤, 끝갈망","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404895&page=29","sourceText":"♣ 날일 - 날삯을 받고 하는 일 일을 하고 삯을 받는 방법은 여러 가지가 있다. 흔히 '월급'이라는 것은 달마다 품삯을 주고받는 것이고, '주급'은 일주일 단위로 품삯을 계산하는 것이다. 하루 단위로 셈한 품삯을 '날삯'이라 하는데, 이렇게 날삯을 받고 하는 일을 '날일'이라 한다. 요즘 쓰는 말로 '일당제'라 할 수 있다. 날일은 고용관계를 불안정하게 한다. 정규 직원을 채용해서 해야 할 일을, 인건비를 아끼기 위해 날일로 처리하는 것은 노동시장을 불안정하게 하는것이므로 지양되어야 한다.\\n♣ 갈무리 - 저장. 자신에게 닥친 일을 처리함.\\n♣ 일쑤 - 가장 좋은 수. 최선책\\n♣ 끝갈망 - 일의 뒤끝을 수습하는 일.(끝마감)\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"흙깔이, 겨리, 두렁서리, 볏","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404748&page=29","sourceText":"♤ 흙깔이 - 흙주접을 막기 위해서 다른 데 있는 영양분이 많은 흙이나 토질이 다른 흙을 파서 논밭에 옮겨 깔아주는 일 한가지 작물을 오래 짓다 보면 특정한 영양분만 작물이 흡수하여 땅심이 떨어지고 메마르게 된다. 이를 '흙주접'이라 한다. 흙주접을 막기 위해서 다른 데 있는 흙을 파서 논밭에 옮겨 깔아주는 것을 '흙깔이'라고 하는데, 이는 친환경적인 유기농법이다.\\n♤ 겨리(질) - 소 두 마리가 끄는 쟁기질. 한 마리가 끄는 쟁기질은 '호리(질)'\\n♤ 두렁서리 - 논두렁 위에 난 잡초 따위를 낫으로 베에서 없애는 일.\\n♤ 볏 - 보습 위에 비스듬히 대어 흙이 한쪽으로 떨어지게 한 쇳조각.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"걸기질, 겉갈이, 그루, 두렁","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404698&page=29","sourceText":"▶ 걸기질 - 논바닥에 물이 골고루 퍼지지 않을 때 높은 데의 흙을 낮은 데로 끌어내려 고르는 일 농경이나 건축 일에서는 땅을 편편하게 골라주어야 할 일이 자주 있다. 논바닥을 고르는 것을 '바닥걸기질'이라 하는데 이를 줄여서 '걸기질'이라 한다. 또 가을에 마당질을 하기 위하여, 여름내 장마로 패이고 울퉁불퉁하게 된 마당을 흙을 이겨서 고르게 바르는 일은 '마당맥질'이라고 한다. 걸기질은 논바닥에만 필요한 것이 아니다. 사람들의 모둠살이도 때때로 걸기질해주지 않으면 힘과 재물이 한곳으로 쏠리게 된다. 그리고 바로 그곳에서 부패가 시작된다. 무릇 평등주의이념이란 간혹 세상을 걸기질하는 것과 같다.\\n▶ 겉갈이 - 잡초나 해충을 없애려고 추수 뒤에 논밭을 갈아엎는 일 '겉갈이'는 땅 속의 해충이나 유충을 햇볕에 드러나게 하여 제거하는 방법이다. 대규모 조직사회에서 일정 주기마다 한번씩 인사이동을 시키는 것도 일종의 겉갈이라고 할 수 있다. 직무권한을 가진 사람이 한 자리에 오래 머물다 보면 아무래도 그 자리가 '부패'하기 쉽기 때문이다.\\n▶ 그루 - 한 해에 같은 땅에 농사짓는 횟수 나무나 곡식 등의 줄기의 아랫부분을 '그루'라 하고, 나무를 베어낸 뒤 남은 밑동을 '그루터기'라고 한다. 또한 나무를 세는 단위로도 자주 쓰는 말이다. 그런데 '그루'가 농사와 관련된 말로 쓰일 때는, 한 땅에 농작물을 심는 횟수를 말한다. 즉 한 땅에 한 번만 농사를 지으면 '한그루'라 한다. 그런데 한 땅에 두번 이상 농사짓는 것, 즉 '이모작'은 '두그루'가 아니라 '그루갈이'라 부른다.\\n▶ 두렁 - 논과 논 사이의 작은 둑 두렁은 논농사의 출발선이다 두렁에 쪼그리고 앉아 새참도 먹고, 더러는 두렁에서 이웃 논의 주인과 물 때문에 사움을 벌이기도 한다. 이처럼 두렁에는 농경사회의 애환이 서린다. 두렁은 본디 논과 논의 경계이면서 통로 역할을 한다. 또한 노동에 지친 몸을 잠시 뉘일 수 있는 간이 쉼터 구실도 한다. 그래서 편하고 팔자 좋은 사람을 '두렁에 누운 소'라고 부른다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"북새, 집알이,  짬짜미, 모둠","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404585&page=30","sourceText":"◆ 북새 - 뭇 사람이 법석대는 상태. 여럿이서 어떤 일을 방해하는 것. 여러 사람이 들끓어 북적북적한 상태를 나타낸 말이다. 그렇게 북적대다 보면 차분하게 어떤 일을 할 수가 없다. 여러 사람이 모여 잔치를 벌이거나 뜻을 모으는 것과는 다른 현상이다. 예컨대 전쟁 같은 난리 통을 '북새통'이라고 한다. 그리고 여럿이서 어떤 일을 방해하는 것을 '북새질치다', '북새놓다'고 하며, 그런 판이 벌어진 곳을 '북새판'이라 한다.\\n◆ 집알이 - 갓 이사한 집이나 신혼집을 인사 겸 구경삼아 찾아보는 일. 요즈음에도 흔히 볼 수 있는 우리 풍속 가운데 하나가 바로 '집들이'다. 갓 혼인한 신혼부부가 친지들을 불러 신혼집을 공개하는 집들이도 있고, 새집으로 이사했을 때 하는 집들이도 있다. 그런데 이들의 초대를 받고 가는 것을 보통 '집들이 간다'고 한다. 그러나 엄밀하게 말하면 '집들이' 초대를 받아서 '집알이'하러 가는 것이다. '집들이'는 이사하여 새로운 집으로 옮겨 들어가는 것, 또는 이사한 뒤에 이웃과 친지를 청하여 음식을 대접하는 일을 뜻한다. 따라서 '집들이' 하는 집에 찾아가는 손님쪽에서 보면 '집알이 간다'고 해야 바른 표현이다. 한편 집들이를 할 때 음식을 장만하여 손님을 대접하는 것은 '들턱'이라고 한다. '집들이하면서 내는 턱'이라는 뜻이다.\\n◆ 짬짜미 - 남모르게 몇몇이서 자기들끼리만 짜고 하는 약속. '편을 짜다', '팀을 짜다'와 같이 어떤 목적을 위하여 사람들을 조직한다는 의미의 '짜다'에 뿌리를 둔 말이다. 역사 속에서 짬짜미하는 예가 종종 있다. 지난 1979년 10. 26사태가 발생하자 '하나회'라는 신군부 사조직 세력은 다른 동료 군인들 모르게 '짬짜미'로 반란을 획책하여, 무력으로 정권을 장악하였다. 정치권에서도 특정 지역에 기반을 둔 정치인들이 파벌을 만들고 자기들기리 짬짜미하여 나라 살림을 좌지우지하는 유치한 '짬짜미 정치'가 계속 이어져왔다.\\n◆ 모둠 - 어떤 모임이나 단체를 다시 작게 나눈 집단.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"동아리, 두레, 모꼬지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404455&page=30","sourceText":"◇ 동아리 - 목적이 같은 사람들이 한패를 이룬 무리. 예전에 대학가에서 '서클'은 낭만적인 대학생활의 상징처럼 인식되기도 하였다. 그래서 고등학생들 사이에서도 이를 흉내 낸 별의별 '서클'이 등장하였고, 그중에는 이른바 '불량 서클'도 상당수 포함되엇다. 다행히도 요즘의 대학생들은 '서클'이라는 말 대신에 '동아리'라는 말을 쓴다. 외국어를 쫓아내고 우리말을 되찾은 바람직한 경우라 할 수 있다. '불량 서클'이라는 말은 있어도 '불량 동아리'라는 말은 아직 생겨나지 않은 것을 보면 말글살이는 사람의 정서에 대단한 영향을 미친다는 것을 알 수 있다. 한편 동아리는 '나무 아랫동아리'처럼 긴 물건의 한 부분을 말하기도 한다.\\n◇ 두레 - 농촌에서 농사의 공동작업을 위해 마을이나 몇 개의 두럭 단위로 만든 조직. 우리 전통 농경사회의 공동체 정신이 가장 잘 드러나는 생활양식이다. '두레'는 말 그대로 작업 공동체다. 그런데 단지 공동작업만 하는 것이 아니다. '두레'는 여러 가지 뜻을 가지는 말이다. 예컨대 집단으로 하는 농악도 '두레'라 하고, 농군들이 여럿이 음식을 장만하여 모여서 노는 것도 '두레'라 한다. 또 둥근 밥상을 '두레상'이라 하는데, 이 두레상을 펴놓고 여럿이 둘러앉아 음식을 먹는 것을 '두레 먹다'라고 한다.\\n◇ 모꼬지 - 놀이나 잔치로 여러 사람이 모임 어떤 단체의 회원들이 단합을 위해 '수련회'를 하는 것을 흔히 '엠티'라고 하였다. 이는 '멤버십 트레이닝'을 줄인 말로, 단체 활도에 적응하기 위한, 일종의 훈련 성격을 띤 야유회 같은 것이었다. 그런데 지금은 '엠티' 대신 '모꼬지'라는 말이 널리 쓰인다. '모꼬지'는 흔히 산이나 강, 바다 같은 야외로 나가서 한다. 이 때문에 '모꼬지 간다'는 표현을 쓰느 사람들이 더러 있으나 엄밀히 따지면 이는 정확하지 않다. '모꼬지' 자체가 '여러 사람이 모여 놀이판을 여는 것'을 뜻하는 말이므로 '모꼬지한다' 또는 '모꼬지하러간다'고 표현해야 옳다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"곁사돈, 여의다, 남진아비","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404313&page=30","sourceText":"◎ 곁사돈 - 직접 사돈 간이 아닌 방계 간의 사돈. '사돈'은 자녀가 혼인을 하였을 때 그 배우자의 부모를 말한다. 그런데 자녀의 배우자 부모가 아닌 형제자매 등도 보통 사돈이라고 부르는데, 엄밀히 말하면 이는 '곁사돈'이다. 즉 방계 간에 있는 사돈을 '곁사돈'이라고 한다. '방계'란 '직계'에 상대되는 말로, 같은 조상에서 갈라진 수평적인 계통을 말한다. 형제자매나 4촌, 6촌 등의 관계에 있는, 같은 항렬의 친족이 곧 '방계'다. 한편 겹혼인으로 맺어진 사돈관계는 '겹사돈' 이라 한다. '곁사돈'과 '겹사돈'은 다르다.\\n◎ 여의다 - 죽어서 이별하다. 멀리 떠나보내다. 딸을 시집보내다. '여의다'는 부모, 자식, 사랑하는 임 등 가족이나 가족 비슷하게 가까운 사람과의 이별을 뜻하는 말이다. '부모를 여의다'라고 하면 부모가 돌아가신 것을 뜻한다. '임을 여의다'는 사랑하는 임을 떠나보냈다는 것이고, '딸을 여의다'는 딸을 시집보낸다는 뜻이다. 반면 아들 장가보내는 것을 '여의다'라고 하지는 않는다. 아들은 결혼을 해도 부모의 곁을 떠나지 않았기 때문이다. 하지만 요즘에는 아들도 결혼해서 떠나가는 세상이니 '여의다'라고 해야 하지 않을까. 어떤 경우든 '여의다'는 이별의 슬픔이 묻어 있는 말이다.\\n◎ 남진아비 - 아내를 가진 사내. 유뷰남. 반대는 '남진어미'\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"까치걸음, 야바윗속, 한시름, 본데","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404294&page=30","sourceText":"○ 까치걸음- 아이들이 기쁠 때 두 발을 모아 뛰면서 조촘거리는 종종걸음\\n○ 야바윗속 - 속임수로 협잡을 꾸미는 속내 '야바위'란 교묘한 속임수로 물주가 돈을 따는 노름의 하나다. 그 뜻을 넓혀보면 비단 놀음뿐만 아니라 협잡의 수단으로 그럴듯하게 꾸미는 일을 모두 이르는 말이다. 흔히 이런 놀음이나 일을 하는 사람을 '야바위꾼' 또는 '설레꾼'이라고 한다. '야바윗속'은 바로 야바위꾼의 교묘한 속마음을 일컫는 말이다.\\n○ 한시름 - 큰 걱정 오늘날에는 주로 '한시름 놓다' 또는 '한시름 덜다'라는 관용구 형태로 쓰인다. '한시름이다'고 하면 '걱정이 태산이다'는 말과 같은 뜻이다. 그러므로 '한시름 놓다(덜다)'는 큰 걱정에서는 일단 벗어났다는 뜻이다. 여기서 '한'은 '하나'가 아니라 '크다'는 뜻이다.\\n○ 본데 - 보아서 배운 솜씨나 지식, 또는 예의범절\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"볼만장만, 선웃음, 선갓, 손기척","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404151&page=30","sourceText":"☆ 볼만장만 - 보기만 하고 간섭하지 아니하는 모양 우리가 흔히 쓰는 '가관이다'라는 말을 우리말로 풀어쓰면 '볼만하다'는 뜻이다. 그런데 이 말은 '볼만한 가치가 있다'기보다는 그 반대의 뜻으로, 눈앞에서 펼쳐진 일이 봐줄만하지 않다는 뜻이다. 반어법이다. 그런데 '볼만장만'은 눈앞에서 급한 일이 벌어지는데도 그것을 보고 있는 사람이 시비를 가리거나 참견하지 않는 경우에 쓰는 말이다. '강 건너 불 구경'을 말한다. 즉 냉소적이고 소극적인 태도를 꼬집는 말이다.\\n☆ 선웃음 - 우습지도 않은데 꾸며 웃는 거짓 웃음 간혹 '선웃음'을 선한 표정으로 웃는 웃음이라고 알고, 그렇게 쓰는 사람들이 있다. 그러나 '선웃음'은 엉너리치는 웃음이다. 우습지도 않은데 남의 마음을 사고자 능청을 떨며 억지로 웃는 것을 말한다. 방송의 우스개 극에서 시청자의 웃음을 끌어내기 위해 음향으로 들려주는 웃음소리도 선웃음의 하나다. 실제의 웃음이 아니라 제작진이 억지로 만들어서 들려주는 웃음인것이다. '선웃음'에서 '선'은 으뜸꼴이 '설다'인데, '익지 못하다' 또는 '서투르다'는 뜻이다.\\n☆ 선갓 - 햇살의 눈부심을 막고 멀리 보기 위하여 손을 이맛전에 붙이는 짓. 우리가 일상적으로 하는 행동임에도 그것을 나타내는 적당한 말이 없거나, 있어도 모르고 잘 쓰지 않는 경우가 더러 있다. '손갓'도 그런 말 가운데 하나다. 소설 따위의 문학 작품에서 사람의 행동을 그려내기에 알맞은 말이다. 예컨대 \\"그는 햇살에 눈이 부시어 손을 이맛전에 붙이고 먼 산을 바라보았다\\"라는 표현보다는, \\"그는 햇살에 눈이 부시어 손갓을 하고 먼 산을 바라보았다\\"라고 쓰면 훨씬 간결하면서도 글맛이 살아난다.\\n☆ 손기척 - 노크 우리나라의 전통적인 노크 방법은 '에헴'하는 헛기침이다. 집의 구조를 보면 알 수 있듯이, 일상의 삶의 공간이 열려 있었던 전통사회에서는 굳이 손기척이 필요 없었다. 신분에 따라서 \\"에헴\\"하고 헛기침을 하거나, 그럴 만한 지위가 못 되면 공손하게 말로 아뢰면 되는 것이다. 그러나 생활의 공간이 꽁꽁 닫혀 있는 오늘날의 일상생활에서는 헛기침이 통하지 않는다. 이제 닫힌 문 앞에서는 손기척을 하는 것이 일상의 예절이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 -","images":[]},{"word":"든버릇, 듣보기, 뜬금없다, 바르집다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404040&page=30","sourceText":"☆ 든버릇 - 고치기 어려운 고질적인 버릇이나 습관. '든버릇'은 몸속에 들어와 자리를 잡고 앉은 버릇이라고 할 수 있다. 사람은 누구나 저마다의 버릇이나 습관이 있기 마련이다. 좋은 버릇은 끊임없이 힘을 들여야 만들어지지만 나쁜 버릇은 저절로 찾아와서 든버릇이 되고 만다. 든버릇은 좋지 않은 버릇이다. 흔히 쓰는 한자말 '고질병'에 갈음하여 쓸 수 있는 말이다. 한편 '든버릇'이라는 말은 없다.\\n☆ 듣보기 - 듣고 보는 것. 시청 \\"지금 이 방송을 시청하시는 시청자 여러분, 안녕하십니까?\\" 방송 진행자가 흔히 하는 말이다. 그런데 '시청하시는 시청자 여러분'은 반복적 표현이라 거슬린다. 그래서 어떤 방송 진행자는 '시청하시는'을 '보고계시는'으로 바꾼다. 그러나 텔레비전을 듣지는 않고 보기만 하는가? 이럴 때 '듣보기하시는'으로 써보는 것도 손색이 없을 것이다.\\n☆ 뜬금없다 - 갑작스럽고 엉뚱하다. 금(金)은 돈이다. 그러므로 '뜬금'은 시중에 '떠 있는 돈'이다. 곧 시세의 변동에 따라 정해지는 값이다. 시장의 가격은 수요와 공급의 법칙에 따라 오르락내리락하기 마련이다. 그런데 어떤 장사꾼이 제멋대로 정한터무니없는 가격으로 손님들을 불러모은다면, 그의 행위는 뜬금없다. 뜬금없는 행위가 다 나쁜 것은 아니다. 불의한 경우를 보고도 많은 사람들이 숨죽이고 있을 때 용감하게 나서는 시민의 행위는, 얼추 뜬금없다고 할 수 있지만 결국은 손뼉을 칠 일이다.\\n☆ 바르집다 - 덮어두어야 할 다른 사람의 비밀을 여러 사람이 있는 자리에서 끄집어내어 이야기하다. '바르잡다'는 원래 '오그라진 것을 벌려 펴다'는 뜻이다. 그러나 사람의 행위와 관련지어 '지나간 일 또는 비밀을 들추어내거나, 사소한 일을 크게 떠벌리다'는 뜻으로 많이 쓰인다. 말의 형태에서 짐작할 수 있듯이 '바르집다'는 '바르다'와 '집어내다'의 두 가지 말이 합성된 것이다. 고기 뼈에 붙어 있는 살을 거두어내는 것을 이를 때 '살을 바르다'라고 하며, 밤송이나 콩깍지 따위의 껍질을 벗기고 속 알맹이를 집어낼 때도 '밤(콩)알을 바르다'라고 한다. 이럴 때 쓰는 '바르다'와 '집어내다'가 붙어서 '바르집다'는 말이 생성된 것이다. 입이 가벼운 사람들은 되새겨봄 직한 말이다. 큰말은 '버르집다'이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"강울음, 건사하다, 까치발","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403947&page=30","sourceText":"☆ 강울음 - 눈물을 흘리지 않고 건성으로 우는 울음. '강울음'은 억지로 힘들여 우는 것, 또는 부자유스런 울음 등이 이에 속한다. '건울음'은 건성으로 우는 것이다. '강-'이 접두어로 쓰일 때 '억지', '호된', '부자유스런', '메마른' 등의 뜻이 있다. 또는 '그것만으로 이루어진'이라는 뜻도 있다. '강울음', '강다짐' 등의 '강-'은 '억지'의 뜻이 있고, '강추위'의 '강-'은 '호된'의 뜻이 있다. 안주 없이 마시는 술을 '강술'이라고 하는데 여기에서의 '강-'은 '그것만으로'의 뜻이다. '강보리밥'의 '강-'도 같은 뜻이다.\\n☆ 건사하다 - 자신에게 딸린 것을 잘 돌보아 거두다. 잘 간수하여 지키다. 제게 딸린 사람, 제 소유의 물건 따위를 잘 간수하고 거두는 것을 말한다. 집 안, 화초 따위를 잘 손질해 가꾸는 것, 마음속의 꿈을 소중하게 가꾸어 나가거나 몸을 건강하게 잘 유지하는 것 모두가 건사하는 것이다. 또한 아랫사람이나 고용자에게 일을시킬 때 막연히 지시하는 것이 아니라 구체적인 일거리를 챙겨주는 것도 '건사하다'라고 한다.\\n☆ 까치발 - 키를 높이기 위하여 발뒤꿈치를 드는 일. 키가 작은 사람이 커 보이게 하는 몸짓으로는 두 가지가 있는데, 첫째는 목을 빼는 것이요, 둘째는 발뒤꿈치를 한껏 드는 일이다. 목이야 빼봤자 키를 키우는 데 별 도움에 되지 않지만, 까치발은 잘하면 발의 길이만큼 키를 키울 수 있다. 한편 한쪽 발을 들고 다른 쪽 발로만 서 있거나 뛰는 것은 속어로 '깨금발'이라 하며, 어린아이들이 두 발을 모아서 종종 뛰는 것을 '까치걸음'이라 한다. '까치발'과는 구별해야 한다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"텡쇠, 틀박이, 고드름장아찌, 대못박이, 곰손이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403841&page=30","sourceText":"☆ 텡쇠 - 겉으로는 튼튼해 보이지만 속으로는 허약한 사람 '-쇠'는 사람을 홀하게 이르거나 일반적으로 신분이 낮은 사람을 일컫는 접사인데 '돌쇠', '마당쇠' 등이 그와 같은 예이다.그런데 고대에서 이 '-쇠'는 왕의 이름으로 쓰일 정도로 지체 높은 사람에게 쓰이는 말이었다. 그러다가 조선 시대에 와서 '개똥쇠', '무적쇠'처럼 주로 하인을 부르는 이름으로 쓰이게 되었고, 근래에 이르러서는 천한 사람의 이름으로 아예 굳어져 버린 것이다. 이처럼 '-쇠'의 쓰임이 크게 변한 것은 조선조 이후 우리말을 경시해온 사대주의 풍조 때문이었다. 한편 '텡'은 비어 있는 모양을 나타내는 말이다. '텡쇠'와 비슷한 뜻을 지닌 말로는 '텡보'가 있다.\\n☆ 틀박이 - 생전 고향을 떠나지 않는 사람. 먹어도 몸무게가 늘거나 줄지 않는 몸바탕 일정한 테두리에 묶여 변동이 없는 것을 말한다. 키나 몸이 붇지 않는 사람, 또는 일정한 틀에 박혀 있는 물건 따위를 가리키는 말이다. 특히 먹어도 살이 찌지 않아서 몸무게가 늘거나 줄지 않는 틀박이 체질을 가진 사람들은 요즈음 이른바 '살 빼기 전쟁'에 나서는 사람들에게 부러움의 대상이다.\\n☆ 고드름장아찌 - 언행이 싱거운 사람을 농으로 일컫는 말 장아찌는 간장에 절이거나 담근 반찬을 말한다. 그러므로 당연히 짭짤한 맛이 생명이다. 그런데 고드름을 간장에 절이면 어떻게 될까? 고드름은 다 녹아서 싱거운 물이 되고 말 터이다. 고드름과 장아찌, 이 두가지 상반된 성질이 해학적으로 합성된 말이다. 즉 '고드름장아찌'는 맹물 같은 사람을 빗댄 말이다.\\n☆ 대못박이 - 대못도 들어가지 않는 물건. 융통성 없는 사람 대못이 물건을 뚫지 못하는 것처럼, 아주 어리석고 둔하여 가르쳐도 깨닫지 못하는 사람을 빗댄 말이다. 말귀를 알아듣지 못하거나 남의 말을 좀처럼 듣지 않는 사람을 일러 \\"귀에 못박았냐?\\"라고 하는 경우가 있다. '대못박이'는 고정관념이 강하여 새로운 것을 잘 받아들이지 않거나, 남의 말에 귀를 기울이지 않아서 융통성이 없는 사람 따위를 말한다.\\n☆ 곰손이 - 곰과 같이 순하고 듬직한 사람.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"늦깍이, 따라지, 민머리, 연생이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403764&page=30","sourceText":"☆ 늦깍이 - 나이가 들어서 중이 된 사람 오늘날 '늦깍이'는 나이가 들어서 어떤 전문적인 분야에 나아간 사람을 일컫는 말로 흔히 쓰인다. 특히 늦은 나이에 학교에 들어간 사람을 '늦깍이 학생'이라 부는 것이 예사다. '늦깍이'는 원래 나이가 들어서 중이 되기 위하여 머리를 깎은 사람을 이르는 말이다. 즉 머리를 '늦게 깎았다'는 것이다. 늦게 불가에 들어서다 보니 당연히 사리를 깨닫는 것도 남보다 늦다.\\n☆ 따라지 - 키와 몸이 매우 작아 풍채가 보잘것 없는 사람 '따라지'는 단지 사람의 겉모습만을 두고 하는 말이 아니다. 키와 몸집이 작더라도 정신세계가 드높고 당당한 사람은 실제보다 훨씬 크게 보인다. 마음이나 몸이나 모두 왜소하여 볼품없는 사람을 일러 '따라지'라고 한다.\\n☆ 민머리 - 정수리까지 벗어진 대머리 정수리까지 시원하게 벗어진 대머리를 옛말로는 '민머리'라 하였다. 그러나 사실상 이 말은 신체적인 대머리보다는 '벼슬하지 못한 사람'들이 자조적으로 자신의 신세를 빗대어 쓰는 경우가 더 많았다. 한편, '여자의 쪽지지 않은 머리'도 민머리라고 하는데, '민-'이 접두어로 쓰일 때는 일반적으로 '꾸밈새나 덧붙어 딸린 것이 없음'을 뜻한다. 화장하지 않은 얼굴을 '민낯'이라 하는 것과 같은 이치다. 대머리보다는 한결 어감이 부드러운 '민머리'라는 말로 바꾸어 쓰는 것이 좋을 것이다.\\n☆ 연생이 - 잔약하고 보잘것없는 사람이나 물건 조선 시대 의녀의 이야기를 다룬, 한 방송국의 역사극에 등장한 인물 가운데 '연생이'라는 이름을 가진 궁녀가 있었다. 우연한 계기에 승은을 입어 첩지를 받게 되는 연생이라는 이름은 사실상 남존여비 사상이 지배하던 조선 시대에 흔하디흔한 이름이었다. 여자 아이들을 하찮게 여겨 이런 이름을 많이 붙였던 것이다. '개똥이'. '분례' 등도 봉건 시대에 여성을 홀대하여 붙인 이름들이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"생목, 시르죽다, 알땀, 주럽, 주접, 배냇냄새","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403612&page=30","sourceText":"☆ 생목 - 먹은 지 얼마 안 되어 다시 입으로 올라오는, 삭지 않은 음식물이나 시큼한 위액. 보통 음식을 급히 먹거나 국물 없이 강다짐(마른밥)을 먹었을 때 일어나는 생리현상이다. 흔히 '생목 오르다'라고 한다. 위 속에 들어간 음식물이 위액과 섞이지 못하고 역류하는 것으로, 체한것과는 다른 생리현상이다.\\n☆ 시르죽다 - 기운을 못 차리다. 기를 못 펴다 '시르다'의 어원은 분명치 않다. '실개천', '실낱' 따위처럼 가늘고 작은 것을 뜻하는 '실'에서 비롯되었거나, '시들다' 또는 '시름'과 관련된 것으로 보인다. 어떤 말에서 유래되었든 모두 '나약함'이나 '연약함'을 뜻한다. '시르죽다'는 '나약하다'는 한자말에 갈음하여 쓸 수있는 말이다.\\n☆ 알땀 - 예쁜 여자의 이마 따위에 송알송알 맺히는 땀 사람이 흘리는 땀에도 여러 가지가 있다. 보통 사람들이 흘리는 땀방울에 견주어 예쁜 여자가 흘리는 땀방울은 '알땀'이라 한다. 예쁜 여자는 땀방울도 다른가 보다. 무척 힘이 들 때 몹시 쏟아지는 땀은 '비지땀'이라 한다. 보기에도 안쓰러운 땀이다. 또한 구슬처럼 방울방울 맺히는 땀은 '구슬땀'이라 한다. 알땀은 여성적인 느낌이, 구슬땀은 남성적인 느낌이 든다.\\n☆ 주럽 - 피곤하고 고단한 증세 극도로 피곤하고 고단한 증세가 몰려오는 것을 '주럽들다'라고 한다. 또 주럽이 든 고단한 몸을 쉬게 하여 피로를 푸는 것은 '주럽떨다'라고 한다. 주럽을 떨쳐낸다는 뜻이다. 한편 주럽은 주로 사람의 몸 상태에 대해서만 쓰는 말이다. 따라서 식물이 병들어 말라 들어가는 상태를 나타내는 '주접'과는 구별해서 써야한다.\\n☆ 주접 - 여러 가지 이유로 생물체가 쇠해지는 상태 '주접'은 '주럽'과 뜻이 다르다. 식물이나 작물 따위의 생물체가 잔병이 많아서 잘 자라지 못하거나 기를 펴지 못하고 시들어가는 것을 '주접들다'라고 한다. 작은말은 '조잡'이다. 그런데 '주접'은 오늘날 대부분 행위와 관련되어 쓰인다. 예컨대 음식에 대하여 추잡하게 욕심을 부리는 태도가 있는 사람을 '주접스럽다'라고 한다. 뜻이 별로 좋지 않은 말이다. 사람을 극도로 비하할 때 쓰는 말이다.\\n☆ 배냇냄새 - 갓난아이의 몸에서 풍기는 냄새\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"꽃무덤, 몸풀이, 쉰둥이, 막달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403590&page=31","sourceText":"☆ 꽃무덤 - 아까운 나이에 죽은 젊은이의 무덤 '꽃'과 '무덤'은 그 느낌이 극단적으로 상반되는 말이다. 하지만 두 말이 합쳐짐으로써 가슴 아련한 정서적인 느낌을 불러일으킨다. '꽃무덤'은 절절한 사랑을 못 이루고 떠난 슬픈 영혼, 또는 불의에 항거하다가 비명에 쓰러져 간 외로운 영혼들을 떠올리게 하는 말이다.\\n☆ 몸풀이 - 해산하다. 아이를 낳고 몸조리하는 상태 몸은 생명을 지닌 육신을 말한다. 따라서 '몸을 푼다'는 것은 뱃속의 생명이 세상에 나오는 것을 뜻한다. 더불어 '몸풀이'는 아이를 낳는 순간부터 산후 조리를 하는 단계를 두루 뜻하는 말이다.\\n☆ 쉰둥이 - 부모의 나이가 쉰 줄에 들어서 태어난 아이 부모가 사십대 정도에 아이를 낳게 되면 보통 '늦둥이'라고 부른다. 그런데 오십대의 여성이 아이를 낳는 경우는 거의 없을 것이다. 따라서 쉰둥이느 아버지의 입장에서 쉰 줄에 가진 아이를 말한다.\\n☆ 막달 - 해산달\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"염통, 푸석살, 활개, 나룻, 몸씨, 안개눈썹","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403439&page=31","sourceText":"☆ 염통 - '심장'의 순우리말 ☆ 푸석살 - 무르고 푸석푸석한 살 조금만 앓고 나도 살이 축나게 쭉 빠지는 체질을 가진 사람의 살이 바로 '푸석살'이다. 물렁물렁하게 많이 찐 살을 뜻하는 '무살'과 비슷하지만, 무살보다 살갗이 더 거칠고 쇠해 보인다. 푸석살과 반대되는 말은 '참살'과 '대살'이다.\\n☆ 활개 - 사람의 활짝 편 두 팔과 다리 의기양양한 태도로 휘젓고 다니는 것을 '활개를 치다'라고 한다. 요즘에도 흔히 쓰는 말인데, 여기서 '활개'는 원래 퍼덕거리는 새의 두 날개나, 사람의 활짝 편 두 팔과 다리를 일컫는 말이다. '활개'가 들어가는 말은 '힘차고 의기양양한'태도를 나타낸다. 또한 '이불 속에서 활개 치다'라는 말이 있는데 평소 남이 보지 않는 곳에서는 큰소리를 잘 치고 잘난 체하다가도 정작 어?***?일을 당하면 해결하지 못하고 쩔쩔매는 사람을 이르는 말이다.\\n☆ 나룻 - 수염을 예스럽게 이르는 말 ☆ 몸씨 - 몸의 맵시. 몸매 ☆ 안개눈썹 - 숱이 많지 않고 빛깔이 엷은 눈썹\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"메밀눈,미주알, 민낯,밸,삭신","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403394&page=31","sourceText":"☆ 메밀눈 - 작고 모질게 생긴 눈. '메밀눈'은 뾰족하게 모가 난 메밀에 눈의 모양을 빗댄 말이다. 별로 좋지 않은 느낌을 주는 눈이다.\\n☆ 미주알 - 똥구멍에 닿아 있는 창자의 끝부분. 말하지 않아도 좋을 사소한 것까지 속속들이 말하거나 캐묻는 행위에 '미주알고주알'이라는 말을 쓴다. '미주알'은 신체의 은밀한 곳에 감추어져 있는 살덩어리다. 그 미주알을 꺼내듯 알리고 싶지 않은 일까지 캐물으면, 대답하는 사람은 미주알이 빠져나온 것처럼 곤혹스럽고 고통스럽다는 뜻이다. 한편 미주알을 '밑살'이라고도 한다.\\n☆ 민낯 - 여자의 화장하지 않은 맨얼굴. '민낯'에서 '민-'은 '꾸밈새나 덧붙어 딸린 것이 없음'을 나타내는 접두어다. '민머리','민다래끼','민날' 따위의 '민-'이 모두 그런 뜻으로 쓰였다. 한편 접두어 '민-'은 '닳아서 모지라지거나 우둘투둘하던 것이 평평하게 됨'을 뜻하기도 한다.\\n☆ 밸 - 창자의 속어. '밸'은 '배알'의 준말이다. 작은 창자는 '가는 밸'이고, 큰창자는 '큰 밸'이다. 밸은 창자를 속되게 이르는 말이지만, 구겨지고 꼬인 마음의 상태를 나타내기도 한다. 그래서 창자가 꼬인 것처럼 마음이 꼬이는 것을 '밸이 꼬이다'라고 한다.\\n☆ 삭신 - 몸의 힘살과 뼈마디.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서 -","images":[]},{"word":"물, 불, 광물과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403287&page=31","sourceText":"○ 개숫물 - 그릇을 씻은 물, 또는 생활폐수\\n개숫물은 원래 음식 그릇을 씻은 물을 뜻하는 말이다. 그러나 오늘날에는 그릇 씻은 물뿐만 아니라 일반 가정에서 버린느 생활폐수를 모두 일컫는 말이라 할 수 있다.\\n○ 군불 - 방을 덥게 하려고 때는 불.\\n날이 추운 겨울에 아궁이에 불을 지펴 구들장을 덥혀 주기 위해 때는 불.\\n○ 목물 - 사람의 목까지 찰 정도의 깊은 물. 여름철 등과 목에만 물을 끼얹는 목욕.\\n'목물'은 물의 깊이를 가리키는 말이기도 하지만, 허리 위에서 목까지만 물로 씻는 일을 가리키는 말로 더 많이 쓰인다.\\n○ 불잉걸 - 활짝 피어 이글이글한 숯불.\\n벌겋게 달아오른 숯불이나 장작개비의 불덩어리를 말한다. 숯이나 나무가 불에 탈 때 가장 놓은 온도를 유지하는 대목이라 할 수 있다. 불잉걸을 '잉걸불'이라고도 하며 줄여서 '잉걸'이라고도 부르는데, 이는 활활 타오르른 불꽃보다 훨씬 더 뜨거운 상태다.\\n○ 한데우물 - 집의 울 밖에 있는 우물. 공동우물.\\n○ 머리등 - 자동차나 자전거 따위의 앞부분에 달린 등. 전조등, 헤드라이트.","images":[]},{"word":"사물의 현상이나 이치와 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceText":"★ 곰비임비 - 물건이 거듭 쌓이거나 일이 계속 일어나는 모양.\\n★ 김첨지감투 - 어떤 사물이 도깨비 장난같이 없어지기 잘하거나, 가뭇없이 사라져버린 것.\\n★ 낙낙하다 - 크기, 수효, 무게가 조금 크거나 남음이 있다.\\n'낙낙하다'는 '넉넉하다'의 작은말이다. 요즘에는 주로 큰말인 '넉넉하다'만 쓰이지만, 나타내는 대상의 규모가 작을 때는 '낙낙하다'는 표현을 살려 써봄 직하다.\\n★ 달걀가리 - 달걀을 쌓은 가리. 곧 현실적으로 가능하지 않은 일.\\n'가리'는 볏단 따위를 쌓아 올리는 것을 말하는데, 달걀을 그것들끼리만 쌓아 올릴 수 있는가? 즉 현실적으로 가능하지 않은 일을 쓸데없이 상상하는 것을 말한다.\\n★ 모지라지다 - 물건의 끝이 닳아서 없어지다.\\n연필을 오래 써서 모지라지면 '몽당연필'이 된다. 빗자루나 붓 따위를 오래 쓰다 보면 모지라져서 더 이상 쓰기 어렵게 된다. 이렇게 오래 써서 끝이 다 닳아진 물건을 '모지랑이'라고 한다.\\n★ 마디다 - 잘 닳거나 없어지지 않고 오래 지탱하다.\\n짚신은 잘 닳는다. 그렇지만 고무신이나 운동화는 잘 닳지 않는다. 그래서 고무신은 마디다. '사람이 참 마디다'라고 하면 '헤프지 않다'는 뜻이다. '마디다'는 자라는 속도가 더딘 것을 표현하기도 한다.\\n★ 사춤 - 벌어지거나 갈라진 틈.\\n원래 담이나 벽의 갈라진 틈을 '사춤'이라 하고, 그러한 틈을 진흙으로 메우는 일을 '사춤 치다'라고 한다. 사춤은 사람과 사람의 관계에도 있따. 따라서 서먹한 사람과의 관계를 풀어주는 것도 사춤을 치는 일이라고 할 수 있다.\\n★ 시나브로 - 모르는 사이에 조금씩. 다른 일을 하는 사이에 조금씩.\\n아주 느리게 일이 진행되는 것을 나타내는 말로, 동사 앞에 쓰여 그 움직임을 꾸며주는 역할을 한다.\\n★ 옹글다 - 물건이 조각나거나 축나지 아니하고 본디 그대로 있다.\\n어떤 것이 가지고 있어야 할 내용에 조금도 모자람이 없는 상태를 말한다. '옹고집', '옹두리'따위에서 쓰인 '옹'은 대체로 '작지만 단단하고 완고함'을 뜻한다. '옹글다'와 뜻이 비슷하면서 느낌이 더 강한 말은 '옹골차다'이다. 또한 '실속있게 꽉 찬 상태'를 '옹골차다'라고 한다.\\n★ 터울 - 두 물건 사이에 차이가 지다.\\n한 어머니가 낳은 형제자매 간의 나이 차이를 뜻하는 말로 주로 쓰인다. '터울'은 원래 '한터에서의 울타리'라는 뜻이다. 어떤 경계를 말하는 것이다. 이것이 줄어서 '터울'이 되었고, 지금은 주로 나이 차이를 나타내는 말로 쓰이고 있는 것이다.","images":[]},{"word":"사물의 이름과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceText":"☆ 가을부채 - 철이 지나 쓸모없게 된 물건.\\n☆ 거스러미 - 손톱이 박힌 자리 위에 살갗이 거슬려서 일어난 보풀 같은 것.\\n나무의 결 같은 것이 얇게 터져 일어나 가시처럼 된 부분 또한 거스러미라고 한다. 마루에 거스러미가 일어나면 발바닥에 박혀서 상처가 나기 쉽다. 어떤 일에서 사소한 부분에 말썽이 일어나는 경우도 거스러미라 할 수 있다.\\n☆ 검불 - 마른 풀, 낙엽, 짚 부스러기 따위처럼 마구 헝클어진 것의 총칭.\\n검불 가운데서도 자잘한 짚 부스러기나 흩어진 낱알 같은 것을 '팃검불'이라 한다.\\n☆ 더께 - 몹시 찌든 물건에 앉은 거친 때.\\n더께는 비눗물로도 좀처럼 닦이지 않는 찌든 때를 말한다. 오래된 가구나 가전제춤에 앉은 때가 바로 그렇다.\\n☆ 맏물 - 그해에 맨 먼저 나온 과일이나 곡식, 해산물 따위.\\n한 집에서 맨 먼저 태어난 사람을 '맏이', 짐승의 첫 번째 새끼를 '맏배'라고 부르는 것과 같은 이치이다.\\n맏물의 반대말은 '끝물'이다.\\n☆ 여줄가리 - 주된 물건의 줄기에 딸린 물건. 중요한 일에 딸린 중요하지 않은 일.\\n'액세서리(accessory)'에 해당하는 순 우리말이 바로 '여줄가리'다.\\n여줄가리는 어떤 일을 하는 데 있어서 '중요한 일에 딸린, 그다지 중요하지 않은 일'을 뜻하기도 한다. 여줄가리에 반대되는 말은 '대줄가리'다. 대줄가리는 어떤 사실의 중요한 골자를 말한다.\\n☆ 오가리 - 무, 호박 따위의 살을 길게 썰어서 말린 것.\\n☆ 사북 - 물건의 가장 중요한 부분. 부챗살이나 가위 다리의 교차된 곳에 꽂은 못.\\n☆ 왜배기 - 겉보기에 좋고 질적으로도 짭짤한 물건. 반대말은 '진상'","images":[]},{"word":"식물의 생태와 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402981&page=31","sourceText":"□ 나무초리 - 나뭇가지의 가느다란 끝부분.\\n'초리'는 '회초리','눈초리'와 같이 끝이 길고 가느다란 것을 나타내는 말이다. 짐승의 꼬리나 새의 꽁지와 비슷한 뜻이다.\\n나무의 꼭대기 줄기를 '우듬지'라 하는데, 나무초리는 우듬지에서도 맨 끝, 꼬리처럼 뾰족한 부분을 말한다. '위초리'라고도 한다.\\n□ 보늬 - 밤이나 도토리같이 겉껍질이 있는 나무열매 속에 있는 얇은 껍질.\\n한자말로 '내피(內皮)'에 해당한다. 잣이나 땅콩의 질기고 단단한 겉껍질을 벗기고 나면 붉은 막 같은 속껍질이 나온다. 그 또한 보늬다.\\n□ 아람 - 탐스러운 가을 햇살을 받아서 저절로 충분히 익어 벌어진 과실.\\n아람이 활짝 벌어지는 것을 '아람 벌다'라고 하며, 아람이 나무에서 떨어지거나 곧 떨어질 상태에 있는 것을 '아람 불다'라고 한다.\\n□ 등걸 - 줄기를 잘라낸 나무 밑동.(=그루)\\n□ 똘기 - 채 익지 않은 과실.\\n□ 삭정이 - 산 나무에 붙어 있는 말라 죽은 가지.","images":[]},{"word":"식물의 종류, 이름과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceText":"◇ 갈목 - 갈대의 이삭.\\n갈목은 갈대꽃이 달린 이삭 부분을 말하는 것이다. 그것을 꺾어서 만든 밋자루를 '갈목비'라고 부른다.\\n◇ 남새 - 들에 심어서 가꾸는 채소. '야채'를 대신하는 말.\\n'남새'는 '푸새'와 상대되는 말이다. 산과 들에 자생하는 푸성귀를 푸새라 하고, 무나 배추처럼 심어서 가꾼 채소를 남새라한다. 따라서 채소를 심은 밭은 남새밭이 된다.\\n◇ 다복솔 - 가지가 다보록하게 퍼진 어린 소나무.\\n가지가 다보록하게 퍼진 어린 소나무를 '보득솔'이라 하였다. 이 '보득솔'과 비슷한 이름이 곧 '다복솔'이다. 보통 풀이나 작은 나무가 탐스럽고 소복하게 나 있는 모양을 '다보록하다'고 한다.\\n◇ 장다리꽃 - 무, 배추 따위의 줄기에 피는 꽃.\\n◇ 개똥참외 - 가꾸지 않았어도 저절로 나서 열린 참외.\\n◇ 오디 - 뽕나무의 열매.\\n◇ 오얏 - 자두.\\n◇ 살사리꽃 - 코스모스.","images":[]},{"word":"동물의 생태와 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceText":"■ 무녀리 - 한 태에 낳은 여러 마리의 새끼 가운데 맨 먼저 나온 새끼\\n한편 무녀리는 '맏배'와 다르다. 맏배는 처음으로 임신하여 낳은 새끼를 말한다. 사람의 경우 맏딸, 맏아들이라고 하는 것과 같은 이치다.\\n■ 홀알 - 암탉이 교미하지 않고 낳은 알. 무정란(無精卵).\\n양계장에서날마다 쏟아져 나오는 수많은 달걀은 대부분 홀알이다.\\n■ 흘레 - 짐슴의 교미(交尾)\\n짐슴이 교미를 하는 것을 '흐르다'라고 한다. '흘레'는 이 '흐르다'가 변한 말로, '흘레하다'또는 '흘레붙다'의 형태로 쓰인다. 소, 말, 돼지 따위 짐승을 흘레붙일 때에는 암컷이 달아나지 못하도록 틀에 암컷을 묶어놓는데, 이 틀을 '흘레틀'이라고 한다.\\n■ 며느리발톱 - 길짐승이나 새의 뒤쪽 발톱.\\n■ 모래집 - 포유동물의 태아를 싼 얇은 막.\\n■ 조가비 - 조개의 껍데기.\\n■ 항정 - 돼지나 개 따위 짐승의 목덜미.","images":[]},{"word":"동물의 종류나 이름과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceText":"◇ 고도리 - 고등어의 새끼, 또는 포도청에서 죄인의 목을 졸라 죽이는 일을 맡아 하던 사람.\\n◇ 길짐승/날짐승 - 기어다는 짐승/날아다는 짐승.\\n◇ 부사리 - 들이받는 버릇이 있는 소.\\n◇ 붕장어 - 뱀장어와 비슷하게 생긴 붕장어과의 바닷물고기.\\n우리에게 흔히 '아나고'라는 일본말로 더 많이 알려진 붕장어는 몸길이가 90센티미터가량 되는, 뱀장어 비슷한 바닷물고기 이름이다.\\n◇ 알배기 - 알이 들어 통통한 생선. 외모에 비하여 알차고 충실한 사람.\\n생선이 아니라도 '겉보다 속이 야무진 상태'를 이를 때 '알배기'라고 한다.\\n◇ 풀치 - 갈치의 새끼.\\n'갈치'의 원말은 '칼치'다. 즉 칼 모양을 닮은 고기라는 뜻이다.\\n그런데 그 새끼를 '풀치'라고 하는 것은 그것이 기다란 풀잎 모양을 닮았기 때문일 것이다. 해학이 묻어나는 우리말이다. 풀[草]이 자라서 칼[刀]이 되는 셈이다.\\n◇ 받배 - 짐승이 첫 번째로 낳은 새끼.\\n◇ 간자미 - 가오리 새끼.\\n◇ 꽝다리 - 조기 새끼.\\n◇ 솜병아리 - 알에서 깬 지 얼마 안 되는 병아리. 햇병아리.\\n◇ 불강아지 - 몹시 여윈 강아지.","images":[]},{"word":"위치, 방향과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceText":"▲ 가두리 - 물건의 가를 두르고 있는 언저리.\\n가두리는 바깥쪽, 가장자리를 뜻하는 '가'와 '두르다'가 합쳐진 말로, 통상 어떤 물체 겉쪽의 휘두른 언저리를 이르는 말이다.\\n▲ 고섶 - 손만 내밀면 바로 찾을 수 있는 곳.\\n물건을 두는 곳이나 서랍, 그릇 등에서 손만 내밀면 바로 찾을 수 있는 곳을 일러 '고섶'이라고 한다. '섶'이란 비교적 가까운 곳을 뜻한다. '길섶'이 길에 접해 있는 언저리를 가리키는 것과 같은 이치다. 곳간, 벽장, 서랍, 그릇 따위의 가장 앞쪽의 손쉽게 물건을 찾을 수있는 곳은 모두 고섶이다.\\n▲ 도래 - 둥근 물건의 둘레.\\n도래는 '돌다'에서 비롯된 말로, 다른 말에 덧붙어 '돌아가게 되어 있다','둥글다'는 뜻을 나타낸다.\\n팔꿈치의 둥근 뼈를 '도래뼈'라 하고, '도래샘'은 빙 돌아서 흐르는 샘물이고, '도래솔'은 무덤가에 둘러선 소나무를 말한다. 또 둥글게 된 밥상을 '도래상'이라 한다.\\n▲ 맞은바라기 - 앞으로 마주 바라다보이는 곳.\\n건너편, 맞은편과 뜻이 비슷한 말이지만, '맞은바라기'는 이보다 거리상의 여유가 느껴지는 말이다. '건너편'은 둘 사이에 길이나 강과 같은 경계가 있음을 뜻하고, '맞은편'은 비교적 가까운 곳을 나타낸다. 예를 들어 마주 보이는 아파트 건물은 '맞은편'에 있지만, 멀리 마주 보이는 산봉우리를 나타낼 때는 '맞은바라기'가 어울린다.\\n▲ 시울 - 눈, 입 등의 언저리.\\n주로 사람의 얼굴에서 눈과 입의 언저리를 가리키는 말로 쓰이는데, 저 혼자 쓰이는 경우가 거의 없다. '눈시울', '입시울'처럼 '눈'과 '입'에 붙어서 쓰인다.\\n▲ 이마받이 - 두 물체가 아주 가깝게 맞붙음을 이르는 말.\\n이마받이는 본디 '이마를 들이받음'을 뜻하는 말이다.\\n▲ 가녘 - 가장자리나 언저리, 여가리. 변두리나 한쪽 모퉁이.","images":[]},{"word":"길과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceText":"■ 가풀막 - 가파른 땅의 바닥. 급경사 길.\\n가풀막은 '가파르다'에, '오르막', '내리막', '늘그막'따위에 쓰인 '-막'이 붙어서 이루어진 말이다. '가파르다'의 원형을 살려서 '가팔막'이라고도 한다.\\n■ 갓길 - 비상시 이용하도록 고속도로 양쪽 가장자리에 있는 길.\\n■ 고샅 - 마을의 좁은 골목, 또는 좁은 골짜기의 사이.\\n고샅은 본디 '좁은 골짜기'를 뜻하는 말이다.\\n고샅의 '고'는 골짜기를 뜻하는 '골'의 받침소리가 탈락한 형태이다. 또한 '샅'은 본래 '사이'가 줄어든 말로 사람이나 짐승의 가랑이 사이를 뜻한다. 손가락 사이를 '손샅'이라 하는 것과 비슷한 이치다. 따라서 고샅을 말 그대로 풀어보며 '골짜기 사이'가 된다. 그런데 문학작품에 나오는 고샅이란 말은 대체로 어린 시절 추억이 스며들어 있는, 마을의 좁은 길목을 뜻한다.\\n■ 길라잡이 - 길을 인도하는 사람.\\n■ 길품 - 먼 길을 걷는 노력, 또는 남의 갈 길을 대신 가주고 삯을 받는 일.\\n'길품(을) 들이다'는 것은 어떤 목적지를 향하여 일부러 노력을 들여 길을 가는 경우를 뜻한다. '길품(을) 팔다'고 하면, 원뜻은 남의 갈 길을 대신 가주고 삯을 받는다는 뜻이다. 그러나 '아무 보람도 없이 헛길만 가다'는 뜻으로도 쓰인다. 이런 경우에는 '길품만 팔았다'고 표현한다.\\n■ 논틀길 - 꼬불꼬불한 논두렁 위로 난 길.\\n논틀길의 '-틀-'은 '틀다'에서 변형된 말이다. 그러므로 논틀길은 '비틀비틀하게 난 길'의 모양을 담고 있는 말이다. 논틀길을 줄여서 '논틀'이라고도 한다.\\n■ 뒤안길 - 늘어선 집들의 뒤쪽으로 난 길.\\n동네 앞 '큰길'에 상대되는 말이다.동네 앞길은 '한길', 마을 속으로 난 길은 '속길(이면도로)', 마을 뒤쪽으로 난 길은 '뒤안길'이 된다.\\n뒤안길은 관심을 받지 못하여 초라하고 쓸쓸한 생활이나 처지를 은유로 나타내기도 한다. 인생에도 한길과 뒤안길이 있는 법이다.\\n■ 에움길 - 빙 둘러서 가는 길. 우회로.\\n가장 가까운 방향으로 질러가는 길을 '지름길'이라고 한다면, 이와는 달리 빙 둘러서 가는 길이나 우회로를 일컬어 '에움길'이라 한다. '두름길'과 같은 말이다.\\n■ 한길 - 차나 사람이 많이 다니는 큰 길.\\n한길은 '큰 길'이다. 어떤 고을에서 가장 크고 번화한 길을 말한다.\\n한길은 단지 길의 크기만을 말하는 것이 아니라, 특정 지역 내에서 차나 사람의 통행량이 가장 많은 번화한 길을 가리키는 말이다. 한편 사람들이 많이 모이는 번화한 곳을 '한바닥'이라 하고, 반대로 사람이 별로 가지 않는 외진 곳을 '도린곁'이라 한다.\\n■ 길섶 - 길 가장자리\\n■ 나들목 - 드나들 때 반드시 거치게 되는 길목. 고속도로 톨게이트.\\n■ 돌서더릿길 - 돌이 많이 깔린 길.\\n■ 푸서릿길 - 잡초가 무성하게 난 길.","images":[]},{"word":"강, 바다와 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceText":"○ 감풀 - 썰물 때는 보이고 밀물 때는 안 보이는, 비교적 넓고 평탄한 모래톱.\\n우리나라 서해안이나 남해안에는 섬은 섬이지만 썰물 때는 길이 나서 뭍이나 다름없는 곳이 여러 군데 있다. 구약성서에 나오는 '모세의 기적'을 연상하게 하는 이 길은 뭍과 섬 사이에 감풀이 이어진 것이다.\\n○ 까치놀 - 석양에 먼 바다의 수평선에서 희번덕이는 물결.\\n해거름에 서쪽 하늘을 물들인 불긋불긋한 노을.\\n○ 난바다 - 붙에서 멀리 떨어진 넓은 바다.\\n난바다는 한자말로 '원해(遠海)' 또는 '원양(遠洋)'에 해당한다.\\n한편 뭍에서 그리 멀지 않은 가까운 바다는 '든바다'라고 한다. 한자말로 '근해(近海)'이다.\\n○ 너울 - 바다에서 일어나는 사납고 큰 물결.\\n바람이 세게 불 때 뱃전이나 방파제 따위에 부딪치면서 하얀 물기둥처럼 솟구쳐 오르다가 물보라를 일으키는 거친 파도.\\n너울을 줄여서 '놀'이라고도 한다\\n○ 물참 - 밀물이 들어와 가장 높이 찼을 때. 만조(滿潮)\\n○ 사리 - 매달 음력 보름날과 그믐날에 조수가 가장 높이 들어오는 때.\\n'조수(潮水)'나 '조석(潮汐)', '간만(干滿)'은 모두 다 밀물과 썰물을 나타내는 한자말이다.\\n○ 조금 - '조감(潮減)'에서 변한 말. 한달 중에서 조사가 가장 낮은 때.\\n밀물이 가장 낮게 드는 음력 8일경과 23일경의 조수를 말한다. 조금 때는 바닷물이 높지 않아서 감풀이 넓게 드러난다. 한펴 조금 때 날씨가 궂은 것을 '조금치'라고 한다.\\n○ 숨은여 - 수면 위로는 보이지 않지만 바다 속에 내밀고 있는 암초.\\n○ 여울 - 강이나 바다의 바닥이 얕거나 폭이 좁아서 물살이 세차게 흐르는 곳.","images":[]},{"word":"땅과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceText":"◆ 가람 - 강(江)의 예스런 말.\\n◆ 감탕 - 갖풀에 송진을 넣고 끓인 끈끈한 풀, 또는 물과 함께 짓이겨 곤죽같이 된 진흙.\\n짐승의 가죽이나 뼈 따위를 모아서 오래 고은 뒤 굳으면 끈끈하고 황갈색의 도는 접착제가 된다. 이를 '아교(阿膠)'또는 우리말로 '갖풀'이라 하는데, 여기에 다시 송진을 넣고 끓이면 더욱 끈끈한 풀이 된다. 이를 일컬어 '감탕'이라 하고, 비가 온 뒤 아주 질게 된 진흙땅을 '감탕밭'이라 한다. 또한 남녀가 점잖지 않게 온갖 음탕한 몸짓으로 잠자리를 하는 짓을 경멸스럽게 말할 때 '감탕질'이라 한다.\\n◆ 개막은 땅- 간척지(干拓地)\\n지금처럼 대규모의 갯벌을 막아서 환경과 생태에 영향을 미치는 정도는 아니지만, 비교적 오래 전부터 서해안 지방에서는 바닷가 갯벌에 돌담을 쌓아서 농경지로 사용하였는데, 이를 '개막은땅'이라 불렀다. 개막은땅은 지금도 그 흔적이 남아 있다. 한편 개막은땅이 넓은 들판이 되어 펼쳐져 있는 것을 '노해'라고 한다.\\n◆ 둔치- 강, 호수 등 물가의 가장자리나 둔덕진 곳.\\n둔치는 예전의 '고수부지(高水敷地)'라는 어?***?한자말을 제치고 훌륭하게 부활한 우리말이다. 둔치는 물과 당의 점이지대로서 개구리 등 양서류가 서식하는 곳이다.\\n◆ 알땅 - 비바람을 막을 아무런 준비도 없는 땅.\\n'알땅'을 비롯하여 '알몸', '알곡','알밤' 따위의 말에서 접두사 '알-'은 겉을 싼 것이 다 벗겨진 모양을 나타낸다. 알땅은 초목이 전혀 없이 먹을 것, 마실 것조차 구하기 어?***? 사막과 같은 발가벗은 땅을 말한다. '노지(露地)' 또는 '황무지(荒蕪地)'라는 한자말에 갈음하여 쓸 수 있는 말이다.\\n◆ 터앝 - 집 울타리 안에 있는 작은 밭.\\n터앝은 '텃밭'과 다른다. 텃밭은 집터에 딸리거나 집 가까이 있지만 울타리(담) 밖에 있는 밭을 이르는 말이고, 터앝은 울타리 안의 마당 한구석에 있는 밭이다. 요즘 도시의 빌딩 옥상 같은 데에 채소를 조금씩 심어놓은 것을 가끔 볼 수 있는데 이것도 터앝이라고 할 수 있다.\\n◆ 푸서리 - 덩거칠게 잡풀이 무성한 곳.\\n'푸서리'는 '풀'과 '서리'가 합하여 이뤄진 말이다. '서리'의 'ㅅ'앞에서 '풀'의 'ㄹ'이 떨어지면서 '푸서리'가 된 것이다.\\n이처럼 '풀'은 경우에 따라서 그 받침이 바뀌거나 탈락하여 일정한 말을 만드는데 '푸새','푸성귀'가 그런 말이다.\\n한편 '서리'는 '무엇이 많이 모여 있는 그 사이'를 뜻하는 말로 쓰였다.\\n◆ 후미 - 산길이나 물가의 굽어서 휘어진 곳, 또는 굽돌이.\\n산길이나 물가의 굽어서 휘어진 곳을 '후미'라고 하며, 그렇게 된 길을 '후밋길'이라 한다. 또한 굽어서 들어간 정도가 깊다는 것을 일러 '후미지다'라고 하는데, 이 말은 요즘에 와서 '무서울 정도로 깊숙하고 쓸쓸한 장소'를 나타낼 때 주로 쓰인다. 한편 항간에서는 '후(後)지다'라는 속된 말을 더러 쓰는데, 이는 '뒤처지다','질이 떨어지다' 등의 뜻을 가진 말이다. 따라서 이말과 '후미지다'를 같은 뜻으로 혼동해서는 안 될 것이다.\\n◆ 노해 - 바닷가에 퍼진 들판.\\n◆ 선바위 - 산이나 들, 또는 물 가운데 외따로 우뚝 서 있는 큰 바위.\\n◆ 펀더기 - 넓은 들. 광야(廣野).\\n◆ 함지땅- 분지(盆地).\\n◆ 너럭바위 - 넓고 평평한 바위.\\n◆ 날땅 - 개간하지 않은 땅. '나대지'를 대신하는 말.","images":[]},{"word":"더위, 추위, 구름과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402110&page=32","sourceText":"● 강더위 - 비는 오지 않고 여러 날 계속되는 심한 더위.\\n비가 내려서 더위를 식혀주어야 하는데 그렇지 아니하고 더위만 계속된다는 뜻이며, 반대말은 '강추위'다.\\n● 거먹구름 - 비를 머금은 검은 구름\\n'검은 구름' 또는 '시커먼 구름'을, 맛을 좀더 살려 표현한 말이다. 한자말로 '암운(暗雲)'이라고 한다.\\n● 매지구름 - 비를 머금은 검은 조각구름.\\n매지구름이 검게 보이는 것은 땅으로부터 낮게 떠 있기 때문이다. 그래서 매지구름은 밀","images":[]},{"word":"바람과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceText":"○ 강바람 - 비는 내리지 않고 몹시 세게 부는 바람.\\n강바람은 일종의 계절풍이다. 즉 비는 오지 않고 바람만 몹시 부는 태풍을 강바람이라 할 수 있다.\\n○ 꽃샘바람 - 봄철 꽃이 필 무렵에 부는 찬바람.\\n'꽃샘'에서 '샘'은 물이 솟아나는 샘이 아니다. '시샘'의 줄임말이다.\\n○ 높새 - '북동풍'을 뱃사람이 이르는 말.\\n'높'은 북쪽을 가리키는 '노'라는 말이 변한 것이고, '새'는 동쪽을 말한다.\\n뱃사람들이 방향을 가리키는 말로 '새'는 동쪽, '하늬'는 서쪽, '마'는 남쪽이다.\\n○ 바람꽃 - 먼 산에 구름같이 끼는 보얀 기운.\\n바람에도 꽃이 있다. 큰 바람이 불기 전에 먼저 먼 산에 구름같이 끼는 보얀 기운을 '바람꽃'이라 한다. 바람꽃이 일면 큰 바람이 분다. 그래서 뱃사람들은 바람꽃이 보이면 출항을 하지 않았고, 농부들은 바람의 피해을 입지 않도록 농작물을 단속하였다.\\n○ 황소바람- 좁은 곳으로 가늘게 불어오지만 매우 춥게 느껴지는 바람.\\n옛날 서민들에게 가장 추운 바람은 황소바람이었다. 지금은 집에 난방이 잘 되어 한겨울에도 집 안에서 속옷 차림으로 지낼 수 있지만, 옛날 서민들은 한겨울날 문풍지 떠는 소리와 함께 문틈으로 스며 들어오는 바람에 오금이 저리도록 떨면서 밤을 보내야 했다. 특히 작은 창구멍을 통해 들어오는 바깥공기는 차라리 바깥에서 거세게 휘몰아치는 찬바람을 직접 맞는 것보다 더 춥게 느껴진다.\\n○ 돌개바람 - 태풍과 같이 휘돌면서 부는 바람, 또는 강한 회오리바람.\\n○ 건들마 - 초가을에 남쪽에서 불어오는 시원한 바람. (=건들바람)","images":[]},{"word":"비와 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceText":"○ 가랑비 - 조금씩 내리는 비.\\n가랑비에서 '가랑'은 매우 작은 것을 뜻한다. 가랑비는 한자말 '세우(細雨)'에 해당하는 우리말이다.\\n○ 달구비 - 빗발이 달구처럼 굵게 죽죽 쏟아지는 비.\\n'달구'는 집터나 묘지 같은 데에 흙바닥을 다질 때 쓰는 굵은 장대를 말한다. 달구비는 채찍비, 장대비 따위와 더불어 가장 굵은 빗줄기와 무더기비를 나타내는 말이다.\\n○ 먼지잼 - 비가 겨우 먼지나 날리지 않을 정도로 조금 내림.\\n오랜 가뭄으로 메마른 땅에 풀풀 날리는 먼지를 겨우 재워놓을 정도로 내리는 비를 말한다. '잼'은 '재움'의 줄임말로 볼 수 있따.\\n○ 비설거지 - 비가 오려고 할 때 비에 맞지 않도록 물건을 치우거나 덮어서 단속하는 일.\\n○ 여우비 - 볕이 난 날 잠깐 뿌리는 비.\\n예상치 않게 홀연히 나타났다가 사라지는 여우처럼, 여우비는 햇볕이 난 날에 잠깐 흩뿌리다가 마는 비를 말한다. 지역에 따라서는 여우비가 내리는 것을 '호랑이 장가간다'고 말하기도 한다.\\n○ 억수 - 물을 끼얹듯이 아주 세차게 쏟아지는 비. 억수장마\\n○ 흑비 - 바람에 날려 떨어지는 가벼운 모래흙. 황사(黃沙)\\n○ 비받이 - 우산\\n○ 해받이 - 양산","images":[]},{"word":"계절, 때와 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401825&page=32","sourceText":"◎ 나달 - 나흘이나 닷새 정도. 세월.\\n어원을 두 가지로 추정할 수 잇는 말이다. 말의 뿌리를 '나흘과 닷새'로 보면 4~5일을 뜻하는 말이고, '날과 달'이 더해져서 된 말로 본다면 곧 세월을 뜻하게 된다. 나달은 그 두 가지 뜻을 함께 가진 말이다. 말하는 상황에 따라서 세월의 뜻으로 쓰이기도 하고, 4~5일을 뜻하기도 한다.\\n◎ 낮곁 - 한낮부터 해 지기까지의 시간을 둘로 나누었을 때 그 전반부.\\n우리의 전통사회에서 하루 동안의 시간샘법은, 낮에는 해가 지나는 길을 따르고, 밤에는 별자리의 놓인 모양에 따랐다. 정오 무렵부터 오후 3시경까지의 반나절을 '낮곁'이라 한다. 낮곁은 해가 가장 높이 떠 있는 시간이다. 세상의 만물이 가장 왕성하게 활동하는 시간이며, 하루 중 가장 더울 무렵이기도 하다.\\n◎ 열나절 - 일정한 한도 안에서 매우 오랫동안.\\n하루 낮의 절반가량을 '나절'이라고 한다. 그러나 나절이 반드시 하루를 절반으로 잘라서 말하는 것은 아니다. '아침나절'이나 '점심나절' 따위와 같이 하루 가운데 일정한 동안을 어림잡아 나타내기도 한다. 그러므로 열나절은 대략 닷새 안팎이 되겠지만, 딱 자라서 닷새를 말하는 것은 아니다. 하루이틀이면 끝낼 수 있는 일을 여러 날 길게 끌고 가는 경우에 쓰는 말이다.\\n◎ 한뉘 - 한평생\\n'뉘'는 보통 사람의 한평생, 한세상, 한 세대를 뜻하는 옛말이다. 그러므로 '한뉘'는 사람의 한평생 또는 한세상을 말한다.\\n'뉘'가 '자손'또는 '자손의 덕'이라는 뜻으로 쓰이는 경우도 있따. 예컨대 '뉘 보다'라고 하면 '자손을 보다'라는 뜻이다. 한편 '볕뉘'에서 처럼 '뉘'가 접미사로 쓰이며 별로 대단치 않은 것, 작은 것, 미천한 것, 그림자 등을 뜻한다. 쌀에 섞인 벼 알갱이를 '뉘'라고 하기도 한다. 이것 또한 하찮은 것을 뜻하는데, 뉘가 많이 섞인 쌀을 '뉘반지기'라고 한다.\\n◎ 한물 -채소나 어물이 한창 쏟아져 나오거나 수확되는 때.\\n'한물갔다'는 말은 오늘날 어떤 사람의 전성기가 지났다는 뜻으로 쓰인다. 그런데 이 말의 유래가 되는 '한물'은 채소나 어물 등이 한창 성한 때를 말한다. 곧 '성어(成魚)기'나 '수확기'의 뜻이다. 특히 '수확의 절정기가 지나다'의 뜻으로 쓰인 '한물이 넘다','한물이 지다'따위의 표현이 사람의 처지에 적용되어 \\"그 사람도 이제 한물갔어!\\"와 같이 쓰이게 된 것이다. 한편 한물의 때를 가리킬 때는 '한철'이라고 한다.\\n◎ 해뜰참 - 해가 돋을 무렵\\n해돋이는 해의 움직임을 나타내는 말이고 해뜰참은 '해돋이하는 때'를 말하는 것이다. '해돋이를 보다'라는 말은 맞지만 '해뜰참을 보다'라는 말은 맞지 않다. 또 '해돋이에 일터로 나가다'라는 말은 틀리다. '해뜰참에 일터로 나가다'라고 해야 한다. 해뜰참은 '해거름'에 맞서는 말이다.","images":[]},{"word":"별과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401720&page=32","sourceText":"◎ 개밥바라기 - 해 진 뒤에 서쪽 하늘에 반짝이는 금성.\\n'바라기'는 작은 그릇을 말한다. 따라서 개밥바라기는 '개의 밥그릇'이다. 우리가 살고 있는 지구와 비교적 가까이 있는 행성으로, 지구의 바로 안쪽에서 태양의 주위를 돌며 저녁이나 새벽에 선명한 빛을 내뿜는 별이 바로 금성(金星)이다.\\n예) 저물녘 열구름 사이로 떠오른 개밥바라기 빛이 처연하다.\\n◎ 미리내 - 남북으로 길게 강물처럼 분포한 항성의 무리. 은하수.\\n미리내는 불규칙한 모양을 가진 여러 항성들의 무리다. 많게는 수억 개의 별이 거대한 소용돌이 모양으로 어떤 질서를 이루고 있다. 따라서 이것의 측면을 지구에서 바라보면 거대한 띠, 혹은 거대하게 흐르는 강물처럼 보이는 것이다. 미리내의 '미리'는 '미르'에서 변천한 것으로 보이는데, '미르'는 용(龍)을 뜻하는 우리 옛말이다. 그러므로 미리내는 '용의 내[川]'라는 뜻이다.\\n예) 사람의 눈으로 볼 수 있는 것 중에서 가장 큰 것은 무엇일까. 그것은 바로 미리내다.\\n◎ 별똥별 - '유성'의 우리말\\n유성(流星)을 우리말로 '별똥별'이라고 한다. 유성은 우주 공간의 먼지 덩어리가 지구의 대기권 안으로 들어와서 빠른 속도로 낙하하며 공기와 마찰하면서 빛을 내는 것을 말한다. 우리가 흔히 혜성이라고 부르는 꼬리별, 살별과는 다른 것이다. 한편 별똥별이 지구에 떨어진 것을 운석이라고 하는데, 이를 우리말로는 '별똘돌'이라고 한다.\\n◎ 샛별 - 새벽 동쪽 하늘에 반짝이는 금성.\\n해질녘에 보이는 금성을 '개밥바라기'라고 한 것처럼, 금성이 새벽하늘에 보일 때는 '샛별'이라고 부른다. '새벽의 별' 또는 '새로 난 별'이라는 의미를 줄인 말이다.\\n◎ 싸라기별 - 싸라기처럼 아주 잘게 보이는 별. 잔별.\\n싸라기는 '쌀의 부스러기'를 말한다. 보통 '부스러기'는 작고 하찮은 것을 이르지만, 우리의 전통 정서에서 싸라기는 단순한 부스러기가 아니다. 쌀은 귀중한 식량이다. 그러니 쌀 한 톨뿐만 아니라 그 부스러기도 함부로 버릴 수 없다. 매우 귀한 물건을 '금싸라기'에 빗대는 것처럼, 싸라기는 '자잘하지만 매우 귀한 것'을 뜻한다. 그런 의미에서 우리 조상들은 무수히 흩어져 보이는 작은 별들을 단순히 잔별이라고 하지 않고 싸라기별이라고 부른 것이다. 이를 줄여서 '싸락별'이라고도 한다.\\n예) 저 하늘에 무수히 빛나는 싸라기별을 보아라. 그 가운데 이름을 가진 별이 몇이나 될까?","images":[]},{"word":"달과 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401692&page=32","sourceText":"● 달가림 - '월식'의 순 우리말.\\n월식(月蝕)은 해와 지구와 달이 일직선으로 위치하여 지구의 그림자가 달을 덮어버리는 현상을 말한다. 일식(日蝕)은 반대로 달이 해를 가리는 것이다. 그런데 일식이나 월식에서 '식(蝕)'은 좀이 먹거나 썩어 들어간 상처를 뜻한다. 뜻이 별로 좋지 않은 한자말이다.\\n그것보다는 '해가림'이나 '달가림'이라는 말이 훨씬 느낌도 좋고 과학적이다.\\n● 달물결 - 달빛이 은은히 비낀 물결.\\n달빛이 바다나 호수의 표면에 비껴드는 풍경 속에 홀로 서 있는 장면을 상상해보라. 어느 숲에선가 금방이라도 소복한 처녀귀신이 사뿐사뿐 걸어 나올 것 같다. 달물결은 자연이 만들어낸 가장 음산(陰散)한 풍경이라고 할 수 있다. 전통사사인 음양의 원리에 따르면 달과 물은 모두 음(陰)의 성질을 가지고 있다. 음의 기운이 강한 두 가지가 만났으니 음산함의 극치다.\\n● 달안개 - 달밤에 피어오르는 안개, 또는 달빛이 안개처럼 뿌옇게 보이는 것.\\n강의 어귀나 호수 주변에 피어오르는 안개와 달빛이 어우러진 말이다. 희뿌연 안개 사이로 푸르스름한 달빛이 비껴드는 장면이 떠올리면, 무섭고도 슬픈 전설의 배경이 연상된다. 달빛과 안개는 공포영화에 등장하는 단골 장면이기도 하다.\\n● 어스름달 - 해가 진 다음이나 뜨기 전의 어슬녘에 뜨는 달.\\n'어스름'은 해가 진 다음이나 뜨기 전 얼마 동안 주위가 환한 상태를 말한다. 어둠과 밝음이 교차하는 시간이라 할 수 있다. 어스름달은 이렇듯 어스름할 무렵, 즉 '어슬녘'에 뜨는 달이다. 검기울어 가는 초저녁에 떠 있는 달이나, 해 뜨기 직전 동살이 들 무렵에 떠 있는 달 모두 어스름달이다. 달은 깜깜한 밤중일수록 더욱 선명하고 밝게 느껴진다. 그런 이치로 본다면 어스름달은 때가 조금 이르거나 늦은 달이라고 할 수 있다.\\n● 지샌달 - 먼 동이 튼 뒤 서쪽 하늘에 보이는 달.\\n밤을 지새우고 해가 뜬 뒤에도 서쪽 하늘에 아직 달이 떠 있는 것을 가끔 볼 수 있다. 이를 '지새는달' 또는 줄여서 '지샌달'이라고 한다. 밤을 지새운 다음에 떠 있는 달이라는 뜻이다. 지샌들은 어스름달의 한 가지다.\\n- 박남일의 '우리말 풀이사전' 중에서","images":[]},{"word":"해와 관련된 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401594&page=33","sourceText":"◆ 갓밝이 - 새벽 동이 틀 무렵의 희끄무레한 상태. 지금 막 밝아진 때.\\n희미하게 날이 밝을 무렵을 흔히 '여명(黎明)'이라고 한다. 이것에 해당하는 우리말이 바로 '갓밝이'다. '금방'또는 '지금 막'이라는 뜻을 가진 꾸밈말 '갓'과 '밝다'의 명사형인 '밝이'가 붙어서 이루어진 말. '갓난아기'의 '갓'과 같은 이치이다.\\n예) 부지런하기로 소문난 김씨는 날마다 갓밝이에 벌써 쇠꼴을 한 바지게나 베어 짊어지고 사립짝을 밀고 들어온다.\\n◆ 돋을볕 - 해돋이 무렵 처음으로 솟아오르는 햇볕.\\n간밤의 어둠을 밀어내면서 부드럽게 세상을 비추는 돋을볕은 상서로운 기운을 느끼게 한다. 해돋이 때 처음 비쳐드는 빛을 '햇귀'라고도 하는데, 두 말의 느낌에 미묘한 차이가 있다.\\n돋을볕이 햇볕의 힘찬 움직임을 느끼게 하는 말이라면, 햇귀는 소중하고 존귀한 느낌을 주는 말이다.\\n예) 매 새해 첫날 해맞이를 하는 사람들은 기실 해돋이 때 뿜어져 나오는 돋을 볕을 보기 위해서 명산의 꼭대기나 동해 바닷가로 모여든다.\\n◆해거름 - 해가 서쪽으로 기울어질 무렵.\\n해거름은 '해'와 '거르다'가 결합된 말이다. '끼니를 거르다'라는 말처럼 '거르다'는 뭔가를 차례대로 해가다가 중간에 어느 자리를 빼고 넘기는 것을 말한다. 즉 해거름은 한 일도 없이 하루간 건너뛰듯 지나가 버린 것을 뜻한다. 해와 관련된 우리말을 자세히 보면 해가 떠 있는 동안의 시간의 흐름에 따라 세밀하게 구분되어 있음을 알 수 있다. 그 중에서 해거름은 해넘이보다 조금 앞선 때를 가리킨다. 해거름은 이미 해가 서쪽 산마루에 걸려 있어서 어떤 일을 새로 시작하는 것보다는 하던 일의 아귀를 지어야 할 때다.\\n예) 점심 먹고 바로 밭으로 온다던 서방님은 해거름이 다 되어서야 불콰한 낮을 하고는 갈지자걸음으로 나타났으니, 그 꼴을 본 아낙은 속이 끓어 어찌할 바를 몰랐다.\\n◆ 해바라기 - 양지바른 곳에서 햇볕을 쬐는 일.\\n따사한 햇살도 사시사철 무한정으로 모든 사람들의 머리 위를 비추지는 않는다. 흐린 날. 궂은 날 다 지나고 구름 걷힌 뒤에야 그 따뜻한 기운을 비로소 사람들에게 선사한다. 그래서 햇볕은 더욱 소중하고 고맙게 느껴진다. 해바라기는 해와 사람의 가장 직접적인 만남이다. 겨울을 지난 봄철에는 하루가 다르게 해가 길어지는 것을 보면서 사계절의 변화를 실감하게 된다. 따사한 봄볕이 내리쬐기 시작할 무렵 도심지 공원 한구석에서 해바라기하는 노인들을 종종 볼 수 있다. 볕뉘를 쬐면서 노인들은 무슨 생각을 하게 되는 것일까?\\n예) 날도 좋은데 드렇게 방 안에만 틀어박혀 있지 말고 옥상에 올라가서 해바라기라도 하렴!\\n◆ 햇발 - 사방으로 뻗친 햇살.\\n빗발, 눈발, 서릿발 등 날씨와 관련된 말 뒤에 붙는 '-발'은 당찬 기세를 뜻한다. 따라서 햇발은 기세 좋게 강하게 뻗치는 햇살을 나타낼 때 쓰는 말이다. 예컨대 구름 사이로 희미하게 내비치는 햇살을 햇발이라고 부르지는 않는다. 사방으로 펼쳐진 햇살만을 햇발이라고 부른다.\\n예) 우리가 탄 자동차는 노해에 떨어지는 따가운 햇발을 받으며 해변을 따라 달려갔다.\\n- '좋은 문장을 쓰기 위한 우리말 풀이사전' 중에서","images":[]},{"word":"지질하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401490&page=33","sourceText":"★ [형] 보잘것없고 변변하지 못하다. - '지질하다' 대신 '지질맞다'를 써도 좋다. 어찌씨는 '지질지질'인데, '지질지질'은 '물기가 많아서 조금 진 듯한 모양'을 가리키기도 한다. '지질하다'도 두 가지 뜻으로 쓰이는 말이엇 '싫증날 만큼 지루하다'는 의미를 갖기도 한다.\\n예)\\n▶섣불리 도망질을 치다가 붙들리는 날이면 지질한 목숨이나마 보전 못할 테니까….<홍명희, 임걱정>\\n▶지질한 서방 믿어 보며 사는 계집처럼 가련한 자도 없을 거라. <이문구, 장한몽>","images":[]},{"word":"곰비임비","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401314&page=33","sourceText":"★연거푸. 자꾸자꾸. [양태]\\n@1. 일이나 물건이 거듭 모이는 모양\\n2. 물건이 거듭 쌓이거나 일이 겹치는 모양. 예) 병일은 곰비임비 술을 들이켰다(현진건의 『적도』에서)","images":[]},{"word":"밑두리콧두리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401272&page=33","sourceText":"[명] 확실히 알기 위하여 자세히 자꾸 캐어묻는 근본.\\n예) 과부 할미는 밑두리콧두리 별것을 다 묻는다는 실뚱머룩한 표정으로 입을 삐죽거렸다.\\n<문순태, 타오르는 강>","images":[]},{"word":"요일","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceText":"월요일 - 다날\\n화요일 - 부날\\n수요일 - 무날\\n목요일 - 남날\\n금요일 - 쇠날\\n토요일 - 흙날\\n일요일 - 해날","images":[]},{"word":"日","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceText":"1일 - 하루\\n2일 - 이틀\\n3일 - 사흘\\n4일 - 나흘\\n5일 - 닷새\\n6일 - 엿새\\n7일 - 이레\\n8일 - 여드레\\n9일 - 아흐레\\n10일 - 열흘\\n11일 - 열하루\\n12일 - 열이틀\\n13일 - 열사흘\\n14일 - 열나흘\\n15일 - 열닷새\\n16일 - 열엿새\\n17일 - 열이레\\n18일 - 열여드레\\n19일 - 열아흐레\\n20일 - 스무날\\n21일 - 스물하루\\n22일 - 스물이틀\\n23일 - 스물사흘\\n24일 - 스물나흘\\n25일 - 스물닷새\\n26일 - 스물엿새\\n27일 - 스물이레\\n28일 - 스물여드레\\n29일 - 스물아흐레\\n30일 - 서른날\\n31일 - 그믐날","images":[]},{"word":"月","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceText":"1월 해오름달 - 새해 아침에 힘있게 오르는 달\\n2월 시샘달 - 잎샘추위와 꽃샘추위가 있는 겨울의 끝 달\\n3월 물오름달 - 뫼와 들에 물 오르는 달\\n4월 잎새달 - 물오른 나무들이 저마다 잎 돋우는 달\\n5월 푸른달 - 마음이 푸른 모든이의 달\\n6월 누리달 - 온 누리에 생명의 소리가 가득차 넘치는 달\\n7월 견우직녀달 - 견우직녀가 만나는 아름다운 달\\n8월 타오름달 - 하늘에서 해가 땅위에선 가슴이 타는 정열의 달\\n9월 열매달 - 가지마다 열매맺는달\\n10월 하늘연달 - 밝달뫼에 아침의 나라가 열린달\\n11월 미틈달 - 가을에서 겨울로 치닫는 달\\n12월 매듭달 - 마음을 가다듬는 한해의 끄트머리 달","images":[]},{"word":"거섶","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400845&page=33","sourceText":"거섶 : [목재]\\n1. 물이 둑에 스쳐서 개개지 못하게 둑의 가에 말뚝을 박고 가로 결은 나뭇가지\\n2. 삼굿(삼을 벗기기 위하여 찌는 구덩이나 큰 솥) 위에 덮는 풀\\n3. 비빔밥에 섞는 나물.\\n예) … 겨우내 얼지 않고 흐르는 여우목이 있었으며, 발 벗지 않고도 건널 수 있게 고리삭아 가는 오리나무 서너 개를 걸쳐놓은 거섶이 있었다 (이문구의 소설 '관촌수필'에서)","images":[]},{"word":"사리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400750&page=33","sourceText":"사리다:[동]\\n1. 국수, 새끼, 실 따위를 동그랗게 포개어 감다.\\n▶ 다음에 쓰기 좋게 줄을 잘 사려 두어라.\\n2. 뱀 따위가 몸을 똬리처럼 동그렇게 감다.\\n▶ 그 신(神)은 몸을 사리면 팔 척 장신의 남자만큼 하여지지만, 그 몸을 늘이면 이 바다 안에 꽉 들어찰 만큼 크다. <한승원, 해일>\\n3. 짐승이 겁을 먹고 꼬리를 사리고 숨었다.\\n4. 박아서 나온 못을 꼬부려 붙이다.\\n5. 어떤 일에 적극적으로 나서지 않고 살살 피하며 몸을 아끼다.\\n▶ 그는 이번 일로 불이익이 있을까 몸을 사리는 눈치였다.\\n6. 정신을 바짝 가다듬다.\\n▶ 그는 새삼 마음을 굳게 사려 먹었다.","images":[]},{"word":"불땀","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400635&page=33","sourceText":"불땀 : [불] 화력의 세고 약한 정도.\\n▶ 그녀는 불땀이 좋은 바싹 마른 삭정이만을 골라 불을 지폈다. <조정래, 태백산맥>\\n♣ 썩은 장작은 불땀이 적고, 참나무 장작은 불땀이 세다. 나무가 자랄 때 남쪽으로 향하여, 햇볕을 많이 받아 불땀이 좋은 부분을 '불땀머리'라고 한다. 장작의 '불땀머리'를 치며 잘 쪼개진다.","images":[]},{"word":"<<비의 우리말 >>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceText":"<<비의 우리말 >>\\n가루비 - 가루처럼 포슬포슬 내리는 비.\\n잔 비 - 가늘고 잘게 내리는 비.\\n실 비 - 실처럼 가늘게, 길게 금을 그으며 내리는 비.\\n싸락비 - 싸래기처럼 포슬포슬 내리는 비.\\n날 비 - 놋날(돗자리를 칠 때 날실로 쓰는 노끈)처럼 가늘게 비끼며 내리는 비.\\n발 비 - 빗발이 보이도록 굵게 내리는 비.\\n작달비 - 굵고 세차게 퍼붓는 비.\\n달구비 - 달구(땅을 다지는 데 쓰이는 쇳덩이나 둥근 나무 토막)로 짓누르듯 거세게 내리는 비.\\n여우비 - 맑은 날에 잠깐 뿌리는 비.\\n먼지잼 - 먼지나 잠재울 정도로 아주 조금 내리는 비.\\n개부심 - 장마로 홍수가 진 후에 한동안 멎었다가 다시 내려, 진흙을 씻어 내는 비.\\n바람비 - 바람이 불면서 내리는 비.\\n도둑비 - 예기치 않게 밤에 몰래 살짝 내린 비.\\n누 리 - 우박.\\n궂은비 - 오래 오래 오는 비.\\n보름치 - 음력 보름 무렵에 내리는 비나 눈.\\n그믐치 - 음력 그믐께에 내리는 비나 눈.\\n웃 비 - 비가 다 그치지는 않고, 한창 내리다가 잠시 그친 비.\\n해 비 - 한쪽에서 해가 비치면서 내리는 비.\\n꿀 비 - 농사짓기에 적합하게 내리는 비.\\n단 비 - 꼭 필요할 때에 알맞게 내리는 비.\\n목 비 - 모낼 무렵에 한목 오는 비.\\n못 비 - 모를 다 낼 만큼 흡족하게 오는 비.\\n약 비 - 요긴한 때에 내리는 비.\\n모다깃비 - 뭇매를 치듯이 세차게 내리는 비.\\n우레비 - 우레가 치면서 내리는 비.\\n마른비 - 땅에 닿기도 전에 증발되어 버리는 비\\n오란비 - 장마의 옛말\\n건들장마 - 초가을에 비가 내리다가 개고, 또 내리다가 개곤 하는 장마.\\n일 비 - 봄비. 봄에는 할 일이 많기 때문에 비가 와도 일을 한다는 뜻으로 쓰는 말.\\n잠 비 - 여름비. 여름에는 바쁜 일이 없어 비가 오면 낮잠을 자기 좋다는 뜻으로 쓰는 말.\\n떡 비 - 가을비. 가을걷이가 끝나 떡을 해 먹으면서 여유 있게 쉴 수 있다는 뜻으로 쓰는 말.\\n술 비 - 겨울비. 농한기라 술을 마시면서 놀기 좋다는 뜻으로 쓰는 말.\\n비 꽃 - 비 한 방울 한 방울. 비가 시작될 때 몇 방울 떨어지는 비.","images":[]},{"word":"모꼬지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400412&page=34","sourceText":"모꼬지 : [놀이] 여러 사람이 놀이나 잔치 따위로 모이는 일.\\n▶ 혼인날에도 다른 제자보다 오히려 더 일찍이 와서 모든 일을 총찰하였고 모꼬지 자리에서도 가장 기쁜 듯이 술을 마시고 춤을 추고 즐기었다. <현진건, 무영탑>","images":[]},{"word":"안통","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400376&page=34","sourceText":"①그릇이나 통 따위의, 테두리가 있는 물체의 속 넓이. ¶그 그릇은 보기보다 안통이 커서 쓸모가 많다.\\n② ‘속마음’을 속되게 이르는 말. ¶안통이 그렇게 좁아서 어디 같이 지내겠느냐?\\n③안으로 향한 부분이나 안에 있는 부분. =안쪽. ¶지리산 산자락이 한참 북쪽으로 흘러가다가 산자락 끝이 불쑥 솟아오른 그 안통 고원 지대가 운봉이었다.〈송기숙, 녹두 장군〉","images":[]},{"word":"담빡과 더펄더펄","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400277&page=34","sourceText":"★ 담빡 : 깊은 생각 없이 가볍게 행동하는 모양.\\n'담빡'과 비슷한 말로, '덥석'또는 '냉큼'이라는 말이 있어요. 달려덜어 냉큼 움켜잡거나 할 때 '덥석 잡는다'라고 하잖아요. 이렇게 행동이 재빠를 때는 그 짧은 시간 동안 깊은 생각을 하지는 못하겠지요. 그럼 거의 후회할 짓을 하게 되고 말이에요. 성격 급한 친구들, '담빡'행동하지 말고 늘 먼저 생각하고 행동하세요.\\n예) 예쁜 꽃이 눈에 쏙 들어오기에 담빡 꺾어 왔지요.\\n★ 더펄더펄 : 들떠서 침착하지 못하고 가볍게 행동하는 모양.\\n'더펄더펄'도 '담빡'처럼 가볍게 행동한다는 뜻인데, 여기서 나온 말이 몇 개 있어요. 우선 '더펄이'는 붙임성이 있고 활발한 사람을 말해요. 본뜻과는 달리 그리 부정적인 사람을 일컫지는 않는 모양이에요. 또한 '더펄더펄'이 더부룩한 털이나 머리칼 같은 것이 출렁거리듯 흔들리는 모양을 가리키기도 하기 때문에 '더펄머리'라는 말도 있어요. 더펄더펄 날리는 더부룩한 머리털을 말하지요. 그리고 '더펄개'는 온몸에 털이 길게 나서 더펄거리는 개, 즉 삽살개를 말해요.\\n예) 꽃님이는 생긴 것과 다르게 더펄더펄 선머슴처럼 군다.","images":[]},{"word":"너스레","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400115&page=34","sourceText":"너스레: 남을 놀리려고 수다스럽게 늘어놓는 말\\n'너스레'는 원래 흙구덩이나 그릇, 또는 바닥에 물건이 빠지지 않게 하려고 걸쳐 놓는 막대기를 말해요. 지금은 그 뜻이 변해 '남을 놀리려고 수다스럽게 늘어놓는 말이나 말솜씨'를 말하지요.\\n'너스레을 놓다', '너스레를 떨다', '너스레를 부리다'로 쓰인답니다.\\n예) 너무 미안한 마음에 괜히 너스레를 떨며 웃어댔다.","images":[]},{"word":"모르쇠","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400040&page=34","sourceText":"모르쇠 : 아는 것이나 모르는 것이나 다 모른다고 잡아떼는 일.\\n덮어놓고 모른다고 잡아떼는 일을 '모르쇠'라고 해요. 거의 들어보지 못했던 말이죠? 그래서인지 우리말을 맞추는 텔레비전 프로그램에서 10대 청소년들에게 이 말의 뜻을 추측해 보라고 했더니 '지능이 떨어지는 새'라고 대답했대요.\\n'모르쇠 잡다'의 모양으로도 쓰이는데, '전혀 알지 못하는 체한다'는 뜻이에요. 그런데 '모르다'라는 말이 어떻게 해서 생겨났는지 아나요? 아, 알지 못한다고요? 그래요. 맞았어요! 너무나 당연한 말이겠지만, '모르다'는 '알지 못하다'에서 나온 말이에요. 우리말의 어원도 가만 보면, 간단하고도 참 재미나지요?\\n그건 그렇고, 알면 안다고 할 것이지 왜 모른다고 잡아뗄까요? 대답하기 곤란해서? 아니면 책임지기 싫어서 나 몰라라 하려고? 어찌되었든 '모르쇠'는 좋은 뜻으로 쓰이는 예는 거의 없어요. 질문한 사람 속 터지게 '모르쇠'는 하지 말아요!\\n예) 유씨는 굳이 더 캐어물으려고 하지 않고 그쯤에서 짐짓 모르쇠를 해 버렸다.","images":[]},{"word":"저지레","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399951&page=34","sourceText":"'저지레'는 일을 그르치게 하거나 말썽을 부린다는 뜻으로, '저지르다'에서 비롯된 말이에요. '저지르다'는 '네가 기어이 일을 저질렀구나!' 처럼 탈이 나게 한다는 부정적인 의미로 쓰이는데, 대체로 아이들이 일으킨 말썽이나 문제를 가리킬 때 쓰인답니다. 뭐, 가끔은 호기심 많은 어린 아이들이 그르친 가벼운 '저지레'는 귀여울 때도 있지만 말이에요.\\n예) 네 저지레 때문에 내가 얼마나 혼난 줄 알아?","images":[]},{"word":"갈무리, 곰비임비","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399853&page=34","sourceText":"◐ 갈무리 : 물건을 잘 챙겨 간직함. 일을 마무리함.\\n'갈무리'는 주로 '저장'의 뜻으로 쓰이고, 일을 '마무리'한다는 의미로 쓰여요.\\n물건뿐 아니라 넘쳐 나는 정보들도 잘 갈무리해서 내 것으로 만들어","images":[]},{"word":"함초롬, 해설피","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399720&page=34","sourceText":"넓은 벌 동쪽끝으로/ 옛이야기 지줄대는 실개천이 휘돌아 나가고,\\n얼루백이 황소가/해설피 금빛 게으른 울음을 우는 곳.\\n그 곳이 차마 꿈엔들 잊힐리야.\\n(줄임)\\n흙에서 자란 내 마음/파아란 하늘빛이 그리워\\n함부로 쏜 화살을 찾으러/풀섶 이슬에 함추롬휘적시던 곳.\\n그 곳이 차마 꿈엔들 잊힐리야.\\n노래로도 만들어진 정지용 시인의 <향수>라는 유명한 시예요.\\n시인 자신이 태어나고 자란 고향이 평화로운 모습을 마치 한 폭의 그림처럼 아름답게 그려 놓았어요. 차마 꿈에도 잊을 수 없는 곳이라고 표현하면서 말이지요. 이 시는 아름다운 우리말을 많이 담고 있어 우리말을 돋보여 주는 시이기도 한데요, '해설피'와 '함추롬' 등을 보면 알 수 있어요. '해설피'는 해가 질 때 빛이 약해진 모양을 뜻해요. 해와, 해가 져서 밝은 빛이 약하다는 '설핏하다'가 더해져서 (해+설핏하다 →해설피) 생긴 말이지요. '함추롬'은 '함초롬'의 사투리로\\n'함초롬하다'고 하면, '어떤 기운이 서리어 있거나 물기를 머금고 있어 차분하고 곱다'는 뜻이에요. 그 맑디맑은 뜻도 그렇지만, '함초롬'의 '롬'처럼'ㅁ'으로 끝나는 말은 왠지 곱고 따뜻한 느낌이 들지요. '둥그스름, 상큼, 소담, 달콤'처럼 말이에요.","images":[]},{"word":"케케묵다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399686&page=34","sourceText":"오래되어서 낡았다는 뜻의 '케케묵다'는 흔히 '켸켸묵다'나 '캐캐묵다'로 잘못 쓰이고 있어요.\\n'케케묵다'는 '켜이켜이 묵다'에서 비롯된 말이에요. '켜'는 '포개진 물건의 층'을 뜻하고, '켜켜이'는 '여러 켜마다'의 뜻이지요. 층층이 여러 켜마다 오래되었으니 얼마나 낡았을까요? 아무튼 이 말은 물건뿐 아니라 새로운 지식 같은 것을 받아들이지 못하는 고리타분한 생각 등을 가리키는 말로 쓰이기도 해요.\\n예) 그렇게 겸손하게 행동하면 이 젊은이들은 케케묵은 구닥다리라고 흉볼걸요?","images":[]},{"word":"추레하다, 후줄근하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399559&page=35","sourceText":"'추레하다'는 겉모양이 깨끗하지 못하고 생기가 없다는 뜻인데, '추레하다'의 작은 말이 '초라하다'라는걸 알게 되면 뜻이 쉬이 이해가 갈 거예요.\\n예) 몸이 불편한데 옷까지 추레하면 어디 제대로 된 대접을 받을 수 있는 세상입니까?\\n'추레하다'와 비슷한 말로 '후줄근하다'가 있어요. 옷이나 피륙 따위가 젖거나 해서 추레한 모양을 뜻하고, 몸이 지쳐 기운이 없다는 뜻으로도 쓰여요.\\n예) 무릎이 나온 청바지며 후줄근한 잠바가 비에 젖어 번들거렸다.\\n추레하고 후줄근한 모양을 빗댄 표현을 예로 들자면 '비에 맞은 장닭 같다'는 속담이 있어요. 좋던 차림새가 어떤 까닭으로 볼꼴 없이 된 모양을 이르는 말이에요. '장닭'은 '수탉'을 말하는데, 수탉이 비 맞기 전과 비 맞은 후의 모양새가 꽤 큰 차이가 있어서 이런 말이 생겼대요. 어떤 모양새인지 무척 궁금한데, 비 맞은 수탉을 어디 가면 볼 수 있을까요?","images":[]},{"word":"암팡지다, 다부지다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399469&page=35","sourceText":"▣ 암팡지다: 몸은 작아도 힘차고 다부지다.\\n▣ 다부지다: 벅찬 일을 치러 낼 힘이 있다.\\n'암팡지다'는 작은 몸이지만 힘차고 다부지다는 뜻이에요. '다부지다'는 벅찬 일을 치러 낼 힘이 있다는 뜻이지요. '작은 고추가 맵다'는 말이 생각나는 말이에요.\\n'다부지다'도 물론 '다부진 몸매', '다부진 각오', '다부진 꿈'처럼 꽉 차고 당차고 힘찬 이미지를 느끼게 하는 말이고요.\\n예) 당장이라도 한판 붙자는 듯 두 팔을 걷어붙인 그 모습은 암팡지고 다부지다 못해 오히려 귀여움을 느끼게 했다.","images":[]},{"word":"오붓하다, 조붓하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399388&page=35","sourceText":"♣ 오붓하다 : 아늑하고 정답다. '\\n오붓하다'는 그리 많지 않은 사람들이 다정하게 아늑한 시간을 갖게될 때 쓰이는 말이에요. 예) 자네하고 오붓하게 여행도 즐기고 문병도 하자는 게지. 그리고 '오붓하다'는 말은 '살림살이가 넉넉하다'는 뜻도 있어요.\\n예) 만일의 경우에 대비하여 미리 준비해 가지고 왔던 돈뭉치를 내흔드는 살림이 오붓한 집 아버지도 있었다. 하나의 낱말이 '다정하다'는 뜻과 '살림살이가 넉넉하다'는 뜻을 함께 쓴다는 게 조금 생뚱맞게 느껴지지만, 살림살이도 어느 정도는 넉넉해야 가족끼리 더욱 오붓할 수 있기 때문이겠지요?\\n♣ 조붓하다 : 조금 좁은 듯하다.\\n'조붓하다'는 말은 설명하자니 퍼뜩 어떤 노래가 떠오르네요. '산 너머 조붓한 오솔길에 봄이 찾아온다고~'로 시작되는 '봄이 오는 길'이라는 경쾌한 노래예요. 그런데 왠지 넓은 길보다는 조금 좁더라도 '조붓한' 오솔길이 더 '오붓하게' 느껴지지요?\\n예) 언니와 나는 가끔 뒷산의 조붓한 길을 오붓하게 걷곤 했다.","images":[]},{"word":"알토란같다, 옹골차다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399245&page=35","sourceText":"▶ 알토란같다 : 쓸모 있고 야무져서 버릴 데가 없다.\\n'토란'이라는 푸성귀가 있어요. 소화를 돕고 양양가도 많아 국으로 많이 만들어 먹는 토란은 땅에서 캐내어 먹어요. 그런데 처음에 토란을 파내면 흙이 묻어 있고 잔뿌리도 많지요. 이렇게 지저분한 토란의 흙을 털어 내고 잔뿌리도 다듬어 깨끗하게 한 토란을 '알토란'이라고 해요. 당연히 보기 좋게 쓸모 있겠죠? 그래서 여기서 '알토란같다'는 말이 나왔어요. '모양이 깨끗하고 매끈하다', '야무지고 버릴데가 없다', '살림살이를 알뜰하게 한다'는 뜻으로 쓰인답니다.\\n예) 저 알토란같이 생긴 아이는 뉘 집 아들인고?\\n▶ 옹골차다 : 야무지게 속이 꽉 차 있다.\\n'옹골차다'는 '알토란같다'와 마찬가지로 야무지게 속이 꽉 차 있다는 뜻이에요. '어떤 것이 가지고 있어야 할 내용에 조금도 모자람이 없는 상태'를 말하는 '옹글다'와 뜻이 비슷하면서 느낌이 더 강한 말이 바로 '옹골차다'예요. 여기서 '옹'은 '옹고집'에 쓰인 '옹'과 같은 말로, 대체로 작지만 단단하고 완고함을 뜻한답니다.\\n예) 병어는 버릴 부분이 거의 없는 옹골찬 생선이다.","images":[]},{"word":"아리다, 아리땁다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399147&page=35","sourceText":"◈ 아리다 : 혀끝을 똑 쏘는 것 같은 느낌이 있다. 아프다.\\n◈ 아리땁다 : 사랑스럽고 아름답다. '아리다'와 '아리땁다'의 설명은 우리 민족의 대표적인 민요 '아리랑'과 함께 해야 할 것 같아요.\\n오랜 옛날부터 우리나라 사람들의 사랑을 받으며 널리 불린 노래 '아리랑'은 무슨 뜻일까요? 아직까지 확실한 해석은 없지만 두 가지 정도로 추측할 수 있다고 해요.\\n첫 번째, '아리랑'에서 '아리'를 '아프다'는 뜻의 '아리다'로 보는 거예요. 마음의 상처를 받았을 때 '아리다'라는 말을 하니까 '아리'를 '아프게'로 풀이한다면 '아리랑'은 '마음이 아프도록 (그리운)님'이 되는 것이지요 ('랑'은 '님'이라는 뜻이에요).\\n두 번째로 '아리랑'의 '아리'를 '아리따운(아리+다운)'의 '아리',즉 '곱다', '아름답다'로 해석하는 거예요. 그러니까 '아리랑'의 두 번째 뜻은 '고운 님'이에요.\\n노래 가사에서도 그렇고, 사랑은 아픈 거라고 말하는 걸 보면 '아린' 사랑과 '아리따운 '사랑이 같은 말이라고 해도 지나친 말은 아니겠지요?","images":[]},{"word":"아름차다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399085&page=35","sourceText":"◆ 아름차다 : 힘에 벅차다.\\n'아름차다'는 '힘에 겹다, 벅차다'는 뜻인데, 여기서 '아름'은 두 팔을 벌려 껴안은 둘레의 길이를 말해요. 흔히 나무의 둘레를 '아름'으로 표현하지요. 그래서 흔히 '한 아름'이라고 하면 넉넉하게 많다는 느낌으로 쓰여요. 무엇이든 간에, 두 팔로 감싸 안을 정도로 한 아름인 것이면 힘에 벅차기도 하겠죠?\\n예) 나에게는 오늘 꼭 해야 할 아름찬 과제가 있다.","images":[]},{"word":"심드렁하다, 시큰둥하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398933&page=35","sourceText":"◑ 심드렁하다 : 마음에 들지 않아 관심이 없다.\\n◑ 시큰둥하다 : 마음에 내키지 않아 말이나 하는 짓에 성의가 없다.\\n'심드렁하다'는 마음이나 입맛에 맞지 않아 관심이 없어서 서두르지 않을 때 쓰는 말이에요. '마음에 내키지 않아 말이나 하는 짓에 성의가 없다'는 '시큰둥하다'와 비슷한 뜻이지요.\\n예) 우리가 아무리 재롱을 떨어도 할머니의 심드렁하고 시큰둥한 표정은 변하지 않았다.\\n아무리 예쁜 얼굴이라도 항상 심드렁하고 시큰둥한 얼굴은 예뻐 보이지 않겠지요?","images":[]},{"word":"슬밋하다와 훤칠하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398822&page=35","sourceText":"▶ 슬밋하다 : 거침새 없이 길고 곧다.\\n▶ 훤칠하다 : 길이가 길고 미끈하다. 소설가 현진건의 <불국사 기행> 이라는 글을 보면 '슬밋하다'는 말이 나와요. 불국사의 석굴암 벽 가운데에 병을 움켜쥐고 서 있는 '십이면관음보살'이 새겨져 있는데, 이 '십일면관음보살'의 허리를 '좁은 듯하면서도 슬밋한 허리'라고 표현했어요.\\n보살상의 허리를 보세요. 어때요, 거침새 없이 길고 곧은 '슬밋하다'의 뜻과 느낌을 알 것도 같지요? '훤칠하다'는 길고 미끈하거나 막힘없이 깨끗하고 시원스러운 것을 말해요. 키가 큰 것뿐 아니라 시원한 성격을 빗댈 때도 훤칠하다고 표현하지요.\\n'헌칠하다'는 말도 같이 쓰이기는 한데, 이 말은 키나 몸집이 보기 좋을 때만 쓴다는 점이 달라요. 다시 말해 '헌칠하다'보다는 '훤칠하다'가 더 넓은 뜻으로 쓰이는 거예요.","images":[]},{"word":"스산하다와 을씨년스럽다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398730&page=35","sourceText":"▶ 스산하다 : 몹시 어수선하고 쓸쓸하다.\\n'스산하다'는 '스산한 하늘'이나 '스산한 바람'처럼 날씨가 약간 흐리고 으스스할 때나 마음이 쓸쓸하거나 어수선할 때 쓰는 말이에요.\\n예) 안개가 짙게 깔려 있어서 혼자 걷는 새벽길이 더욱 스산하다.\\n▶ 을씨년스럽다 : 날씨나 분위기 따위가 스산하고 쓸쓸하다.\\n'을씨년스럽다'는 스산함이 조금 더한 뜻인데요, 이 말은 '을사년'에서 유래되었을 가능성이 많아요. 일본이 우리나라를 빼앗기 위해 '을사년'인 1905년에 강제로 '을사 늑약'을 맺었어요. 우리나라로서는 아주 부끄럽고 분한 일이었고, 그래서 사람들 마음도 슬프고 허탈했겠지요. 이 일로 인해 마음이나 날씨가 어수선하고 흐린 것을 '을사년스럽다'고 했는데, 소리가 나는 대로 '을싸년스럽다'로 변했다가 '을씨년스럽다'가 되었다고 해요. 우리말에는 이렇게, 사람들의 감정이나 생활뿐 아니라 우리의 역사까지도 고스란히 담겨 있답니다.\\n예) 가을날 해 저문 후의 호수는 을씨년스러웠다.","images":[]},{"word":"서름하다, 시쁘다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398629&page=35","sourceText":"◎ 서름하다 : 남과 가깝지 못하여 서먹하다. 사물에 익숙하지 못하다.\\n'서름하다'는 다른 사람과 친하지 않아 서먹서먹하다는 뜻이에요.\\n하지만 꼭 사람에게만 쓰는 말은 아니어서, 어떤 사물에 익숙하지 못할 때도 '서름하다'는 표현을 해요. 자주 들어 보지 못한 말이거나, 어쩌면 처음 들어봤을 '서름한'말이기는 하지만 잘 기억해 두세요.\\n예) 지도에서도 못 찾을 서름한 먼 나라에서 걸","images":[]},{"word":"생때같다, 생뚱맞다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398588&page=36","sourceText":"★ 생때같다 : 몸이 튼튼하여 통 병이 없다.\\n흔히 아픈 데 없이 건강한 아이를 '생때 같은 자식'이라고 말해요. 그리고 듣기만 해도 참 안타까운 말이지만 '생때 같은 사람이 죽다'처럼 건강하던 사람이 갑자기 죽게 되었을 때 주로 이 표현을 많이 써요.\\n★ 생뚱맞다 : 하는 짓이나 말이 앞뒤가 서로 맞지 않고 엉뚱하다.\\n'상황에 맞지 않고 엉뚱하다'는 뜻인 '생뚱맞다'는 '쌩뚱맞죠?'라는 유행어 때문인지 참 재미나게 들리는 말이에요. 이렇게 말소리의 느낌마저 재미난 말 '생뚱맞다'는 어떻게 생겼을까요? '생뚱'의 '생'은 무리하거나 애매함을 이르는 말이에요. '생트집', '생사람' 등과 같이 쓰이지요. 그리고 '뚱'은 '엉뚱하다'의 '뚱'에서 온 것으로 보고요. 결국 '엉뚱하다'를 조금 더 강조한 뜻으로 생긴 말이 '생뚱맞다'인 샘이에요.","images":[]},{"word":"반지빠르다, 새되다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398431&page=36","sourceText":"● 반지빠르다 : 말이나 하는 짓이 얄밉다.\\n'반지빠르다'는 '말이나 하는 짓이 얄미울 정도로 약삭빠르다'는 뜻이에요. '교만스럽다'는 뜻으로도 쓰이는데, 겸손함 없이 잘난 체하고 버릇없다는 거예요. 자신이 잘났다고 생각하는 건 자유라고 해도 남을 깔보고 업신여기는건 바르지 않은 행동이겠지요?\\n● 새되다 : 소리가 높고 날카롭다.\\n'새되다'는 요즘 들어 '우스운 꼴이 됐다, 황당하다'는 뜻으로 사용되기도 하는데, 원래는 높고 날카로운 소리를 '새된'소리라고 해요. 다시 말해 '새되다'고 하면 소리나 목소리가 높고 날카롭다는 뜻이에요.","images":[]},{"word":"밍근하다, 바투","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398343&page=36","sourceText":"★ 밍근하다 : 미지근하다. 뜨겁지도 차갑지도 않은 미지근한 상태를 '밍근하다'고 해요.\\n작은 말은 '맹근하다'지요. 그런데 미지근한다는 건 대충 어느 정도의 온도를 말할까요? 사람의 기본 체온인 36.5도보다 높으면 뜨겁다고 느끼고, 낮으면 차갑다고 느낀다고해요. 그러니까 밍근한 물의 온도는 36도 정도가 될 거예요. 보기글 - 말린 표고버섯은 찬물보다 흡수가 빠른 밍근한 물에 불려야 한다.\\n★ 바투 : 두 물체 사이나 거리가 썩 가깝게, 시간이나 길이가 아주 짧게.\\n'시간이나 공간이 몹시 가깝게 붙어 있다.' 또는 '길이가 매우 짧다'는 뜻으로 '밭다'라는 말이 있어요. '바투'는 '밭다'에서 비롯된 말이에요. 보기글 - 손톱을 너무 바투 잘라 아프다.","images":[]},{"word":"무쪽같다, 미쁘다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398293&page=36","sourceText":"◆ 무쪽같다 : 사람의 생김새가 몹시 못나다.\\n커다랗고 하얀 무를 자르면 쩍쩍~ 잘 갈라져요. 그래서 어떤 일을 단칼에 거절할 때 '무쪽같이 자른다'고 하지요. 그런데 어쩌다 실수로 잘못 잘라진 무쪽은 울퉁불퉁하고 모양이 예쁘지 않아요. 이렇게 잘못 갈라진 무쪽을 못 생긴 여자에 빗대어 '무쪽같다'고 말하게 된 거예요. 하지만 아무리 '무쪽같이'생긴 여자라 할지라도 마음이 고우면 되지 않겠어요?\\n◆ 미쁘다 : 믿음성이 있다.\\n'미쁘다'는 '믿다'의 '믿'과 '브다'가 합쳐서 생긴 말인데, '믿음성이 있다'또는 '진실하다'는 뜻으로 쓰이기도 하지요. 물론, 진실하니 믿음이 생겼겠지만 말이에요. 어떤 대상에 대해 믿음이 간다는 것, 특히 사람이 사람을 믿는다는 것은 세상을 살아가는 데에 있어 가장 기본적이고 중요한 마음 자세라는 생각이 들어요. '진실하다, 믿음이 간다, 믿음직스럽다, 미덥다, 미쁘다 ‥‥‥.' 어때요, 말만 들어도 참 든든하죠? 친구들은 주변에 믿어도 될 만한 '미쁜' 사람이 몇 명이나 있나요?","images":[]},{"word":"머쓱하다, 멀쑥하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398196&page=36","sourceText":"◆ 머쓱하다 : 쑥스럽고 어색하다 무안을 당하거나 하여 기가 죽을 때 '머쓱하다'고 해요.\\n'쑥스럽고 어색하다', 또는 '멋쩍다'등으로 쓰는 말이지요. 같은 뜻의 사투리로 '뻘쭘하다'는 말도 있어요. 예) 내가 우스갯소리를 했는데도 웃지 않아서 정말 머쓱했다.\\n◆ 멀쑥하다 : 멋없이 키가 크고 묽게 생기다.\\n'머쓱하다'가 어울리지 않게 키가 크다는 뜻도 있는데, 이것과 비슷해서 헷갈리기 쉬운 말로 '멀쑥하다'라는 말이 있어요. '멀쑥하다'는 '멋없이 키가 크다'는 뜻과 함께 '물기가 많아 묽다', '지저분하지 않고 멀끔하다'는 뜻을 함께 가지고 있어요. 예) 방금 빳빳하게 다린 것 같은 멀쑥한 정장을 입은 사람이 내게 말을 걸었다.","images":[]},{"word":"마뜩하다, 맵자하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398021&page=36","sourceText":"◆ 마뜩하다 : 마음에 들다.\\n'마뜩하다'는 '마음에 들다', '마음에 마땅하다'는 뜻이에요. '마땅한' 것은 알맞거나 옳은 것이니까, 알맞게 내 마음에 쏙 드는 모양새를 생각하면 될거예요. 예: 그는 맡겨진 배역이 마뜩하지 않았지만, 그래도 열심히 해 보리라 다짐했다.\\n◆ 맵자하다 : 모양이 체격에 어울려서 맵시가 있다.\\n자주 쓰는 말은 아니지만, 맵시 있게 옷을 차려 입었다든지 모양새가 아름다울 때 '맵자하다'고 해요. 줄임말은 '맵자다'인데, 이와 비슷한 말로 '맵짜다'가 있어요. 하지만 '맵짜다'는 음식 맛이나 바람, 또는 성미가 매섭게 독하거나 사납다는 뜻이어서 '맵자하다'와는 전혀 다른 말이지요. 예: 쭉 뻗은 직선과 부드러운 곡선이 조화를 이루는 한복은, 입었을 때 더욱 맵자하다.","images":[]},{"word":"깡똥하다, 꺼림하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397969&page=36","sourceText":"깡똥하다 : 겉에 입은 옷이 속이 드러날 정도로 매우 짧다.\\n귀엽고 재미난 발음의 '깡똥하다'는 '강동하다'의 센말이에요. 특히 속옷이나 아래옷이 드러날 만큼 겉옷이나 윗옷의 길이가 짧다는 뜻으로 쓰이지요.\\n꺼림하다 : 한 일이 마음에 걸려 편하지 못하다.\\n자기가 한 일이 후회되고 마음에 자꾸 걸려 편하지 못한 것을 '꺼림하다'고 해요. 매우 꺼림한 것은 '꺼림칙하다'고 하지요. 흔히 말하는 '꺼림직하다'는 잘못 쓰인 거예요. 어떤 일을 했는데, 꺼림하거나 끼림칙한 느낌이 든다면 참 신경 쓰일 거예요. 엎지른 물은 다시 주워 담을 수 없잖아요? 자신이 한 일이 뉘우쳐지지 않게 어떤 일을 할 때엔 한 번 더 생각하고 행동하도록 해야겠어요.","images":[]},{"word":"괴발개발","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397850&page=36","sourceText":"괴발개발 : 글씨를 지저분하게 마구 갈겨 써 놓은 모양.\\n얼핏 괴상하게 들릴 수도 있는 '괴발개발'이라는 말은, '고양이의 발, 개의 발'에서 생겨난 말이에요. 여기서 '괴'는 고양이의 옛말이죠. 고양이나 개는 여기저기 가리지 않고 마구 쏘다니는 동물이라, 발에는 언제나 흙이나 더러운 것이 묻어 있어요. 그 발로 집 안에 들어오기라도 해 봐요. 참 지저분하고 정신없기도 하겠지요? 이렇게 개나 고양이의 발자국이 어지럽게 흩어져 있는 모양이나 마치 아무렇게나 써 놓은 글씨 같다고 해서 이런 말이 생겨난 거예요. 흔히들 '개발새발'썼다고 하는데, 이건 틀린 표현이에요.","images":[]},{"word":"곰살궂다, 살갑다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397737&page=36","sourceText":"곰살궂다 : 싹싹하고 다정하다.\\n살갑다 : 마음씨가 부드럽고 다정스럽다.\\n'곰살궂다'는 친절하고 다정다감함을 나타내는 말이에요. '곰살맞다'로 많이 쓰이지만 '곰살궂다'가 표준어예요. '살갑다'도 부드럽고 정이 많다는 뜻으로, '곰살궂다'와 거의 비슷하게 쓰일 수 있어요. 우리가 다른 사람을 대할 때 조그만 더 곰살궂고 살갑다면, 참 따뜨하고 살기 좋은 세상이 되겠지요?\\n● 이런 뜻도 있어요. '곰살궂다'는 '꼼꼼하고 자세하다.' '살갑다'는 '겉보기와는 달리 속이 넓다.'","images":[]},{"word":"고즈넉하다와 한갓지다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397648&page=36","sourceText":"고즈넉하다 : 고요하고 아늑하다.\\n한갓지다 : 한가하고 조용하다.\\n요즘 사람들은 온종일 자동차 소리, 갖가지 기계 소리, 발달된 대중매체에서 흘러나오는 소리 등 정말 셀 수 없이 많고복잡한 소리들 속에 묻혀 살고 있어요. 또 점점 그런 시끄러움에 아무렇지 않게 익숙해져 가고 있고요.\\n이런 이유 때문에 우리 주변에서는 호젓하고 아늑한 느낌의 '고즈넉한' 곳, 시끄럽지 않은 '한갓진'곳을 찾아내기가 쉽지 않지요.\\n자, 잠깐 눈을 감고 시골길이나 산길을 혼자 걷고 있다고 상상해 보세요. 들리는 소리라곤 정답게 지저귀는 새소리, 바람 소리, 발길에 차이는 돌멩이 소리뿐이라면‥‥‥.\\n잠시라도 마음이 편안한 시간이었지요!","images":[]},{"word":"완자와 너비아니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397558&page=37","sourceText":"완자 : 쇠고기를 잘게 다져 달걀, 두부 등을 섞고 둥글게 빚어 기름에 지진 음식. 흔히 '동그랑땡'이라고 불리는 음식이 바로 '완자'예요.\\n너비아니 : 쇠고기에 양념을 하여 구운 음식.\\n'너비아니'는 우리나라 고기구이 가운데 대표하고 할 수 있어요. 쇠고리의 가장 연하고 맛있는 부위인 등심이나 안심을 얇게 저며 갖은 양념에 재어 두었다가 석쇠에 구워 먹는 요리지요. '\\n너비아니'는 큼직큼직하게 '너붓너붓'썰어서 요리했다고 해서 붙인 이름이에요.","images":[]},{"word":"알근달근하다와 칼칼하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397440&page=37","sourceText":"알근달근하다 : 맛이 조금 맵고도 달다.\\n칼칼하다 : 맵고 톡 쏘는 맛이 있다.\\n여러 가지 맛 중에서 '알근달근한' 맛이 궁금하다면, 매우면서도 달짝지근한 떡볶이를 먹어 봐요. 매운맛에 눈물이 쏙 빠져도, 단맛에 미소 짓게 될 걸요?\\n그리고 '칼칼하다'는 맵게 자극하는 맛이 있다는 뜻이에요.\\n그러니까 '칼칼한'맛은 '알근달근한' 맛과 달리 매운맛만 있고 단맛은 없는 거예요.\\n그리고 '칼칼하다'는 목이 마르다는 뜻도 함께 가지고 있어요.\\n그나저나 매운 정도나 맛이 조화에 따라 이렇게 갖가지 말을 만들어 낸 우리 조상님들은, 아무래도 맛을 느끼는 미각의 달인들이었나 ?","images":[]},{"word":"시금털털, 쌉싸래","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397397&page=37","sourceText":"시금털털하다 : 맛이 조금 시면서도 떫다.\\n쌉싸래하다 : 조금 쓴 듯하다.\\n'시금털털하다'의 센말은 '시금떨떨하다'예요. 여기서 '시금'은 '시다, 시큼하다'는 뜻이고 '떨떨하다'는 떫다는 뜻이에요. 그러니까 '시금털털하다'는 신맛과 떫은맛을 동시에 나타낸 말이지요. 어떤 맛인지 궁금한가요? 그럼 덜 익은 감이나 살구를 한 입 베어 물어볼까여? 그럼 \\"으, 시금털털해!\\"라는 말이 절로 나올걸요? '쌉싸래하다'는 조금 쓴맛을 말해요. 완전히 쓴맛도 아닌 약간 쓰다는 표현을 그냥 말 그대로 '약간 쓰다'고 하지 않고, 약간의 여운이 감도는 이렇게 멋진 말을 만들어 냈어요. 그리고 쌉싸래한 맛보다 더 쓴맛, 그러니까 '쌉싸래하다'의 큰말은 '씁쓰레하다'예요.","images":[]},{"word":"끼니와 주전부리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397245&page=37","sourceText":"끼니 : 늘 일정한 때에 먹는 밥.\\n주전부리 : 군것질. 끼니 외에 먹는 음식\\n'끼니'는 정해진 때에 먹는 아침, 점심, 저녁 식사를 말해요. 그리고 '주전부리'는 끼니 외에 먹는 군것질을 말하고요. '군것질'의 '군'은 '쓸데없는'이라는 뜻이에요. '군말'은 '하지 않아도 될 말', '군침'은 '음식을 먹지도 않았는데 흘러나오는 침'이라는 뜻이지요. 그러니까 끼니 외에 먹지 않아도 될 쓸데없는 음식을 먹는 '주전부리'는 바로 지금의 간식을 말하는 거예요.","images":[]},{"word":"꼬치미와 코다리","sourceUrl":"https://
