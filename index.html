rceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"우세","meaning":"남에게서 받는 비웃음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"쌩뚱같다","meaning":"말이나 하는 짓이 앞뒤가 서로 맞지 아니하고 엉뚱하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"으밀아밀","meaning":"남모르게 비밀히 이야기하는 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"새잡다","meaning":"남의 비밀을 엿듣다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"배참","meaning":"윗사람에게 꾸지람을 듣고, 그 화풀이를 다른 데다 하는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"떠대다","meaning":"거짓으로 꾸며 대답하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"쇠","meaning":"남을 낮추어서 일컫는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"남우세","meaning":"남에게 웃음과 조롱을 받게 됨.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"뒤받다","meaning":"잘못을 꾸짖을 때에 도리어 반항하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"울릉대다","meaning":"힘이나 말로써 남을 위협하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"조작거리다","meaning":"지나치게 아는 체하며 떠들다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"가납사니","meaning":" 491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"강쇠바람","meaning":"초가을에 부는 동풍.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"재넘이","meaning":"산으로부터 내리부는 바람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"뒤바람","meaning":"북풍 ↔ 마파람, 앞바람","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"살바람","meaning":"좁은 틈에서 새어 들어오는 찬 바람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"강바람","meaning":"비는 아니 오고 몹시 부는 바람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"소소리 바람","meaning":"이른 봄에 살 속으로 스며드는 듯한 음산하고 찬 바람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"훌치다","meaning":"촛불이나 등잔불의 불꽃이 바람에 쏠리다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"찬바람 머리","meaning":"가을철에 싸늘한 바람이 불기 시작할 때.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"득하다","meaning":"날씨가 갑자기 추워지다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"치하다","meaning":"그날 무렵의 날씨가 나빠지다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"너테","meaning":"얼음 위에 더끔더끔 덧얼어 붙은 얼음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"성엣장","meaning":"물 위에 떠서 흘러가는 얼음덩이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"석다","meaning":"쌓여 있는 눈이 속으로 곯아서 녹다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"눈석임","meaning":"눈이 속으로 녹아서 스러짐.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"어녹다","meaning":"얼다가 녹다가 하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"얼마르다","meaning":"얼어가면서 차차 마르다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"잔풀나기","meaning":"작은 풀의 싹이 돋아나는 봄철.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"철겹다","meaning":"어느 철에 뒤지다.\\n- 사전 속에 잠자는 보배로운 우리말 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406491&page=28","sourceTitle":"날씨에 관계되는 말 2"},{"word":"동살","meaning":"동이 터서 훤하게 비치는 광선.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"희붐하다","meaning":"새벽의 밝은 빛이 약간 희다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"희번하다","meaning":"동이 트면 허언 광선이 약간 비쳐서 번하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"돋을볕","meaning":"아침에 솟아오르는 햇볕.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"햇귀","meaning":"해가 처음 솟을 적의 빛.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"낮결","meaning":"한낮으로부터 해가 저물 때까지의 동안의 전반.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"저뭇하다","meaning":"날이 저물어 어스레하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"해거름","meaning":"해가 거의 넘어갈 무렵.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"해껏","meaning":"해가 질 때까지.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"강더위","meaning":"오랫동안 비가 아니 오고 볕이 쬐는 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"따지기","meaning":"이른 봄 얼었던 흙이 풀리려고 할 무렵.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"우리다","meaning":"더운 기운이 있도록 볕이 들다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"불가물","meaning":"아주 심한 가뭄.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"보름치","meaning":"음력 보름께에 비나 눈이 오는 날씨.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"온달","meaning":"음력 보름달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"먼지잼","meaning":"비가 겨우 먼지가 나지 아니할 정도로 조금 옴.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"물마","meaning":"비가 많이 와서 땅 위에 넘치는 물.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"복물지다","meaning":"복날에 비가 많이 오다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"시위","meaning":"비가 많이 와서 강물이 넘쳐 흘러 육지를 침범하는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"지짐 거리다","meaning":"비가 조금씩 자주 오다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"친친하다","meaning":"축축한 중에도 끈끈하여 불쾌한 느낌이 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"첫물지다","meaning":"그 해 들어 첫 홍수가 나다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"비설거지","meaning":"비가 오려할 때에 비를 맞혀서는 안 될 물건을 미리 덮거나 치우는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"비거스름이","meaning":"비가 갠 뒤에 바람이 불고 시원해지는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"개부심","meaning":"장마에 큰물이 난 뒤 한동안 쉬었다가 한바탕 내리는 비가 명개를 부시어 냄.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"작달비","meaning":"굵직하고 억세게 퍼붓는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"빗밑","meaning":"오던 비가 그치어 떨어지는 속도.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"웃비","meaning":"아직 빗기운이 그치지 않았으나 좍좍 내리다가 그친 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"벗개다","meaning":"구름이 벗어지고 날이 차차 개다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"웃날들다","meaning":"날이 개다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"나무말미","meaning":"여러 날 걸리는 장마 중에 날이 잠깐 들어서 풋나무를 말릴 만한 겨를.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"빨래말미","meaning":"여러 날 걸리는 장마 중에 날이 잠깐 들어서 옷을 빨아 말릴 만한 겨를.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"암무지개","meaning":"쌍무지개가 섰을 때에 다른 하나보다 빛깔이 묽고 흐릿한 무지개.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"수무지개","meaning":"쌍무지개가 섰을 때에 빛이 곱고 똑똑하게 보이는 무지개.\\n- 사전 속에 잠자는 보배로운 우리말 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406316&page=28","sourceTitle":"날씨에 관계되는 말 1"},{"word":"에누리","meaning":"일본어인 줄 알기도 한다. 그러나 순수한 우리말이다. 상황에 따라 다른 뜻으로 쓰인다.“세상에 에누리 없는 장사가 어디 있어?” 이 말을 판매자가 했다면 ‘에누리’는 ‘물건값을 받을 값보다 더 많이 부르는 일’의 뜻이 된다. 사는 이가 했을 때는 ‘값을 깎는 일’이란 의미로 쓰일 수 있다. 보태거나 깎아서 말한다는 뜻도 있다.‘에누리 섞인 말.’\\n2008/11/21 서울신문","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406292&page=28","sourceTitle":"에누리"},{"word":"비나리","meaning":"앞길의 행복을 비는 말. 원래는 남사당패 놀이의 성주풀이 굿에서 곡식과 돈을 상 위에 받아놓고 외는 고사문이나, 그것을 외는 사람을 가리키는 말이었는데, 이후 사람들의 행복을 비는 말로 쓰이게 되었다. 그래서 앞날의 행복을 기원하는 것을 '비나리하다'라고 한다. 한편 '비나리치다'라고 하면 '아첨하여 환심을 사다'는 뜻이므로 구별해 써야 한다. 또한 구구한 말로 남에게 무엇을 청하는 짓을 '비라리'라고 한다. 어감은 비슷하지만 뜻은 상반되는 말들이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406196&page=28","sourceTitle":"비나리, 추렴, 길놀이, 쥐불"},{"word":"추렴","meaning":"여러 사람이 돈이나 곡식 따위를 얼마씩 내어 거두는 것, 또는 그렇게 하여 무엇을 사먹는 일 '추렴'은 '출렴' 또는 '염출'이라는 한자말에서 비롯되었다. 흔히 서양식으로 '더치페이'라고 하는 것이다. 한자말로는 '갹금', '갹출'이라고도 한다. 각 사람에게서 똑같은 액수의 돈이나 물건을 걷는 것은 '각추렴'이라 하고, 먼저 추렴을 했는데 그것으로 부족하여 더하는 추렴을 '가추렴'이라 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406196&page=28","sourceTitle":"비나리, 추렴, 길놀이, 쥐불"},{"word":"길놀이","meaning":"탈춤놀이에 들어가기 전에 탈꾼들이 탈춤을 놀 자리까지 삼현육각을 잡히면서 가는 행렬","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406196&page=28","sourceTitle":"비나리, 추렴, 길놀이, 쥐불"},{"word":"쥐불","meaning":"농가에서 음력 정월 첫 쥐날에 쥐를 쫓는다 하여 논둑이나 밭둑의 마른 풀에 붙이는 풀\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406196&page=28","sourceTitle":"비나리, 추렴, 길놀이, 쥐불"},{"word":"달풀이","meaning":"정월부터 섣달까지 달마다의 절후나 행사를 노래로 풀어 부르거나, 또는 매달의 액이나 병을 노래하는 것. 지구가 삼백 예순 다섯 번을 정신없이 돌며 해의 둘레를 한 바퀴 도는데 걸리는 시간을 '해'라고 하듯이, 달이 지구를 한 바퀴 도는데 드는 시간을 '달'이라고 한다. '해'와 '달'은 천체의 이름이면서 곧 시간의 단위이기도 하다. 달의 주기를 이용한 시간 개념이 바로 음력인데, 이는 어로와 농경 사회에서는 필수적인 시간 셈법이다. '달풀이'는 액을 막기 위한 기복적인 내용을 포함하고 있지만 무엇보다도 각 절기별로 필요한 일을 환기시켜주는, 교훈적인 목적에서 행한 것으로 보인다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406028&page=28","sourceTitle":"달풀이, 동티, 물수제비 뜨기, 비김수"},{"word":"동티","meaning":"건드리지 않을 일을 공연히 건드려서 스스로 걱정이나 해를 입게 된 것. '동티'는 본디 '건드려서는 안 될 땅을 파는 일'을 뜻하는 한자말 '동토'가 변해서 우리말로 굳어진 것이다. 토목이나 건축 등의 일에서 흙 따위를 잘못 다루어, 지신의 노여움을 사서 재앙을 받는다고 믿는 것이다. 불가항력한 재앙이 일어나거나, 가만 두어야 할 것을 공연히 건드려 일이 잘못되는 것을 '동티나다'고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406028&page=28","sourceTitle":"달풀이, 동티, 물수제비 뜨기, 비김수"},{"word":"물수제비 뜨기","meaning":"얇고 둥근 돌 같은 것을 물 위로 비껴가게 던져서 탐방탐방 수면을 스치며 가게 하는 장난질. 물수제비 뜨기를 하면서, 누가 던진 돌이 더 많이 튕겨오르는지 서로 내기를 하기도 한다. 물수제비 뜨기는 자맥질과 구별해야 한다. 자맥질은 물속에서 멱을 감으며 노는 놀이이고, 물수제비 뜨기는 물 밖에서 돌멩이를 수면에 던지며 노는 놀이이다. 지역에 따라서 '팔매치기', '물찰찰이', '물종개' 따위로 부르기도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406028&page=28","sourceTitle":"달풀이, 동티, 물수제비 뜨기, 비김수"},{"word":"비김수","meaning":"장기, 바둑 따위에서 서로 비기게 되는 수. 무승부. 운동경기나 게임 등에서 승부가 나지 않은 것을 '무승부'라고 한다. '비김수'는 무승부에 갈음하여 쓸 수 있는 말이다. 비김수의 '수'는 '수가 나다', '수가 높다'고 할 때의 '수'와 같은 한자말이다. 비김수를 줄여서 '빅수'라고 하고, 바둑 애호가들은 흔히 이를 더 줄여서 '빅'이라고도 한다. 현대 바둑에서는 실제로 비김수가 없다. 다만 부분적인 '사활 싸움'을 할 때 흑과 백 어느 쪽도 상대를 잡을 수 없는 상태가 생기는데, 이것을 '빅수'라고 한다. 한편 축구나 야구 같은 운동경기에서 비김수는 예사로 일어나는 일이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=406028&page=28","sourceTitle":"달풀이, 동티, 물수제비 뜨기, 비김수"},{"word":"차림표","meaning":"식당이나 찻집 같은 곳에서 음식이나 음료 따위의 종목과 값을 적은 표 식당에 가서 \\"여기 차림표 좀 주시오\\"하면 \\"메뉴판요?\\"라고 되물어오기 일쑤다. 식당이나 찻집 같은 곳에서 음식이나 음료 따위의 차림과 값을 적은 표를 우리말로 '차림표'라 한다. 요즘에는 거의 '메뉴판'이라는 말을 쓰는데, 그냥 '메뉴'나 '메뉴표'도 아니고, '메뉴판'이라고 하니 참으로 '엽기'적인 용어다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405940&page=28","sourceTitle":"차림표, 밑글, 헛글"},{"word":"밑글","meaning":"이미 배운 글. 밑천이 되는 글 기본지식 또는 기초가 되는 학문을 말한다. 학벌사회에서는 이른바 명문대학을 나와야만 지도자가 된다고 생각하기 쉽지만, 사실은 고등학교 정도의 밑글만 가지면 세상을 이끌어가는데 필요한 밑글은 충분히 갖출 수 있다고 생각된다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405940&page=28","sourceTitle":"차림표, 밑글, 헛글"},{"word":"헛글","meaning":"배워도 쓰지 못하는 지식. 배운 만큼 실천해야 한다는 것을 일깨우는 말이다. 사실 지식이란 꼭 실제 생활에 쓸모가 있어야 하는 것은 아니다. 사람의 정신세계를 퐁족하게 하는 것만으로도 지식의 가치가 있다. 다만 사람의 삶과 동떨어진, 죽어 있는 지식을 경계할 일이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405940&page=28","sourceTitle":"차림표, 밑글, 헛글"},{"word":"가마솥더위","meaning":"가마솥을 달굴 때의 아주 뜨거운 기운처럼 몹시 더운 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"가뭄더위","meaning":"가뭄으로 더 덥게 느껴지는 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"강더위","meaning":"오랫동안 비가 오지 아니하고 볕만 내리쬐는 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"무더위","meaning":"습도와 온도가 매우 높아 찌는 듯 견디기 어려운 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"불볕더위","meaning":"햇볕이 몹시 뜨겁게 내리쬐는 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"찜통더위","meaning":"뜨거운 김을 쐬는 것 같은 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"한더위","meaning":"한창 심한 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"늦더위","meaning":"여름이 다 가도록 가시지 않는 더위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405879&page=28","sourceTitle":"더위를 나타내는 우리말"},{"word":"불목","meaning":"온돌방 아래의 가장 더운 자리 구들장에 불을 지펴서 난방을 하던 옛날식 온돌방은 아랫목과 윗목의 차이가 뚜렷했다. 그래서 한겨울에 손님이 오면 아랫목을 권하는 것이 예의였고, 집에서도 아랫목은 늘 집안 어른들의 차지였다. 그런데 명절 때나 잔치 준비를 할 때 음식을 만드느라 불을 너무 많이 지피게 되면, 부넘기에 가까운 자리는 장판이 검게 그을릴 정도로 뜨거워진다. 그 지점이 바로 '불목'이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405746&page=28","sourceTitle":"불목, 한뎃잠"},{"word":"한뎃잠","meaning":"길거리나 다리 밑과 같이, 집이 아닌 추운 데서 자는 잠 '한데'서 자는 잠을 말한다. '한데'란 바람막이가 없는 추운 곳이다. 그런 곳에서 불어오는 바람을 '한뎃바람'이라 하고, 한데에서 밤을 보내는 것을 '한둔하다'라고 한다. 한뎃잠은 한마디로 '노숙'에 해당한다. 한뎃잠을 한 번이라도 자본 사람은 집의 고마움을 안다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405746&page=28","sourceTitle":"불목, 한뎃잠"},{"word":"괭이잠","meaning":"깊이 들지 못하고 자꾸 깨면서 드는 잠 한여름 밤 열대야 현상이 일어날 때면 깊이 잠들지도 못하고, 또 잠을 자다가도 자주 깨게 된다. 이렇게 선잠이 드는 것을 '괭이잠'이라 한다. '괭이'는 '고양이'의 줄임말이다. 고양이, 토끼 따위의 짐승들은 경계심이 많아서 깊이 잠들지 않는데서 유래된 말이다. 마음에 근심이 많은 사람들은 괭이잠을 자기 십상이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405618&page=28","sourceTitle":"괭이잠, 나비잠, 대마루, 들창"},{"word":"나비잠","meaning":"어린아이가 반듯이 누워 팔을 머리 위로 벌리고 자는 잠. 천진난만한 표정으로 새근새근 숨을 몰아쉬면서 두 팔을 머리 위로 벌리고 평화로운 표정으로 자고 있는 어린아이의 모습은, 말 그대로 한 마리의 나비가 사뿐히 앉았다가 날아가는 모습을 연상케 한다. 어린아이의 그런 모습을 표현하기에 '나비잠'보다 적당한 말은 없을 것이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405618&page=28","sourceTitle":"괭이잠, 나비잠, 대마루, 들창"},{"word":"대마루","meaning":"지붕 위의 가장 높게 마루턱이 진 부분. 우리 전통가옥의 지붕은 기와지붕이든 초가지붕이든 '대마루'를 중심으로 물매가 지도록 되어 있다. 시각적으로는 주변경관과 잘 어울리고, 실용적인 면에서는 빗물이 잘 흘러내릴수 있는 구조다. 지붕에 떨어진 빗방울은 대마루를 가운데로 하여 집의 앞쪽 처마와 뒤쪽 처마를 향하여 흘러내린다. 그런의미에서 보면 대마루는 '분수령'이다. 한편 일의 성패와 싸움의 승부가 결정되는 마지막 판을 '대마루판'이라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405618&page=28","sourceTitle":"괭이잠, 나비잠, 대마루, 들창"},{"word":"들창","meaning":"바깥쪽으로 밀어 올려 열게 되어 있는 문. 문은 여는 방향에 따라 여러 가지가 있다. 그중 가장 흔한 것이 출입문으로 흔히 쓰이는 '여닫이문'이다. 그리고 창문은 보통 '미세기문'이 많다. '미세기'는 두 쪽의 문을 좌우로 겹치도록 밀어서 열거나 닫게 된 것이다. 같은 미세기라도 한쪽만 밀고 닫게 된 것은 '미닫이'라고 한다. 한편 '들창'은 창문 중에서도 밖으로 밀어 올려서 고정 시키도록 된 창문이다. 중앙 냉난방을 하는 대형 건물에서 흔히 볼 수 있는데, 열을 차단하기 위해서 창문을 붙박이로 만들고, 그 아래쪽에 환기를 위하여 작은 들창을 내는 것이다. 따라서 들창은 미세기에 비해서 대체로 창문의 크기가 작다. 이를 옛말로는 '벼락닫이'라고 부르기도 하였다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405618&page=28","sourceTitle":"괭이잠, 나비잠, 대마루, 들창"},{"word":"도가니","meaning":"소 무릎의 종지뼈와 거기 붙은 살","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405513&page=29","sourceTitle":"도가니, 동그랑땡, 두루치기, 완자, 지짐이"},{"word":"동그랑땡","meaning":"엽전 모양으로 생긴 저냐, 즉 '돈저냐'를 속되게 이르는말. '저냐'는 얇게 저민 고기나 생선 따위에 밀가루를 바르고 달걀을 입혀 기름에 지진 음식","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405513&page=29","sourceTitle":"도가니, 동그랑땡, 두루치기, 완자, 지짐이"},{"word":"두루치기","meaning":"돼지고기, 조갯살, 낙지 따위를 슬쩍 데쳐서 갖은양념을 한 음식.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405513&page=29","sourceTitle":"도가니, 동그랑땡, 두루치기, 완자, 지짐이"},{"word":"완자","meaning":"다진 쇠고기를 기름에 지진음식","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405513&page=29","sourceTitle":"도가니, 동그랑땡, 두루치기, 완자, 지짐이"},{"word":"지짐이","meaning":"국물이 적고 간이 좀 짜게 끓인 음식의 총칭.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405513&page=29","sourceTitle":"도가니, 동그랑땡, 두루치기, 완자, 지짐이"},{"word":"고두밥","meaning":"알갱이가 꼬들꼬들한 된밥. 밥은 지어진 상태나 조리방법에 따라 여러 가지 명칭으로 불린다. 물기가 많으면 '진밥'이라 하고 적으면 '된밥'이라 한다. 된밥 중에서도 그냥 먹기 힘들 정도로 쌀 알갱이가 '꼬들꼬들한' 된밥이 '고두밥'이다. 술을 빚으려면 찹쌀이나 멥쌀, 조 등을 시루에 쪄서 '지에밥'이라는 술밥을 지어야 한다. 이 지에밥이야말로 고두밥의 대표격이라 할 수 있다. 한편 그릇 위까지 수북이 퍼 담은 밥은 '감투밥' 또는 '고봉밥'이라 불렀다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405418&page=29","sourceTitle":"고두밥, 다지기, 모둠밥, 강술, 너비아니"},{"word":"다지기","meaning":"고추, 마늘 따위를 함께 섞어 다진 양념 김장을 할 때 절인 배추나 무를 버무리기 위하여, 여러 가지 재료를 다져서 만든 양념이 곧 '다지기'다. 또 국밥 따위를 말아서 먹을 때 넣어 먹는 양념도 다지기다. 얼큰한 음식을 좋아하는 사람들은 설렁탕이나 칼국수 따위 음식을 먹을 때도 벌겋게 다지기를 풀어서 먹는다. 이를 '다대기'라 부르는 사람들이 많은데 '다지기'가 맞는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405418&page=29","sourceTitle":"고두밥, 다지기, 모둠밥, 강술, 너비아니"},{"word":"모둠밥","meaning":"여러 사람이 내 것 네 것 없이 같이 먹기 위하여 많이 담은 밥 '모둠'은 여러 사람이 모인 단체를 말한다. 옛 농경사회에서 여럿이 함께 들일을 할 때, 일일이 별도의 밥그릇을 챙겨 가는 것이 번거로워서 큰 함지박에 한꺼번에 밥을 담아가지고 가서 일을 하다가 둘러앉아 먹는다. 이것이 바로 '모둠밥'이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405418&page=29","sourceTitle":"고두밥, 다지기, 모둠밥, 강술, 너비아니"},{"word":"강술","meaning":"안주 없이 먹는 술","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405418&page=29","sourceTitle":"고두밥, 다지기, 모둠밥, 강술, 너비아니"},{"word":"너비아니","meaning":"얄팍얄팍하게 저며 갖은 양념을 해서 구운 고기.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405418&page=29","sourceTitle":"고두밥, 다지기, 모둠밥, 강술, 너비아니"},{"word":"걸단추","meaning":"걸어서 채우게 된 단추. 호크.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405396&page=29","sourceTitle":"걸단추, 까치두루마기, 상답, 옷거리, 트임새"},{"word":"까치두루마기","meaning":"까치설빔으로 아이들이 입는, 오색으로 지은 두루마기.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405396&page=29","sourceTitle":"걸단추, 까치두루마기, 상답, 옷거리, 트임새"},{"word":"상답","meaning":"자녀의 혼인 등 뒷날에 쓰려고 마련해두는 옷감.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405396&page=29","sourceTitle":"걸단추, 까치두루마기, 상답, 옷거리, 트임새"},{"word":"옷거리","meaning":"옷을 입은 맵시. 옷을 거는 도구를 뜻하는 '옷걸이'와 구별.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405396&page=29","sourceTitle":"걸단추, 까치두루마기, 상답, 옷거리, 트임새"},{"word":"트임새","meaning":"옷을 만들 때 앞이나 뒤를 터놓는 것, 또는 트인 모양새.\\n- 좋은 문장을 쓰기 위한 우리말 사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405396&page=29","sourceTitle":"걸단추, 까치두루마기, 상답, 옷거리, 트임새"},{"word":"가락지","meaning":"여자가 손가락에 장식으로 끼우는 두 짝의 고리 '가락지'는 '반지'의 순우리말이다. '반'은 '나누다'는 뜻을 가진 한자말이고,'지'는 손가락을 가리킨다. 이처럼 반지는 사람들이 손가락을 걸고 뜻을 나누는 의미로 끼우는 물건이다. 보통 진주나 보석 따위를 끼워 장식을 한 것을 반지라고 한다면, 가락지는 그런 장식이 없는 고리를 말한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405223&page=29","sourceTitle":"가락지, 거들지, 두루주머니, 오지랖"},{"word":"거들지","meaning":"손을 감추기 위해 두루마기나 여자의 저고리 소매끝에 길게 덧대는 소매 이를 한자말로 '한삼'이라고 한다. 일상복보다는 춤 출때 입는 무용복에서 많이 볼 수 있다. 예컨대 탈춤을 출 때 한삼자락 휘날리며 덩실덩실 춤을 추는 모양새를 떠올려보면 그 모양이 생생하다. 또한 고구려 고분벽화에 거들지 자락을 휘달리며 춤추는 여인들의 모습이 그러져 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405223&page=29","sourceTitle":"가락지, 거들지, 두루주머니, 오지랖"},{"word":"두루주머니","meaning":"아래는 둥글고 위는 모가 진, 허리에 차는 주머니. 염낭. 어린아이들의 한복 차림에서 흔히 볼 수 있다. 설날 세뱃돈을 넣는 '복주머니'도 두루주머니의 하나다. 아가리에 잔주름을 잡고 두 개의 끈을 좌우로 꿰어서 당기면 주머니 입구가 오므라지게 된 주머니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405223&page=29","sourceTitle":"가락지, 거들지, 두루주머니, 오지랖"},{"word":"오지랖","meaning":"웃옷이나 윗도리에 입는 겉옷의 앞자락. '오지랖이 넓다'는 말을 오늘날에도 종종 쓴다. 그런데 이 말이 그다지 좋은 뜻은 아니다 .옷의 앞자락이 넓으면 몸이나 다른 옷을 넓게 겹으로 감싸게 되는데, 간섭할 필요도 없는 일에 주제넘게 간섭하는 사람을 비꼬는 말이다. 그런 사람에게 '오지랖이 몇 폭이냐?'고 비아냥거리며 묻기도 한다. 그런데 오지랖이 넓다는 것은 가슴이 넓다는 말이다. 즉 남을 배려하고 감싸는 마음의 폭이 넓다는 것을 말한다. 그런 점에서 본다면 오지랖이 넓은 것이 미덕이다. 다만 그것이 지나쳐서 남에게 도움이 되기보다는 오히려 귀찮게 하는 결과를 가져올 때, 이를 경계하여 '오지랖이 넓다'고 하는 것이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405223&page=29","sourceTitle":"가락지, 거들지, 두루주머니, 오지랖"},{"word":"가락","meaning":"기다란 물건의 도막을 세는 단위. 원래는 물레로 실을 지을 때 실이 감기는 쇠꼬챙이를 뜻하는 말이다. 이를 '가락꼬치'라고도 하는데, 그 쇠꼬챙이가 가느다랗고 길게 생겨서 비슷한 모양의 물건을 세는 단위로 쓰이게 된 것이다. 즉 기름하게 토막진 어떤 물건의 낱개가 '한 가락'이라고 한다. '손가락', '발가락', '엿가락' 등 올(오라기)보다 굵은 것의 도막을 '가락'이라 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405138&page=29","sourceTitle":"가락, 소수, 두레, 두름, 두매한짝"},{"word":"소수","meaning":"몇 말, 몇 되, 몇 냥, 몇 달 등 어떤 단위보다 조금 넘음을 나타내는 말 '소수나다'고 하면 그 땅에서 소출이 늘거나 분량이 조금 남아도는 것을 말한다. 일반적으로 '소수'는 말, 되, 냥, 달과 같은 시간이나 분량, 수치의 단위에 붙어서 그보다 조금 넘음을 나타내는 말로 쓰인다. '말소수'는 한 말 남짓한 곡식의 양이며, '달소수'는 한 달 남짓한 기간을 말한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405138&page=29","sourceTitle":"가락, 소수, 두레, 두름, 두매한짝"},{"word":"두레","meaning":"둥근 켜로 된 시루떡 덩이, 또는 그것을 세는 단위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405138&page=29","sourceTitle":"가락, 소수, 두레, 두름, 두매한짝"},{"word":"두름","meaning":"조기나 청어 같은 물고기를 두 줄로 열 마리씩 엮은 것, 또는 고사리 따위 산나물을 열 모숨가량 엮은 것","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405138&page=29","sourceTitle":"가락, 소수, 두레, 두름, 두매한짝"},{"word":"두매한짝","meaning":"다섯 손가락을 가리키는 말\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405138&page=29","sourceTitle":"가락, 소수, 두레, 두름, 두매한짝"},{"word":"민날","meaning":"날카롭게 드러난 칼날이나 창날. '민날', '민낯', '민머리' 따위에서 '민-'은 덧씌워진 뭔가가 없는 상태를 말한다. 꼭 필요한 때가 아니면 칼날은 칼집 속에 들어 있어야 안전하다. 칼을 민날인 채로 간수하다 보면 드러난 칼날에 상처를 입을 수 있다. 날카로운 칼날의 위험을 되새기게 하는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405053&page=29","sourceTitle":"민날, 틀톱, 헛돌이"},{"word":"틀톱","meaning":"두 사람이 밀고 당기면서 켜는 큰톱. 흥부가 큰 박을 타기 위해 형 놀부 집에서 빌려온 물건이 바로 '틀톱'이다. 틀톱은 양쪽에 손잡이가 달려 있으며 두 사람이 밀고 당기도록 되어 있다. 오늘날에는 전기톱이 나와서 틀톱을 쓸 일이 거의 없지만, 예전에는 굵고 큰 나무를 베거나 통나무 따위를 썰 때 요긴하게 쓰던 연모다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405053&page=29","sourceTitle":"민날, 틀톱, 헛돌이"},{"word":"헛돌이","meaning":"바퀴나 엔진 따위가 헛도는 일. 멈추어 있는 자동차에 시동이 걸려 있거나, 어떤 기계가 필요없이 돌아가는 것을 '공회전'이라고 한다. '헛돌이'는 '공회전'에 갈음하여 쓸 수 있는 우리말이다. 헛돌이는 대기오염을 일으키므로 근래에는 일정 시간 이상 헛돌이하는 것을 법으로 금지하고 있다. 쓸모없이 버려지는 연료도 절감하고 대기오염도 조금이나마 줄여보자는 취지에서다.\\n- 좋은 문장을 쓰기 위한 우리말 사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=405053&page=29","sourceTitle":"민날, 틀톱, 헛돌이"},{"word":"다림방","meaning":"푸줏간. 요즘의 정육점 조선 시대에는 돼지고기나 쇠고기 따위를 전문으로 팔던 가게를 '다림방'이라 하였다. 다림방을 '푸줏간'이라고도 하였는데, 지금의 '정육점'이 바로 그것이다. 요즘 정육점을 다림방이라 부르는 일은 거의 없지만 그 대신 '노래방', '빨래방', '놀이방'등의 신조어가 생겨나서 일상적으로 그리 어색하지 않게 쓰이고 있다. 이는 다림방과 같은 맥락이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404923&page=29","sourceTitle":"다림방, 에누리, 밭쟁이, 삯팔이, 저잣거리"},{"word":"에누리","meaning":"할인. 물건값을 깍는 일. 요즘에는 '에누리'를 '값을 깎아서 사는 것'을 가리키는 말로 쓰고 있지만, 원래는 '제값보다 높여 부르는 값'을 뜻하는 말이다. 정확하게 말하면 장사꾼의 입장에서는 에누리를 붙이는 것이고, 손님은 에누리를 하는 것이 아니라 에누리를 떼는 것이다. 당연히 깎아서 팔 것을 전제로 제값을 높여서 불렀으니 깎아서 사지 않으면 이른바 '바가지'를 쓴 셈이 된다. 그래서 이 에누리를 두고 흥정이 벌어진다. 물건을 사는 사람이 '에누리합시다'라고 하면 값을 깎아달라는 것이고, 파는 사람이 '에누리 없소!'라고 하면 제값에 보태어 부른 게 없다는 말이 된다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404923&page=29","sourceTitle":"다림방, 에누리, 밭쟁이, 삯팔이, 저잣거리"},{"word":"밭쟁이","meaning":"채소 농사를 생업으로 하는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404923&page=29","sourceTitle":"다림방, 에누리, 밭쟁이, 삯팔이, 저잣거리"},{"word":"삯팔이","meaning":"삯을 받고 막일을 해주는 품팔이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404923&page=29","sourceTitle":"다림방, 에누리, 밭쟁이, 삯팔이, 저잣거리"},{"word":"저잣거리","meaning":"가게들이 죽 늘어서 있는 거리. 상가\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404923&page=29","sourceTitle":"다림방, 에누리, 밭쟁이, 삯팔이, 저잣거리"},{"word":"날일","meaning":"날삯을 받고 하는 일 일을 하고 삯을 받는 방법은 여러 가지가 있다. 흔히 '월급'이라는 것은 달마다 품삯을 주고받는 것이고, '주급'은 일주일 단위로 품삯을 계산하는 것이다. 하루 단위로 셈한 품삯을 '날삯'이라 하는데, 이렇게 날삯을 받고 하는 일을 '날일'이라 한다. 요즘 쓰는 말로 '일당제'라 할 수 있다. 날일은 고용관계를 불안정하게 한다. 정규 직원을 채용해서 해야 할 일을, 인건비를 아끼기 위해 날일로 처리하는 것은 노동시장을 불안정하게 하는것이므로 지양되어야 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404895&page=29","sourceTitle":"날일, 갈무리, 일쑤, 끝갈망"},{"word":"갈무리","meaning":"저장. 자신에게 닥친 일을 처리함.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404895&page=29","sourceTitle":"날일, 갈무리, 일쑤, 끝갈망"},{"word":"일쑤","meaning":"가장 좋은 수. 최선책","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404895&page=29","sourceTitle":"날일, 갈무리, 일쑤, 끝갈망"},{"word":"끝갈망","meaning":"일의 뒤끝을 수습하는 일.(끝마감)\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404895&page=29","sourceTitle":"날일, 갈무리, 일쑤, 끝갈망"},{"word":"흙깔이","meaning":"흙주접을 막기 위해서 다른 데 있는 영양분이 많은 흙이나 토질이 다른 흙을 파서 논밭에 옮겨 깔아주는 일 한가지 작물을 오래 짓다 보면 특정한 영양분만 작물이 흡수하여 땅심이 떨어지고 메마르게 된다. 이를 '흙주접'이라 한다. 흙주접을 막기 위해서 다른 데 있는 흙을 파서 논밭에 옮겨 깔아주는 것을 '흙깔이'라고 하는데, 이는 친환경적인 유기농법이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404748&page=29","sourceTitle":"흙깔이, 겨리, 두렁서리, 볏"},{"word":"겨리","meaning":"소 두 마리가 끄는 쟁기질. 한 마리가 끄는 쟁기질은 '호리(질)'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404748&page=29","sourceTitle":"흙깔이, 겨리, 두렁서리, 볏"},{"word":"두렁서리","meaning":"논두렁 위에 난 잡초 따위를 낫으로 베에서 없애는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404748&page=29","sourceTitle":"흙깔이, 겨리, 두렁서리, 볏"},{"word":"볏","meaning":"보습 위에 비스듬히 대어 흙이 한쪽으로 떨어지게 한 쇳조각.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404748&page=29","sourceTitle":"흙깔이, 겨리, 두렁서리, 볏"},{"word":"걸기질","meaning":"논바닥에 물이 골고루 퍼지지 않을 때 높은 데의 흙을 낮은 데로 끌어내려 고르는 일 농경이나 건축 일에서는 땅을 편편하게 골라주어야 할 일이 자주 있다. 논바닥을 고르는 것을 '바닥걸기질'이라 하는데 이를 줄여서 '걸기질'이라 한다. 또 가을에 마당질을 하기 위하여, 여름내 장마로 패이고 울퉁불퉁하게 된 마당을 흙을 이겨서 고르게 바르는 일은 '마당맥질'이라고 한다. 걸기질은 논바닥에만 필요한 것이 아니다. 사람들의 모둠살이도 때때로 걸기질해주지 않으면 힘과 재물이 한곳으로 쏠리게 된다. 그리고 바로 그곳에서 부패가 시작된다. 무릇 평등주의이념이란 간혹 세상을 걸기질하는 것과 같다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404698&page=29","sourceTitle":"걸기질, 겉갈이, 그루, 두렁"},{"word":"겉갈이","meaning":"잡초나 해충을 없애려고 추수 뒤에 논밭을 갈아엎는 일 '겉갈이'는 땅 속의 해충이나 유충을 햇볕에 드러나게 하여 제거하는 방법이다. 대규모 조직사회에서 일정 주기마다 한번씩 인사이동을 시키는 것도 일종의 겉갈이라고 할 수 있다. 직무권한을 가진 사람이 한 자리에 오래 머물다 보면 아무래도 그 자리가 '부패'하기 쉽기 때문이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404698&page=29","sourceTitle":"걸기질, 겉갈이, 그루, 두렁"},{"word":"그루","meaning":"한 해에 같은 땅에 농사짓는 횟수 나무나 곡식 등의 줄기의 아랫부분을 '그루'라 하고, 나무를 베어낸 뒤 남은 밑동을 '그루터기'라고 한다. 또한 나무를 세는 단위로도 자주 쓰는 말이다. 그런데 '그루'가 농사와 관련된 말로 쓰일 때는, 한 땅에 농작물을 심는 횟수를 말한다. 즉 한 땅에 한 번만 농사를 지으면 '한그루'라 한다. 그런데 한 땅에 두번 이상 농사짓는 것, 즉 '이모작'은 '두그루'가 아니라 '그루갈이'라 부른다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404698&page=29","sourceTitle":"걸기질, 겉갈이, 그루, 두렁"},{"word":"두렁","meaning":"논과 논 사이의 작은 둑 두렁은 논농사의 출발선이다 두렁에 쪼그리고 앉아 새참도 먹고, 더러는 두렁에서 이웃 논의 주인과 물 때문에 사움을 벌이기도 한다. 이처럼 두렁에는 농경사회의 애환이 서린다. 두렁은 본디 논과 논의 경계이면서 통로 역할을 한다. 또한 노동에 지친 몸을 잠시 뉘일 수 있는 간이 쉼터 구실도 한다. 그래서 편하고 팔자 좋은 사람을 '두렁에 누운 소'라고 부른다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404698&page=29","sourceTitle":"걸기질, 겉갈이, 그루, 두렁"},{"word":"북새","meaning":"뭇 사람이 법석대는 상태. 여럿이서 어떤 일을 방해하는 것. 여러 사람이 들끓어 북적북적한 상태를 나타낸 말이다. 그렇게 북적대다 보면 차분하게 어떤 일을 할 수가 없다. 여러 사람이 모여 잔치를 벌이거나 뜻을 모으는 것과는 다른 현상이다. 예컨대 전쟁 같은 난리 통을 '북새통'이라고 한다. 그리고 여럿이서 어떤 일을 방해하는 것을 '북새질치다', '북새놓다'고 하며, 그런 판이 벌어진 곳을 '북새판'이라 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404585&page=30","sourceTitle":"북새, 집알이,  짬짜미, 모둠"},{"word":"집알이","meaning":"갓 이사한 집이나 신혼집을 인사 겸 구경삼아 찾아보는 일. 요즈음에도 흔히 볼 수 있는 우리 풍속 가운데 하나가 바로 '집들이'다. 갓 혼인한 신혼부부가 친지들을 불러 신혼집을 공개하는 집들이도 있고, 새집으로 이사했을 때 하는 집들이도 있다. 그런데 이들의 초대를 받고 가는 것을 보통 '집들이 간다'고 한다. 그러나 엄밀하게 말하면 '집들이' 초대를 받아서 '집알이'하러 가는 것이다. '집들이'는 이사하여 새로운 집으로 옮겨 들어가는 것, 또는 이사한 뒤에 이웃과 친지를 청하여 음식을 대접하는 일을 뜻한다. 따라서 '집들이' 하는 집에 찾아가는 손님쪽에서 보면 '집알이 간다'고 해야 바른 표현이다. 한편 집들이를 할 때 음식을 장만하여 손님을 대접하는 것은 '들턱'이라고 한다. '집들이하면서 내는 턱'이라는 뜻이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404585&page=30","sourceTitle":"북새, 집알이,  짬짜미, 모둠"},{"word":"짬짜미","meaning":"남모르게 몇몇이서 자기들끼리만 짜고 하는 약속. '편을 짜다', '팀을 짜다'와 같이 어떤 목적을 위하여 사람들을 조직한다는 의미의 '짜다'에 뿌리를 둔 말이다. 역사 속에서 짬짜미하는 예가 종종 있다. 지난 1979년 10. 26사태가 발생하자 '하나회'라는 신군부 사조직 세력은 다른 동료 군인들 모르게 '짬짜미'로 반란을 획책하여, 무력으로 정권을 장악하였다. 정치권에서도 특정 지역에 기반을 둔 정치인들이 파벌을 만들고 자기들기리 짬짜미하여 나라 살림을 좌지우지하는 유치한 '짬짜미 정치'가 계속 이어져왔다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404585&page=30","sourceTitle":"북새, 집알이,  짬짜미, 모둠"},{"word":"모둠","meaning":"어떤 모임이나 단체를 다시 작게 나눈 집단.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404585&page=30","sourceTitle":"북새, 집알이,  짬짜미, 모둠"},{"word":"동아리","meaning":"목적이 같은 사람들이 한패를 이룬 무리. 예전에 대학가에서 '서클'은 낭만적인 대학생활의 상징처럼 인식되기도 하였다. 그래서 고등학생들 사이에서도 이를 흉내 낸 별의별 '서클'이 등장하였고, 그중에는 이른바 '불량 서클'도 상당수 포함되엇다. 다행히도 요즘의 대학생들은 '서클'이라는 말 대신에 '동아리'라는 말을 쓴다. 외국어를 쫓아내고 우리말을 되찾은 바람직한 경우라 할 수 있다. '불량 서클'이라는 말은 있어도 '불량 동아리'라는 말은 아직 생겨나지 않은 것을 보면 말글살이는 사람의 정서에 대단한 영향을 미친다는 것을 알 수 있다. 한편 동아리는 '나무 아랫동아리'처럼 긴 물건의 한 부분을 말하기도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404455&page=30","sourceTitle":"동아리, 두레, 모꼬지"},{"word":"두레","meaning":"농촌에서 농사의 공동작업을 위해 마을이나 몇 개의 두럭 단위로 만든 조직. 우리 전통 농경사회의 공동체 정신이 가장 잘 드러나는 생활양식이다. '두레'는 말 그대로 작업 공동체다. 그런데 단지 공동작업만 하는 것이 아니다. '두레'는 여러 가지 뜻을 가지는 말이다. 예컨대 집단으로 하는 농악도 '두레'라 하고, 농군들이 여럿이 음식을 장만하여 모여서 노는 것도 '두레'라 한다. 또 둥근 밥상을 '두레상'이라 하는데, 이 두레상을 펴놓고 여럿이 둘러앉아 음식을 먹는 것을 '두레 먹다'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404455&page=30","sourceTitle":"동아리, 두레, 모꼬지"},{"word":"모꼬지","meaning":"놀이나 잔치로 여러 사람이 모임 어떤 단체의 회원들이 단합을 위해 '수련회'를 하는 것을 흔히 '엠티'라고 하였다. 이는 '멤버십 트레이닝'을 줄인 말로, 단체 활도에 적응하기 위한, 일종의 훈련 성격을 띤 야유회 같은 것이었다. 그런데 지금은 '엠티' 대신 '모꼬지'라는 말이 널리 쓰인다. '모꼬지'는 흔히 산이나 강, 바다 같은 야외로 나가서 한다. 이 때문에 '모꼬지 간다'는 표현을 쓰느 사람들이 더러 있으나 엄밀히 따지면 이는 정확하지 않다. '모꼬지' 자체가 '여러 사람이 모여 놀이판을 여는 것'을 뜻하는 말이므로 '모꼬지한다' 또는 '모꼬지하러간다'고 표현해야 옳다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404455&page=30","sourceTitle":"동아리, 두레, 모꼬지"},{"word":"곁사돈","meaning":"직접 사돈 간이 아닌 방계 간의 사돈. '사돈'은 자녀가 혼인을 하였을 때 그 배우자의 부모를 말한다. 그런데 자녀의 배우자 부모가 아닌 형제자매 등도 보통 사돈이라고 부르는데, 엄밀히 말하면 이는 '곁사돈'이다. 즉 방계 간에 있는 사돈을 '곁사돈'이라고 한다. '방계'란 '직계'에 상대되는 말로, 같은 조상에서 갈라진 수평적인 계통을 말한다. 형제자매나 4촌, 6촌 등의 관계에 있는, 같은 항렬의 친족이 곧 '방계'다. 한편 겹혼인으로 맺어진 사돈관계는 '겹사돈' 이라 한다. '곁사돈'과 '겹사돈'은 다르다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404313&page=30","sourceTitle":"곁사돈, 여의다, 남진아비"},{"word":"여의다","meaning":"죽어서 이별하다. 멀리 떠나보내다. 딸을 시집보내다. '여의다'는 부모, 자식, 사랑하는 임 등 가족이나 가족 비슷하게 가까운 사람과의 이별을 뜻하는 말이다. '부모를 여의다'라고 하면 부모가 돌아가신 것을 뜻한다. '임을 여의다'는 사랑하는 임을 떠나보냈다는 것이고, '딸을 여의다'는 딸을 시집보낸다는 뜻이다. 반면 아들 장가보내는 것을 '여의다'라고 하지는 않는다. 아들은 결혼을 해도 부모의 곁을 떠나지 않았기 때문이다. 하지만 요즘에는 아들도 결혼해서 떠나가는 세상이니 '여의다'라고 해야 하지 않을까. 어떤 경우든 '여의다'는 이별의 슬픔이 묻어 있는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404313&page=30","sourceTitle":"곁사돈, 여의다, 남진아비"},{"word":"남진아비","meaning":"아내를 가진 사내. 유뷰남. 반대는 '남진어미'\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404313&page=30","sourceTitle":"곁사돈, 여의다, 남진아비"},{"word":"까치걸음","meaning":"아이들이 기쁠 때 두 발을 모아 뛰면서 조촘거리는 종종걸음","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404294&page=30","sourceTitle":"까치걸음, 야바윗속, 한시름, 본데"},{"word":"야바윗속","meaning":"속임수로 협잡을 꾸미는 속내 '야바위'란 교묘한 속임수로 물주가 돈을 따는 노름의 하나다. 그 뜻을 넓혀보면 비단 놀음뿐만 아니라 협잡의 수단으로 그럴듯하게 꾸미는 일을 모두 이르는 말이다. 흔히 이런 놀음이나 일을 하는 사람을 '야바위꾼' 또는 '설레꾼'이라고 한다. '야바윗속'은 바로 야바위꾼의 교묘한 속마음을 일컫는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404294&page=30","sourceTitle":"까치걸음, 야바윗속, 한시름, 본데"},{"word":"한시름","meaning":"큰 걱정 오늘날에는 주로 '한시름 놓다' 또는 '한시름 덜다'라는 관용구 형태로 쓰인다. '한시름이다'고 하면 '걱정이 태산이다'는 말과 같은 뜻이다. 그러므로 '한시름 놓다(덜다)'는 큰 걱정에서는 일단 벗어났다는 뜻이다. 여기서 '한'은 '하나'가 아니라 '크다'는 뜻이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404294&page=30","sourceTitle":"까치걸음, 야바윗속, 한시름, 본데"},{"word":"본데","meaning":"보아서 배운 솜씨나 지식, 또는 예의범절\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404294&page=30","sourceTitle":"까치걸음, 야바윗속, 한시름, 본데"},{"word":"볼만장만","meaning":"보기만 하고 간섭하지 아니하는 모양 우리가 흔히 쓰는 '가관이다'라는 말을 우리말로 풀어쓰면 '볼만하다'는 뜻이다. 그런데 이 말은 '볼만한 가치가 있다'기보다는 그 반대의 뜻으로, 눈앞에서 펼쳐진 일이 봐줄만하지 않다는 뜻이다. 반어법이다. 그런데 '볼만장만'은 눈앞에서 급한 일이 벌어지는데도 그것을 보고 있는 사람이 시비를 가리거나 참견하지 않는 경우에 쓰는 말이다. '강 건너 불 구경'을 말한다. 즉 냉소적이고 소극적인 태도를 꼬집는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404151&page=30","sourceTitle":"볼만장만, 선웃음, 선갓, 손기척"},{"word":"선웃음","meaning":"우습지도 않은데 꾸며 웃는 거짓 웃음 간혹 '선웃음'을 선한 표정으로 웃는 웃음이라고 알고, 그렇게 쓰는 사람들이 있다. 그러나 '선웃음'은 엉너리치는 웃음이다. 우습지도 않은데 남의 마음을 사고자 능청을 떨며 억지로 웃는 것을 말한다. 방송의 우스개 극에서 시청자의 웃음을 끌어내기 위해 음향으로 들려주는 웃음소리도 선웃음의 하나다. 실제의 웃음이 아니라 제작진이 억지로 만들어서 들려주는 웃음인것이다. '선웃음'에서 '선'은 으뜸꼴이 '설다'인데, '익지 못하다' 또는 '서투르다'는 뜻이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404151&page=30","sourceTitle":"볼만장만, 선웃음, 선갓, 손기척"},{"word":"선갓","meaning":"햇살의 눈부심을 막고 멀리 보기 위하여 손을 이맛전에 붙이는 짓. 우리가 일상적으로 하는 행동임에도 그것을 나타내는 적당한 말이 없거나, 있어도 모르고 잘 쓰지 않는 경우가 더러 있다. '손갓'도 그런 말 가운데 하나다. 소설 따위의 문학 작품에서 사람의 행동을 그려내기에 알맞은 말이다. 예컨대 \\"그는 햇살에 눈이 부시어 손을 이맛전에 붙이고 먼 산을 바라보았다\\"라는 표현보다는, \\"그는 햇살에 눈이 부시어 손갓을 하고 먼 산을 바라보았다\\"라고 쓰면 훨씬 간결하면서도 글맛이 살아난다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404151&page=30","sourceTitle":"볼만장만, 선웃음, 선갓, 손기척"},{"word":"손기척","meaning":"노크 우리나라의 전통적인 노크 방법은 '에헴'하는 헛기침이다. 집의 구조를 보면 알 수 있듯이, 일상의 삶의 공간이 열려 있었던 전통사회에서는 굳이 손기척이 필요 없었다. 신분에 따라서 \\"에헴\\"하고 헛기침을 하거나, 그럴 만한 지위가 못 되면 공손하게 말로 아뢰면 되는 것이다. 그러나 생활의 공간이 꽁꽁 닫혀 있는 오늘날의 일상생활에서는 헛기침이 통하지 않는다. 이제 닫힌 문 앞에서는 손기척을 하는 것이 일상의 예절이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404151&page=30","sourceTitle":"볼만장만, 선웃음, 선갓, 손기척"},{"word":"든버릇","meaning":"고치기 어려운 고질적인 버릇이나 습관. '든버릇'은 몸속에 들어와 자리를 잡고 앉은 버릇이라고 할 수 있다. 사람은 누구나 저마다의 버릇이나 습관이 있기 마련이다. 좋은 버릇은 끊임없이 힘을 들여야 만들어지지만 나쁜 버릇은 저절로 찾아와서 든버릇이 되고 만다. 든버릇은 좋지 않은 버릇이다. 흔히 쓰는 한자말 '고질병'에 갈음하여 쓸 수 있는 말이다. 한편 '든버릇'이라는 말은 없다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404040&page=30","sourceTitle":"든버릇, 듣보기, 뜬금없다, 바르집다"},{"word":"듣보기","meaning":"듣고 보는 것. 시청 \\"지금 이 방송을 시청하시는 시청자 여러분, 안녕하십니까?\\" 방송 진행자가 흔히 하는 말이다. 그런데 '시청하시는 시청자 여러분'은 반복적 표현이라 거슬린다. 그래서 어떤 방송 진행자는 '시청하시는'을 '보고계시는'으로 바꾼다. 그러나 텔레비전을 듣지는 않고 보기만 하는가? 이럴 때 '듣보기하시는'으로 써보는 것도 손색이 없을 것이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404040&page=30","sourceTitle":"든버릇, 듣보기, 뜬금없다, 바르집다"},{"word":"뜬금없다","meaning":"갑작스럽고 엉뚱하다. 금(金)은 돈이다. 그러므로 '뜬금'은 시중에 '떠 있는 돈'이다. 곧 시세의 변동에 따라 정해지는 값이다. 시장의 가격은 수요와 공급의 법칙에 따라 오르락내리락하기 마련이다. 그런데 어떤 장사꾼이 제멋대로 정한터무니없는 가격으로 손님들을 불러모은다면, 그의 행위는 뜬금없다. 뜬금없는 행위가 다 나쁜 것은 아니다. 불의한 경우를 보고도 많은 사람들이 숨죽이고 있을 때 용감하게 나서는 시민의 행위는, 얼추 뜬금없다고 할 수 있지만 결국은 손뼉을 칠 일이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404040&page=30","sourceTitle":"든버릇, 듣보기, 뜬금없다, 바르집다"},{"word":"바르집다","meaning":"덮어두어야 할 다른 사람의 비밀을 여러 사람이 있는 자리에서 끄집어내어 이야기하다. '바르잡다'는 원래 '오그라진 것을 벌려 펴다'는 뜻이다. 그러나 사람의 행위와 관련지어 '지나간 일 또는 비밀을 들추어내거나, 사소한 일을 크게 떠벌리다'는 뜻으로 많이 쓰인다. 말의 형태에서 짐작할 수 있듯이 '바르집다'는 '바르다'와 '집어내다'의 두 가지 말이 합성된 것이다. 고기 뼈에 붙어 있는 살을 거두어내는 것을 이를 때 '살을 바르다'라고 하며, 밤송이나 콩깍지 따위의 껍질을 벗기고 속 알맹이를 집어낼 때도 '밤(콩)알을 바르다'라고 한다. 이럴 때 쓰는 '바르다'와 '집어내다'가 붙어서 '바르집다'는 말이 생성된 것이다. 입이 가벼운 사람들은 되새겨봄 직한 말이다. 큰말은 '버르집다'이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=404040&page=30","sourceTitle":"든버릇, 듣보기, 뜬금없다, 바르집다"},{"word":"강울음","meaning":"눈물을 흘리지 않고 건성으로 우는 울음. '강울음'은 억지로 힘들여 우는 것, 또는 부자유스런 울음 등이 이에 속한다. '건울음'은 건성으로 우는 것이다. '강-'이 접두어로 쓰일 때 '억지', '호된', '부자유스런', '메마른' 등의 뜻이 있다. 또는 '그것만으로 이루어진'이라는 뜻도 있다. '강울음', '강다짐' 등의 '강-'은 '억지'의 뜻이 있고, '강추위'의 '강-'은 '호된'의 뜻이 있다. 안주 없이 마시는 술을 '강술'이라고 하는데 여기에서의 '강-'은 '그것만으로'의 뜻이다. '강보리밥'의 '강-'도 같은 뜻이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403947&page=30","sourceTitle":"강울음, 건사하다, 까치발"},{"word":"건사하다","meaning":"자신에게 딸린 것을 잘 돌보아 거두다. 잘 간수하여 지키다. 제게 딸린 사람, 제 소유의 물건 따위를 잘 간수하고 거두는 것을 말한다. 집 안, 화초 따위를 잘 손질해 가꾸는 것, 마음속의 꿈을 소중하게 가꾸어 나가거나 몸을 건강하게 잘 유지하는 것 모두가 건사하는 것이다. 또한 아랫사람이나 고용자에게 일을시킬 때 막연히 지시하는 것이 아니라 구체적인 일거리를 챙겨주는 것도 '건사하다'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403947&page=30","sourceTitle":"강울음, 건사하다, 까치발"},{"word":"까치발","meaning":"키를 높이기 위하여 발뒤꿈치를 드는 일. 키가 작은 사람이 커 보이게 하는 몸짓으로는 두 가지가 있는데, 첫째는 목을 빼는 것이요, 둘째는 발뒤꿈치를 한껏 드는 일이다. 목이야 빼봤자 키를 키우는 데 별 도움에 되지 않지만, 까치발은 잘하면 발의 길이만큼 키를 키울 수 있다. 한편 한쪽 발을 들고 다른 쪽 발로만 서 있거나 뛰는 것은 속어로 '깨금발'이라 하며, 어린아이들이 두 발을 모아서 종종 뛰는 것을 '까치걸음'이라 한다. '까치발'과는 구별해야 한다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403947&page=30","sourceTitle":"강울음, 건사하다, 까치발"},{"word":"텡쇠","meaning":"겉으로는 튼튼해 보이지만 속으로는 허약한 사람 '-쇠'는 사람을 홀하게 이르거나 일반적으로 신분이 낮은 사람을 일컫는 접사인데 '돌쇠', '마당쇠' 등이 그와 같은 예이다.그런데 고대에서 이 '-쇠'는 왕의 이름으로 쓰일 정도로 지체 높은 사람에게 쓰이는 말이었다. 그러다가 조선 시대에 와서 '개똥쇠', '무적쇠'처럼 주로 하인을 부르는 이름으로 쓰이게 되었고, 근래에 이르러서는 천한 사람의 이름으로 아예 굳어져 버린 것이다. 이처럼 '-쇠'의 쓰임이 크게 변한 것은 조선조 이후 우리말을 경시해온 사대주의 풍조 때문이었다. 한편 '텡'은 비어 있는 모양을 나타내는 말이다. '텡쇠'와 비슷한 뜻을 지닌 말로는 '텡보'가 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403841&page=30","sourceTitle":"텡쇠, 틀박이, 고드름장아찌, 대못박이, 곰손이"},{"word":"틀박이","meaning":"생전 고향을 떠나지 않는 사람. 먹어도 몸무게가 늘거나 줄지 않는 몸바탕 일정한 테두리에 묶여 변동이 없는 것을 말한다. 키나 몸이 붇지 않는 사람, 또는 일정한 틀에 박혀 있는 물건 따위를 가리키는 말이다. 특히 먹어도 살이 찌지 않아서 몸무게가 늘거나 줄지 않는 틀박이 체질을 가진 사람들은 요즈음 이른바 '살 빼기 전쟁'에 나서는 사람들에게 부러움의 대상이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403841&page=30","sourceTitle":"텡쇠, 틀박이, 고드름장아찌, 대못박이, 곰손이"},{"word":"고드름장아찌","meaning":"언행이 싱거운 사람을 농으로 일컫는 말 장아찌는 간장에 절이거나 담근 반찬을 말한다. 그러므로 당연히 짭짤한 맛이 생명이다. 그런데 고드름을 간장에 절이면 어떻게 될까? 고드름은 다 녹아서 싱거운 물이 되고 말 터이다. 고드름과 장아찌, 이 두가지 상반된 성질이 해학적으로 합성된 말이다. 즉 '고드름장아찌'는 맹물 같은 사람을 빗댄 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403841&page=30","sourceTitle":"텡쇠, 틀박이, 고드름장아찌, 대못박이, 곰손이"},{"word":"대못박이","meaning":"대못도 들어가지 않는 물건. 융통성 없는 사람 대못이 물건을 뚫지 못하는 것처럼, 아주 어리석고 둔하여 가르쳐도 깨닫지 못하는 사람을 빗댄 말이다. 말귀를 알아듣지 못하거나 남의 말을 좀처럼 듣지 않는 사람을 일러 \\"귀에 못박았냐?\\"라고 하는 경우가 있다. '대못박이'는 고정관념이 강하여 새로운 것을 잘 받아들이지 않거나, 남의 말에 귀를 기울이지 않아서 융통성이 없는 사람 따위를 말한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403841&page=30","sourceTitle":"텡쇠, 틀박이, 고드름장아찌, 대못박이, 곰손이"},{"word":"곰손이","meaning":"곰과 같이 순하고 듬직한 사람.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403841&page=30","sourceTitle":"텡쇠, 틀박이, 고드름장아찌, 대못박이, 곰손이"},{"word":"늦깍이","meaning":"나이가 들어서 중이 된 사람 오늘날 '늦깍이'는 나이가 들어서 어떤 전문적인 분야에 나아간 사람을 일컫는 말로 흔히 쓰인다. 특히 늦은 나이에 학교에 들어간 사람을 '늦깍이 학생'이라 부는 것이 예사다. '늦깍이'는 원래 나이가 들어서 중이 되기 위하여 머리를 깎은 사람을 이르는 말이다. 즉 머리를 '늦게 깎았다'는 것이다. 늦게 불가에 들어서다 보니 당연히 사리를 깨닫는 것도 남보다 늦다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403764&page=30","sourceTitle":"늦깍이, 따라지, 민머리, 연생이"},{"word":"따라지","meaning":"키와 몸이 매우 작아 풍채가 보잘것 없는 사람 '따라지'는 단지 사람의 겉모습만을 두고 하는 말이 아니다. 키와 몸집이 작더라도 정신세계가 드높고 당당한 사람은 실제보다 훨씬 크게 보인다. 마음이나 몸이나 모두 왜소하여 볼품없는 사람을 일러 '따라지'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403764&page=30","sourceTitle":"늦깍이, 따라지, 민머리, 연생이"},{"word":"민머리","meaning":"정수리까지 벗어진 대머리 정수리까지 시원하게 벗어진 대머리를 옛말로는 '민머리'라 하였다. 그러나 사실상 이 말은 신체적인 대머리보다는 '벼슬하지 못한 사람'들이 자조적으로 자신의 신세를 빗대어 쓰는 경우가 더 많았다. 한편, '여자의 쪽지지 않은 머리'도 민머리라고 하는데, '민-'이 접두어로 쓰일 때는 일반적으로 '꾸밈새나 덧붙어 딸린 것이 없음'을 뜻한다. 화장하지 않은 얼굴을 '민낯'이라 하는 것과 같은 이치다. 대머리보다는 한결 어감이 부드러운 '민머리'라는 말로 바꾸어 쓰는 것이 좋을 것이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403764&page=30","sourceTitle":"늦깍이, 따라지, 민머리, 연생이"},{"word":"연생이","meaning":"잔약하고 보잘것없는 사람이나 물건 조선 시대 의녀의 이야기를 다룬, 한 방송국의 역사극에 등장한 인물 가운데 '연생이'라는 이름을 가진 궁녀가 있었다. 우연한 계기에 승은을 입어 첩지를 받게 되는 연생이라는 이름은 사실상 남존여비 사상이 지배하던 조선 시대에 흔하디흔한 이름이었다. 여자 아이들을 하찮게 여겨 이런 이름을 많이 붙였던 것이다. '개똥이'. '분례' 등도 봉건 시대에 여성을 홀대하여 붙인 이름들이다.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403764&page=30","sourceTitle":"늦깍이, 따라지, 민머리, 연생이"},{"word":"생목","meaning":"먹은 지 얼마 안 되어 다시 입으로 올라오는, 삭지 않은 음식물이나 시큼한 위액. 보통 음식을 급히 먹거나 국물 없이 강다짐(마른밥)을 먹었을 때 일어나는 생리현상이다. 흔히 '생목 오르다'라고 한다. 위 속에 들어간 음식물이 위액과 섞이지 못하고 역류하는 것으로, 체한것과는 다른 생리현상이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403612&page=30","sourceTitle":"생목, 시르죽다, 알땀, 주럽, 주접, 배냇냄새"},{"word":"시르죽다","meaning":"기운을 못 차리다. 기를 못 펴다 '시르다'의 어원은 분명치 않다. '실개천', '실낱' 따위처럼 가늘고 작은 것을 뜻하는 '실'에서 비롯되었거나, '시들다' 또는 '시름'과 관련된 것으로 보인다. 어떤 말에서 유래되었든 모두 '나약함'이나 '연약함'을 뜻한다. '시르죽다'는 '나약하다'는 한자말에 갈음하여 쓸 수있는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403612&page=30","sourceTitle":"생목, 시르죽다, 알땀, 주럽, 주접, 배냇냄새"},{"word":"알땀","meaning":"예쁜 여자의 이마 따위에 송알송알 맺히는 땀 사람이 흘리는 땀에도 여러 가지가 있다. 보통 사람들이 흘리는 땀방울에 견주어 예쁜 여자가 흘리는 땀방울은 '알땀'이라 한다. 예쁜 여자는 땀방울도 다른가 보다. 무척 힘이 들 때 몹시 쏟아지는 땀은 '비지땀'이라 한다. 보기에도 안쓰러운 땀이다. 또한 구슬처럼 방울방울 맺히는 땀은 '구슬땀'이라 한다. 알땀은 여성적인 느낌이, 구슬땀은 남성적인 느낌이 든다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403612&page=30","sourceTitle":"생목, 시르죽다, 알땀, 주럽, 주접, 배냇냄새"},{"word":"주럽","meaning":"피곤하고 고단한 증세 극도로 피곤하고 고단한 증세가 몰려오는 것을 '주럽들다'라고 한다. 또 주럽이 든 고단한 몸을 쉬게 하여 피로를 푸는 것은 '주럽떨다'라고 한다. 주럽을 떨쳐낸다는 뜻이다. 한편 주럽은 주로 사람의 몸 상태에 대해서만 쓰는 말이다. 따라서 식물이 병들어 말라 들어가는 상태를 나타내는 '주접'과는 구별해서 써야한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403612&page=30","sourceTitle":"생목, 시르죽다, 알땀, 주럽, 주접, 배냇냄새"},{"word":"주접","meaning":"여러 가지 이유로 생물체가 쇠해지는 상태 '주접'은 '주럽'과 뜻이 다르다. 식물이나 작물 따위의 생물체가 잔병이 많아서 잘 자라지 못하거나 기를 펴지 못하고 시들어가는 것을 '주접들다'라고 한다. 작은말은 '조잡'이다. 그런데 '주접'은 오늘날 대부분 행위와 관련되어 쓰인다. 예컨대 음식에 대하여 추잡하게 욕심을 부리는 태도가 있는 사람을 '주접스럽다'라고 한다. 뜻이 별로 좋지 않은 말이다. 사람을 극도로 비하할 때 쓰는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403612&page=30","sourceTitle":"생목, 시르죽다, 알땀, 주럽, 주접, 배냇냄새"},{"word":"배냇냄새","meaning":"갓난아이의 몸에서 풍기는 냄새\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403612&page=30","sourceTitle":"생목, 시르죽다, 알땀, 주럽, 주접, 배냇냄새"},{"word":"꽃무덤","meaning":"아까운 나이에 죽은 젊은이의 무덤 '꽃'과 '무덤'은 그 느낌이 극단적으로 상반되는 말이다. 하지만 두 말이 합쳐짐으로써 가슴 아련한 정서적인 느낌을 불러일으킨다. '꽃무덤'은 절절한 사랑을 못 이루고 떠난 슬픈 영혼, 또는 불의에 항거하다가 비명에 쓰러져 간 외로운 영혼들을 떠올리게 하는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403590&page=31","sourceTitle":"꽃무덤, 몸풀이, 쉰둥이, 막달"},{"word":"몸풀이","meaning":"해산하다. 아이를 낳고 몸조리하는 상태 몸은 생명을 지닌 육신을 말한다. 따라서 '몸을 푼다'는 것은 뱃속의 생명이 세상에 나오는 것을 뜻한다. 더불어 '몸풀이'는 아이를 낳는 순간부터 산후 조리를 하는 단계를 두루 뜻하는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403590&page=31","sourceTitle":"꽃무덤, 몸풀이, 쉰둥이, 막달"},{"word":"쉰둥이","meaning":"부모의 나이가 쉰 줄에 들어서 태어난 아이 부모가 사십대 정도에 아이를 낳게 되면 보통 '늦둥이'라고 부른다. 그런데 오십대의 여성이 아이를 낳는 경우는 거의 없을 것이다. 따라서 쉰둥이느 아버지의 입장에서 쉰 줄에 가진 아이를 말한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403590&page=31","sourceTitle":"꽃무덤, 몸풀이, 쉰둥이, 막달"},{"word":"막달","meaning":"해산달\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403590&page=31","sourceTitle":"꽃무덤, 몸풀이, 쉰둥이, 막달"},{"word":"염통","meaning":"'심장'의 순우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403439&page=31","sourceTitle":"염통, 푸석살, 활개, 나룻, 몸씨, 안개눈썹"},{"word":"푸석살","meaning":"무르고 푸석푸석한 살 조금만 앓고 나도 살이 축나게 쭉 빠지는 체질을 가진 사람의 살이 바로 '푸석살'이다. 물렁물렁하게 많이 찐 살을 뜻하는 '무살'과 비슷하지만, 무살보다 살갗이 더 거칠고 쇠해 보인다. 푸석살과 반대되는 말은 '참살'과 '대살'이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403439&page=31","sourceTitle":"염통, 푸석살, 활개, 나룻, 몸씨, 안개눈썹"},{"word":"활개","meaning":"사람의 활짝 편 두 팔과 다리 의기양양한 태도로 휘젓고 다니는 것을 '활개를 치다'라고 한다. 요즘에도 흔히 쓰는 말인데, 여기서 '활개'는 원래 퍼덕거리는 새의 두 날개나, 사람의 활짝 편 두 팔과 다리를 일컫는 말이다. '활개'가 들어가는 말은 '힘차고 의기양양한'태도를 나타낸다. 또한 '이불 속에서 활개 치다'라는 말이 있는데 평소 남이 보지 않는 곳에서는 큰소리를 잘 치고 잘난 체하다가도 정작 어?***?일을 당하면 해결하지 못하고 쩔쩔매는 사람을 이르는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403439&page=31","sourceTitle":"염통, 푸석살, 활개, 나룻, 몸씨, 안개눈썹"},{"word":"나룻","meaning":"수염을 예스럽게 이르는 말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403439&page=31","sourceTitle":"염통, 푸석살, 활개, 나룻, 몸씨, 안개눈썹"},{"word":"몸씨","meaning":"몸의 맵시. 몸매","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403439&page=31","sourceTitle":"염통, 푸석살, 활개, 나룻, 몸씨, 안개눈썹"},{"word":"안개눈썹","meaning":"숱이 많지 않고 빛깔이 엷은 눈썹\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403439&page=31","sourceTitle":"염통, 푸석살, 활개, 나룻, 몸씨, 안개눈썹"},{"word":"메밀눈","meaning":"작고 모질게 생긴 눈. '메밀눈'은 뾰족하게 모가 난 메밀에 눈의 모양을 빗댄 말이다. 별로 좋지 않은 느낌을 주는 눈이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403394&page=31","sourceTitle":"메밀눈,미주알, 민낯,밸,삭신"},{"word":"미주알","meaning":"똥구멍에 닿아 있는 창자의 끝부분. 말하지 않아도 좋을 사소한 것까지 속속들이 말하거나 캐묻는 행위에 '미주알고주알'이라는 말을 쓴다. '미주알'은 신체의 은밀한 곳에 감추어져 있는 살덩어리다. 그 미주알을 꺼내듯 알리고 싶지 않은 일까지 캐물으면, 대답하는 사람은 미주알이 빠져나온 것처럼 곤혹스럽고 고통스럽다는 뜻이다. 한편 미주알을 '밑살'이라고도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403394&page=31","sourceTitle":"메밀눈,미주알, 민낯,밸,삭신"},{"word":"민낯","meaning":"여자의 화장하지 않은 맨얼굴. '민낯'에서 '민-'은 '꾸밈새나 덧붙어 딸린 것이 없음'을 나타내는 접두어다. '민머리','민다래끼','민날' 따위의 '민-'이 모두 그런 뜻으로 쓰였다. 한편 접두어 '민-'은 '닳아서 모지라지거나 우둘투둘하던 것이 평평하게 됨'을 뜻하기도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403394&page=31","sourceTitle":"메밀눈,미주알, 민낯,밸,삭신"},{"word":"밸","meaning":"창자의 속어. '밸'은 '배알'의 준말이다. 작은 창자는 '가는 밸'이고, 큰창자는 '큰 밸'이다. 밸은 창자를 속되게 이르는 말이지만, 구겨지고 꼬인 마음의 상태를 나타내기도 한다. 그래서 창자가 꼬인 것처럼 마음이 꼬이는 것을 '밸이 꼬이다'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403394&page=31","sourceTitle":"메밀눈,미주알, 민낯,밸,삭신"},{"word":"삭신","meaning":"몸의 힘살과 뼈마디.\\n- 좋은 문장을 쓰기 위한 우리말 풀이사전 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403394&page=31","sourceTitle":"메밀눈,미주알, 민낯,밸,삭신"},{"word":"개숫물","meaning":"그릇을 씻은 물, 또는 생활폐수\\n개숫물은 원래 음식 그릇을 씻은 물을 뜻하는 말이다. 그러나 오늘날에는 그릇 씻은 물뿐만 아니라 일반 가정에서 버린느 생활폐수를 모두 일컫는 말이라 할 수 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403287&page=31","sourceTitle":"물, 불, 광물과 관련된 순 우리말"},{"word":"군불","meaning":"방을 덥게 하려고 때는 불.\\n날이 추운 겨울에 아궁이에 불을 지펴 구들장을 덥혀 주기 위해 때는 불.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403287&page=31","sourceTitle":"물, 불, 광물과 관련된 순 우리말"},{"word":"목물","meaning":"사람의 목까지 찰 정도의 깊은 물. 여름철 등과 목에만 물을 끼얹는 목욕.\\n'목물'은 물의 깊이를 가리키는 말이기도 하지만, 허리 위에서 목까지만 물로 씻는 일을 가리키는 말로 더 많이 쓰인다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403287&page=31","sourceTitle":"물, 불, 광물과 관련된 순 우리말"},{"word":"불잉걸","meaning":"활짝 피어 이글이글한 숯불.\\n벌겋게 달아오른 숯불이나 장작개비의 불덩어리를 말한다. 숯이나 나무가 불에 탈 때 가장 놓은 온도를 유지하는 대목이라 할 수 있다. 불잉걸을 '잉걸불'이라고도 하며 줄여서 '잉걸'이라고도 부르는데, 이는 활활 타오르른 불꽃보다 훨씬 더 뜨거운 상태다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403287&page=31","sourceTitle":"물, 불, 광물과 관련된 순 우리말"},{"word":"한데우물","meaning":"집의 울 밖에 있는 우물. 공동우물.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403287&page=31","sourceTitle":"물, 불, 광물과 관련된 순 우리말"},{"word":"머리등","meaning":"자동차나 자전거 따위의 앞부분에 달린 등. 전조등, 헤드라이트.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403287&page=31","sourceTitle":"물, 불, 광물과 관련된 순 우리말"},{"word":"곰비임비","meaning":"물건이 거듭 쌓이거나 일이 계속 일어나는 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"김첨지감투","meaning":"어떤 사물이 도깨비 장난같이 없어지기 잘하거나, 가뭇없이 사라져버린 것.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"낙낙하다","meaning":"크기, 수효, 무게가 조금 크거나 남음이 있다.\\n'낙낙하다'는 '넉넉하다'의 작은말이다. 요즘에는 주로 큰말인 '넉넉하다'만 쓰이지만, 나타내는 대상의 규모가 작을 때는 '낙낙하다'는 표현을 살려 써봄 직하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"달걀가리","meaning":"달걀을 쌓은 가리. 곧 현실적으로 가능하지 않은 일.\\n'가리'는 볏단 따위를 쌓아 올리는 것을 말하는데, 달걀을 그것들끼리만 쌓아 올릴 수 있는가? 즉 현실적으로 가능하지 않은 일을 쓸데없이 상상하는 것을 말한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"모지라지다","meaning":"물건의 끝이 닳아서 없어지다.\\n연필을 오래 써서 모지라지면 '몽당연필'이 된다. 빗자루나 붓 따위를 오래 쓰다 보면 모지라져서 더 이상 쓰기 어렵게 된다. 이렇게 오래 써서 끝이 다 닳아진 물건을 '모지랑이'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"마디다","meaning":"잘 닳거나 없어지지 않고 오래 지탱하다.\\n짚신은 잘 닳는다. 그렇지만 고무신이나 운동화는 잘 닳지 않는다. 그래서 고무신은 마디다. '사람이 참 마디다'라고 하면 '헤프지 않다'는 뜻이다. '마디다'는 자라는 속도가 더딘 것을 표현하기도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"사춤","meaning":"벌어지거나 갈라진 틈.\\n원래 담이나 벽의 갈라진 틈을 '사춤'이라 하고, 그러한 틈을 진흙으로 메우는 일을 '사춤 치다'라고 한다. 사춤은 사람과 사람의 관계에도 있따. 따라서 서먹한 사람과의 관계를 풀어주는 것도 사춤을 치는 일이라고 할 수 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"시나브로","meaning":"모르는 사이에 조금씩. 다른 일을 하는 사이에 조금씩.\\n아주 느리게 일이 진행되는 것을 나타내는 말로, 동사 앞에 쓰여 그 움직임을 꾸며주는 역할을 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"옹글다","meaning":"물건이 조각나거나 축나지 아니하고 본디 그대로 있다.\\n어떤 것이 가지고 있어야 할 내용에 조금도 모자람이 없는 상태를 말한다. '옹고집', '옹두리'따위에서 쓰인 '옹'은 대체로 '작지만 단단하고 완고함'을 뜻한다. '옹글다'와 뜻이 비슷하면서 느낌이 더 강한 말은 '옹골차다'이다. 또한 '실속있게 꽉 찬 상태'를 '옹골차다'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"터울","meaning":"두 물건 사이에 차이가 지다.\\n한 어머니가 낳은 형제자매 간의 나이 차이를 뜻하는 말로 주로 쓰인다. '터울'은 원래 '한터에서의 울타리'라는 뜻이다. 어떤 경계를 말하는 것이다. 이것이 줄어서 '터울'이 되었고, 지금은 주로 나이 차이를 나타내는 말로 쓰이고 있는 것이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403162&page=31","sourceTitle":"사물의 현상이나 이치와 관련된 순 우리말"},{"word":"가을부채","meaning":"철이 지나 쓸모없게 된 물건.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"거스러미","meaning":"손톱이 박힌 자리 위에 살갗이 거슬려서 일어난 보풀 같은 것.\\n나무의 결 같은 것이 얇게 터져 일어나 가시처럼 된 부분 또한 거스러미라고 한다. 마루에 거스러미가 일어나면 발바닥에 박혀서 상처가 나기 쉽다. 어떤 일에서 사소한 부분에 말썽이 일어나는 경우도 거스러미라 할 수 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"검불","meaning":"마른 풀, 낙엽, 짚 부스러기 따위처럼 마구 헝클어진 것의 총칭.\\n검불 가운데서도 자잘한 짚 부스러기나 흩어진 낱알 같은 것을 '팃검불'이라 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"더께","meaning":"몹시 찌든 물건에 앉은 거친 때.\\n더께는 비눗물로도 좀처럼 닦이지 않는 찌든 때를 말한다. 오래된 가구나 가전제춤에 앉은 때가 바로 그렇다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"맏물","meaning":"그해에 맨 먼저 나온 과일이나 곡식, 해산물 따위.\\n한 집에서 맨 먼저 태어난 사람을 '맏이', 짐승의 첫 번째 새끼를 '맏배'라고 부르는 것과 같은 이치이다.\\n맏물의 반대말은 '끝물'이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"여줄가리","meaning":"주된 물건의 줄기에 딸린 물건. 중요한 일에 딸린 중요하지 않은 일.\\n'액세서리(accessory)'에 해당하는 순 우리말이 바로 '여줄가리'다.\\n여줄가리는 어떤 일을 하는 데 있어서 '중요한 일에 딸린, 그다지 중요하지 않은 일'을 뜻하기도 한다. 여줄가리에 반대되는 말은 '대줄가리'다. 대줄가리는 어떤 사실의 중요한 골자를 말한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"오가리","meaning":"무, 호박 따위의 살을 길게 썰어서 말린 것.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"사북","meaning":"물건의 가장 중요한 부분. 부챗살이나 가위 다리의 교차된 곳에 꽂은 못.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"왜배기","meaning":"겉보기에 좋고 질적으로도 짭짤한 물건. 반대말은 '진상'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=403027&page=31","sourceTitle":"사물의 이름과 관련된 순 우리말"},{"word":"나무초리","meaning":"나뭇가지의 가느다란 끝부분.\\n'초리'는 '회초리','눈초리'와 같이 끝이 길고 가느다란 것을 나타내는 말이다. 짐승의 꼬리나 새의 꽁지와 비슷한 뜻이다.\\n나무의 꼭대기 줄기를 '우듬지'라 하는데, 나무초리는 우듬지에서도 맨 끝, 꼬리처럼 뾰족한 부분을 말한다. '위초리'라고도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402981&page=31","sourceTitle":"식물의 생태와 관련된 순 우리말"},{"word":"보늬","meaning":"밤이나 도토리같이 겉껍질이 있는 나무열매 속에 있는 얇은 껍질.\\n한자말로 '내피(內皮)'에 해당한다. 잣이나 땅콩의 질기고 단단한 겉껍질을 벗기고 나면 붉은 막 같은 속껍질이 나온다. 그 또한 보늬다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402981&page=31","sourceTitle":"식물의 생태와 관련된 순 우리말"},{"word":"아람","meaning":"탐스러운 가을 햇살을 받아서 저절로 충분히 익어 벌어진 과실.\\n아람이 활짝 벌어지는 것을 '아람 벌다'라고 하며, 아람이 나무에서 떨어지거나 곧 떨어질 상태에 있는 것을 '아람 불다'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402981&page=31","sourceTitle":"식물의 생태와 관련된 순 우리말"},{"word":"등걸","meaning":"줄기를 잘라낸 나무 밑동.(=그루)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402981&page=31","sourceTitle":"식물의 생태와 관련된 순 우리말"},{"word":"똘기","meaning":"채 익지 않은 과실.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402981&page=31","sourceTitle":"식물의 생태와 관련된 순 우리말"},{"word":"삭정이","meaning":"산 나무에 붙어 있는 말라 죽은 가지.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402981&page=31","sourceTitle":"식물의 생태와 관련된 순 우리말"},{"word":"갈목","meaning":"갈대의 이삭.\\n갈목은 갈대꽃이 달린 이삭 부분을 말하는 것이다. 그것을 꺾어서 만든 밋자루를 '갈목비'라고 부른다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"남새","meaning":"들에 심어서 가꾸는 채소. '야채'를 대신하는 말.\\n'남새'는 '푸새'와 상대되는 말이다. 산과 들에 자생하는 푸성귀를 푸새라 하고, 무나 배추처럼 심어서 가꾼 채소를 남새라한다. 따라서 채소를 심은 밭은 남새밭이 된다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"다복솔","meaning":"가지가 다보록하게 퍼진 어린 소나무.\\n가지가 다보록하게 퍼진 어린 소나무를 '보득솔'이라 하였다. 이 '보득솔'과 비슷한 이름이 곧 '다복솔'이다. 보통 풀이나 작은 나무가 탐스럽고 소복하게 나 있는 모양을 '다보록하다'고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"장다리꽃","meaning":"무, 배추 따위의 줄기에 피는 꽃.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"개똥참외","meaning":"가꾸지 않았어도 저절로 나서 열린 참외.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"오디","meaning":"뽕나무의 열매.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"오얏","meaning":"자두.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"살사리꽃","meaning":"코스모스.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402832&page=31","sourceTitle":"식물의 종류, 이름과 관련된 순 우리말"},{"word":"무녀리","meaning":"한 태에 낳은 여러 마리의 새끼 가운데 맨 먼저 나온 새끼\\n한편 무녀리는 '맏배'와 다르다. 맏배는 처음으로 임신하여 낳은 새끼를 말한다. 사람의 경우 맏딸, 맏아들이라고 하는 것과 같은 이치다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceTitle":"동물의 생태와 관련된 순 우리말"},{"word":"홀알","meaning":"암탉이 교미하지 않고 낳은 알. 무정란(無精卵).\\n양계장에서날마다 쏟아져 나오는 수많은 달걀은 대부분 홀알이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceTitle":"동물의 생태와 관련된 순 우리말"},{"word":"흘레","meaning":"짐슴의 교미(交尾)\\n짐슴이 교미를 하는 것을 '흐르다'라고 한다. '흘레'는 이 '흐르다'가 변한 말로, '흘레하다'또는 '흘레붙다'의 형태로 쓰인다. 소, 말, 돼지 따위 짐승을 흘레붙일 때에는 암컷이 달아나지 못하도록 틀에 암컷을 묶어놓는데, 이 틀을 '흘레틀'이라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceTitle":"동물의 생태와 관련된 순 우리말"},{"word":"며느리발톱","meaning":"길짐승이나 새의 뒤쪽 발톱.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceTitle":"동물의 생태와 관련된 순 우리말"},{"word":"모래집","meaning":"포유동물의 태아를 싼 얇은 막.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceTitle":"동물의 생태와 관련된 순 우리말"},{"word":"조가비","meaning":"조개의 껍데기.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceTitle":"동물의 생태와 관련된 순 우리말"},{"word":"항정","meaning":"돼지나 개 따위 짐승의 목덜미.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402776&page=31","sourceTitle":"동물의 생태와 관련된 순 우리말"},{"word":"고도리","meaning":"고등어의 새끼, 또는 포도청에서 죄인의 목을 졸라 죽이는 일을 맡아 하던 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"길짐승","meaning":"/날짐승 - 기어다는 짐승/날아다는 짐승.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"부사리","meaning":"들이받는 버릇이 있는 소.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"붕장어","meaning":"뱀장어와 비슷하게 생긴 붕장어과의 바닷물고기.\\n우리에게 흔히 '아나고'라는 일본말로 더 많이 알려진 붕장어는 몸길이가 90센티미터가량 되는, 뱀장어 비슷한 바닷물고기 이름이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"알배기","meaning":"알이 들어 통통한 생선. 외모에 비하여 알차고 충실한 사람.\\n생선이 아니라도 '겉보다 속이 야무진 상태'를 이를 때 '알배기'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"풀치","meaning":"갈치의 새끼.\\n'갈치'의 원말은 '칼치'다. 즉 칼 모양을 닮은 고기라는 뜻이다.\\n그런데 그 새끼를 '풀치'라고 하는 것은 그것이 기다란 풀잎 모양을 닮았기 때문일 것이다. 해학이 묻어나는 우리말이다. 풀[草]이 자라서 칼[刀]이 되는 셈이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"받배","meaning":"짐승이 첫 번째로 낳은 새끼.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"간자미","meaning":"가오리 새끼.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"꽝다리","meaning":"조기 새끼.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"솜병아리","meaning":"알에서 깬 지 얼마 안 되는 병아리. 햇병아리.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"불강아지","meaning":"몹시 여윈 강아지.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402638&page=31","sourceTitle":"동물의 종류나 이름과 관련된 순 우리말"},{"word":"가두리","meaning":"물건의 가를 두르고 있는 언저리.\\n가두리는 바깥쪽, 가장자리를 뜻하는 '가'와 '두르다'가 합쳐진 말로, 통상 어떤 물체 겉쪽의 휘두른 언저리를 이르는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceTitle":"위치, 방향과 관련된 순 우리말"},{"word":"고섶","meaning":"손만 내밀면 바로 찾을 수 있는 곳.\\n물건을 두는 곳이나 서랍, 그릇 등에서 손만 내밀면 바로 찾을 수 있는 곳을 일러 '고섶'이라고 한다. '섶'이란 비교적 가까운 곳을 뜻한다. '길섶'이 길에 접해 있는 언저리를 가리키는 것과 같은 이치다. 곳간, 벽장, 서랍, 그릇 따위의 가장 앞쪽의 손쉽게 물건을 찾을 수있는 곳은 모두 고섶이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceTitle":"위치, 방향과 관련된 순 우리말"},{"word":"도래","meaning":"둥근 물건의 둘레.\\n도래는 '돌다'에서 비롯된 말로, 다른 말에 덧붙어 '돌아가게 되어 있다','둥글다'는 뜻을 나타낸다.\\n팔꿈치의 둥근 뼈를 '도래뼈'라 하고, '도래샘'은 빙 돌아서 흐르는 샘물이고, '도래솔'은 무덤가에 둘러선 소나무를 말한다. 또 둥글게 된 밥상을 '도래상'이라 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceTitle":"위치, 방향과 관련된 순 우리말"},{"word":"맞은바라기","meaning":"앞으로 마주 바라다보이는 곳.\\n건너편, 맞은편과 뜻이 비슷한 말이지만, '맞은바라기'는 이보다 거리상의 여유가 느껴지는 말이다. '건너편'은 둘 사이에 길이나 강과 같은 경계가 있음을 뜻하고, '맞은편'은 비교적 가까운 곳을 나타낸다. 예를 들어 마주 보이는 아파트 건물은 '맞은편'에 있지만, 멀리 마주 보이는 산봉우리를 나타낼 때는 '맞은바라기'가 어울린다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceTitle":"위치, 방향과 관련된 순 우리말"},{"word":"시울","meaning":"눈, 입 등의 언저리.\\n주로 사람의 얼굴에서 눈과 입의 언저리를 가리키는 말로 쓰이는데, 저 혼자 쓰이는 경우가 거의 없다. '눈시울', '입시울'처럼 '눈'과 '입'에 붙어서 쓰인다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceTitle":"위치, 방향과 관련된 순 우리말"},{"word":"이마받이","meaning":"두 물체가 아주 가깝게 맞붙음을 이르는 말.\\n이마받이는 본디 '이마를 들이받음'을 뜻하는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceTitle":"위치, 방향과 관련된 순 우리말"},{"word":"가녘","meaning":"가장자리나 언저리, 여가리. 변두리나 한쪽 모퉁이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402521&page=32","sourceTitle":"위치, 방향과 관련된 순 우리말"},{"word":"가풀막","meaning":"가파른 땅의 바닥. 급경사 길.\\n가풀막은 '가파르다'에, '오르막', '내리막', '늘그막'따위에 쓰인 '-막'이 붙어서 이루어진 말이다. '가파르다'의 원형을 살려서 '가팔막'이라고도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"갓길","meaning":"비상시 이용하도록 고속도로 양쪽 가장자리에 있는 길.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"고샅","meaning":"마을의 좁은 골목, 또는 좁은 골짜기의 사이.\\n고샅은 본디 '좁은 골짜기'를 뜻하는 말이다.\\n고샅의 '고'는 골짜기를 뜻하는 '골'의 받침소리가 탈락한 형태이다. 또한 '샅'은 본래 '사이'가 줄어든 말로 사람이나 짐승의 가랑이 사이를 뜻한다. 손가락 사이를 '손샅'이라 하는 것과 비슷한 이치다. 따라서 고샅을 말 그대로 풀어보며 '골짜기 사이'가 된다. 그런데 문학작품에 나오는 고샅이란 말은 대체로 어린 시절 추억이 스며들어 있는, 마을의 좁은 길목을 뜻한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"길라잡이","meaning":"길을 인도하는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"길품","meaning":"먼 길을 걷는 노력, 또는 남의 갈 길을 대신 가주고 삯을 받는 일.\\n'길품(을) 들이다'는 것은 어떤 목적지를 향하여 일부러 노력을 들여 길을 가는 경우를 뜻한다. '길품(을) 팔다'고 하면, 원뜻은 남의 갈 길을 대신 가주고 삯을 받는다는 뜻이다. 그러나 '아무 보람도 없이 헛길만 가다'는 뜻으로도 쓰인다. 이런 경우에는 '길품만 팔았다'고 표현한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"논틀길","meaning":"꼬불꼬불한 논두렁 위로 난 길.\\n논틀길의 '-틀-'은 '틀다'에서 변형된 말이다. 그러므로 논틀길은 '비틀비틀하게 난 길'의 모양을 담고 있는 말이다. 논틀길을 줄여서 '논틀'이라고도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"뒤안길","meaning":"늘어선 집들의 뒤쪽으로 난 길.\\n동네 앞 '큰길'에 상대되는 말이다.동네 앞길은 '한길', 마을 속으로 난 길은 '속길(이면도로)', 마을 뒤쪽으로 난 길은 '뒤안길'이 된다.\\n뒤안길은 관심을 받지 못하여 초라하고 쓸쓸한 생활이나 처지를 은유로 나타내기도 한다. 인생에도 한길과 뒤안길이 있는 법이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"에움길","meaning":"빙 둘러서 가는 길. 우회로.\\n가장 가까운 방향으로 질러가는 길을 '지름길'이라고 한다면, 이와는 달리 빙 둘러서 가는 길이나 우회로를 일컬어 '에움길'이라 한다. '두름길'과 같은 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"한길","meaning":"차나 사람이 많이 다니는 큰 길.\\n한길은 '큰 길'이다. 어떤 고을에서 가장 크고 번화한 길을 말한다.\\n한길은 단지 길의 크기만을 말하는 것이 아니라, 특정 지역 내에서 차나 사람의 통행량이 가장 많은 번화한 길을 가리키는 말이다. 한편 사람들이 많이 모이는 번화한 곳을 '한바닥'이라 하고, 반대로 사람이 별로 가지 않는 외진 곳을 '도린곁'이라 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"길섶","meaning":"길 가장자리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"나들목","meaning":"드나들 때 반드시 거치게 되는 길목. 고속도로 톨게이트.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"돌서더릿길","meaning":"돌이 많이 깔린 길.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"푸서릿길","meaning":"잡초가 무성하게 난 길.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402489&page=32","sourceTitle":"길과 관련된 순 우리말"},{"word":"감풀","meaning":"썰물 때는 보이고 밀물 때는 안 보이는, 비교적 넓고 평탄한 모래톱.\\n우리나라 서해안이나 남해안에는 섬은 섬이지만 썰물 때는 길이 나서 뭍이나 다름없는 곳이 여러 군데 있다. 구약성서에 나오는 '모세의 기적'을 연상하게 하는 이 길은 뭍과 섬 사이에 감풀이 이어진 것이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"까치놀","meaning":"석양에 먼 바다의 수평선에서 희번덕이는 물결.\\n해거름에 서쪽 하늘을 물들인 불긋불긋한 노을.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"난바다","meaning":"붙에서 멀리 떨어진 넓은 바다.\\n난바다는 한자말로 '원해(遠海)' 또는 '원양(遠洋)'에 해당한다.\\n한편 뭍에서 그리 멀지 않은 가까운 바다는 '든바다'라고 한다. 한자말로 '근해(近海)'이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"너울","meaning":"바다에서 일어나는 사납고 큰 물결.\\n바람이 세게 불 때 뱃전이나 방파제 따위에 부딪치면서 하얀 물기둥처럼 솟구쳐 오르다가 물보라를 일으키는 거친 파도.\\n너울을 줄여서 '놀'이라고도 한다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"물참","meaning":"밀물이 들어와 가장 높이 찼을 때. 만조(滿潮)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"사리","meaning":"매달 음력 보름날과 그믐날에 조수가 가장 높이 들어오는 때.\\n'조수(潮水)'나 '조석(潮汐)', '간만(干滿)'은 모두 다 밀물과 썰물을 나타내는 한자말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"조금","meaning":"'조감(潮減)'에서 변한 말. 한달 중에서 조사가 가장 낮은 때.\\n밀물이 가장 낮게 드는 음력 8일경과 23일경의 조수를 말한다. 조금 때는 바닷물이 높지 않아서 감풀이 넓게 드러난다. 한펴 조금 때 날씨가 궂은 것을 '조금치'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"숨은여","meaning":"수면 위로는 보이지 않지만 바다 속에 내밀고 있는 암초.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"여울","meaning":"강이나 바다의 바닥이 얕거나 폭이 좁아서 물살이 세차게 흐르는 곳.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402379&page=32","sourceTitle":"강, 바다와 관련된 순 우리말"},{"word":"가람","meaning":"강(江)의 예스런 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"감탕","meaning":"갖풀에 송진을 넣고 끓인 끈끈한 풀, 또는 물과 함께 짓이겨 곤죽같이 된 진흙.\\n짐승의 가죽이나 뼈 따위를 모아서 오래 고은 뒤 굳으면 끈끈하고 황갈색의 도는 접착제가 된다. 이를 '아교(阿膠)'또는 우리말로 '갖풀'이라 하는데, 여기에 다시 송진을 넣고 끓이면 더욱 끈끈한 풀이 된다. 이를 일컬어 '감탕'이라 하고, 비가 온 뒤 아주 질게 된 진흙땅을 '감탕밭'이라 한다. 또한 남녀가 점잖지 않게 온갖 음탕한 몸짓으로 잠자리를 하는 짓을 경멸스럽게 말할 때 '감탕질'이라 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"개막은 땅","meaning":"간척지(干拓地)\\n지금처럼 대규모의 갯벌을 막아서 환경과 생태에 영향을 미치는 정도는 아니지만, 비교적 오래 전부터 서해안 지방에서는 바닷가 갯벌에 돌담을 쌓아서 농경지로 사용하였는데, 이를 '개막은땅'이라 불렀다. 개막은땅은 지금도 그 흔적이 남아 있다. 한편 개막은땅이 넓은 들판이 되어 펼쳐져 있는 것을 '노해'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"둔치","meaning":"강, 호수 등 물가의 가장자리나 둔덕진 곳.\\n둔치는 예전의 '고수부지(高水敷地)'라는 어?***?한자말을 제치고 훌륭하게 부활한 우리말이다. 둔치는 물과 당의 점이지대로서 개구리 등 양서류가 서식하는 곳이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"알땅","meaning":"비바람을 막을 아무런 준비도 없는 땅.\\n'알땅'을 비롯하여 '알몸', '알곡','알밤' 따위의 말에서 접두사 '알-'은 겉을 싼 것이 다 벗겨진 모양을 나타낸다. 알땅은 초목이 전혀 없이 먹을 것, 마실 것조차 구하기 어?***? 사막과 같은 발가벗은 땅을 말한다. '노지(露地)' 또는 '황무지(荒蕪地)'라는 한자말에 갈음하여 쓸 수 있는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"터앝","meaning":"집 울타리 안에 있는 작은 밭.\\n터앝은 '텃밭'과 다른다. 텃밭은 집터에 딸리거나 집 가까이 있지만 울타리(담) 밖에 있는 밭을 이르는 말이고, 터앝은 울타리 안의 마당 한구석에 있는 밭이다. 요즘 도시의 빌딩 옥상 같은 데에 채소를 조금씩 심어놓은 것을 가끔 볼 수 있는데 이것도 터앝이라고 할 수 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"푸서리","meaning":"덩거칠게 잡풀이 무성한 곳.\\n'푸서리'는 '풀'과 '서리'가 합하여 이뤄진 말이다. '서리'의 'ㅅ'앞에서 '풀'의 'ㄹ'이 떨어지면서 '푸서리'가 된 것이다.\\n이처럼 '풀'은 경우에 따라서 그 받침이 바뀌거나 탈락하여 일정한 말을 만드는데 '푸새','푸성귀'가 그런 말이다.\\n한편 '서리'는 '무엇이 많이 모여 있는 그 사이'를 뜻하는 말로 쓰였다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"후미","meaning":"산길이나 물가의 굽어서 휘어진 곳, 또는 굽돌이.\\n산길이나 물가의 굽어서 휘어진 곳을 '후미'라고 하며, 그렇게 된 길을 '후밋길'이라 한다. 또한 굽어서 들어간 정도가 깊다는 것을 일러 '후미지다'라고 하는데, 이 말은 요즘에 와서 '무서울 정도로 깊숙하고 쓸쓸한 장소'를 나타낼 때 주로 쓰인다. 한편 항간에서는 '후(後)지다'라는 속된 말을 더러 쓰는데, 이는 '뒤처지다','질이 떨어지다' 등의 뜻을 가진 말이다. 따라서 이말과 '후미지다'를 같은 뜻으로 혼동해서는 안 될 것이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"노해","meaning":"바닷가에 퍼진 들판.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"선바위","meaning":"산이나 들, 또는 물 가운데 외따로 우뚝 서 있는 큰 바위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"펀더기","meaning":"넓은 들. 광야(廣野).","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"함지땅","meaning":"분지(盆地).","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"너럭바위","meaning":"넓고 평평한 바위.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"날땅","meaning":"개간하지 않은 땅. '나대지'를 대신하는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402252&page=32","sourceTitle":"땅과 관련된 순 우리말"},{"word":"강더위","meaning":"비는 오지 않고 여러 날 계속되는 심한 더위.\\n비가 내려서 더위를 식혀주어야 하는데 그렇지 아니하고 더위만 계속된다는 뜻이며, 반대말은 '강추위'다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402110&page=32","sourceTitle":"더위, 추위, 구름과 관련된 순 우리말"},{"word":"거먹구름","meaning":"비를 머금은 검은 구름\\n'검은 구름' 또는 '시커먼 구름'을, 맛을 좀더 살려 표현한 말이다. 한자말로 '암운(暗雲)'이라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402110&page=32","sourceTitle":"더위, 추위, 구름과 관련된 순 우리말"},{"word":"매지구름","meaning":"비를 머금은 검은 조각구름.\\n매지구름이 검게 보이는 것은 땅으로부터 낮게 떠 있기 때문이다. 그래서 매지구름은 밀","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402110&page=32","sourceTitle":"더위, 추위, 구름과 관련된 순 우리말"},{"word":"강바람","meaning":"비는 내리지 않고 몹시 세게 부는 바람.\\n강바람은 일종의 계절풍이다. 즉 비는 오지 않고 바람만 몹시 부는 태풍을 강바람이라 할 수 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceTitle":"바람과 관련된 순 우리말"},{"word":"꽃샘바람","meaning":"봄철 꽃이 필 무렵에 부는 찬바람.\\n'꽃샘'에서 '샘'은 물이 솟아나는 샘이 아니다. '시샘'의 줄임말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceTitle":"바람과 관련된 순 우리말"},{"word":"높새","meaning":"'북동풍'을 뱃사람이 이르는 말.\\n'높'은 북쪽을 가리키는 '노'라는 말이 변한 것이고, '새'는 동쪽을 말한다.\\n뱃사람들이 방향을 가리키는 말로 '새'는 동쪽, '하늬'는 서쪽, '마'는 남쪽이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceTitle":"바람과 관련된 순 우리말"},{"word":"바람꽃","meaning":"먼 산에 구름같이 끼는 보얀 기운.\\n바람에도 꽃이 있다. 큰 바람이 불기 전에 먼저 먼 산에 구름같이 끼는 보얀 기운을 '바람꽃'이라 한다. 바람꽃이 일면 큰 바람이 분다. 그래서 뱃사람들은 바람꽃이 보이면 출항을 하지 않았고, 농부들은 바람의 피해을 입지 않도록 농작물을 단속하였다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceTitle":"바람과 관련된 순 우리말"},{"word":"황소바람","meaning":"좁은 곳으로 가늘게 불어오지만 매우 춥게 느껴지는 바람.\\n옛날 서민들에게 가장 추운 바람은 황소바람이었다. 지금은 집에 난방이 잘 되어 한겨울에도 집 안에서 속옷 차림으로 지낼 수 있지만, 옛날 서민들은 한겨울날 문풍지 떠는 소리와 함께 문틈으로 스며 들어오는 바람에 오금이 저리도록 떨면서 밤을 보내야 했다. 특히 작은 창구멍을 통해 들어오는 바깥공기는 차라리 바깥에서 거세게 휘몰아치는 찬바람을 직접 맞는 것보다 더 춥게 느껴진다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceTitle":"바람과 관련된 순 우리말"},{"word":"돌개바람","meaning":"태풍과 같이 휘돌면서 부는 바람, 또는 강한 회오리바람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceTitle":"바람과 관련된 순 우리말"},{"word":"건들마","meaning":"초가을에 남쪽에서 불어오는 시원한 바람. (=건들바람)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=402043&page=32","sourceTitle":"바람과 관련된 순 우리말"},{"word":"가랑비","meaning":"조금씩 내리는 비.\\n가랑비에서 '가랑'은 매우 작은 것을 뜻한다. 가랑비는 한자말 '세우(細雨)'에 해당하는 우리말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"달구비","meaning":"빗발이 달구처럼 굵게 죽죽 쏟아지는 비.\\n'달구'는 집터나 묘지 같은 데에 흙바닥을 다질 때 쓰는 굵은 장대를 말한다. 달구비는 채찍비, 장대비 따위와 더불어 가장 굵은 빗줄기와 무더기비를 나타내는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"먼지잼","meaning":"비가 겨우 먼지나 날리지 않을 정도로 조금 내림.\\n오랜 가뭄으로 메마른 땅에 풀풀 날리는 먼지를 겨우 재워놓을 정도로 내리는 비를 말한다. '잼'은 '재움'의 줄임말로 볼 수 있따.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"비설거지","meaning":"비가 오려고 할 때 비에 맞지 않도록 물건을 치우거나 덮어서 단속하는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"여우비","meaning":"볕이 난 날 잠깐 뿌리는 비.\\n예상치 않게 홀연히 나타났다가 사라지는 여우처럼, 여우비는 햇볕이 난 날에 잠깐 흩뿌리다가 마는 비를 말한다. 지역에 따라서는 여우비가 내리는 것을 '호랑이 장가간다'고 말하기도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"억수","meaning":"물을 끼얹듯이 아주 세차게 쏟아지는 비. 억수장마","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"흑비","meaning":"바람에 날려 떨어지는 가벼운 모래흙. 황사(黃沙)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"비받이","meaning":"우산","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"해받이","meaning":"양산","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401915&page=32","sourceTitle":"비와 관련된 순 우리말"},{"word":"나달","meaning":"나흘이나 닷새 정도. 세월.\\n어원을 두 가지로 추정할 수 잇는 말이다. 말의 뿌리를 '나흘과 닷새'로 보면 4~5일을 뜻하는 말이고, '날과 달'이 더해져서 된 말로 본다면 곧 세월을 뜻하게 된다. 나달은 그 두 가지 뜻을 함께 가진 말이다. 말하는 상황에 따라서 세월의 뜻으로 쓰이기도 하고, 4~5일을 뜻하기도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401825&page=32","sourceTitle":"계절, 때와 관련된 순 우리말"},{"word":"낮곁","meaning":"한낮부터 해 지기까지의 시간을 둘로 나누었을 때 그 전반부.\\n우리의 전통사회에서 하루 동안의 시간샘법은, 낮에는 해가 지나는 길을 따르고, 밤에는 별자리의 놓인 모양에 따랐다. 정오 무렵부터 오후 3시경까지의 반나절을 '낮곁'이라 한다. 낮곁은 해가 가장 높이 떠 있는 시간이다. 세상의 만물이 가장 왕성하게 활동하는 시간이며, 하루 중 가장 더울 무렵이기도 하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401825&page=32","sourceTitle":"계절, 때와 관련된 순 우리말"},{"word":"열나절","meaning":"일정한 한도 안에서 매우 오랫동안.\\n하루 낮의 절반가량을 '나절'이라고 한다. 그러나 나절이 반드시 하루를 절반으로 잘라서 말하는 것은 아니다. '아침나절'이나 '점심나절' 따위와 같이 하루 가운데 일정한 동안을 어림잡아 나타내기도 한다. 그러므로 열나절은 대략 닷새 안팎이 되겠지만, 딱 자라서 닷새를 말하는 것은 아니다. 하루이틀이면 끝낼 수 있는 일을 여러 날 길게 끌고 가는 경우에 쓰는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401825&page=32","sourceTitle":"계절, 때와 관련된 순 우리말"},{"word":"한뉘","meaning":"한평생\\n'뉘'는 보통 사람의 한평생, 한세상, 한 세대를 뜻하는 옛말이다. 그러므로 '한뉘'는 사람의 한평생 또는 한세상을 말한다.\\n'뉘'가 '자손'또는 '자손의 덕'이라는 뜻으로 쓰이는 경우도 있따. 예컨대 '뉘 보다'라고 하면 '자손을 보다'라는 뜻이다. 한편 '볕뉘'에서 처럼 '뉘'가 접미사로 쓰이며 별로 대단치 않은 것, 작은 것, 미천한 것, 그림자 등을 뜻한다. 쌀에 섞인 벼 알갱이를 '뉘'라고 하기도 한다. 이것 또한 하찮은 것을 뜻하는데, 뉘가 많이 섞인 쌀을 '뉘반지기'라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mo
