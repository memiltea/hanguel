www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397135&page=37","sourceText":"꼬치미 : 꼬챙에 꿴 음식.\\n코다리 : 명태를 말려 코를 꿰어 놓은 것.\\n'꼬챙이'는 나무 따위의 가늘고 긴 막대기를 말해요. 줄임말은 '꼬치'인데, '꼬치미'는 이 '꼬치'에서 나온 말이에요. 고기 등을 꼬챙이에 꿰어서 구운 '산적'이나 곶감' 등도 모두 '꼬치미'라고 할 수 있어요.\\n'코다리'도 또 하나의 꼬치미예요.\\n겨울철에 잡히는 생선인 '명태'는 여러 가지 이름이 있어요. 바로 잡은 싱싱한 명태는 '생태', 꽁꽁 얼린 것은 '동태', 널어서 바람에 빨리 말린 것은 '북어', 얼리고 녹이는 걸 반복하면서 말린 것은 '황태'라고 해요.\\n그리고 '코다리'는 북어를 만들 때 나뭇가지 같은 것으로 북어의 코를 꿰어 매달아 놓는다고 해서 붙인 이름이에요.","images":[]},{"word":"간간하다와 밍밍하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397062&page=37","sourceText":"간간하다 : 짭짤하여 먹기에 알맞을 정도로 간이 배어 있다.\\n밍밍하다 : 음식 따위가 제 맛이 나지 않고 싱겁다.\\n흔히 음식에 맛을 낼 때 '간'을 한다고 하죠? '간'은 음식에 짠맛을 내는 소금, 간장, 젓갈 등을 통틀어 이르는 말이에요. 그러니까 '간하다'고 하면, 여러 가지 맛 가운데 '짠맛'을 내는 걸 뜻하지요. '채소나 생선 따위의 음식물을 소금에 절이다'는 뜻으로도 쓰이고요. '간간하다'는 이렇게 '간하다'에서 나온 말로, 입맛이 당기고 먹기에 적당할 정도로 간이 배어 있는 걸 말해요.\\n'밍밍하다'는 '간간하다'와는 반대로 음식의 맛이 짜지 않고 싱거운 걸 뜻해요.\\n'덤덤하다'고도 표현하지요. 그런데 우리나라 사람들, '간간한' 음식 좋아하기로 유명하지요? 예로부터 찌개나 젓갈류 등을 계속 먹어 왔기 때문이에요. 하지만 간간한 것도 지나치면 건강에 좋지 않아요. 입맛이 돌 정도로만 간을 하고, 적당히 '밍밍한'맛에 길들여지도록 해야겠어요.","images":[]},{"word":"꽃잠, 덧거리, 눈썰미","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396930&page=37","sourceText":"▲ 꽃잠 - 세상 모르게 '깊이 든 잠'\\n▲ 덧거리 - 정해진 양보다 더 많이 얹어서 주는 것. 더 넓은 뜻으로, '없는 사실을 보태어 말하는 것'을 이르기도 함\\n▲ 눈썰미 - 한번 보아 그대로 흉내낼 수 있는 재주","images":[]},{"word":"사람의 생긴 모양을 이르는 말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceText":"● 누에늙은이 - 누에가 늙은 것같이 말라 휘늘어진 사람.\\n● 뻗팔이 - 꼬부라지지 않는 팔. 또는 그 팔을 가진 사람.\\n● 앉은뱅이 - 안기는 해도 서지는 못하는 불구자.\\n● 곱장다리 - 무릎뼈는 밖을 향해 벌어지고 정강이는 안을 향해 휘어진 다리.\\n● 덴둥이 - ①불에 덴 사람. ②미운 사람을 욕으로 이르는 말.\\n● 껑충이 - 키가 껑충하게 크고 마음이 허황한 사람.\\n● 앙가발이 - ①다리가 짧고 굵은 사람. ②잘 달라 붙은 사람.\\n● 제비턱 - 밑이 두툼하고 넓직하게 생긴 턱. 또는 그러한 사람의 별명.\\n● 함실코 - 코가 쏙 빠져 입천장과 콧구멍이 맞뚫린 사람.\\n● 해귀당신 - 얼굴이 해바라지고 푼더분하지 못하게 생긴 사람을 비유하는 말.\\n● 흑보기 - 눈동자가 한쪽으로 몰려, 무엇을 정면으로 보지 못하고 언제나 흘겨보는 사람.\\n● 곰보딱지 - 얼굴이 몹시 얽은 사람을 놀리어 이르는 말.\\n● 청맹과니(靑盲--) - 보기에는 눈이 멀쩡하나 실지는 조금도 보지 못하는 눈. 또는 그런 사람. 당달봉사. (준말) 청맹.\\n● 합죽이 - 이가 빠져서 입과 볼이 합죽한 사람.\\n● 보름보기 - '애꾸눈이'를 조롱하는 말.","images":[]},{"word":"추억의 옛물건들 이름","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceText":"★ 고리 - 고리나 대오리로 엮어서 상자처럼 만든 그릇. 옷을 담는 데 쓰임.\\n★ 동고리 - 버들로 둥글납작하게 만든 작은 고리짝.\\n★ 고비 - 편지 같은 것을 꽂아 두는 물건. 종이로 주머니나 상자처럼 만들거나 종이오리로 '+'자 모양으로 만들어 벽에다 붙임.\\n★ 타래박 - 대나 나무로 된, 긴 자루가 달린 두레박.\\n★ 둥주리 - 짚으로 두껍고 크게 엮은 둥우리. 옛날에 밖을 지키던 사람이 추울 때 들어앉아서 망을 봤고, 또 말을 타고 길가는 사람이 말 등에 얹어서 타고 들어앉았음.\\n★ 둥우리 - 짚이나 대나 싸리 따위로 바구니 비슷하게 엮어 만든 그릇. 추녀나 서까래 밑에 네 귀를 매어 담.\\n★ 도래방석 - 짚으로 둥그게 짠 방석. 주로 곡물을 널어 말리는 데에 쓰며, 방석으로 이용하기도 함.\\n★ 빗접 - 빗, 빗솔, 빗치개 따위 같이 머리를 빗는 데 쓰는 도구를 넣어두는 작은 제구. 흔히 창호지 같은 것을 여러 겹 붙여 기름에 결어서 만듦.\\n★ 섬 - 곡식을 담기 위하여 짚으로 엮어서 만든 멱서리.\\n★ 평미레 - 말에 곡식을 담고 그 위를 평평하게 미는 방망이.\\n★ 색대 - 섬이나 가마니 속의 든 곡식이나 소금을 거죽으로부터 찔러서 빼내어 보는데 쓰는 제구.","images":[]},{"word":"사람의 신체적 특징을 나타내는 말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceText":"◎ 들창코 - 코끝이 들려서 콧구명이 드러나 뵈는 코, 또는 그런 코를 가진 사람을 놀림조로 이르는 말.\\n◎ 생강손이 - 손가락이 잘라져서 생강처럼 된 사람을 이르는 말. 새앙손이.\\n◎ 애꾸눈이 - '한쪽 눈이 먼 사람' 을 앝잡아 이르는 말. (준말0 애꾸. ◎ 말승냥이 - '키가 볼품없이 크고 사나운 사람'을 이르는 말.\\n◎ 먹보 - 귀가 먹은 사람.\\n◎ 몽구리 - ㉠ 머리를 아주 바싹 깍은 머리 ㉡'중'을 얕잡아 이르는 말.\\n◎ 밭장다리 - 걸을 때 두 발의 끝이 밖으로 향하게 걷는 사람. (반대말) 안짱다리.\\n◎ 사시랑이 - 가늘고 약한 사람이나 물건.\\n◎ 혹부리 - 얼굴에 혹이 달린 사람을 놀림조로 이르는 말.\\n◎ 콧벽장이 - 콧구멍이 너무 좁아 숨을 못 쉬는 사람을 놀림조로 이는 말.\\n◎ 곱사등이 - 곱사등인 불구자. 비타민 D의 결핍으로, 주로 어린이 때 이 병이 생김. 곱추\\n◎ 장구머리 - 이마와 뒤통수가 쑥 내민 머리, 또는 그렇게 생긴 사람.\\n◎ 작다리 - 키가 작은 사람을 농으로 이르는 말.\\n◎ 난쟁이 - 정상적인 보통 키보다 훨씬 작은 사람.\\n◎ 외팔이 - '한쪽 팔만 있는 사람'을 홀하게 이르는 말.\\n◎ 점박이 - '얼굴이나 몸에 큰 접이 박힌 사람이나 짐승'을 이르는 말. 점둥이.\\n◎ 더더리 - 말을 더덜거리는 사람.\\n◎ 따라지 - 보잘 것 없이 키와 몸이 작은 사람. 딸보.","images":[]},{"word":"우리 농장의 잡초들","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceText":"◈ 명아주 : 일년초로 큰 것은 2m 정도까지 자라며 거름터에서 높이 자라는 것을 볼 수 있고, 잎 뒤에는 은색 가루같은 것이 피어 있음. 그 줄기로 지팡이를 만드는데 그 지팡이를 청려장(靑藜杖)이라고 함.\\n◈ 바랭이 : 포아풀과이며 기어가서는 뿌리를 내리고 다시 기어가서는 뿌리를 내리는, 전답에서 가장 흔하고 무성한 잡초.\\n◈ 메꽃 : 나팔꽃과 닮은 덩굴성 다년초이나 꽃색이 나팔꽃보다 연하고 품위도 없어 보임.\\n◈ 도꼬마리 ; 높이는 1m 내외의 일년초이며 특징은 길이 1cm 폭 8mm 정도의 둥글길쭉한 열매가 맺히는데 열매에는 갈고리 같은 가시가 나 있어 옷에 잘 붙음.\\n◈ 독말풀 : 쓰레기장에 잘 나는 1m 이상으로 자라는 일년초. 8~9월에 연한 자줏빛이 도는 흰 꽃이 피고 열매는 가시가 돋은 길이 5~6cm 지름 2cm 정도임. 만지면 고약한 냄새가 남. ◈ 망초 : 높이는 1m 정도인데 곧게 자라며 작은 꽃 여럿이 모인 꽃은 6~7월에 피는데 속은 노라나 꽃잎은 하얀색인 귀화 식물.\\n◈ 냉이 : 높이 50cm 정도이나 겨울과 이른봄엔 채취하여 국을 끓여 먹음. 꽃은 5~6월에 흰 점처럼 피는데 이때 뿌리의 냄새를 맡으면 계피 냄새가 남.\\n◈ 질경이 : 다년초로 특징은 잎에서 평행하게 뻗은 다섯 개의 엽맥이 뚜렷함. 이 옆백을 당겨내면 섬유처럼 빠져 나오며 뿌리는 곧게 깊이 박혀 있음.\\n◈ 메귀리 : 포아풀과의 풀로 귀리와 비슷하며 높이 1m쯤 되며 구황식물이고 잎과 줄기는 가축의 먹이로 이용됨.","images":[]},{"word":"물에 사는 것들","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceText":"◐ 우렁이 : 무논이나 웅덩이 등에 사는 암녹색 고둥. 식용함\\n◐ 생이 : 담수 연못 등의 풀섶에 서식하는 몸길이 35mm 쯤 되는 새우. 생으로 젓을 담아 먹거나 말리어 먹음. 토하(土蝦)\\n◐ 물방개 : 몸길이 40mm 내외로 못이나 늪에 살며 몸은 타원형으로 납작하고 뒷다리에는 긴 털이 뭍어 있어 헤엄치기에 적당함. 성충과 유충은 모두 육식성임.\\n◐ 게아재비 : 몸길이 43mm 내외이고 몸은 가늘고 길며 회갈색 또는 황갈색임. 못이나 늪에서 어린 물고기나 곤충을 잡아먹음.\\n◐ 물자라 : 몸길이 18~20mm 정도이고 물장군과 비슷함. 몸빛은 암황갈색이고 봄철에 암컷이 수컷의 등에 알을 낳으면 부화할 때까지 수컷이 알을 등에 지고 다님.\\n◐ 물땅땅이 : 물방개와 비슷하나 등이 좀 더 불룩함. 몸길이 32~35mm이고 몸빛은 광택 있는 칠흑색이고 앞가슴 한가운데 두 개의 점이 있음.\\n◐ 송장헤엄치게 : 몸길이 12mm 정도이며 몸빛은 황갈색에 날개에는 세 개의 검은 얼룩무늬가 있음. 보통 배 쪽을 위로하여 송장헤엄을 치고 맑은 날에는 날아다님. 잔고기나 올챙이 등을 잡아 피를 빨아먹음.\\n◐ 물둥구리 : 타원형이고 날개가 있으며 몸 길이 11mm 정도이고 몸빛은 암갈색에 오갈색부가 있고 앞다리는 발톱 모양이며, 못에서 작은 물고기나 곤충을 포식함.\\n◐ 물빈대 : 물두구리와 비슷한데 몸길이 6~10mm이고, 몸은 원반상이며 납작하고,날개는 퇴화하여 흔적만 있고 계류에 서식하며 작은 물고기를 포식함.","images":[]},{"word":"다따가, 쾌분잦하다, 가두기, 가데기, 난바다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396331&page=38","sourceText":"* 다따가 : 도중에 갑자기. 별안간.\\n* 쾌분잦하다 : 꽤 북적거리며 어수선하다.\\n* 가두기/가둑잎 : 가랑잎.\\n* 가데기 : 쟁기.\\n* 난바다 : 육지에서 멀리 떨어진 넓은 바다.","images":[]},{"word":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceText":"*가늘라 : 갓난 아이, 어린이.\\n*난든집 : 손에 익숙한 재주.\\n*단백사위: 윷놀이의 마지막 판에 쓰이는 말.\\n*라온 : 즐거운.\\n*마음자리: 마음의 본바탕.\\n*바닥쇠 : 지방에서 오래 전부터 사는 사람.\\n*아름아름: 한아름이 넘도록 뭉쳐지거나 뭉친 모양.","images":[]},{"word":"가녘, 나쎄, 나쪼다, 다림방, 마득사리, 바사기, 사리사리, 아삼삼하다, 콩팔...","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396122&page=38","sourceText":"* 가녘 : 가장자리. 여가리.\\n* 나쎄 : 어느 정도로 먹은 나이.\\n* 나쪼다 : 어른 앞에 나오다.\\n* 다림방 : 서울에서 쇠고기, 돼지 고기를 파는 가게\\n* 마득사리 : 노래의 장단을 맞추는 소리.\\n* 바사기 : 사물의 이해력이 부족하고 인격을 갖추지 못한 사람.\\n* 사리사리 : 연기가 가늘게 올라가는 모양.\\n* 아삼삼하다 : 생김새나 됨됨이가 마음에 끌리게 묘하고 그럴 듯한데가 있다.\\n* 콩팔 칠팔 : 갈피를 잡을 수 없어 함부로 지껄이는 모양.","images":[]},{"word":"뜻이 좋은 순 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396035&page=38","sourceText":"@가말다 - 일을 잘 헤아려 처리한다.\\n@끌끌하다 - 마음이 맑고 바르며 깨끗하다.\\n@시나브로 - 모르는 사이에 조금씩 조금씩.\\n@띠앗머리 - 형제 자매 사이에 우애하는 정의.\\n@안다미 - 남이 져야 할 책임을 맡아짐. 화\\n@수분 - 재물이 자꾸 생겨 아무리 써도 줄지 않음을 이르는 말\\n@들거지 - 듬직하고 위엄이 있는 겉모양.\\n@타울거리다 - 뜻한 바를 이루려고 애를 쓰다.\\n@의초 - 동기간의 우애.\\n@오달지다 - 야무지고 실속이 있다.\\n@여낙낙하다 - 성미가 곱고 상냥하다.\\n@아귀차다 - 뜻이 굳고 하는 일이 야무지다.","images":[]},{"word":"코떼다, 아름차다, 다솜, 마음겹다, 나무거울, 가다리, 나풋나풋","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395964&page=38","sourceText":"＃코 떼다 : 무안하도록 핀잔을 맞다.\\n＃아름차다: 힘에 벅차다.\\n#다솜 : 애틋한 사랑.\\n#마음겹다: 마음이 몹시 쓰이다.\\n#나무거울: 겉으로는 그럴 듯 하나 실제로는 아무 소용도 없는 사람이나 물건을 가리키는 말.\\n#가다리 :한 마지기에 얼마씩의 삯을 받고 모낼 논을 갈고 써레질을 해 주는 일.\\n#나풋나풋: 가볍고 날렵하게 움직이는 모양. 또는,잇달아 가볍게 나부끼는 모양. <동의어> 나푼나푼","images":[]},{"word":"직업과 관련된 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395813&page=38","sourceText":"▶ 갖바치 - 가죽신 만드는 것을 업으로 삼던 사람\\n▶ 거간꾼 - 흥정을 붙이는 일을 업으로 삼던 사람\\n▶ 동산바치- 정원의 나무나 꽃 따위를 가꾸고, 순이나 가지를 잘라 예쁘게 손질하는 일을 업으로 삼는 사람.\\n▶ 또드락장이 - 귀금속으로 세공품을 만드는 일을 업으로 삼는 사람\\n▶ 모가비 - ① 사당패나 선소리패를 이끄는 우두머리\\n② 인부나 광대 같은 낮은 패의 우두머리\\n③ 탈놀이에서 가독, 연출 그리고 어","images":[]},{"word":"가납사니, 가래톳, 갈깃머리, 갈무리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395733&page=38","sourceText":"# 가납사니 (이름) 1) 쓸데없는 말을 지껄이기 좋아하는 수다스러운 사람. 2) 말다툼을 잘하는 사람.\\n# 가래톳 (이름) 허벅다리 윗부분의 림프절이 부어 생긴 멍울.\\n# 갈깃머리 (이름) 상투나 낭자, 딴머리 따위와 같이 머리를 묶어 모양을 만들 때 함께 묶이지 않고 아래로 처지는 머리털.\\n# 갈무리 (이름) 1) 물건 따위를 잘 정리하거나 간수함. 2) 일을 처리하여 마무리함.","images":[]},{"word":"섣달, 달구지, 동냥젖","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395699&page=38","sourceText":"◇ 섣달 : 음력으로 한 해의 마지막 달. 음력 십이월. 극월(極月). ○○그믐날 흰떡 맞듯.(속담)\\n◇ 달구지 : 소 한 마리가 끄는 짐수레. ○○○를 타고 가던 옛 시절이 생각난다.\\n◇ 동냥젖 : 남의 젖을 얻어먹는 일, 또는 그 젖. 심청이는 ○○○으로 자랐다.","images":[]},{"word":"갈무리, 이태, 벙거지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395585&page=39","sourceText":"◇ 갈무리 - 물건을 잘 챙기어 간수함. ‘마무리’의 뜻도 있다.\\n◇ 이태 - 두 해. 2년\\n◇ 벙거지 - 지난날, 병졸이 머리에 쓰던 모자. 털로 검고 두껍게 갓처럼 만들었음. ‘모자’의 속된 말이기도 하다.","images":[]},{"word":"길처, 둘하다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395494&page=39","sourceText":"◇ 길처 「명」가는 길의 근처.\\n◇ 둘하다 「형」둔하고 미련하다.","images":[]},{"word":"푸하다, 뜨더귀 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395334&page=39","sourceText":"◇ 푸하다 「형」속이 꽉 차지 아니하고 불룩하게 부풀어 있다.\\n◇ 뜨더귀 「명」조각조각으로 뜯어 내거나 가리가리 찢어 내는 짓. 또는 그 조각.","images":[]},{"word":"더넘스럽다, 스리 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395232&page=39","sourceText":"◇ 더넘스럽다 「형」다루기에 버거운 데가 있다.\\n◇ 스리 「명」음식을 먹다가 볼을 깨물어 생긴 상처.","images":[]},{"word":"서슬, 길래 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395134&page=39","sourceText":"◇ 서슬 「명」쇠붙이로 만든 연장이나 유리 조각 따위의 날카로운 부분.\\n◇ 길래 「부」오래도록 길게.","images":[]},{"word":"굻다, 기스락 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395056&page=39","sourceText":"◇ 굻다 「형」담긴 것이 그릇에 그득 차지 아니하고 조금 비어 있다.\\n◇ 기스락 「명」비탈진 곳의 가장자리.","images":[]},{"word":"아늠, 안차다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394983&page=39","sourceText":"◇ 아늠 「명」볼을 이루고 있는 살.\\n◇ 안차다 「형」겁이 없고 야무지다.","images":[]},{"word":"볼썽, 되통스럽다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394831&page=39","sourceText":"◇ 볼썽 「명」남에게 보이는 체면이나 태도.\\n◇ 되통스럽다 「형」미련하거나 찬찬하지 못하여 일을 잘 저지를 듯하다.","images":[]},{"word":"느껍다, 틈서리 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394791&page=39","sourceText":"◇ 느껍다 「형」어떤 느낌이 마음에 북받쳐서 벅차다.\\n◇ 틈서리 「명」틈이 난 부분의 가장자리.","images":[]},{"word":"발림, 버릊다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394697&page=39","sourceText":"◇ 발림 「명」액체나 가루 따위를 다른 물체의 겉에 묻히거나 입히는 일.\\n◇ 버릊다 「동」벌여서 어수선하게 늘어놓다.","images":[]},{"word":"드러장이다, 모람모람 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394550&page=40","sourceText":"◇ 드러장이다 「동」많은 물건이 한군데에 차곡차곡 쌓이다.\\n◇ 모람모람 「부」이따금씩 한데 몰아서.","images":[]},{"word":"자락, 빼물다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394422&page=40","sourceText":"◇ 자락 「명」넓게 퍼진 안개나 구름, 어둠 따위.\\n◇ 빼물다 「동」혀를 이로 물고 입 밖으로 늘어뜨리다.","images":[]},{"word":"앙세다, 모짝 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394315&page=40","sourceText":"◇ 앙세다 「형」몸은 약하여 보여도 힘이 세고 다부지다.\\n◇ 모짝 「부」한 번에 있는 대로 다 몰아서.","images":[]},{"word":"된비알, 드레지다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394244&page=40","sourceText":"◇ 된비알 「명」몹시 험한 비탈.\\n◇ 드레지다 「형」사람의 됨됨이가 가볍지 않고 점잖아서 무게가 있다.","images":[]},{"word":"삼삼하다, 넌더리 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394125&page=40","sourceText":"◇ 삼삼하다 「형」잊히지 않고 눈앞에 보이는 듯 또렷하다.\\n◇ 넌더리 「명」지긋지긋하게 몹시 싫은 생각.","images":[]},{"word":"바르집다, 보풀, 푼더분하다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394070&page=40","sourceText":"◇ 바르집다 「동」숨겨진 일을 들추어내다.\\n◇ 보풀 「명」종이나 헝겊 따위의 거죽에 부풀어 일어나는 몹시 가는 털.\\n◇ 푼더분하다 「형」여유가 있고 넉넉하다.","images":[]},{"word":"갓밝이, 설레설레, 마닐마닐하다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393968&page=40","sourceText":"◇ 갓밝이 갓밝이「명」날이 막 밝을 무렵.\\n◇ 설레설레 부」가만히 있지 아니하고 자꾸 움직이는 모양.\\n◇ 마닐마닐하다 「형」음식이 씹어 먹기에 알맞도록 부드럽고 말랑말랑하다.","images":[]},{"word":"안침, 밉광스럽다, 맞갖다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393879&page=40","sourceText":"◇ 안침 「명」안쪽으로 쑥 들어간 곳.\\n◇ 밉광스럽다 「형」보기에 매우 밉살스러운 데가 있다.\\n◇ 맞갖다 「형」마음이나 입맛에 꼭 맞다.","images":[]},{"word":"얼김, 도뜨다, 가시눈 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393766&page=40","sourceText":"◇ 얼김 「명」어떤 일이 벌어지는 바람에 자기도 모르게 정신이 얼떨떨한 상태.\\n◇ 도뜨다 「형」말씨나 행동이 정도가 높다.\\n◇ 가시눈 「명」날카롭게 쏘아보는 눈을 비유적으로 이르는 말.","images":[]},{"word":"밑절미, 자처울다, 어지빠르다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393680&page=40","sourceText":"◇ 밑절미 「명」사물의 기초가 되는, 본디부터 있던 부분.\\n◇ 자처울다 「동」닭이 점점 새벽을 재촉하여 울다.\\n◇ 어지빠르다 「형」정도가 넘고 처져서 어느 한쪽에도 맞지 아니하다.","images":[]},{"word":"뼛성, 발밭다, 발, 지더리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393529&page=41","sourceText":"◇ 뼛성 「명」갑자기 발칵 일어나는 짜증.\\n◇ 발밭다 「형」기회를 놓치지 않고 재빠르게 붙잡아 이용하는 소질이 있다.\\n◇ 발 「명」새로 생긴 나쁜 버릇이나 관례.\\n◇ 지더리다 「형」성품이나 행실이 지나치게 더럽고 야비하다.","images":[]},{"word":"자깝스럽다, 자드락, 들때밑, 거탈 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393494&page=41","sourceText":"◇ 자깝스럽다 「형」어린아이가 마치 어른처럼 행동하거나, 젊은 사람이 지나치게 늙은이의 흉내를 내어 깜찍한 데가 있다.\\n◇ 자드락 「명」나지막한 산기슭의 비탈진 땅.\\n◇ 들때밑 「명」세력 있는 집의 오만하고 고약한 하인을 이르는 말.\\n◇ 거탈 명」실상이 아닌, 다만 겉으로 드러난 태도.","images":[]},{"word":"지질하다, 동가리, 철겹다, 말가리 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393311&page=41","sourceText":"◇ 지질하다 「형」보잘것없고 변변하지 못하다.\\n◇ 동가리 「명」단으로 묶은 것을 동으로 쌓아 놓은 무더기.\\n◇ 철겹다 「형」제철에 뒤져 맞지 아니하다.\\n◇ 말가리 「명」말의 갈피와 조리. 또는 말의 줄거리.","images":[]},{"word":"부꾸미, 벋놓다, 겨끔내기, 의뭉하다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393296&page=41","sourceText":"◇부꾸미 「명」찹쌀가루, 밀가루, 수수 가루 따위를 반죽하여 둥글고 넓게 하여 번철에 지진 떡.\\n◇벋놓다 「동」다잡아 기르거나 가르치지 아니하고, 제멋대로 올바른 길에서 벗어나게 내버려\\n두다.\\n◇겨끔내기 「명」서로 번갈아 하기.\\n◇의뭉하다 「형」겉으로 보기에는 어리석어 보이나 속으로는 엉큼하다.","images":[]},{"word":"추렴, 깨단하다, 벌이터, 뜨막하다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393149&page=41","sourceText":"◇추렴 「명」모임이나 놀이 또는 잔치 따위의 비용으로 여럿이 각각 얼마씩의 돈을 내어 거둠.\\n◇깨단하다 「동」오랫동안 생각해 내지 못하던 일 따위를 어떠한 실마리로 말미암아 깨닫거나 분명히 알다.\\n◇벌이터 「명」벌이를 하는 일터.\\n◇뜨막하다 「형」사람들의 왕래나 소식 따위가 자주 있지 않다.","images":[]},{"word":"발, 갑치다, 고부탕이, 빨 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393019&page=41","sourceText":"◇ 발 「명」새로 생긴 나쁜 버릇이나 관례.\\n◇ 갑치다 「동」마구 서둘거나 조르면서 귀찮게 굴다.\\n◇ 고부탕이 「명」피륙 따위의 필을 지을 때에, 꺾이어 겹쳐 넘어간 곳.\\n◇ 빨 「명」일이 되어 가는 형편과 모양.","images":[]},{"word":"시망스럽다, 지더리다, 비거스렁이, 버슷버슷하다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392911&page=41","sourceText":"◇ 시망스럽다 「형」몹시 짓궂은 데가 있다.\\n◇ 지더리다 「형」성품이나 행실이 지나치게 더럽고 야비하다.\\n◇ 비거스렁이 「명」비가 갠 뒤에 바람이 불고 기온이 낮아지는 현상.\\n◇ 버슷버슷하다 「형」여러 사람의 사이가 모두 서로 잘 어울리지 아니하다.","images":[]},{"word":"신둥지다, 엄장, 합죽하다, 들때밑 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392864&page=41","sourceText":"◇ 신둥지다 「형」지나치게 주제넘다.\\n◇ 엄장 「명」풍채가 좋은 큰 덩치.\\n◇ 합죽하다 「형」이가 빠져 입술과 볼이 오므라져 있다.\\n◇ 들때밑 「명」세력 있는 집의 오만하고 고약한 하인을 이르는 말.","images":[]},{"word":"갑치다, 발, 은결들다, 사시랑이 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392727&page=41","sourceText":"◇ 갑치다 「동」마구 서둘거나 조르면서 귀찮게 굴다.\\n◇ 발 「명」새로 생긴 나쁜 버릇이나 관례.\\n◇ 은결들다 「동」원통한 일로 남모르게 속이 상하다.\\n◇ 사시랑이 「명」가늘고 약한 물건이나 사람.","images":[]},{"word":"제비초리, 배냇머리, 시새, 진창 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392638&page=41","sourceText":"◇ 제비초리 뒤퉁수나 앞이마에 뾰족이 내민 머리털\\n◇ 배냇머리 갓난 아이가 난 뒤로 한번도 깎지 않은 머리털\\n◇ 시새 보드랍고 고운 잔모래. =잔모래.\\n◇ 진창 땅이 질어서 질퍽질퍽하게 된 곳. 질퍽질퍽한 진흙.","images":[]},{"word":"단골집, 덮개, 돌팔이, 떠새, 고주망태 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392574&page=42","sourceText":"◇ 단골집 굿을 할때 늘 정해놓고 불러다 쓰는 무당\\n☞ 항상 거래하는 장사집을 이름.\\n◇ 덮개 불교에서 착한 마음을 덮어 가리는 탐욕이나 진심(嗔心)을 이르는 말.\\n◇ 돌팔이 이리저리 돌아다니며 어설픈 기술을 파는 사람, 돌다와 팔다가 결합되다.\\n◇ 떠새 돈이나 세력을 믿고 젠체하며 억지를 쓰는 것.\\n◇ 고주망태 고주는 술을 거르는 틀인데 여기에 망태를 올려 놓으면 술냄새가 베어 망태전체에서 술 냄새가 난다.\\n☞ 술을 너무 많이 마셔 정신을 차리지 못하는 상태.","images":[]},{"word":"개개다, 개차반, 고뿔, 괄괄하다, 늦깍이 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392463&page=42","sourceText":"◇ 개개다 서로 맞 닿아서 해지거나 닳아지다.\\n☞ 성가시게 달라붙어 손해가 되다.\\n☞ 손해를 끼치다.\\n◇ 개차반 개가 먹는 차반, 즉 '똥' 이란 뜻.\\n☞ 언행이 더럽고 막된 사람.\\n◇ 고뿔 고뿔은 코와 불이 합쳐진 말로 감기에 들면 코에 불이 나는 것처럼 더운 김이 나온다 하여 유래.\\n☞ 감기를 일컫는 말.\\n◇ 괄괄하다 이불호청이나 옷에 풀을 먹일때 풀기가 너무 세서 빳빳하게 된 상태.\\n☞ 풀기가 센 것 같이 급하고 억센 성품이나 목소리가 크고 거센 것을 이름.\\n◇ 늦깍이 늦게 머리깍은 중\\n☞ 세상 이치를 남보다 늦게 깨달은 사람.","images":[]},{"word":"고명딸, 나리, 남세스럽다, 넋두리, 뇌까리다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392370&page=42","sourceText":"◇ 고명딸 고명은 음식의 모양과 맛을 더하기 위하여 음식위에 뿌리는 양념.\\n☞ 아들이 많은 집의 외딸을 의미.\\n◇ 나리 옛날 왕자를 높여 부르던 말이었는데 시간이 흘러 정3품 이하의 당하관을 높여 부르는 말이 되었다.\\n☞ 일정한 지위에 있는 사람을 부르기도 하고 때로는 지위 높은 사람을 비아냥거리는 뜻으로 쓰이기도 한다.\\n◇ 남세스럽다 남에게 비웃음과 조롱거리가 될 만하다는 남우세스럽다가 준 말.\\n☞ 남의 비웃음을 받을만하다는 의미.\\n◇ 넋두리 본래 무당이 죽은 이의 넋을 대신하여 하는 말.\\n☞ 원통한 일이나 억울한 일, 또는 불만이 있을 때, 두덜거리며 길게 늘어 놓는 말.\\n☞ 푸념\\n◇ 뇌까리다 뒤풀이 말한다는 의미를 가진 '뇌다' 에 접미사 '가리' 가 붙어서 된 말.\\n☞ 아무렇게나 마구 지껄이는 것.","images":[]},{"word":"가닥, 검쓰다, 고불치다, 고지, 나달 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392278&page=42","sourceText":"◇ 가닥 하나로 묶이어 있거나 하나에서 갈려 나온 하나하나의 올이나 줄기\\n◇ 검쓰다 비위에 거슬릴 만큼 몹시 거세고 쓰다 ; 일 따위가 마음에 들지 아니하여 언짢고 씁쓰레하다\\n◇ 고불치다 꺽인 자리가 나게 접다\\n◇ 고지 호박이나 가지 따위를 납작하게 썰거나 길게 오려서 말린 것\\n◇ 나달 날과 달을 이르는 말 ; 세월","images":[]},{"word":"마누라, 무꾸리, 무텅이, 마디다, 망나니 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392149&page=42","sourceText":"◇ 마누라 조선시대에 이 말은 '대비 마노라' 와 같이 쓰이던 극존칭어였다. ; 신분제도가 무너지면서 중년이 넘은 여자를 속되게 이르는 변화. ; 아내를 허물없이 부르는 말.\\n◇ 무꾸리 무당이나 판수에게 앞날의 길흉을 알아보는 일. ; 점치는 일.\\n◇ 무텅이 거친 땅에 논밭을 일구어서 곡식을 심는 일.\\n◇ 마디다 닳거나 없어지는 동안이 오래다.\\n◇ 망나니 조선시대 사형수의 목을 베는 사형 집행인. ; 언행에 있어서 몹시 막되먹은 사람.","images":[]},{"word":"감또개, 울력, 숲정이, 엄전하다, 푸네기 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392013&page=42","sourceText":"◇ 감또개 꽃과 함께 떨어진 어린 감\\n◇ 울력 여러 사람이 힘을 합해서 하는 일\\n◇ 숲정이 마을 근처에 있는 수풀\\n◇ 엄전하다 하는 짓이나 생긴 모양이 정숙하고 점잖다\\n◇ 푸네기 가까운 제 살붙이","images":[]},{"word":"매시근하다, 드팀새, 설레발치다, 본치 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391964&page=42","sourceText":"◇ 매시근하다 「형」기운이 없고 나른하다.\\n◇ 드팀새 「명」틈이 생긴 기미나 정도.\\n◇ 설레발치다 「동」몹시 서두르며 부산하게 굴다.\\n◇ 본치 「명」남의 눈에 띄는 태도나 겉모양.","images":[]},{"word":"갓밝이, 맞갖다,드레, 뒤퉁스럽다, 가시눈 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391886&page=42","sourceText":"◇ 갓밝이 「명」날이 막 밝을 무렵.\\n◇ 맞갖다 「형」마음이나 입맛에 꼭 맞다.\\n◇ 드레 「명」임시로 남의 집 행랑에 붙어 지내며 그 집의 일을 도와줌. 또는 그런 사람.\\n◇ 뒤퉁스럽다 「형」미련하거나 찬찬하지 못하여 일을 잘 저지를 듯하다.\\n◇ 가시눈 「명」날카롭게 쏘아보는 눈을 비유적으로 이르는 말.","images":[]},{"word":"마닐마닐하다, 너나들이, 든손, 설레설레, 곰비임비","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391780&page=42","sourceText":"◇ 마닐마닐하다 「형」음식이 씹어 먹기에 알맞도록 부드럽고 말랑말랑하다.\\n◇ 너나들이 「명」서로 너니 나니 하고 부르며 허물 없이 말이 건넴. 또는 그런 사이.\\n◇ 든손 「명」①(‘든손에’ 꼴로 쓰여) 일을 시작한 김. ②(주로 ‘든손으로’ 꼴로 쓰여) 서슴지 않고 얼른 하는 동작.\\n◇ 설레설레 「부」가만히 있지 아니하고 자꾸 움직이는 모양.\\n◇ 곰비임비 「부」물건이 거듭 쌓이거나 일이 계속 일어남을 나타내는 말.","images":[]},{"word":"시울, 오줄없다, 타박, 내셍기다, 불땀 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391678&page=42","sourceText":"◇시울 「명」약간 굽거나 휜 부분의 가장자리.\\n◇ 오줄없다 「형」하는 일이나 태도가 야무지거나 칠칠하지 못하다.\\n◇ 타박 「명」허물이나 결함을 나무라거나 핀잔함.\\n◇ 내셍기다 「동」내리 이 말 저 말 자꾸 주워대다.","images":[]},{"word":"맛문하다, 보지락, 밉둥, 꼲다, 툭지다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391591&page=43","sourceText":"◇ 맛문하다 「형」몹시 지친 상태에 있다.\\n◇ 보지락 「명」비가 온 양을 헤아리는 단위. 보습이 들어갈 만큼 빗물이 땅에 스며든 정도를 이른다.\\n◇ 밉둥 「명」어린아이가 하는 미운 짓.\\n◇ 꼲다 「동」잘잘못을 따져서 평가하다.\\n◇ 툭지다 「동」굵어지거나 두꺼워지다.","images":[]},{"word":"비라리, 어금지금하다, 얄, 둥개다, 보시기 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391416&page=43","sourceText":"◇ 비라리 「명」구구한 말을 하여 가며 남에게 무엇을 청하는 일.\\n◇ 어금지금하다 「형」서로 엇비슷하여 정도나 수준에 큰 차이가 없다.\\n◇ 얄 「명」야살스럽게 구는 짓.\\n◇ 둥개다 「동」일을 감당하지 못하고 쩔쩔매다.\\n◇ 보시기 「명」김치나 깍두기 따위를 담는 반찬 그릇의 하나. 모양은 사발 같으나 높이가 낮고 크기가 작다.","images":[]},{"word":"살잡다, 막사리, 시퉁스럽다, 등걸, 엄발나다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391397&page=43","sourceText":"◇ 살잡다 「동」쓰러져 가는 가세를 다시 일으켜 세우다.\\n◇ 막사리 「명」얼음이 얼기 직전의 밀물.\\n◇ 시퉁스럽다 「형」보기에 하는 짓이 주제넘고 건방진 데가 있다.\\n◇ 등걸 「명」줄기를 잘라 낸 나무의 밑동.\\n◇ 엄발나다 「동」행동이나 태도를 남들과 다르게 제 마음대로 빗나가게 하다.","images":[]},{"word":"어겹, 어기차다, 사부주, 샘바르다, 사로잠 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391244&page=43","sourceText":"◇ 어겹 「명」한데 뒤범벅이 됨.\\n◇ 어기차다 「형」한번 마음먹은 뜻을 굽히지 아니하고, 성질이 매우 굳세다.\\n◇ 사부주 「명」규격을 갖추는 데 필요한 여러 조건.\\n◇ 샘바르다 「형」샘이 심하다.\\n◇ 사로잠 「명」염려가 되어 마음을 놓지 못하고 조바심하며 자는 잠.","images":[]},{"word":"까불리다, 거스러미, 느럭느럭, 구메구메, 맥쩍다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391176&page=43","sourceText":"◇ 까불리다 「동」재물 따위를 함부로 써 버리다.\\n◇ 거스러미 「명」손발톱 뒤의 살 껍질이 가시처럼 얇게 터져 일어난 것.\\n◇ 느럭느럭 「부」말이나 행동이 퍽 느린 모양.\\n◇ 구메구메 「부」남모르게 틈틈이.\\n◇ 맥쩍다 「형」심심하고 재미가 없다.","images":[]},{"word":"나이배기, 보암보암, 가리사니, 발맘발맘, 능갈","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391045&page=43","sourceText":"◇ 나이배기 「명」겉보기보다 나이가 많은 사람을 낮잡아 이르는 말.\\n◇ 보암보암 「명」이모저모 살펴보아 짐작할 수 있는 겉모양.\\n◇ 가리사니 「명」사물을 분간하여 판단할 수 있는 실마리.\\n◇ 발맘발맘 「부」한 발씩 또는 한 걸음씩 길이나 거리를 재는 모양.\\n◇ 능갈 「명」얄밉도록 몹시 능청을 떪.","images":[]},{"word":"어슷비슷, 는개, 어험스럽다, 인, 갈아드리다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=390914&page=43","sourceText":"◇ 어슷비슷 「부」큰 차이가 없이 서로 비슷비슷한 모양.\\n◇ 는개 「명」안개보다는 조금 굵고 이슬비보다는 가는 비.\\n◇ 어험스럽다 「형」짐짓 위엄이 있어 보이는 듯하다.\\n◇ 인 「명」여러 번 되풀이하여 몸에 깊이 밴 버릇.\\n◇ 갈아드리다 「동」전부터 있던 사람이나 물건을 대신하여 다른 사람이나 물건을 새로 들이다.","images":[]},{"word":"자리맡, 허발, 팽하다, 반지랍다, 새때 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=390887&page=43","sourceText":"◇ 자리맡 「명」잠자리의 곁.\\n◇ 허발 「명」몹시 굶주려 있거나 궁하여 체면 없이 함부로 먹거나 덤빔.\\n◇ 팽하다 「형」지나치거나 부족하지 아니하고 꼭 알맞다.\\n◇ 반지랍다 「형」기름기나 물기 따위가 묻어서 윤이 나고 매끄럽다.\\n◇ 새때 「명」끼니와 끼니의 중간 되는 때.","images":[]},{"word":"어지빠르다, 엉너리, 더새다, 영금, 허수롭다 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=390760&page=43","sourceText":"◇ 어지빠르다 「형」정도가 넘고 처져서 어느 한쪽에도 맞지 아니하다.\\n◇ 엉너리 「명」남의 환심을 사기 위하여 어벌쩡하게 서두르는 짓.\\n◇ 더새다 「동」길을 가다가 날이 저물어 정한 곳 없이 들어가 밤을 지내다.\\n◇ 영금 「명」따끔하게 당하는 곤욕.\\n◇ 허수롭다 「형」짜임새나 단정함이 없이 느슨한 데가 있다.","images":[]},{"word":"진저리, 바지런하다, 밑불, 윽살리다, 악다구니 -","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=390672&page=43","sourceText":"◇ 진저리 「명」차가운 것이 몸에 닿거나 무서움을 느낄 때에, 또는 오줌을 눈 뒤에 으스스 떠는 몸짓.\\n◇ 바지런하다 「형」놀지 아니하고 하는 일에 꾸준하다.\\n◇ 밑불 「명」불을 피울 때에 불씨가 되는, 본래 살아 있는 불.\\n◇ 윽살리다 「동」남을 마구 놀려 주거나 집적거리다.\\n◇ 악다구니 「명」기를 써서 다투며 욕설을 하는 짓.","images":[]}]`),sm={totalPosts:Ad,entries:Md},Dd=[["가람","강을 뜻하는 우리말.","가람을 따라 졸졸 물이 흘러요.","🌊","자연"],["가온","가운데를 뜻하는 우리말.","친구들 가온에 서서 사진을 찍었어요.","🎯","생활"],["가을걷이","가을에 익은 곡식을 거두는 일.","농부 아저씨가 가을걷이를 해요.","🌾","생활"],["갈무리","물건을 잘 정리하거나 일을 마무리하는 것.","놀이가 끝나면 장난감을 갈무리해요.","🧺","생활"],["감꽃","감나무에 피는 연한 노란색 꽃.","감나무 아래에 작은 감꽃이 떨어졌어요.","🌼","자연"],["개구쟁이","장난이 심하고 짓궂은 아이.","동생은 장난을 좋아하는 개구쟁이예요.","🐸","사람"],["개울","골짜기나 들에 흐르는 작은 물줄기.","맑은 개울에 작은 물고기가 살아요.","🏞️","자연"],["곁","누군가의 옆이나 가까운 곳.","친구 곁에 앉아 책을 읽어요.","🐥","생활"],["고갯마루","고개에서 가장 높은 곳.","고갯마루에 올라 마을을 내려다보았어요.","⛰️","자연"],["고드름","물이 얼어 처마 끝에 길게 매달린 얼음.","겨울 처마에 고드름이 주렁주렁 열렸어요.","🧊","자연"],["고즈넉하다","조용하고 아늑하다.","숲속의 작은 집이 고즈넉해요.","🏡","마음"],["구름","하늘에 떠 있는 작은 물방울이나 얼음 알갱이의 모임.","하늘에 솜사탕 같은 구름이 떠요.","☁️","자연"],["그루잠","깨었다가 다시 드는 잠.","아침에 눈을 떴다가 그루잠이 들었어요.","😴","생활"],["그루터기","나무를 베고 남은 아랫부분.","다람쥐가 그루터기에 앉았어요.","🪵","자연"],["그늘","빛이 가려져 어두운 곳.","나무 그늘에서 시원하게 쉬어요.","🌳","자연"],["기쁨","마음이 즐겁고 흐뭇한 느낌.","친구를 만나 기쁨이 가득해요.","✨","마음"],["나들이","집을 떠나 가까운 곳에 잠깐 다녀오는 일.","가족과 공원으로 나들이를 가요.","🧢","생활"],["나래","날개를 뜻하는 말.","새가 나래를 활짝 펴요.","🕊️","자연"],["노을","해가 뜨거나 질 때 하늘이 붉게 보이는 모습.","저녁 하늘에 노을이 물들었어요.","🌅","자연"],["누리","우리가 살아가는 세상.","아름다운 누리를 함께 가꾸어요.","🌏","생활"],["다솜","사랑을 뜻하는
