 */const rm=xn("X",[["path",{d:"M18 6 6 18",key:"1bl5f8"}],["path",{d:"m6 6 12 12",key:"d8bk6v"}]]),Od=JSON.parse(`[{"word":"간들거리다","meaning":"바람이 부드럽게 분다\\n간드러지게 움직이다 물체가\\n이리저리 자꾸 흔들리다\\n예) 가을바람이 간드러지게 부니까 꽃들도 간들거린다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1925297","sourceTitle":"간들거리다"},{"word":"마름질","meaning":"옷이나 종이 따위를 치수에 맞게 재거나 자르는 일","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1916769","sourceTitle":"마름질"},{"word":"별쭝나다","meaning":"말이나 하는 짓이 아주 별스럽다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1913881","sourceTitle":"별쭝나다"},{"word":"한통속","meaning":"마음이 서로 통하여 모이는 한 동아리라는 뜻.\\n예) 그 사람들 모두 한통속이니까 속지 마","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1910828","sourceTitle":"한통속"},{"word":"복닥거리다","meaning":"복잡한 곳에서 여러 사람이 떠들다\\n예) 장은 명절 준비를 하러 온 사람들로 복닥거렸다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1886560","sourceTitle":"복닥거리다"},{"word":"티격태격","meaning":"서로 의견이 맞지 않아 시비를 따지는 모양\\n예) 신혼부부 같은데 벌써 티격태격하면 쓰나","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1879686","sourceTitle":"티격태격"},{"word":"허룩하다","meaning":"많이 없어지다. 줄어들다\\n예) 모든 게 그대로 있는데 왜 가게가 허룩해 보일까?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1876049","sourceTitle":"허룩하다"},{"word":"터줏대감","meaning":"일정한 마을이나 직장 등에서 가장 오래된 사람을 가리키는 말\\n예) 이 동네엔 옹기장이 터줏대감이 둘이나 있다네","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1867486","sourceTitle":"터줏대감"},{"word":"윤슬","meaning":"햇빛이나 달빛에 비치어 반짝이는 잔물결\\n예) 저길 봐, 저 바다의 윤슬이 얼마나 아름다운지.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1854482","sourceTitle":"윤슬"},{"word":"출출하다","meaning":"배가 고픈 느낌이 있다 또는 약간 시장하다는 뜻\\n예) 배는 안고프지만 조금 출출하네요","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1851040","sourceTitle":"출출하다"},{"word":"앵두장수","meaning":"잘못을 저지르고 자취를 감춘 사람을 뜻하는 말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1846514&page=2","sourceTitle":"앵두장수"},{"word":"허울좋다","meaning":"겉모습만 좋다 또는 내용과 달리 보기만 좋다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1842143&page=2","sourceTitle":"허울좋다"},{"word":"피장파장","meaning":"서로 낫고 못함이 없는 비슷한 경우나 처지를 이르는 말\\n예) 피장파장인 주제에 나를 놀려!","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1838489&page=2","sourceTitle":"피장파장"},{"word":"아기똥하다","meaning":"말이나 행동 따위가 매우 거만하고 앙큼한 데가 있다는 말\\n또는 조금 틈이 나 있다는 뜻\\n예) 하는 짓이 아주 아기똥한 게 내가 알던 그 착한 효자가 아니라구!","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1835211&page=2","sourceTitle":"아기똥하다"},{"word":"꾀꾀로","meaning":"; 가끔 틈을 타서 살그머니\\n예) 다음 날부터 농부는 꾀꾀로 닭장을 들여다보며 황금알을 낳기가 바쁘게 집어 내곤 했습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1828357&page=2","sourceTitle":"꾀꾀로"},{"word":"허드렛일","meaning":"중요하지 않고 허름한 일\\n(허드레- 그다지 중요하지 않고 허름하여 함부로 쓸 수 있는 허름한 물건 또는 일)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1823562&page=2","sourceTitle":"허드렛일"},{"word":"콩켸팥켸","meaning":"사물이 뒤섞여 뒤죽박죽이 된 것을 이르는 말.\\n예) 시루떡이 콩켸팥켸가 돼 버렸다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1806178&page=2","sourceTitle":"콩켸팥켸"},{"word":"새수나다","meaning":"갑자기 좋은 수가 생기다\\n뜻밖에 재물이 생기다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1797974&page=2","sourceTitle":"새수나다"},{"word":"들무새","meaning":"뒷바라지에 쓰는 물건이나 어떤 일에 쓰는 재료.\\n예) 책상 밑에 받칠 들무새가 좀 있어야겠다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1776855&page=2","sourceTitle":"들무새"},{"word":"자투리","meaning":"자로 재어 팔거나 재단하다가 남은 천의 조각\\n어떤 기중에 미치지 못할 정도로 작거나 적은 조각\\n예) 여러 가지 자투리 천으로 조각보를 만들다\\n자투리 시간을 활용하여 취미 생활을 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1763557&page=2","sourceTitle":"자투리"},{"word":"도닐다","meaning":"가장자리를 빙빙 돌며 거닐다. '돌다'라는 말과 '가다'라는 뜻의 옛말 '니다'가 합쳐서 생겨난 말\\n예) 민주 누나는 연못가를 도닐고 계신 할아버지를 모시러 나갔습니다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1758870&page=3","sourceTitle":"도닐다"},{"word":"꾸미개","meaning":"무엇을 곱게 꾸미는 데 쓰는 물건.\\n예) 모두 같이 '희망 사항' 알림판 꾸미개를 만들어 보자!","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1753293&page=3","sourceTitle":"꾸미개"},{"word":"딸따니","meaning":"어린 딸을 귀엽게 부는 말.\\n예) 우리 딸따니가 얼마나 씩씩하고 부지런한데!","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1748696&page=3","sourceTitle":"딸따니"},{"word":"사슬돈","meaning":"꿰거나 싸지 않은 흩어진 쇠붙이 돈이란 뜻으로, ‘잔돈’을 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1746765&page=3","sourceTitle":"사슬돈"},{"word":"더부살이","meaning":"남의 집에서 먹고 자면서 일을 해주고 삯을 받는 일. 또는 그런 사람을 가리키는 말.\\n예) 삼촌 댁에서 더부살이로 지내는 것도 한두 달이지 더 이상은 못 있겠어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1745059&page=3","sourceTitle":"더부살이"},{"word":"새침데기","meaning":"겉으로만 얌전한 체하는 사람\\n예) 새침데기 아가씨가 오늘은 웬일로 알은체를 했다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1738264&page=3","sourceTitle":"새침데기"},{"word":"가온누리","meaning":"어떠한 일이 있어도 세상의 중심이 되어 라는 뜻","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1736095&page=3","sourceTitle":"가온누리"},{"word":"볏","meaning":"닭이나 꿩 같은 새 종류의 머리에 세로로 붙어 있는 톱니 모양의 붉은 살 조각.\\n예) 닭 벼슬 →닭 볏","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1733414&page=3","sourceTitle":"볏"},{"word":"자밤","meaning":"양념뿐만 아니라 나물 같은 것을 손가락 끝으로 집을 만한 분량을 셀 때 쓸 수 있는 단위.\\n예) 소금 한 자밤","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1681035&page=3","sourceTitle":"자밤"},{"word":"이파리","meaning":"나무나 풀의 살아 있는 날 잎을 가리키는 말.\\n예) 하얀 꽃 이파리 눈송이처럼 날리네","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1669252&page=3","sourceTitle":"이파리"},{"word":"오사리","meaning":"이른 철의 사리 때 잡은 해산물을 말하는데, 이 외에도 이른 철에 농작물을 거두는 일이나 그 농작물을 가리키는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1659429&page=4","sourceTitle":"오사리"},{"word":"에구머니","meaning":"어이구머니의 준말. 깜짝 놀랄 때라든가 힘이 들 때 쓰는 표현","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1646928&page=4","sourceTitle":"에구머니"},{"word":"애오라지","meaning":"겨우 -오로지\\n예) 주머니엔 애오라지 동전 두 닢뿐이다.\\n애오라지 자식을 위하는 부모의 마음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1641464&page=4","sourceTitle":"애오라지"},{"word":"이드거니","meaning":"충분한 분량으로 만족스러운 모양.\\n예) 바쁜 일정 때문에 부족했던 저녁 식사를 모처럼 이드거니 먹었다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1637250&page=4","sourceTitle":"이드거니"},{"word":"지그시","meaning":"조용히 참고 견디는 모양.\\n예) 눈을 지그시 감다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1634663&page=4","sourceTitle":"지그시"},{"word":"어물쩍","meaning":"말이나 행동을 일부러 분명하게 하지 않고 적당히 살짝 넘기는 모양을 말합니다\\n예) 이번에도 어물쩍 넘어가려고 하지 마라.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1631844&page=4","sourceTitle":"어물쩍"},{"word":"송골송골","meaning":"땀이나 소름 또는 물방울 같은 것이 살갗이나 표면에 잘게 많이 돋아나 있는 모양\\n예) 코에 땀이 송골송골 맺힌 걸 보니 맵기는 꽤 매운 모양이구나","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1629013&page=4","sourceTitle":"송골송골"},{"word":"생채기","meaning":"손톱 같은 것으로 할퀴어지거나 긁혀서 생긴 작은 상처\\n(상채기→ 생채기)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1622098&page=4","sourceTitle":"생채기"},{"word":"새치름하다","meaning":"새치름하다.\\n- 조금 쌀쌀맞게 시치미를 떼는 태도가 있다\\n예) 아르바이트 학생은 표정이 새치름해서 말 걸기가 어렵다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1616518&page=4","sourceTitle":"새치름하다"},{"word":"사달","meaning":"사고나 탈\\n예) 일이 꺼림칙하게 되어 가더니만 결국 사달이 났다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1610613&page=4","sourceTitle":"사달"},{"word":"삐치다","meaning":"화가 나서 토라진다고 할 때 쓰는 표현\\n예) 수진이 하고 얘기다가 삐졌대","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1542087&page=5","sourceTitle":"삐치다"},{"word":"뭉그적거리다","meaning":"나아가지 못하고 제자리에서 조금 큰 동작으로 자꾸 게으르게 행동하는 뜻\\n예) 불편한 앉음새를 고치려고 종술은 축축한 엉덩이를 한쪽으로 뭉그적거렸다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1537696&page=5","sourceTitle":"뭉그적거리다"},{"word":"데면데면하다","meaning":"어색하거나 서먹서먹하고 또는 계면쩍게 느끼는 그런 경우를 표현할 때 쓰임","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1514813&page=5","sourceTitle":"데면데면하다"},{"word":"덤터기","meaning":"남에게 넘겨씌우거나 남에게서 넘겨받은 허물이나 걱정거리.\\n예) 덤터기를 씌우지고 않고, 덤터기를 쓰지도 않는, 서로가 서로를 신뢰할 수 있는 그런 사회가 되었으면 좋겠습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1502376&page=5","sourceTitle":"덤터기"},{"word":"넝쿨","meaning":"벽을 타고 올라가는 식물을 가리켜 말할 때.\\n예) 찔레 넝쿨","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1497833&page=5","sourceTitle":"넝쿨"},{"word":"끄물끄물","meaning":"날씨가 활짝 개지 않고 자꾸 흐려진다거나 불빛 같은 것이 밝게 비치지 않고 자꾸 침침해지는 것.\\n예) 하늘이 갑자기 끄물끄물 흐려진다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1494584&page=5","sourceTitle":"끄물끄물"},{"word":"거추장스럽다","meaning":"물건 같은 것이 크거나 무겁거나 해서 다루기가 거북하고 주체스럽다.\\n예) 옷이 두꺼워서 움직이기가 거추장스럽다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1489599&page=5","sourceTitle":"거추장스럽다"},{"word":"거방지다","meaning":"매우 많아서 넉넉하다.\\n예) 일도 잘 끝나고 결과도 기대 이상으로 나왔으니 오늘 다 같이 거방지게 한번 놀아 볼까?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1485431&page=5","sourceTitle":"거방지다"},{"word":"손시늉","meaning":"손으로 어떤 모양이나 움직임을 나타내는 모양.\\n예) 외국 사람이 길을 물어 손시늉을 해 가며 설명했다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1460967&page=5","sourceTitle":"손시늉"},{"word":"손부채","meaning":"손바닥을 펴서 부채 삼아 부치는 일.\\n예) 남자는 더운 듯 손부채를 부쳐 가며 땀을 닦았다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1450154&page=5","sourceTitle":"손부채"},{"word":"손바로","meaning":"손이 닿을 만한 가까운 데.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1447681&page=6","sourceTitle":"손바로"},{"word":"다발","meaning":"꽃이나 푸성귀 따위의 묶음 단위.\\n예)그는 가방에서 돈을 다발로 꺼냈다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1445023&page=6","sourceTitle":"다발"},{"word":"눈길","meaning":"눈이 가는 곳. 또는 눈으로 보는 방향.\\n예) 눈길은 찐빵 접시에 가 있었습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1377810&page=6","sourceTitle":"눈길"},{"word":"손바람","meaning":"일을 치러 내는 솜씨나 힘\\n예) 하루 종일 손바람이 나게 뛴 보람이 있군.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1371669&page=6","sourceTitle":"손바람"},{"word":"말다짐","meaning":"말로 굳게 다짐하는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1357290&page=6","sourceTitle":"말다짐"},{"word":"싸개통","meaning":"여러 사람이 둘러싸고 다투면 승강이를 하는 상황\\n예) 옥신각신 싸개통이 되었습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1348257&page=6","sourceTitle":"싸개통"},{"word":"옥신각신","meaning":"서로 옳다 그르다 하며 다툼. 또는 그런 행위.\\n예)상인들이 물건값을 흥정하느라 옥신각신 떠들고 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1342630&page=6","sourceTitle":"옥신각신"},{"word":"퉁바리","meaning":"퉁명스러운 핀잔..\\n예) 진수는 괜히 나서는 민수가 얄미워 퉁바리를 주었다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1330318&page=6","sourceTitle":"퉁바리"},{"word":"익살꾼","meaning":"남을 웃기는 우스운 말이나 행동을 아주 잘 하는 사람.\\n익살은 남을 웃기려고 일부러 하는 말이나 몸짓.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1310863&page=6","sourceTitle":"익살꾼"},{"word":"벅벅이","meaning":"그러하리라고 미루어 헤아려 보건대 틀림없이\\n예) 무엇인가 벅벅이 트집을 잡을 겁니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1220794&page=6","sourceTitle":"벅벅이"},{"word":"모종비","meaning":"모종하기에 알맞은 때에 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1178868&page=7","sourceTitle":"모종비"},{"word":"멧부리","meaning":"산등성이나 산봉우리의 가장 높은 꼭대기.\\n예) 저 산의 멧부리가 높다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1173931&page=7","sourceTitle":"멧부리"},{"word":"구순하다","meaning":"서로 사귀거나 지내는 데 사이가 좋아 화목하다.\\n예) 형제끼리 구순하게 지냈습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1164942&page=7","sourceTitle":"구순하다"},{"word":"우두망찰","meaning":"정신이 얼떨떨하여 어찌할 바를 모르다.\\n예) 우두망찰하여 슬피 울기만 하였습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1159628&page=7","sourceTitle":"우두망찰"},{"word":"귀잠","meaning":"아주 깊이 든 잠\\n예) 모닥불 옆에서 귀잠이 들었습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1152350&page=7","sourceTitle":"귀잠"},{"word":"번죽거리다","meaning":"얼굴이 번번하게 생긴 사림이 매우 얄밉게 이죽이죽하면서 느물거리는 모양.\\n예) 난 번죽거리는 성격의 남자는 딱 질색이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1135654&page=7","sourceTitle":"번죽거리다"},{"word":"씨양이질","meaning":"한창 바쁠 떄 쓸데없는 일로 남을 귀찮게 하는 짓.\\n예) 바쁜 사람 붙들고 씨양이질 그만 하고 어서 가보시오.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1128970&page=7","sourceTitle":"씨양이질"},{"word":"시서늘하다","meaning":"음식 따위가 식어서 매우 차다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1121091&page=7","sourceTitle":"시서늘하다"},{"word":"터알","meaning":"집의 울 안에 있는 작은 밭\\n예) 집에서 터알을 가꾸며 지내는 노인이 되었습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1116053&page=7","sourceTitle":"터알"},{"word":"다직하다","meaning":"기껏 한다고 하면, 기껏 많이 잡아서, 기껏 많다고 해야\\n예) 다직해야 집 앞의 넓은 마당을 한 바퀴 돌 뿐이었습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1091272&page=7","sourceTitle":"다직하다"},{"word":"꽃자리","meaning":"나무의 꽃이 떨어진 자국\\n예) 울긋불긋 꽃자리가 아름답다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1001519&page=8","sourceTitle":"꽃자리"},{"word":"꽃맺이","meaning":"꽃이 진 뒤에 바로 맺히는 열매","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=920384&page=8","sourceTitle":"꽃맺이"},{"word":"길마중","meaning":"올 사람을 기다리기 위하여 길에 나가 있는 일\\n예)장에 간 엄마 길마중을 나갔다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=887543&page=8","sourceTitle":"길마중"},{"word":"땅고름","meaning":"땅바닥을 높낮이가 없이 바르고 판판하게 고르는 일.\\n예) 땅고름을 하고 일을 시작했습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=880226&page=8","sourceTitle":"땅고름"},{"word":"감숭감숭","meaning":"잔털 따위가 드물게 나서 가무스름한 모양\\n예) 감숭감숭 난 수염이 제법 턱을 덮었다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=874329&page=8","sourceTitle":"감숭감숭"},{"word":"가물가물","meaning":"작고 약한 불빛 따위가 사라질 듯 말 듯 움직이는 모양\\n조금 멀리 있는 물체가 보일 듯 말 듯 희미하게 움직이는 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=867740&page=8","sourceTitle":"가물가물"},{"word":"가랑가랑","meaning":"액체가 많이 담기거나 괴어 가장자리까지 거의 찰 듯한 모양. 눈에 눈물이 넘칠 듯이 가득 괸 모양.\\n예) 소나기가 지나가자 마당에 널린 화분마다 빗물이 가랑가랑 고였다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=860131&page=8","sourceTitle":"가랑가랑"},{"word":"주적거리다","meaning":"주책없이 잘난 체하며 자꾸 떠들다 - 처음 걸음을 걷기 시작하는 어린아이가 자꾸 비틀거리며 귀엽게 걷다\\n- 자꾸 느리게 어정어정 걷다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=847410&page=8","sourceTitle":"주적거리다"},{"word":"버르적거리다","meaning":"고통스러운 일이나 어려운 고비에서 벗어나려고 팔다리를 내저으며 몸을 자꾸 움직이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=837317&page=8","sourceTitle":"버르적거리다"},{"word":"구쁘다","meaning":"뱃속이 허전하여 자꾸 먹고 싶다.\\n예) 입 안에 군침이 돌며 뱃속이 구뻣습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=829095&page=8","sourceTitle":"구쁘다"},{"word":"시쁜","meaning":"마음이 차지 아니하여 시들하다\\n예)승복이는 시쁘둥하게 대답했다 (시쁘둥하다-마음에 차지 아니하여 아주 시들한 기색이 있다)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=825022&page=9","sourceTitle":"시쁜"},{"word":"조잔부리","meaning":"점잖지 않게 때를 가리지 않고 군음식을 자꾸 먹는 모양","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=810368&page=9","sourceTitle":"조잔부리"},{"word":"자드락길","meaning":"나지막한 산기슭의 비탈진 땅에 난 좁은 길","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=798349&page=9","sourceTitle":"자드락길"},{"word":"밥주머니","meaning":"밥을 담는 주머니 -아무 일도 하지 않고 밥이나 축내는 쓸모없는 사람을 낮잡아 이르는 말\\n-위를 속되게 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=792210&page=9","sourceTitle":"밥주머니"},{"word":"덜렁쇠","meaning":"침착하지 못하고 몹시 덤벙거리는 사람(덜렁꾼.덜렁이)\\n예) 영민이는 겉으론 덜렁쇠같이 보이지만, 실제론 꼼꼼하고 치밀하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=787357&page=9","sourceTitle":"덜렁쇠"},{"word":"굴퉁이","meaning":"겉모양은 그럴듯하나 속은 보잘것 없는 물건이나 사람\\n:씨가 여물지 않은 늙은 호박\\n예)이것은 아무짝에도 쓸모없는 굴퉁이이다.\\n길가에서 굴퉁이 하나를 따고 저렇게 좋아한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=780786&page=9","sourceTitle":"굴퉁이"},{"word":"마당발","meaning":"볼이 넓고 바닥이 평평하게 생긴 발\\n: 인간관계가 넓어서 폭넓게 활동하는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=773810&page=9","sourceTitle":"마당발"},{"word":"호르르 호르르","meaning":"작은 새 따위가 날개를 가볍게 치며 날아가는 소리. 또는 그 모양\\n- 얇은 종이나 바싹 마른 검불 따위가 타오르는 소리. 또는 그 모양","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=765767&page=9","sourceTitle":"호르르 호르르"},{"word":"살캉살캉","meaning":"설익은 곡식이나 열매 따위가 자꾸 가볍게 씹히는 소리, 또는 그 느낌\\n살강살강보는 거센 느낌\\n예)나는 물컹물컹하는 무른 고구마보다 살캉살캉하게 씹히는 것을 더 좋아한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=758516&page=9","sourceTitle":"살캉살캉"},{"word":"쿵더쿵","meaning":"방아확에 공이를 잇달아 내리칠 때 나는 소리, 또는 그 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=744784&page=9","sourceTitle":"쿵더쿵"},{"word":"가루다","meaning":"자리를 함께 나란히 하다. 맞서 견주다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=734834&page=10","sourceTitle":"가루다"},{"word":"벼룻길","meaning":"아래가 강가나 바닷가로 통한 벼랑길\\n예) 아름다운 강을 끼고 있는 벼룻길을 가벼운 마음으로 걷다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=728737&page=10","sourceTitle":"벼룻길"},{"word":"곱소리","meaning":"코끼리의 꼬리털 가늘고 부드러우며 망건. 탕건 따위를 만드는 데 쓴다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=716180&page=10","sourceTitle":"곱소리"},{"word":"두렛일","meaning":"여러 사람이 두레를 짜서 하는 농사일.\\n두레는, 농사꾼들이 농사철에 서로 협력하기 위하여 이룬 모임","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=694489&page=10","sourceTitle":"두렛일"},{"word":"달각달각","meaning":"작고 단단한 물건이 자꾸 맞부딪치는 소리. 달가닥달가닥의 준말\\n참고-이름씨가 아름다운 순 우리말 동화\\n이상배 편저","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=686221&page=10","sourceTitle":"달각달각"},{"word":"우렁우렁","meaning":"소리가 아주 크게 울리는 모양","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=675542&page=10","sourceTitle":"우렁우렁"},{"word":"능소니","meaning":"곰의 새끼","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=667613&page=10","sourceTitle":"능소니"},{"word":"마음결","meaning":"마음의 움직이는 바탕\\n-마음결이 비단같다\\n참조)이름씨가 아름다운 순 우리말 동화","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=663125&page=10","sourceTitle":"마음결"},{"word":"뒷말","meaning":"1, 계속되는 이야기의 뒤를 이음\\n3.일이 끝난 뒤에 뒷공론으로 하는 말\\n3.바로 뒤에 오는 말\\n출처) 네이버","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=652642&page=10","sourceTitle":"뒷말"},{"word":"구순하다","meaning":"서로 사귀거나 지내는 데 사이가 좋아 화목하다\\n출처)'이름씨'가 아름다운 순 우리말 동화 이상배 편저","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=645339&page=10","sourceTitle":"구순하다"},{"word":"막둥이","meaning":"1)막내를 귀엽게 이르는 말\\n2)잔심부름하는 사내아이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=636991&page=11","sourceTitle":"막둥이"},{"word":"거드럭거리다","meaning":"거드럭거리다(동)\\n-거만스럽게 잘난 체하며 자꾸 버릇없이 굴다.\\n있을수록 거드럭거리지 말고 겸손해야 한다\\n<출처-네이버>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=628191&page=11","sourceTitle":"거드럭거리다"},{"word":"꾀","meaning":"일은 잘 꾸며 내거나 해결해 내거나 하는 묘한 생각이나 수단.\\n싫증이 나 것을 뜻하기도 함.\\n이름씨가 아름다운 순 우리말 동화 이상배편저 우지현그림","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423862&page=11","sourceTitle":"꾀"},{"word":"일손","meaning":"일하는 손, 또는 손을 놀려 하는 일. '일손이 부족하다.'\\n이름씨가 아름다운 순 우리말 동화 이상배편저 우지현그림","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423739&page=11","sourceTitle":"일손"},{"word":"단박","meaning":"주로 '단박에'의 꼴로 쓰이며, 그 자리에서 바로 '단박에 먹어치우다'.\\n'이름씨,가 아름다운 순 우리말 동화 이상배 편저/ 우지현 그림","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423625&page=11","sourceTitle":"단박"},{"word":"바투","meaning":"두 대상이나 물체의 사이가 썩 가깝게 라는 뜻입니다.\\n엄마는 승민이에게 바투 다가앉았다.\\n※ 출처 - 이름씨가 아름다운 순 우리말 동화 / 이상배 편저","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423530&page=11","sourceTitle":"바투"},{"word":"아름드리","meaning":"둘레가 한 아름이 넘는 것 을 나타내는 말입니다.\\n아름 은 두 팔을 둥글게 모아서 만든 둘레를 말합니다.\\n마을 어귀에 아름드리 느티나무가 서 있다.\\n※ 출처 - 이름씨가 아름다운 순 우리말 동화 / 이상배 편저","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423418&page=11","sourceTitle":"아름드리"},{"word":"새경","meaning":"머슴이 주인에게서 한해 동안 일한 대가로 받는 돈이나 물건\\n※ 출처 : 이름씨가 아름다운 순 우리말 동화 / 이상배 편저","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423324&page=11","sourceTitle":"새경"},{"word":"배불뚝이","meaning":"배가 불뚝하게 나온 사람을 낮잡아 이르는 말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423265&page=11","sourceTitle":"배불뚝이"},{"word":"댓바람","meaning":"일이나 때를 당하여 서슴지 않고 당장.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423111&page=11","sourceTitle":"댓바람"},{"word":"철모르다","meaning":"사리를 분간할 줄 모르다. '철'은 사리를 분별할 줄 아는 힘.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422955&page=12","sourceTitle":"철모르다"},{"word":"바스스","meaning":"눕거나 앉았다가 조용히 일어나는 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422899&page=12","sourceTitle":"바스스"},{"word":"엎어삶다","meaning":"그럴듯한 말로 남을 속이어 자기의 뜻대로 되게 하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422768&page=12","sourceTitle":"엎어삶다"},{"word":"뿔따구","meaning":"불유쾌한 충동으로 왈칵 치미는 노여운 감정. \\"뿔따구'는 '성'의 속어. '성이 나서 얼굴을 붉히다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422684&page=12","sourceTitle":"뿔따구"},{"word":"채비","meaning":"갖추어 차림. 또는 그러는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422537&page=12","sourceTitle":"채비"},{"word":"주먹다짐","meaning":"주먹으로 때리는 짓.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422476&page=12","sourceTitle":"주먹다짐"},{"word":"대갚음","meaning":"남에게 입은 은혜나 남에게 당한 원한을 잊지 않고 그대로 갚음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422322&page=12","sourceTitle":"대갚음"},{"word":"삯","meaning":"일한 데 대한 보수로 주는 돈이나 물건.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422226&page=12","sourceTitle":"삯"},{"word":"흠칫","meaning":"놀라거나 겁이 나서 어깨나 목을 움츠리는 모양. 흠칫흠칫.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422168&page=12","sourceTitle":"흠칫"},{"word":"다리쉬임","meaning":"오랫동안 길을 걷거나 서서 일을 하다가 잠깐 다리를 쉬는 일. 다리쉼.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422034&page=12","sourceTitle":"다리쉬임"},{"word":"등속","meaning":"앞의 물건과 비슷한 것들을 몰아서 이르는 말\\n'연필, 지우개 등속.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421975&page=13","sourceTitle":"등속"},{"word":"길마","meaning":"짐을 싣거나 수레를 끌기 위하여 소나 말 따위의 등에 얹는 안장.\\n'길마를 지우다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421864&page=13","sourceTitle":"길마"},{"word":"때때신","meaning":"알록달록하게 곱게 만든 아이의 신.=꼬까신.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421682&page=13","sourceTitle":"때때신"},{"word":"현명","meaning":"어질고 사리에 밝음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421441&page=13","sourceTitle":"현명"},{"word":"쌍심지","meaning":"몹시 화가 난 두 눈에 핏발이 서는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421378&page=13","sourceTitle":"쌍심지"},{"word":"아귀차다","meaning":"마음이 굳세고 하는 일이 야무지다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421296&page=13","sourceTitle":"아귀차다"},{"word":"모다깃매","meaning":"여럿이 한꺼번에 덤비어 때리는 매 = 몰매.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421134&page=13","sourceTitle":"모다깃매"},{"word":"털수세","meaning":"털이 많이 나서 험상궂게 보이는 수염.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421014&page=13","sourceTitle":"털수세"},{"word":"본새","meaning":"어떤 물건의 본디의 생김새. '본새는 곱다'.\\n어떤한 짓이나 버릇의 됨됨이. '어린 티는 나지만 본새는 의젓하다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420935&page=13","sourceTitle":"본새"},{"word":"성의","meaning":"참되고 정성스러운 뜻. '성의를 다하다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420897&page=13","sourceTitle":"성의"},{"word":"선심","meaning":"남에게 베푸는 후한 마음. '선심을 쓰다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420741&page=14","sourceTitle":"선심"},{"word":"고루","meaning":"고르게. 두루두루 빼놓지 않고.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420630&page=14","sourceTitle":"고루"},{"word":"다리품","meaning":"길을 걷는 데 드는 노력. '괜히 다리품만 팔았다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420510&page=14","sourceTitle":"다리품"},{"word":"동무장사","meaning":"두 사람 이상이 같이 경영하는 장사.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420465&page=14","sourceTitle":"동무장사"},{"word":"돌장이","meaning":"석수를 이름. 돌을 다루어 물건을 만드는 사람. = 석공","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420317&page=14","sourceTitle":"돌장이"},{"word":"물정","meaning":"세상의 형편이나 인심. '세상 물정에 어둡다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420258&page=14","sourceTitle":"물정"},{"word":"돈꿰미","meaning":"엽전을 꿰는 꿰미. 또는 엽전을 꿰어 놓은 꿰미.\\n'돈꿰미를 차다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420119&page=14","sourceTitle":"돈꿰미"},{"word":"헤프다","meaning":"말을 조심하지 않고 함부로 지껄이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420011&page=14","sourceTitle":"헤프다"},{"word":"처지","meaning":"자기가 처해 있는 경우, 또는 환경.\\n'처지가 매우 딱하다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419998&page=14","sourceTitle":"처지"},{"word":"배알","meaning":"지위가 높거나 존경하는 사람을 찾아가 뵘.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419870&page=14","sourceTitle":"배알"},{"word":"뜬돈","meaning":"어쩌다 우연희 생긴 돈.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419771&page=15","sourceTitle":"뜬돈"},{"word":"경","meaning":"'불경'의 준말. 불경은 불교의 경전으로 부처님의 가르침을 기록한 책.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419691&page=15","sourceTitle":"경"},{"word":"궁리","meaning":"마음 속으로 이리저리 따져 깊이 생각함. 또는 그런 생각.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419571&page=15","sourceTitle":"궁리"},{"word":"할긋","meaning":"곁눈으로 살짝 한 번 할겨 보는 모양. 눈에 얼씬 보이는 모양. 곁눈은, 얼굴은 돌리지 않고 눈알만 옆으로 굴려서 보는 눈.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419421&page=15","sourceTitle":"할긋"},{"word":"너럭바위","meaning":"넓고 평평한 큰 돌.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419287&page=15","sourceTitle":"너럭바위"},{"word":"가물","meaning":"오래도록 비가 안 오는 날씨. 가뭄.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419151&page=15","sourceTitle":"가물"},{"word":"어르신네","meaning":"남의 아버지나 나이 많은 사람을 이르는말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419013&page=15","sourceTitle":"어르신네"},{"word":"아귀차다","meaning":"마음이 굳세고 하는 일이 야무지다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418892&page=15","sourceTitle":"아귀차다"},{"word":"해넘이","meaning":"해가 막 넘어가는 때.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418757&page=15","sourceTitle":"해넘이"},{"word":"처지","meaning":"처하여 있는 사정이나 형편. '처지가 딱하다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418679&page=15","sourceTitle":"처지"},{"word":"빚물이","meaning":"남의 빚을 대신 갚아 주는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418514&page=16","sourceTitle":"빚물이"},{"word":"난바다","meaning":"육지에서 멀리 떨어진 넓은 바다. '난바다에 떠 있는 배'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418420&page=16","sourceTitle":"난바다"},{"word":"할금할금","meaning":"곁눈으로 살그머니 자꾸 할겨 보는 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418316&page=16","sourceTitle":"할금할금"},{"word":"퉁방울눈","meaning":"퉁방울처럼 불거진 눈.\\n퉁방울은, 품질이 낮은 놋쇠로 만든 방울. '퉁방울처럼 눈이 휘둥그레지다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418273&page=16","sourceTitle":"퉁방울눈"},{"word":"울력","meaning":"욱력\\n'여러 사람이 힘을 합하여 일함. 또는 그런 힘' 을 뜻합니다.\\n예) '마을 사람들이 울력하여 김매기를 마쳤다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418170&page=16","sourceTitle":"울력"},{"word":"온새미","meaning":"주로 '온새미로'의 꼴로 쓰이는 말로, '가르거나 쪼개지 않고 생긴 그대로의 상태'를 뜻합니다.\\n예) 치를 온새미로 한 마리 주시오'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418037&page=16","sourceTitle":"온새미"},{"word":"걱정꾸러기","meaning":"'늘 걱정이 많은 사람' 을 낮잡아 이르는 말이고, '늘 남에게 걱정을 많이 듣는 사람'을 낮잡아 이르는 말이기도 합니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417972&page=16","sourceTitle":"걱정꾸러기"},{"word":"말총","meaning":"'말의 갈기나 꼬리의 털'. '갈기'는, 말이나 사람의 목덜미에 난 긴 털을 말합니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417814&page=16","sourceTitle":"말총"},{"word":"다저녁때","meaning":"'저녁이 다 된 때'를 말합니다. '아침 나절에 온다고 하더니 다저녁때가 다 되어도 오지 않는구나'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417797&page=16","sourceTitle":"다저녁때"},{"word":"또바기","meaning":"'언제나 한결같이 꼭 그렇게'라는 뜻입니다.\\n예) '인사를 또바기 잘 한다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417676&page=16","sourceTitle":"또바기"},{"word":"트레바리","meaning":"'이유 없이 남의 말에 반대하기를 좋아하는 성격. 또는 그런 성격을 지닌 사람'을 말합니다. '그 사람은 어느 자리에서나 트레바리이다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417522&page=17","sourceTitle":"트레바리"},{"word":"먹음새","meaning":"'음식을 먹는 태도'를 뜻합니다. 비슷한 말로는 '먹새'가 있습니다. '먹음새가 좋아 살이 찐다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417452&page=17","sourceTitle":"먹음새"},{"word":"온달","meaning":"'음력 보름날의 가장 둥근 달'을 말합니다. 보름달.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417355&page=17","sourceTitle":"온달"},{"word":"아람치","meaning":"'개인이 사사로이 차지하는 몫'을 뜻합니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417215&page=17","sourceTitle":"아람치"},{"word":"애면글면","meaning":"'몹시 힘에 겨운 일을 이루려고 갖은 애를 쓰는 모양' 을 뜻합니다. 애면글면하다. '애면글면 돈을 모아 부자가 되었다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417160&page=17","sourceTitle":"애면글면"},{"word":"메숲","meaning":"'산에 나무가 우거진 숲'을 말합니다. '메숲지다'는, 산에 나무가 울창하다는 뜻입니다. '메숲에서 새들이 지저귄다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417048&page=17","sourceTitle":"메숲"},{"word":"허허바다","meaning":"'끝없이 널고 큰 바다'를 말합니다. '난바다'는, 육지에서 멀리 떨어진 넓은 바다로 비슷한 뜻의 말이며, '허허벌판'은, 끝없이 넓고 큰 벌판을 말합니다. '허허바다에 떠 있는 배'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416940&page=17","sourceTitle":"허허바다"},{"word":"도리머리","meaning":"'머리를 좌우로 흔들어 싫다거나 아니라는 뜻을 표시하는 짓'을 말합니다. = 도리질.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416816&page=17","sourceTitle":"도리머리"},{"word":"노량","meaning":"'느릿느릿'이란 뜻이며, '노량으로'는, 어정어정 놀면서 느릿느릿. '일을 그렇게 노량으로 하면 언제 끈내느냐'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416799&page=17","sourceTitle":"노량"},{"word":"쭉신","meaning":"'해지고 쭈그러진 헌 신' 입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416660&page=17","sourceTitle":"쭉신"},{"word":"달구리","meaning":"'이른 새벽의 닭이 울 때'를 이르는 말입니다. '먼 길을 떠나기 위해 달구리에 일어나 채비를 하였다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416582&page=18","sourceTitle":"달구리"},{"word":"맨꽁무니","meaning":"'아무 밑천 없이 맨주먹으로 일을 함. 또는 그렇게 일을 하는 사람' 을 이르는 말입니다.\\n'그 사람은 돈도 기술도 없는 맨꽁무니이다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416483&page=18","sourceTitle":"맨꽁무니"},{"word":"찌그렁이","meaning":"'남에게 무턱대고 억지로 떼를 쓰는 짓. 또는 그런 사람'을 이릅니다.\\n'찌그렁이 붙지 마라'. 또다른 뜻은 '제대로 여물지 못한 찌그러진 열매'입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416370&page=18","sourceTitle":"찌그렁이"},{"word":"구쁘다","meaning":"'뱃속이 허전하여 자꾸 먹고 싶다' 라는 뜻입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416214&page=18","sourceTitle":"구쁘다"},{"word":"보드기","meaning":"'크게 자라지 못하고 마디가 많은 어린 나무'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416173&page=18","sourceTitle":"보드기"},{"word":"시쁘다","meaning":"'마음에 차지 아니하여 시들하다'의 뜻입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416058&page=18","sourceTitle":"시쁘다"},{"word":"야지랑","meaning":"'얄밉도록 능청맞고 천연스러운 태도'를 말합니다.\\n'야지랑스럽다'는, 얄밉도록 능청맞고 천연스럽다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415956&page=18","sourceTitle":"야지랑"},{"word":"아름드리","meaning":"'둘레가 한 아름이 넘는 것'을 나타내는 말입니다.\\n'아름'은 두 팔을 둥글게 모아서 만든 둘레를 말합니다.\\n예) '마을 어귀에 아름드리 느티나무가 서 있다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415845&page=18","sourceTitle":"아름드리"},{"word":"용춤","meaning":"남이 추어올리는 바람에 좋아서 시키는 대로 하는 짓.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415788&page=18","sourceTitle":"용춤"},{"word":"옹춘마니","meaning":"'소견이 좁고 마음이 너그럽지 못한 사람'을 이릅니다.\\n예) '그는 마음이 콱 막힌 옹춘마니이다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415647&page=18","sourceTitle":"옹춘마니"},{"word":"풋바심","meaning":"'채 익기 전의 벼나 보리를 베어 미리 떨거나 훑는 일'이라는 뜻입니다.\\n'풋'은 새로운 것, 덜 익은 것의 뜻을 풋감, 풋고추, 풋곡식, 풋과일같이 덜 익은 것을 나타냅니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415573&page=19","sourceTitle":"풋바심"},{"word":"업숭이","meaning":"\\"하는 짓이 변변하지 못한 사람을 조롱하는 말\\" 입니다.\\n예) '쯧쯧, 하는 짓이 꼭 업숭이다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415440&page=19","sourceTitle":"업숭이"},{"word":"허풍","meaning":"허풍은\\n거짓말에 순우리말입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415349&page=19","sourceTitle":"허풍"},{"word":"빙충맞다","meaning":"\\"똘똘하지 못하고 어리석으며 수줍음을 타는 데가 있다. \\"\\n예) 젊은 사람이 씩씩하지 못하고 빙충맞다.\\"\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415278&page=19","sourceTitle":"빙충맞다"},{"word":"마음자리","meaning":"'마음의 본바탕'이라는 뜻입니다.\\n'마음보'는, 마음을 쓰는 속 바탕, '마음씨'는 마음을 쓰는 태도를 말합니다.\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415110&page=19","sourceTitle":"마음자리"},{"word":"보짱","meaning":"\\"마음 속에 품은 꿋꿋한 생각이나 요량\\"을 뜻합니다.\\n예) '그 청년은 보짱이 크다.'\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415066&page=19","sourceTitle":"보짱"},{"word":"고래실","meaning":"'바닥이 깊고 물길이 좋아 기름진 논' 이르는 뜻\\n예) 넓은 고래실에서 해마다 풍년이 든다.\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414940&page=19","sourceTitle":"고래실"},{"word":"고추바람","meaning":"살을 에는 듯 매섭게 부는 차가운 바람\\n눈위로 불어 오는 찬바람, 눈을 마구 휘날리는 바람은 '눈바람'입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414896&page=19","sourceTitle":"고추바람"},{"word":"괭이잠","meaning":"'깊이 들지 못하고 자주 깨면서 자는 잠'을 이릅니다.\\n'노루잠'도 비슷한 뜻입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414791&page=19","sourceTitle":"괭이잠"},{"word":"틀거지","meaning":"'튼실하고 위험이 있는 겉모양' 을 뜻함.\\n'튼실하다'는 튼튼하고 실하다는 뜻입니다.\\n예) '그 사람 틀거지가 만만치 않다'.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414654&page=19","sourceTitle":"틀거지"},{"word":"물초","meaning":"'온통 물에 젖음. 또는 그런 모양'을 말합니다.\\n예) '온몸이 물초가 되어 흐느적거렸다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414531&page=20","sourceTitle":"물초"},{"word":"어리보기","meaning":"예) 난 세상 물정을 모르는 어리보기 일세\\n- 얼뜬사람, 둔한 사람을 뜻함.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414416&page=20","sourceTitle":"어리보기"},{"word":"허릅숭이","meaning":"'말과 행동이 착실하지 못하여 미덥지 못한 사람'을 이르는 말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414391&page=20","sourceTitle":"허릅숭이"},{"word":"소마소마","meaning":"'겁이 나거나 무서워서 마음이 초조한 모양'의 뜻입니다.\\n'소마소마 가슴을 졸이다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414216&page=20","sourceTitle":"소마소마"},{"word":"덴겁하다","meaning":"'뜻밖의 일을 당하거나 겁에 질려 어찌할 바를 모르고 허둥지둥함'을 이르는 말.\\n예) '도둑이 기침 소리에 덴겁하여 도망쳤다.'\\n<출처 : '이름씨'가 아름다운 순 우리말 동화, 이상배 편저>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414175&page=20","sourceTitle":"덴겁하다"},{"word":"애면글면","meaning":"몸시 힘에 겨운 일을 이루려고 갖은 애를 쓰는 모양.\\n낑낑. 끙끙. 힘에 겨워 괴롭게 자꾸 내는 소리입니다. 이렇게 낑낑, 끙끙 소리가 날 만큼 몹시 힘에 겨운 일을 이루려고 갖은 애를 쓰는 모양을 애면글면이라고 합니다. 무슨 사자성어 같기도 하죠?\\n애면글면 둘러봐도 나는 절대 못 찾을걸?\\n귀신이 나오는 공포 영화의 주인공들도 늘 애면글면하죠? 좀처럼 모습을 보이지 않는 귀신 때문에 겁에 질려 늘 힘들게 도망치곤 하니까요. 공포 영화속에서는 주인공이 들어간 방에는 분명히 아무도 없습니다. 하지만 금세 어디선가 새살거리는 소리가 들려와서 \\"이게 무슨 소리지? 누구 있어요?\\"하며 애면글면 찾아디니다가 결국….\\n애면글면 기른 자식들은 지금 어디 있는 걸까?\\n5월8일에만 부모님께 효도하시나요? 이 글을 읽는 지금, 부모님께 사랑을 담아 \\"저를 애면글면 기르시느라 애쓰셨어요. 고맙습니다\\"라고 한 마디 해보시는 건 어떨까요? 그 짧은 한마디 하는 게 뭐 그리 애면글면한가요?\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414053&page=20","sourceTitle":"애면글면"},{"word":"해찰하다","meaning":"해찰: 일에는 마음을 두지 아니하고 쓸데없이 다른 짓을 함.\\n해찰스럽다: 일에는 마음을 두지 아니하고 쓸데없는 다른 짓을 하려는 데가 있다.\\n채만식의 『소년은 자란다 』에 이런 내용이 있습니다. '조선어 시간에 아이들이 해찰을 부리거나….' 여기서 '해찰'은 좀처럼 집중하지 않고 쓸데없이 다른 짓을 한다는 뜻입니다.\\n아이들이란 자칫 한눈팔고 해찰하기 일쑤라서 가끔 주의를 환기할 필요가 있다.\\n'해찰'은 주로 아이들에게 쓰는 말인데요, 자기가 해야 할 일에는 마음을 두지 않고 쓸데없이 다른 짓을 하는 어른에게는 써도 괜찮습니다.\\n옆집 아이는 참 해찰궂은 아이야.\\n마음에 썩 내키지 않아 물건을 부질없이 이것저것 집적거려 해치는 버릇이 있을 때도 해찰궂다를 쓸 수 있습니다. '안에서 새는 바가지는 밖에서도 샌다'고 하니까 아이들이 남의 집에 가서 해찰궂게 굴지 않도록 집안에서부터 가르쳐야겠네요.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413949&page=20","sourceTitle":"해찰하다"},{"word":"데면데면","meaning":"사람을 대하는 태도가 친밀감이 없이 예사로운 모양. 성질이 꼼꼼하지 않아 행동이 신중하거나 조심스럽지 않은 모양.\\n누군가 여러분께 '당신은 데면데면하군요'라고 말한다면 그건 무슨 뜻일까요? 그 말을 듣고 '그렇게 봐 주셔서 고맙습니다'라고 해야 할지, '저를 잘 못 보셨습니다'라고 되받아쳐야 할지 …. '데면데면'의 뜻, 알아 볼까요?\\n그는 누구를 만나도 데면데면 대한다.\\n데면데면은 사람을 대하는 태도가 친밀감이 없이 예사로운 모양을 뜻하는 말입니다. '당신은 데면데면하군요'라는 말은 '당신은 친밀감이 없이 예사롭게 구는군요'라는 뜻입니다. 그렇게 보이려고 의도한 게 아니었다면 친밀하게 보이도록 노력해 보세요.\\n일을 데면데면하게 하면 꼭 탈이 생기게 마련이다.\\n일을 신중하게 하지 않으면 탈이 생기게 마련입니다. 위 문장에서처럼 '데면데면'은 성질이 꼼꼼하지 않아 조심스럽지 않은 모양을 뜻하기도 합니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413879&page=20","sourceTitle":"데면데면"},{"word":"숫접다","meaning":"순박하고 진실하다.\\n여러분 주위에 있는 사람 가운데 가장 순박하고 진실한 사람이 누구인지 떠롤려 보세요. 떠올리셨나요? 다음에 그 사람을 만나게 되면 이렇게 말하세요. '당신은 참 숫저운 사람입니다.'\\n나이도 먹을 만큼 먹었는데 어쩌면 저렇게 숫저울까?\\n숫접다는 순박하고 진실하다는 뜻의 우리말입니다. 순박하고 인정이 두텁다는 뜻의 숫지다, 순박하고 어수룩하다는 뜻의 숫하다도 있습니다.\\n가희는 곱게 생겼을 뿐 아니라 너무 숫져서 모두들 좋아했다.\\n'숫접다'와 '숫지다'를 설명해 주는 '순진하다'에는 두 가지 뜻이 있습니다. 마음이 꾸밈이 없고 순박한 걸 뜻하기도 하지만 세상 물정에 어두워 어수룩하다는 뜻도 갖고 있습니다. 여러분은 어떠세요? '그 사람은 순진해'라는 말, 어떻게 해석할까요? 그 사람은 꾸밈이 없다? 그 사람은 세상 물정에 어둡다\\" 아무리 세상이 각박해지더라도 '순진하다'고 하면 '꾸밈이 없다'를 먼전 생각하는 숫저움을 잃어 버리지 않았으면 좋곘습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413733&page=20","sourceTitle":"숫접다"},{"word":"숫접다","meaning":"순박하고 진실하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413733&page=20","sourceTitle":"숫접다"},{"word":"숫지다","meaning":"순박하고 인정이 두텁다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413733&page=20","sourceTitle":"숫접다"},{"word":"숫하다","meaning":"순박하고 어수룩하다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413733&page=20","sourceTitle":"숫접다"},{"word":"직신직신","meaning":"짓궂은 말이나 행동으로 자꾸 귀찮게 구는 모양. 지그시 힘을 주어 자꾸 누르는 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413625&page=20","sourceTitle":"직신직신"},{"word":"직신직신","meaning":"직씬직씬]. 발음이 좀 어렵죠? 흔히 짖궂은 말이나 행동 따위로 자꾸 귀찮게 하는 사람에게 지분거린다고 하는데요, '직신직신'은 이 '지분거리다'와 비슷한 말입니다.\\n나는 강아지의 배를 직신직신 건드려 봤다.\\n직신직신은 짓궂은 말이나 행동으로 자꾸 귀찮게 구는 모양을 뜻하는 우리말입니다. 또 다르게 지그시 힘을 주어 자꾸 누르는 모양을 뜻하기도 하는데요, 다음과 같이 쓸 수 있습니다.\\n그가 떨어뜨린 종이를 나도 모르게 직신직신 밟았다.\\n누가 모르고 떨어뜨린 종이는 직신직신 밟으면 안 되겠지만 방금 씨앗을 심은 기름진 땅은 작신작신 밟아 줘야겠죠? 작신작신? '직신직신'의 작은말이 '작신작신'입니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413625&page=20","sourceTitle":"직신직신"},{"word":"몽짜","meaning":"음흉하고 심술궂게 욕심을 부리는 짓. 또는 그런 사람.\\n몽짜는 한마디로 심술을 부리는 성질을 뜻하는 말입니다. 왠지 표준어가 아닐 것 같기도 하죠? 하지만 당당히 사전에 표준어로 올라 있는 우리말, 몽짜는 음흉하고 심술궂게 욕심을 부리는 짓이나 그런 사람을 뜻합니다.'그 사람은 어쩐지 몽짜스러운 데가 있다'라는 건 그 사람은 어쩐지 음흉하고 심술궂게 구는 데가 있다는 뜻입니다. 이렇게 몽짜스레 행동하는 사람은 마음에 들지 않게 마련이니까 심술궂게 보이지 않도록 조심합시다!\\n예문)\\n몽짜를 치다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413590&page=21","sourceTitle":"몽짜/몽니"},{"word":"몽니","meaning":"정당한 대우를 받지 못할 때 권리를 주장하기 위하여 심술을 부리는 성질.\\n몽짜와 비슷한 말에는 몽니도 있습니다. 몽니를 부리는 사람을 '몽니쟁이'라고 하는데요, 괜히 심술궂게 굴어서 주변 사람들에게 몽니쟁이나 몽짜로 불리지 말아야겠네요.\\n예문)\\n그것은 참으로 무책임한 발언으로 국민에 대한 몽니일 뿐이다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413590&page=21","sourceTitle":"몽짜/몽니"},{"word":"말미","meaning":"일정한 직업이나 일 따위에 매인 사람이 다른 일로 말미암아 얻는 겨를.\\n직장, 학교, 군대 따위의 단체에서, 일정한 기간 동안 쉬는 일을 '휴가休暇'라고 한다. 쉴 휴休 겨를 가暇. 말 그대로 '쉴 겨를'을 휴가라고 하는 건데, 우리 고유의 말 가운데도 이와 비슷한 뜻을 이르는 말이 있다.\\n말미를 얻다.\\n여름 휴가, 겨울 휴가, 출산 휴가, 제대 휴가, 월차 휴가 등등 휴가에는 종류도 참 많다. 이렇게 많은 휴가들. 앞으로는 휴가 대신 말미를 가 보는 건 어떨까? 말미는 일정한 직업이나 일 따위에 매인 사람이 다른 일로 말미암아 얻는 겨를을 뜻한다. 말미가 나다, 말미를 받다, 말미를 주다. 한자어 휴가休暇를 대신할 수 있는 순 우리말. '말미'입니다.\\n곧 말미를 내어 찾아뵙겠습니다.\\n순 우리말 말미는 일에 매인 사람이 다른 일로 말미암아 얻는 겨를을 뜻한다고 했는데, 한자어 말미末尾는 전혀 다른 뜻이다.\\n어떤 사물의 맨 끄트머리, 그러니까 '말단末端'을 이르는 말이 바로 말미末尾이다. 동음이의어, 말미와 말미末尾. 서로 다른 두 개의 뜻을 헷갈리지 않도록 주의해야겠다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413478&page=21","sourceTitle":"말미"},{"word":"곰살궂다","meaning":"태도나 성질이 부드럽고 친절하다. 꼼꼼하고 자세하다.\\n사람의 성격을 나타내는 말 가운데 하나인 곰살궂다는 사람을 칭찬할 때 쓰면 좋은 말입니다. 칭찬은 고래도 춤추게 한다는데 곰살궂다는 말 한마디는 무엇을 춤추게 만들까요?\\n너는 참 곰살궂다\\n'너는 참 곰살궂다'는 말은 '너는 참 부드럽고 다정하구나'라는 뜻입니다.\\n발음에 주의하면서 읽어 볼까요? 바른 발음은 곰살궂다[곰:살굳따]로 '곰'을 조금 길게 발음합니다. 고옴~\\n아들아, 엄마 허리가 아프니까 이리 와서 곰살궂게 주물러 봐라.\\n곰살궂게 주물러 보라고 하신다고 해서 부드럽고 친절하게만 주무르면 안 됩니다. 우리말 '곰살궂다'에는 '꼼꼼하고 자세하다'는 뜻도 있기 때문에 그럴 때 '꼼꼼하고 자세하게' 주무르는 것이 더 적절하겠죠?\\n또 비슷한 뜻과 모양의 말, 곰살갑다도 있습니다. 성질이 보기보다 상냥하고 부드럽다는 뜻입니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413320&page=21","sourceTitle":"곰살궂다"},{"word":"알음알이","meaning":"서로 가까이 아는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413221&page=21","sourceTitle":"알음알음"},{"word":"알음알음","meaning":"서로 아는 관계, 서로 가진 친분.\\n- 출처: 쓰면서도 잘 모르는 생활 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413221&page=21","sourceTitle":"알음알음"},{"word":"지짐거리다","meaning":"조금씩 내리는 비가 자꾸 오다 말다 하며 자꾸 내리다.\\n빈대떡을 사투리로 지짐이라고 하죠? 또 비가 오면 괜히 이런 말을 합니다. '집에 가서 빈대떡이나 부쳐 먹어.' 비와 빈대떡의 이런 관계 때문일까요? '지짐거리다'는 추적추적 내리는 '비'와 관련된 말입니다.\\n비가 지짐거리는 오후\\n'지짐거리다'는 조금씩 내리는 비가 자꾸 오다 말다 하며 자주 내리는 걸 뜻하는 말입니다. '지짐거리다'는 '지짐대다'로도 쓸 수 있는데요, 밖에 나가야 하는데 지짐대면 우산을 가져가야 할지 말아야 할지 조금 고민되겠죠?\\n지금 밖은 지짐대고 있습니다.\\n우리 속담 가운데 '가랑비에 옷 젖는 줄 모른다'는 말이 있습니다. 가늘게 내리는 비는 조금씩 젖어 들기 때문에 옷이 젖는 걸 쉽게 깨닫지 못한다는 뜻으로 아무리 사소한 것이라도 거듬되면 무시 못 할 정도로 크게 됨을 비유하는 말입니다. 잊지 마세요. 지짐지짐 오는 비에도 옷은 젖습니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413158&page=21","sourceTitle":"지짐거리다"},{"word":"지짐거리다","meaning":"조금씩 내리는 비가 자꾸 오다 말다 하며 자주 내리다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413158&page=21","sourceTitle":"지짐거리다"},{"word":"지짐지짐","meaning":"조금씩 내리는 비가 자꾸 오다 말다 하는 모양.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413158&page=21","sourceTitle":"지짐거리다"},{"word":"친친하다","meaning":"축축하고 끈끈하여 불쾌한 느낌이 있다.\\n아기는 기저귀가 축축해져서 불쾌함을 느끼면 울음을 터트립니다. 또 악몽으로 밤새 땀을 흘렸거나 날씨가 더우서 옷이 흠뻑 젖었을 때도 젖은 기저귀를 찬 아기가 느낄 만한 그런 불쾌감을 느낍니다.\\n아기, 기저귀가 친친하게 젖었구나!\\n'친친하다'는 축축하고 끈끈하여 불쾌한 느낌이 있다는 뜻의 우리말입니다. 문학 작품에도 나오는 말인데요, 현진건의 『무영탑』에는 \\"웃옷을 벗는데 담이 어떻게 흘렀는지 속옷에서 웃옷에까지 친친하게 배어 나와 옷고름을 끄르는 대로 김이 물씬물씬 올라왔다\\"는 부분이 있습니다. 땀 때문에 김까지 물씬 올라오다니 정말 불쾌한 느낌이었겠네요.\\n눈에 눈물이 친친하게 고였다.\\n물기가 있어 조금 젖은 걸 흔히 '촉촉하다'또는 '축축하다'고 합니다. 이젠 '친친하다'도 알았으니까 눈물도 친친할 수 있겠죠? 눈물보다는 콧물이 더 친친하겠지만요. 에취!\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413037&page=21","sourceTitle":"친친하다"},{"word":"사부작사부작","meaning":"별로 힘들이지 않고 계속 가볍게 행동하는 모양\\n미니시리즈 4부작도 아니고, 사부작사부작? 이 말은 무슨 뜻일까요? 아는 만큼 보인다는 말이 있듯이 아는 만큼 들리기도 하겠죠? '사부작사부작'이란 말도 한번 알고 보면 여저기서 들리기 시작한답니다. 지나가던 할머니들의 대화 속에서, 무심코 듣고 잇던 라디오 속에서, 거나하게 취한 아저씨의 중얼거림 속에서도 들립니다.\\n그가 조금만 시부적시부적하면 쓸 만한 물건이 완성되곤 했다.\\n사부작사부작은 별로 힘들이지 않고 계속 가볍게 행동하는 모양을 뜻하는 말입니다. 이 '사부작사부작'의 큰말인 시부적시부적은 별로 힘들이지 않고 계속 거볍게 행동하는 모양인데요, '거볍게'는 잘못 쓴 게 아니라 '가볍다'의 큰말입니다. '사부작사부작'의 큰말이, '시부적시부적'인 것처럼 말이죠.\\n발음에도 신경 써 주세요! 사부작사부작[사부작싸부작], 시부적시부적[시부적씨부적]입니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412969&page=21","sourceTitle":"사부작사부작"},{"word":"발맘발맘","meaning":"1. 남의 뒤를 살피면서 한 발 한 발 뒤따르는 모양.\\n2. 한 발씩 또는 한 걸음씩 길이나 거리를 재는 모양.\\n아이의 뒤를 발맘발맘 따라나서다.\\n'발맘발맘'은 남의 뒤를 살피며 쫓아가는 모양을 뜻하는 말이다. 행동이 수상한 사람의 뒤를 발맘발맘 따라간다는 건 그 사람의 뒤를 잘 살피며 한 발 한 발 뒤따라 간다는 뜻이다.\\n피구를 하려면 바닥에 선을 그어야 하니까 발맘발맘 재어 보자.\\n거리를 잴 때도 '발맘발맘'을 쓸 수 있다. 손을 벌려 한 뼘씩 길이를 재듯이 팔이나 다리를 벌려 길이나 거리를 재는 모양도 '발맘발맘이다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412818&page=21","sourceTitle":"발맘발맘"},{"word":"저어하다","meaning":"'저어하다'는 '염려하다'나 '걱정하다'와 바꿔 쓸 수 있는 말입니다.\\n그대에 대한 내 열정이 식을까 저어된다.\\n'저어하다'말고 저어되다도 있습니다. '저어하다'가 염려하거나 두려워하다는 뜻이니까 ''저어되다'는 염려되거나 두려워지다는 뜻이겠죠?\\n집에서만 은둔하는 사람들은 집 밖으로 나서기를 저어한다.\\n저어하다는 염려하거나 두려워하다는 뜻이지만 한자어 '저어齟齬하다'는 틀어져서 어긋나다, 익숙하지 않아 서름서름하다는 뜻입니다. 한자를 풀이해보니까 '齟(어긋날 저), 齬(어긋날 어)'이네요.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412772&page=21","sourceTitle":"저어하다"},{"word":"암니옴니","meaning":"'암니옴니'\\n'암니옴니'는 쉽게 말해서 '앞니 어금니'이다.\\n앞니든 어금니든 다 같은 이인데 자질구레하게 따진다는 뜻이다.\\n시시콜콜과 비슷한 말이다.\\n이것저것 속속들이 캐묻는 모양을 듯하는 순 우리말, 암니옴니.\\n예문) 사소한 일까지 암니옴니 따지는 것은 딱 질색이다.\\n암니옴니는 뒤집어서 옴니암니라고 써도 맞다.\\n암니옴니=옴니암니\\n1. 다 같은 이인데 자질구레하게 어금니 앞니 따진다는 뜻으로, 아주 자질구레한 것을 이르는 말.\\n2. 자질구레한 일까지 좀스럽게 셈하거나 따지는 모양.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412658&page=21","sourceTitle":"암니옴니"},{"word":"마늘각시","meaning":"마늘 껍질을 벗겨 놓은 것처럼 피부가 하얗고 반반하게 생긴 여인\\n우리나라 옛날 여인들은 몸의 세 군데가 희면 미인이라고 했다. 첫째는 얼굴, 둘째는 이빨, 셋째는 눈동자가 희어야 한다고 했다. 왜냐하면 얼굴이 흰 사람은 피부가 말갛고 깨끗하며, 이빨이 희면 이가 건강하니, 온 몸이 건강하다는 표시이고, 눈동자가 흰 사람도 역시 온 몸이 건강하다는 증거니까 결국 건강한 모습이 미인의 조건이었다.\\n마늘각시란 마늘 껍질을 벗겨 놓은 것처럼 피부가 매끄럽고 하얀 미인을 나타내는 말이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412597&page=22","sourceTitle":"마늘각시"},{"word":"아름","meaning":"두 팔을 둥글게 둘러서 한번에 잡히는 길이\\n'아름'이라는 말은 본디 \\"아기를 안다\\"처럼 '안다'에서 나온 말이다.\\n'아름'은 두팔을 둥글게 둘러 손을 맞잡을 수 있을 만큼의 길이 즉 한번에 안을 수 있는 정도의 크기를 말한다.\\n숲속의 나무가 얼마나 큰가를 따져 볼 때 두 팔로 벌려 안아보면 한아름이 가득 되기도 하고 또 어떤 나무는 혼자서는 안되고 친구들과 여럿이 끌어안아야 되는 수도 있는데 이 정도되는 커다란 나무를 아름드리라고 부른다.\\n아름답다라는 말은 두 팔을 벌려 안아줄 만하다 라는 뜻이다. 사랑스럽고 예쁘고 내 맘에 꼭 드는 사람이라야 안아주고 싶겠지? 그런 사람을 보고 아름답다라고 말한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412494&page=22","sourceTitle":"아름"},{"word":"살피","meaning":"두 땅의 경계를 나타내는 표, 또는 물건과 물건의 틈새를 구별하는 표\\n우리가 책을 읽다가 잠시 덮어 놓을 때, 읽던 곳을 표시하기 위해서 그 자리에 꽂아 놓은 물건을 책갈피라고 한다. 갈피라는 말은 일이나 물건의 부분과 부분이 구별되는 어름을 뜻하는 말이다. 어름은 틈새라는 말이고 그 자리는 책갈피이다. 그 갈피에 꽂아서 표시하는 것을 살피라고 한다.\\n농사를 지을 때 자기 논과 다른 사람의 논을 구분하는 경계선을 살피라고 한다. 경계선이 불분명해서 서로 싸움이 일어나면 그 싸움을 살피싸움이라고 했다.\\n앞으로 책 사이에 꽂아 놓는 표는 책갈피가 아니라 살피라고 부르자.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412340&page=22","sourceTitle":"살피"},{"word":"방짜","meaning":"아주 알차고 훌륭한 물건\\n옛날에는 놋쇠를 이용하여 여러 가지 그릇을 만들어 사용했었다. 놋쇠라는 것은 구리와 아연이라은 두 종류의 쇠를 녹여서 만든 것인데 이 두 가지 쇠를 이용하여 밥그릇, 숟가락, 대접, 심지어 요강이나 여러 가지 방울 등을 만들었다.\\n지금도 민속촌에 가면 놋쇠로 그릇을 만드는 모습을 볼 수가 있다.\\n놋그릇을 만들 때 보통 사람들보다 아주 뛰어난 기술을 가진 사람이 훌륭하게 만든 물건을 방짜라고 불러서 귀하게 여긴단다.\\n본디 방짜라는 말은 아주 좋은 놋쇠를 녹여 부어 낸 다음 다시 여러차례 두드려서 만든 그릇의 이름이다.\\n옛날에는 그렇게 만들어 나오는 그릇마다 그릇바닥에 방이라는 글짜가 새겨 있었는데 이것은 방씨성을 가진 사람이 만들었다는 표시였단다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412283&page=22","sourceTitle":"방짜"},{"word":"보시기","meaning":"김치 깍두기 등을 담는 작은 사발\\n그릇들은 생긴 모양이나, 크기 그리고 쓰는 용도가 조금씩 다르기 때문에 이에 따라 이름이 다르게 붙어 있는 거야.\\n먼저 밥을 먹을 때 쓰는 그릇에는 공기가 있지. 가장 많이 쓰는 말인데 공기에 밥을 담으면 공기밥이 되지. 우리가 식당에 가면 자주 볼 수 있는 말이다. 공기보다 조금 크고 도자기로 만든 그릇을 사발이라고 부른다. 김치 담는 그릇은 주발이라고 한다. 국그릇은 보통 대접이라고 부른다. 김치 담는 그릇은 보시기, 간장을 담는 작은 사기그릇은 종지라고 한다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412148&page=22","sourceTitle":"보시기"},{"word":"사리","meaning":"국수나 새끼, 실 등을 동그랗게 감은 뭉치\\n냉면집이나 국수집에서 사리를 시키면 둥글게 말아 놓은 국수를 더 가져다 주는데 이렇게 국수나 새끼줄, 실 등을 말아 놓은 것을 사리라고 한다.\\n사리는 사리다라는 말에서 나온 것으로 실 같이 길고 잘 엉키는 물건을 동그랗게 포개어 감은 것을 말한다. \\"몸을 사린다\\"라는 말로 쓰일 때는 어렵고 지저분한 일을 살살 피하며 몸을 아낀다는 뜻도 있다.\\n그리고 비슷한 말에 타래라는 말이 있다. 타래, 또는 실타래라고도 하는데 실이나 고삐를 감아서 틀어 놓은 것을 말한다. 마치 꽈배기를 만들 듯이 틀어 놓은 것은 타래라고 하고 그냥 둘글게 둔 것은 사리라고 하는 것이다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412014&page=22","sourceTitle":"사리"},{"word":"또아리","meaning":"물건을 일 때 머리 위에 얹는 받침\\n자동차가 흔하지 않던 시절에 우리 할머니들은 아이들을 데리고 물건을 들고 다니는 것이 매우 힘드셨다. 등에는 작은 아이를 업고 한 손에는 큰 아이 손을 잡고 걸어갈 때, 커다란 보따리는 어찌 할 수가 없어서 머리에 이고 다니셨다. 또는 시장에 가서 찬거리를 사오실 때라든가 우물에서 물을 길어 올 때에도 장바구니나 물동이를 머리에 이고 다니셨다. 이렇게 무거운 물건을 머리에 얹어서 이고 다니면 머리가 아주 아프겠지? 그래서 짚이나 헝겊을 둥글게 말아 또아리를 만들어서 머리에 얹고 그 위에 물건을 이셨다.\\n또아리는 마치 도넛처럼 생겼어.\\n또아리는 둥글게 생겼다는 뜻을 가진 말인데 뱀이 자기의 몸을 둥글게 말고 있는 모양을 일러 \\"또아리 틀었다\\"고 한단다. 요새 대학생 언니 오빠들이 서로 모여서 동아리르 만들어 만나는데, 동아리란 말은 또아리와 같은 뜻의 말이야.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411974&page=22","sourceTitle":"또아리"},{"word":"매무시","meaning":"옷을 입을 때 옷차림이 바르게 되었는가를 정돈하여 살피는 일\\n매무시는 옷차림이 바르게 되었는지를 살피는 일인데 매무시를 잘 하려면 단추가 바르게 채워졌는지, 옷깃이 접힌 곳은 없는지? 혹시 더러운 것이 묻었거나 헤진 곳은 없는지 등을 잘 살펴서 항상 깔끔하고 단정하게 입는 것이 중요하다.\\n매무시와 비슷한 말로 매무새라는 말이 있다. 발음은 비슷하지만 뜻은 조금 다르다.\\n매무새는 옷을 입은 맵시를 가리키는 말이다. 그러니까 매무시를 잘해야 매무새가 나는 법이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411885&page=22","sourceTitle":"매무시"},{"word":"쾌","meaning":"북어 스무마리를 한 단위로 세는 말\\n시장에 가서 북어를 사려고 하면 싸리나무 가지에다 북어를 줄줄이 꿰어서 파는 것을 볼 수 있다. 보통 20마리를 한 줄에 꿰어서 파는데 이렇게 북어 스무마리를 한꺼번에 부를 때는 쾌라고 한다.\\n오징어 스무마리는 축 또는 죽이라고 하고, 조기 20마리는 두름, 바늘 24개는 쌈이라고 한다. 김은 100장을 한 묶음으로 하여 톳이라고 하고, 감이나 마늘 배추, 무 등 과일이나 채소류의 100개는 접이라고 부른다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411774&page=22","sourceTitle":"쾌"},{"word":"마중물","meaning":"펌프의 물을 이끌어 내기 위하여 처음에 붓는 물\\n예전에는 우물에서 두레박으로 물을 길어 썼다. 그러다가 차차 펌프를 박아서 물을 퍼 올려 식수나 생활용수로 쓰게 되었다. 그런데 펌프물은 처음부터 손잡이를 움직이면 물이 나오지 않는다.\\n펌프에서 물을 퍼 올리기 위해서는 일단 물을 한바가지 퍼 붓고 손잡이를 움직여야 땅에서 물이 나온다. 마치 처음에 부은 물이 땅 속에 있는 물을 마중하여 이끌어 오듯이 말이다. 그래서 펌프에 처음 퍼 붓는 물을 마중물이라고 한다.\\n요새는 어떤 일을 하기 위하여 시작하는 작은 일을 뜻하기도 한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411684&page=22","sourceTitle":"마중물"},{"word":"길라잡이","meaning":"나아갈 길을 인도하는 사람\\n길을 따라 여행을 할 때 앞으로 나아갈 길을 인도해 주는 사람을 길라잡이라고 한다. 훌륭한 길라잡이를 만나야 여행이 즐겁고 보람 있게 된다.\\n그리고 함께 길을 가는 사람은 길동무 또는 길벗이라고 하고 길을 지나가는 나그네는 길손이라고 부른다. 길품이라는 말은 이제는 거의 안 쓰이는 말이긴 한데 남이 갈 길을 대신 가 주고 돈을 받는 일을 말해. 퀵서비스 아저씨가 심부름을 해 주고 돈을 받는 것과 비슷하다. 품이라는 말은 어떤 일을 하는 수고를 말하는데 여기저기 부지런히 돌아디는 것을 발품을 판다고 말하고 품삯이라는 말은 남의 일을 대신해 주고 수고비를 받는 것을 말한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411562&page=23","sourceTitle":"길라잡이"},{"word":"길섶","meaning":"길의 가장자리\\n길섶은 본래 고속도로에 있는 갓길하고는 조금 다른 뜻이다. 길가의 가장자리를 가리키는 말이다.\\n길가에 작은 풀밭이 있고 예쁜 꽃들이 피어 있는 곳을 길섶이라고 하지. 옷의 가장자리를 옷섶이라고 하는 것과 같다.\\n섶이라는 말은 덩쿨식물이 잘 자라도록 받쳐주는 나무를 뜻하기도 하고 땔나무로 쓰이는 나무의 이름이기도 하다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411424&page=23","sourceTitle":"길섶"},{"word":"고샅","meaning":"마을의 좁은 골목길\\n마을의 초가집들 사이에 구불구불하게 이어지는 좁은 길을 고샅길이라고 한다. 보통은 골목길이라고도 하지. 본디는 고샅이라고 했는데 길이라는 말이 더 붙어서 고샅길이라고 부르게 되었다.\\n'샅'이라는 우리말은 두 물건의 사이를 나타내는 말 이다. 발가락 사이를 발샅이라고 하는데서 잘 알 수 있다.\\n샅샅이라는 말은 무엇을 찾을 때 아주 꼼꼼히 잘 찾아보라는 뜻으로 하는 말인데 샅이라는 말을 두 번 써서 만든 말이다. 그러니까 사이사이 또는 구석구석 잘 찾아보라는 말이다.\\n씨름을 할 때 허리와 허벅지 사이에 묶는 띠를 샅바라고 하는데 이 말은 샅, 바로 두 다리의 사이에 묶는 '바'라는 말이다. '바'는 무엇을 묶는 줄이라는 뜻의 우리말이다. 밧줄도 거기에서 나온 말이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411341&page=23","sourceTitle":"고샅"},{"word":"붓방아","meaning":"글을 쓸 때 생각이 나지 않아 붓대만 바닥에 찧고 있는 모양\\n붓방아란 글을 쓰거나 공부를 할 때 생각이 나지 않아서 붓대를 바닥에 콩콩하고 찍고 있는 모양을 가리키는 말이다.\\n일기나 편지를 쓸 때 생각이 나지 않으면 연필을 만지작거리면서 멍하니 있을때가 있지? 바로 그런 것을 가리켜 붓방아만 찍고 있다고 말하는 것이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411248&page=23","sourceTitle":"붓방아"},{"word":"시래기","meaning":"무의 입과 줄기를 말린 나물\\n시래기는 무청, 그러니까 무의 잎과 줄기를 말린 것이다.\\n초겨울에 김장을 하면서 무의 잎과 줄기를 따로 잘라 새끼에 묶어 바람이 잘 통하는 그늘에 널어 말린 것이 시래기이다. 이 시래기를 넣어 국을 끓이면 시래깃국이 되고 삶아서 나물로 무치면 시래기무침이 된다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411167&page=23","sourceTitle":"시래기"},{"word":"맛배기","meaning":"맛으로 먹기 위하여 양을 적게 담아 주는 음식\\n배부르라고 먹는 것이 아니라 그냥 입맛을 다시기 위해서 양을 조금만 주는 음식을 맛배기라고 한다.\\n자장면을 시킬 때 곱배기를 달라고 하면 보통 음식보다 곱은 많이 준다. 곱이라는 말은 본디 있는 것보다 한번 더 보태는 것을 말한다.\\n수학시간에 배우는 곱하기가 바로 이 말에서 나온 것이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411095&page=23","sourceTitle":"맛배기"},{"word":"보늬","meaning":"밤이나 은행, 땅콩 따위 과일의 속껍질\\n밤의 속껍질을 보늬라고 부른다. 보늬는 밤에만 있는 것이 아니라 은행에도 있고, 땅콩에도 있다. 요새 우리가 흔히 보는 땅콩의 얇은 껍질은 겉껍질이 아니라 속껍질이다.\\n보늬에서 알 수 있듯이 과일의 껍질은 속껍질과 겉껍질의 두겹으로 되어있는 때가 있다. 그렇게 두겹으로 된 껍질을 꺼풀이라고 부른단다. 양배추나 양파를 보면 여러 겹의 꺼풀을 볼 수 있지?\\n- 출처: 딸에게 들려 주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410930&page=23","sourceTitle":"보늬"},{"word":"저냐","meaning":"생선이나 고기를 얇게 저며 저며 밀가루를 묻히고 둥글게 부친 음식\\n명절이나 생일처럼 식구들이 다 함께 모여 즐기는 좋은 날이되면 집집마다 맛있는 음식을 장만하느라 아주 바빠진다. 갖은 야채를 볶고 나물을 무치고, 국수를 삶고, 부침개를 부치고, 국과 찌개를 끓이고, 생선을 지지고, 떡을 찌고, 고기를 튀겨서 온갖 음식을 만든다.\\n어떤 집이든 잔치마다 빠지지 않고 등장하는 것이 저냐이다. 파저냐, 고기저냐, 생선저냐, 녹두저냐 등은 우리나라 사람들이 아주 좋아하는 음식들이다. 그런데 저냐가 뭐냐구?\\n저냐는 생선이나 고기를 얇게 저며 밀가루를 묻히고 둥글게 부친 음식을 말하는데 요새는 흔히 이 말을 줄여서 전이라고 하지. 또는 동그랑땡이라고 하는 것과도 비슷한 음식이다. 그러니까 생선전, 고기전 이라는 말의 옛 우리말이 생선저냐, 고기저냐라는 말이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410834&page=23","sourceTitle":"저냐"},{"word":"진솔","meaning":"새로 지어 처음 입는 옷\\n새로 지은 옷, 또는 새로 산 옷을 진솔이라고 한다.\\n예전에 임금님은 언제나 진솔버선만을 신으셨다고 한다.\\n새로 빨래를 해서 잘 개켜 놓은 옷에서 나는 산뜻한 냄새를 새물내라고 한다.\\n반대로 옷을 빨아야 할 때가 지났는데도 구질구질하게 그냥 쳐 박아 놓아서 마치 썩은 것처럼 나는 냄새는 자릿내라고 한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410789&page=23","sourceTitle":"진솔"},{"word":"도톨밤","meaning":"도토리같이 동그랗고 작은 밤\\n우리가 먹는 밤도 종류에 따라 이름이 참 많다.\\n거칠거칠한 밤송이 속에 들어있는 밤은 송이밤이라고 하고, 그 속에서 꺼낸 밤은 알밤이라고 해.\\n밤 송이를 열어보면 보통은 알밤이 두 개가 들어 있어. 그 한 개를 부를 때 한 톨이라고 하는데, 밤송이 속에 알밤이 두 개가 들어 있으면 두톨밤이 된다. 그러면 알밤이 세 개가 들어 있으면 세톨밤이라고 하고, 하나 있으면 외톨밤이다.\\n도톨밤은 도토리처럼 동그랗고 작은 밤을 가리키는 말이고, 빈대밤은 빈대처럼 납작하게 생긴 밤을 말한다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410655&page=23","sourceTitle":"도톨밤"},{"word":"꼬투리","meaning":"콩이나 팥과 같은 콩과식물의 씨가 들어 있는 껍질\\n콩이나 팥은 모두 한 개의 껍질 안에 여러 알갱이가 같이 들어 있다. 그 모습을 보면 마치 한 부모 밑에 여러 형제들이 다정하게 모여 사는 것과 비슷하다.\\n이렇게 여러 알갱이가 들어 있는 껍질 하나 하나를 꼬투리하고 한다.\\n이 꼬투리를 잘 잡아서 벗기면 그 속에 있는 모든 것을 가질 수 있게 된다. 그래서 어른들은 무슨 일을 감추는 사람의 속마음을 알게 되었을 때 \\"꼬투리를 잡았다\\"라고 말한다.\\n꼬투리를 벗겨내어 그 속에 들어있는 콩알맹이를 다 꺼내고 남은 꼬투리는 깍지라고 한다.\\n그러니까 콩이 들어있는 것은 꼬투리, 알맹이가 없는 것은 깍지다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410514&page=24","sourceTitle":"꼬투리"},{"word":"샘바리","meaning":"샘이 많아서 안달하는 사람\\n'남의 일이나 물건을 탐내거나 자기보다 나은 처지에 있는 사람을 미워하기도 한다.'\\n'샘'을 가리키는 말이다.\\n누구에게나 있는 마음이다. 그러나 그것이 지나치면 '샘이 많다'는 말을 듣는다. 주위에 좋은 인상을 주지 못한다.\\n그런데 여기에 더해 안달까지 하는 사람이 있다. 이런 사람을 가리켜 '샘바리'라고 한다. 샘이 많아서 안달하는 사람이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410478&page=24","sourceTitle":"샘바리"},{"word":"모듬","meaning":"사람이나 물건들의 모임\\n모듬이란 말은 물건이나 사물을 모아 놓았다는 말이다.\\n지금 우리가 '모으다' 또는 '모이다'라고 하는 말을 옛날 사람들은 '몯다'라고 했는데 이 말에서 만들어진 말이 모듬이라는 말이다.\\n이 말은 홀로는 잘 쓰이지 않고 다른 말과 합하여 쓰인다.\\n예를 들면 여러 가지 생선회를 하나의 접시에 담아놓으면 모듬회가 되고, 여러 가지 재료를 섞어서 찌개를 끓이면 모듬찌개가 된다. 이 밖에도 모듬냄비, 모듬전골 등이 있는데 그러고 보니 주로 먹는 음식에 모듬이 많이 쓰인다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410329&page=24","sourceTitle":"모듬"},{"word":"좀도리","meaning":"밥을 지을 때 조금씩 덜어서 모아 놓은 쌀\\n어느 집이고 집집마다 동전을 모으는 저금통들이 하나 둘 씩은 있게 마련이다. 온 식구들이 하루르 지내고 난 뒤 주머니에 남아있는 동전들을 저금통에 모아 두었다가 가득 모이면 통을 열어서 아이들 학용품도 사고, 은행에 저금도 하곤 한다. 작은 동전을 틈틈히 모으다 보면 정말 '티끌 모아 태산'이라는 옛말이 실감이 나게 된다.\\n옛날 어머니들은 식구들의 밥을 지을 때마다 한줌씩의 쌀을 덜어내어 단지에 모았었다. 이렇게 해서 모아진 쌀을 좀도리라고 하고 이 쌀을 담아 놓는 단지를 좀도리단지라고 불렀다. 좀도리단지에 쌀을 모으는 것은 아무리 재산이 많아도 흥청망청하지 말고 아끼고 절약하자는 마음에서 우러나온 풍속이다. 그리고 이 단지에 모인 쌀은 아낙네들이 꼭 필요한 물건을 사는데 쓰였다. 쌀 한톨이라도 귀하게 여기고 아낄 줄 알아야 무엇이든 소중하게 여기고 살아가게 되는 것이다.\\n요즘처럼 낭비가 심한 시절에는 옛날의 좀도리단지가 다시 되살아나서 집집마다 아끼고 절약하는 정신이 깃들이면 좋겠다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410283&page=24","sourceTitle":"좀도리"},{"word":"꽃다지","meaning":"가지나 오이 따위의 맨 처음 열린 열매\\n농사를 지어서 처음으로 거둔 푸성귀나 나물, 과일들을 맏물이라고 한다. 형제들 사이에서 처음 태어난 아이릉 맏아들, 맏딸이라고 부르는 것과 같은 말이다.\\n그리고 그것들 가운데서 특히 오이나 가지 따위처럼 꽃이 피었다가 진 후에 열리는 첫 열매는 특별히 꽃다지라고 부른다. 또는 꽃이 피었다가 바로 맺힌 열매라서 꽃열매라고부르기도 해. 그리고 맏물의 반대말, 즉 열매가 가의 다 없어질 때 거두어 들인 것들은 끝물이라고 말한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410152&page=24","sourceTitle":"꽃다지/무녀리"},{"word":"무녀리","meaning":"짐승의 맨 처음 낳은 새끼 또는 알\\n개나 돼지처럼 여러 마리의 새끼를 낳을 때 가장 먼저 어미의 뱃속에서 나온 녀석을 무녀리라고 부른다.\\n그런데 무녀리들은 다른 새끼들에 비하여 몸집도 작고 아주 허약하다. 그래서 이 말은 처음에는 어미에게서 처음 태어난 새끼라는 뜻이었다가 나중에는 여러 새끼 가운데 유난히 작고 허약한 새끼라는 뜻으로 바뀌어 쓰인다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410152&page=24","sourceTitle":"꽃다지/무녀리"},{"word":"둠벙","meaning":"땅이 패어서 물이 고인 곳\\n둠이라는 말은 둥글게 만들어졌다는 뜻의 아주 오래된 우리말이다.\\n깊은 산속에 산이 빙 둘러쳐진 곳에 있는 마을을 두메산골이라고 하는데 이 말도 둠이라는 말이 변한 말이고, 시골 마을 이름 가운데 양지뜸, 윗뜸이라는 마을 이름에 나오는 뜸도 마찬가지야.\\n논 옆에 둥글게 땅이 패여서 물이 고여 있는 곳이 있지? 그곳을 둠벙이라고 해. 다른 말로는 웅덩이라고도 하지.\\n논가의 둠벙에는 미꾸라지도 살고 붕어도 살아. 그래서 가을철에는 동네 아저씨들이 둠벙의 물을 모두 퍼내고 그 속에 있는 고기들을 잡아 마을 잔치을 하곤 했었다.\\n둠벙 가운데 작은 것은 옹당이라고 부르고, 아주 작은 웅덩이의 이름을 움파리라고 해. 그러니까 비가 와서 학교 운동장에 잠시 생기는 웅덩이를 움파리라고 말하면 돼.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410049&page=24","sourceTitle":"둠벙"},{"word":"여울","meaning":"강의 바닥이 얕거나 폭이 좁아서 물살이 세게 흐르는 곳\\n여울은 넓은 강에서 유유히 흐르던 강물이 갑자기 강의 바닥이 얕아지거나 폭이 좁아져서 물살이 세게 흐르는 곳이다.\\n여울중에서도 아주 급하고 빠르게 물이 흐르는 곳은 살여울이라고 부르기도 하고 된여울이라고 부르기도 한다. 또 여울물이 턱을 이루고 흐르는 곳을 여울목이라고 부르고 여울가운데에도 비교적 물이 얕아서 건너기에 위험하지 않은 곳은 여울나들이라고 불러서 구별하기도 했다.\\n- 출처 : 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409965&page=24","sourceTitle":"여울"},{"word":"는개","meaning":"안개보다 조금 굵고 이슬비보다 가는 비\\n비 가운데 가장 가느다란 비는 안개비\\n안개비보다 조금 더 물방울이 굵어서 비에 가까운 것을 는개\\n는개보다 더 굵어져서 제대로 비처럼 오는 것을 이슬비\\n이슬비가 굵어지면 가랑비\\n바람도 안 불고 소리없이 내리는 조용한 비는 보슬비\\n보슬비가 오랫동안 쉬임없이 내리면 부슬비\\n빗발이 아주 굵어져서 좍좍 쏟아지면 장대비\\n굵고 거세게 오는 비는 작달비\\n빗방울이 보일 정도로 오는 굵은 비는 발비\\n양동이로 퍼 붓듯이 세차게 오는 비는 억수 - 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409821&page=24","sourceTitle":"는개(비 이름 중 하나)"},{"word":"동살","meaning":"해 뜨기 전 동이 트면서 푸르스름하게 비치는 햇살\\n해가 막 떠오르려고 할 때는 온 하늘이 붉은 기운으로 물들어서 마치 물감을 풀어 놓은 것 같아. 해가 조금씩 수평선 너머로 모습을 나타내며 수줍은 듯 붉은 햇살이 온 하늘에 피어올라. 이때 붉은 햇살 사이로 푸르스름한 기운이 퍼져나가는데 이것을 동살이라고 불러. 그러니까 새벽에 해가 뜨면서 본격적으로 넒게 퍼지는 햇빛을 동살이라고 한다.\\n그리고 해가 훤히 떠올라서 온 세상에 환하게 비추는 햇살을 볕살이라고 해.\\n하나 더 얘기해 줄까? 아침에 해가 떠오르는 것은 해돋이라고 말하는데 저녁에 해가 지는 것은 해넘이라고 부른다.\\n그리고 햇빛이 공기 속의 수증기에 비치어서 해의 둘레에 둥그런 테두리가 생기는 일이 있어. 마치 도넛처럼 둘러쳐지는 일이 있어. 비가 오려고 할 때 많이 나타나는데 이런 현상은 햇무리라고 한단다. 달의 주위에 이런 테두리가 만들어지면 달무리라고 하지.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409721&page=24","sourceTitle":"동살"},{"word":"까치놀","meaning":"석양을 받아 멀리 수평선 위에서 번뜩이는 물결\\n저녁놀은 붉게 물드는 하늘의 색깔도 아름답지만, 강가나 바닷가에서 물위에 비치는 놀의 모습은 훨씬 더 아름답게 느껴진다. 까치놀은 바닷가에 앉아서 저녁놀을 볼 때 멀리 수평선 위에서 하얗게 흔들려 보이는 물결의 이름이다. 붉게 물든 바닷 물결 위로 흰 물살이 치켜 올라가는 모습이 마치 까치가 하늘로 날아 올라가는 모습과 같아서 그렇게 부른단다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409678&page=24","sourceTitle":"까치놀"},{"word":"제비초리","meaning":"사람의 뒤통수나 앞 이마에 뾰족이 내민 머리털\\n초리는 꼬리의 옛말인데 지금은 잘 쓰지 않는 말이다. 그런데 옛날에는 쓰이다가 지금은 쓰이지 않는 말들이 때때로 다른 말들 속에 남아 있는 경우가 있다.\\n예를 들면, '초리'는 눈초리, 회초리, 제비초리 따위의 말에서 찾아 볼 수가 있다.\\n눈초리는 눈의 바깥쪽 가장자리다. 눈초리가 위로 치켜 올라가면 사나와 보이고 아래로 쳐지면 졸린듯이 보인다. 그 눈초리가 바로 눈 꼬리다.\\n제비초리는 뒤통수나 앞이마에 제비꼬리처럼 뾰족이 내민 머리털을 가리킨다.\\n그런데 이 말과 소리가 아주 비슷한 제비추리라는 말이 있다. 이 말은 소의 안심 부위에 붙은 고기를 가리키는 말인데, 그 고기의 생긴 모양도 제비꼬리와 비슷해서 붙여진 이름이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409527&page=25","sourceTitle":"제비초리"},{"word":"고명딸","meaning":"아들만 있는 집의 외딸\\n요즘 초등학교에는 여학생보다 남학생의 숫자가 훨씬 많아서 여학생과 짝을 하지 못하고 남자아이들끼리 짝을 하는 경우가 점점 많아진다는구나. 이것은 우리나라 부모님들이 전통적으로 딸이 많은 집을 보고 딸부잣집이라고 하지. 딸부잣집이 된 이유는 대부분 여자아이만 낳은 집에서 남자아이를 낳으려고 하다가 자꾸 여자아이만 낳아 그렇게 된 경우란다.\\n이런 경우와는 달리 아들이 여럿인데 딸은 하나만 있는 집이 있지. 이런 집의 외딸을 고명딸이라고 한단다.\\n고명이란 말은 음식의 모양과 맛을 돋우기 위하여 음식 위에 뿌리거나 얹은 것의 이름이야.\\n아들 많은 집의 외딸은 음식 위에 얹은 고명처럼 집에서 귀여움을 독차지하고, 집안 분위기를 부드럽고 명랑하게 만들어 주는 역할을 하기 때문에 고명딸이라고 부르게 되었단다.\\n-출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409424&page=25","sourceTitle":"고명딸"},{"word":"고뿔","meaning":"감기\\n감기는 한자로 씌어진 말인데 우리 토박이 말로는 뭔지 아니? 바로 고뿔이야.\\n'고'는 코의 옛말이고, '뿔'은 본래 불이라는 말인데 소리가 바뀌어서 고뿔이 되었단다.\\n말 그대로 고뿔은 코에 불이 붙었다는 뜻이고, 코에 불이 났으니 머리가 아프고 콧물이 나고 어지럽고 힘든 것은 당연하지. 어때! 아주 그럴 듯 하지 않아?\\n고가 코의 옛말이었다는 것은 고섶이라는 말을 살펴봐도 알 수 있단다.\\n고섶은 코앞에 있는 것처럼 가까운 곳을 뜻하는 말이야. 그리고 섶은 옷섶, 길섶에 쓰이는 말로 가장자리라는 말이니까 고섶이라는 말은 코의 가장자리라는 뜻이고, 길섶은 길가의 풀이 자라나는 곳을 말해.\\n없어진 물건을 찾느라고 수선을 피우다가 가까운 곳에서 찾게 되었을 때 \\"고섶에 두고 난리를 피웠군\\"이라고 한단다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409355&page=25","sourceTitle":"고뿔"},{"word":"발장단","meaning":"뜻: 발을 까딱거리면서 장단을 맞추는 모양\\n설명: 발을 까딱거리거나 발끝으로 바닥을 두드리며 장단을 맞추는 것을 발장단이라고 한다. 또 발장구라는 말도 있다. 이 말은 헤엄칠 때나 어린 아이들이 엎드려 기어가려고 할 때 두 발을 들었다 놓았다 하는 짓을 말한다. 수영을 처음 배울 때 수영장 가장자리에 앉아서 두 발만 물 속에 넣고 발차기 연습을 하는 그 동작이 바로 발장구다. 때로는 물장구라고 하기도 한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409236&page=25","sourceTitle":"발장단"},{"word":"돋을볕","meaning":"해돋이 무렵 처음으로 솟아오르는 햇볕.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409118&page=25","sourceTitle":"돋을볕과 돋을양지"},{"word":"돋을양지","meaning":"돋을볕이 잘 드는 양지바른 곳.\\n해님이 살며시 이마를 내밀어요. 어둠을 밀어내고 돋을볕이 솟으면 햇살이 부챗살처럼 퍼지지요. 돋을볕을 '햇귀'라고도 합니다. 돋을볕은 힘차게 느껴지고, 햇귀는 매우 소중하게 느껴지지요.\\n한편, 돋을볕이 잘 드는 양지바른 곳을 돋을양지라고 합니다. 신라의 찬란한 유적인 석굴암은 돋을볕이 잘 드는 돋을양지에 자리하고 있어요. 아침이면 굴 안에 돋을볕이 들어 신비한 분위기가 느껴지요.\\n예문 - 돋을볕이 잘 드는 바닷가 언덕배기 돋을양지에 하얀 집을 지어서 살고 싶어요.\\n- 출처: 글 잘 쓰는 어린이를 위한 예쁜 우리말 사전","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409118&page=25","sourceTitle":"돋을볕과 돋을양지"},{"word":"다리매","meaning":"미스 코리아 대회에 참가한 언니들은 몸매가 참 예쁘지? 키도 크고 다리도 길고, 눈매도 예쁘고 말이야. 그러나 아빠는 사람을 겉모양만 보고 평가해서는 안 된다고 생각해. 아빠가 미스 코리아 이야기를 하는 것은 몸과 관련된 우리말을 설명하기 위해서란다.\\n눈매, 몸매, 입매, 다리매 따위의 말들은 눈과 몸, 입, 다리의 생긴 모양을 나타내는 말이야.\\n그런데 사람들은 눈매나 몸매, 입매라는 말은 자주 사용하지만 다리매라는 말은 쓰지 않는 것 같아.\\n\\"눈매가 독수리처럼 날카로워\\", \\"저 아이는 눈매가 참 부드럽군\\", \\"언니는 몸매가 참 날씬해\\", \\"입매를 보니 참 야무진 성격이겠다.\\"…. 이렇게 눈매나 몸매라는 말을 살려서 쓰고 있는데 \\"다리매가 참 예쁘다\\"라는 말은 잘 하지 않거든.\\n다리매 대신에 각선미라는 한자말을 주로 쓰고있는데 이제부터는 아름다운 우리말을 쓰도록 하자.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409062&page=25","sourceTitle":"다리매"},{"word":"꽃멀미","meaning":"뜻: 꽃의 아름다움에 취해 일어나는 어지러움\\n설명: 멀미는 어지러운 증세를 말하는 것이야.\\n배를 탈 때 생기는 배멀미는 바람이 강하게 불어 파도가 많이 치는 날이면 더 심해진단다. 어떤 사람은 비행기를 탈 때도 멀미를 하곤 해. 엄마는 사람이 많은 시장이나 백화점엘 가면 너무 정신이 없어서 어지럽다고 하지? 그런 것은 사람멀미라고 하는 거야.\\n그러고 보니 멀미라는 말도 참 여러 가지로 쓰이네! 그런데 꽃멀미는 아름다운 꽃밭 속에서 꽃향기에 취해 어지러움을 느끼는 것을 말하니까 이건 참 행복한 멀미라는 생각이 드는구나.\\n- 출처: 딸에게 들려주는 아름다운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408939&page=25","sourceTitle":"꽃멀미"},{"word":"각다귀판","meaning":"뜻: 서로 남의 것을 뜯어먹으려고 덤비는 판\\n설명: '각다귀'는 모기와 비슷하게 생긴 해충이다. 논밭에서 벼나 보리의 뿌리를 갉아먹고 산다. '판'은 '개판, 난장판' 등에 쓰인 '판'과 같이 '어떤 국면'을 지시한다.\\n'각다귀'들이 달려들어 이것저것 갉아먹는 어수선한 국면이 '각다귀판'이다. '모기판'이라는 단어가 없는 것을 보면 '각다귀'가 '모기'보다 훨씬 지독한 해충임을 짐작할 수 있다.\\n'각다귀판'은 그 본래의 의미보다는 '서로 남의 것을 뜯어먹으려고 덤비는 판'이라는 비유적의미로 더 많이 쓰인다.\\n\\"이건 시장이 아니라 완전히 각다귀판일세.\\"에 쓰인 '각다귀판'이 그와 같은 의미로 쓰인 것이다.\\n예문: 사람들이 서로 헐뜯고 싸우는데, 이건 완전히 각다귀판이었다.\\n- 출처: 좋은 글, 좋은 말을 위한 우리말 활용 사전","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408889&page=25","sourceTitle":"각다귀판"},{"word":"가재걸음","meaning":"뒷걸음질하는 걸음\\n'가재, 게, 달팽이' 등이 걷는 모습은 아주 독특하다. '가재'는 뒤로 걷고, '게'는 옆으로 걸으며, '달팽이'는 천천히 걷는다.\\n'가재'처럼 슬금슬금 뒷걸음질하는 걸음을 '가재걸음', '게'처럼 옆으로 걷는 걸음을 '게걸음', '달팽이'처럼 '천천히 걷는 걸음'을 달팽이걸음'이라 한다.\\n'가재걸음'은 '뒤로 걷는 걸음'이라는 의미 이외에 '퇴보(退步)'라는 비유적 의미도 갖는다. 뒤로 가는 것은 발전이 아니라 퇴보이기 때문에 '가재걸음'에 그와 같은 의미가 생겨난 것이다.\\n'가재걸음을 치다(발전하지 못하고 도리어 뒤떨어지거나 못하게 되다)'라는 관용어에 쓰인 '가재걸음'도 '퇴보'라는 의미로 쓰인 것이다.\\n예) 하지만 그렇다고 일단 발을 들여놓은 이상 비겁하게 가재걸음을 칠 수 는 없는 일이었다. <김학철, 김학철 산문집>\\n- 출처: 좋은 글, 좋은 말을 위한 우리말 활용 사전","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408732&page=25","sourceTitle":"가재걸음"},{"word":"가납사니","meaning":"말다툼을 잘하는 사람\\n슬데없는 말을 많이 지껄이는 사람을 '수다쟁이'라고 한다. 이 '수다쟁이'와 의미가 같은 단어가 '가납사니'이다. 물론 '수다쟁이'에는 '낮춤'의 의미가 있고, '가납사니'에는 그것이 없다는 차이가 있다. 아울러 '가납사니'에는 '말다툼을 잘하는 사람'이라는 다른 의미가 있는 것도 '수다쟁이'와 차이점이 있다. 되는 소리 안 되는 소리 쓸데없이 지껄이다 보면 오해가 생기고 그로 인해 말다툼이 벌어질 수 있다. 그래서 '가납사니'에 '말다툼을 잘하는 사람'이라는 의미가 생겨난 것이다. '가납사니'는 '가납'과 '사니'가 결합된 어형인데, 가납의 어원은 분명하지 않다. 다만 '사니'는 '마사니(타작 마당에서 마름을 대신하여 곡식을 되는 사람), 욕사니(남에게 욕을 많이얻어먹는 사람)'등을 보면 '하찮은 사람'을 지시함을 알 수 있다.\\n예문 - 그녀가 보고 싶다. 가납사니 같은 인감 담당 최 여사. 늘 최주사님 왜 그렇게 사세요, 하며 같은 최씨라고 안쓰러워 하던 그녀가 불현듯 보고 싶다. <고병돌, 각시붕어>\\n- 출처: 좋은 글, 좋은 말을 위한 우리말 활용 사전","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408660&page=25","sourceTitle":"가납사니"},{"word":"큰춤보다","meaning":"자기를 위한 큰춤의 의식이 베풀어지는 영화를 누리다.\\n예) 자손을 직심스레 기르더니 드디어 큰춤보는 영광을 누리는구나.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"광치다","meaning":"① 번쩍번쩍 빛을 내다. ② 남에게 드러내어 실상(實狀)을 이상으로 풍을 치다.\\n예) 저 사람은 타향에 가면 풍치고 다닌다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"나부대다","meaning":"철없이 가볍게 부스대다.\\n예) 남보다 좀 아는 게 있다고 분수없이 나부대면 따돌림받기 쉽다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"퉁어리적다","meaning":"옿은지 그른지도 모르고 아무 생각없이 행동하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"맨망떨다","meaning":"요망스럽게 까불다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"잘잘거리다","meaning":"이리저리 채신없이 쏘대다.\\n예) 나이를 먹어서도 잘잘거리고 다닌다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"호드득거리다","meaning":"① 경망하게 연해 방정을 떨다. ② 콩이나 깨를 볶을 때에 톡톡 튀어 소리가 연해 나다. ③ 여러 개의 총포(銃砲)나 딱총 따위가 연해 터지며 소리가 나다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"날바람잡다","meaning":"바람이 들어서 너무 허무하게도 함부로 헤매고 돌아다니다.\\n예) 세상 물정도 모르고 날바람잡고 다니는 사람이 많다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"괘방치다","meaning":"비밀한 일을 드러내다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"소양배양하다","meaning":"나이가 젊어서 함부로 날뛰기만 하고 철이 아직 없다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"판둥거리다","meaning":"아무 일이 없이 빤빤스럽게 놀고만 있다.\\n예) 언제까지 그렇게 판둥거리고 살려느냐.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"어리칙칙하다","meaning":"일부러 어리석은 체하다.\\n예) 겉으로는 어리칙칙학 굴면서 속엔 딴 생각을 품고 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"군던지럽다","meaning":"마음이나 행세가 추저분하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"근대다","meaning":"성가시게 굴다. 귀찮은 느낌이 나도록 지근덕거리다.\\n예) 초등학교 남자 어린이가 여자 어린이를 자꾸 근대다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"자근거리다","meaning":"① 남이 싫어하도록 건드려서 괴롭게 굴다. ② 남이 귀찮아하도록 조르다. ③ 어떤 물건을 약한 힘으로 자꾸 눌러 깨뜨리다.\\n예) 입술을 자근거리다.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceTitle":"행동거지를 나타내는 말 5"},{"word":"날밤새우다","meaning":"공연히 뜬눈으로 밤을 지내다.\\n예) 날밤새운 덕으로 그 원고를 다 쓸 수가 있었다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408424&page=26","sourceTitle":"행동거지를 나타내는 말 4"},{"word":"한둔","meaning":"한데에서 밤을 지냄.\\n예) 이런 날씨에 한둔하면 몸에 나쁩니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408424&page=26","sourceTitle":"행동거지를 나타내는 말 4"},{"word":"조리치다","meaning":"졸음이 올 때에 잠깐 졸고 깨다.\\n예) 남몰래 조리치는 재주 좀 배우고 싶다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408424&page=26","sourceTitle":"행동거지를 나타내는 말 4"},{"word":"굴침스럽다","meaning":"무엇을 억지로 하려고 애쓰는 태도가 있다.\\n예) 법과 대학 재학중에 사법고시에 합격하려고 굴침스럽게 공부를 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408424&page=26","sourceTitle":"행동거지를 나타내는 말 4"},{"word":"길나다","meaning":"행동이 한방면으로 터지다\\n예) 어려운 일도 자꾸 노력하면 끈내는 길나고 만다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408424&page=26","sourceTitle":"행동거지를 나타내는 말 4"},{"word":"잔다리밟다","meaning":"출세할 때에 낮은 데로부터 시작하여 차차 오르다.\\n예) 저 사람은 사환으로부터 잔다리밟아 장관까지 됐다.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408424&page=26","sourceTitle":"행동거지를 나타내는 말 4"},{"word":"알음장","meaning":"눈치로 알리어 주는 것.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"눈주다","meaning":"가만히 약속의 뜻을 보이어 눈짓을 하다.\\n예) 그가 넌지시 눈주면서 먼저 자리를 떴다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"드레지다","meaning":"사람됨이 틀거지가 있어서 가볍지 아니하다. 인격적으로 점잖아서 무게가 있다.\\n예) 그 사람의 태도에는 드레진 데가 있어 믿음직스럽다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"산드러지다","meaning":"태도가 경쾌하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"씻가시다","meaning":"씻어서 가시다. 그릇을 물로 깨끗이 씻어서 더러운 것이 없이 가시다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"어연번듯하다","meaning":"세상에 드러내놓기에 아주 떳떳하고 번듯하다.\\n예) 자식을 혼자 손으로 어연번듯하게 키웠다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"통돌다","meaning":"여러 사람의 뜻이 같이 되어 그리하기로 서로 알리어지다.\\n예) 동지끼리 통돈 약속을 어겨서야 되겠는가?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"통짜다","meaning":"여럿이 한 동아리가 되기를 약속하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"풀치다","meaning":"맺혔던 생각을 돌리어 너그럽게 용서하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"하청치다","meaning":"절에서 재가 끝날 때에 여흥을 하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"노박이로","meaning":"줄곧 오래 붙박이로\\n예) 시험 때문에 노박이 도선관에 다녔다.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceTitle":"행동거지를 나타내는 말 3"},{"word":"누이바꿈","meaning":"누이를 처남과 혼인시킴.\\n예) 어느 고장에서는 누이바꿈하는 사람을 보고 항아리 사돈이라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"섞바꾸다","meaning":"섞어서 바꾸다.\\n예) 어른과 어린이가 섞바꾸어 앉다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"섞사귀다","meaning":"지위와 환경이 다른 사람들끼리 서로 사귀다.\\n예) 그 애는 누구하고나 잘 섞사귄다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"손겪다","meaning":"손님을 대접하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"수세","meaning":"이혼의 증서. 남자가 여자에게 줌.\\n예) 사람이 죽고 사는 판에 수세 따위가 무슨 소용이 있는가.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"집알이","meaning":"남이 새로 집을 들었을 때에 집 구경 겸 인사로 찾아보는 일.\\n예) 이사한 지 한 달이 지나도록 집알이를 못 갔으니 체면이 말이 아니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"방나다","meaning":"집안의 재물이 죄다 없어진다.\\n예) 그 아들 때문에 그 집은 방나고 말았다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"톡탁치다","meaning":"올고 그름을 가릴 것이 없이 다 쓸어 없애다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"버성기다","meaning":"① 벌어져서 틈이 있다. ② 두 사람의 사이가 탐탁하지 않다.\\n예) 점점 더 둘 사이가 버성겨서 큰일이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"보쟁이다","meaning":"부부가 아닌 남녀가 은밀히 관계를 연하여 맺다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"본치","meaning":"남의 눈에 띄는 태도.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"차깔하다","meaning":"문을 굳게 닫아 잠가 두다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"폴짝","meaning":"문을 갑작스레 열거나 닫는 모양.\\n- 출처 : 사전 속에서 잠자는 보배로운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceTitle":"행동거지를 나타내는 말 2"},{"word":"나볏이","meaning":"매우 떳떳하고 의젓하게. < 너볏이\\n예) 남자라면 세상을 나볏이 걸을 수 있어야지.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"나수다","meaning":"① 내어서 드리다. ② 높은 자리로 나아가게 하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"나쪼다","meaning":"어른 앞에 나아오다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"손심부름","meaning":"몸 가까이 있는 일에 대한 잔심부름\\n예) 저 애는 내 곁에 두고 손심부름이나 시키고 싶다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"붙좇다","meaning":"공경하는 마음이나 섬기는 뜻으로 가까이 하여 쫓다.\\n예) 평생 마음으로 붙좇고 있을 뿐입니다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"짓나다","meaning":"흥겨워 멋을 부리다.\\n예) 아기가 젖을 먹고 나더니 한창 짓나서 재롱을 피운다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"가동이치다","meaning":"가동질(어린 아이의 양쪽 겨드랑이를 치켜들고 올렸다 내렸다 할 때, 아이가 다리를 웅그렸다 폈다 하는 짓)을 힘치하게 하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"간질밥 먹이다","meaning":"남의 살을 간지럽게 일부러 건드리다.\\n예) 어린 아이를 간질밥 먹이지 마라.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"가탈거리다","meaning":"말의 걸음이 탄 사람에겍 불편을 자꾸 주다.\\n예) 말이 돌서덜길을 가탈 거리며 간다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"굽닐다","meaning":"몸을 구부리다 일으키다 하다. 몸을 구부리고 일으키고 하여 일하다\\n예) 가을 논에 황금 물결이 굽닐다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"옴살","meaning":"한몸같이 친밀한 터.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceTitle":"행동거지를 나타내는 말 1"},{"word":"하리놀다","meaning":"남을 헐뜯어 웃사람에게 일러바치다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"자빡대다","meaning":"아주 거절하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"야스락거리다","meaning":"입담이 있게 계속하여 말을 늘어놓다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"뎅걸뎅걸","meaning":"벽이나 문을 사이에 두고 들리는 여러 사람의 떠드는 소리.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"엉두덜거리다","meaning":"원망이나 불만이 있어 중얼중얼하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"게정","meaning":"불평스럽게 떠드는 말과 행동.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"살똥스럽다","meaning":"말이나 하는 짓이 독살스럽고 당돌하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"대받다","meaning":"남의 말에 반항하여 들이대다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"말질","meaning":"이러니 저러니 하고 시비를 말하는 짓.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"막서다","meaning":"싸울 것같이 함부로 대들다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceTitle":"언동(言動)에 관계 되는 순 우리말 2"},{"word":"진대","meaning":"남에게 기대어 억지를 쓰다시피 하여 괴롭히는 짓.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sou
