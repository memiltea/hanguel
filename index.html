d=view&no=401825&page=32","sourceTitle":"계절, 때와 관련된 순 우리말"},{"word":"한물","meaning":"채소나 어물이 한창 쏟아져 나오거나 수확되는 때.\\n'한물갔다'는 말은 오늘날 어떤 사람의 전성기가 지났다는 뜻으로 쓰인다. 그런데 이 말의 유래가 되는 '한물'은 채소나 어물 등이 한창 성한 때를 말한다. 곧 '성어(成魚)기'나 '수확기'의 뜻이다. 특히 '수확의 절정기가 지나다'의 뜻으로 쓰인 '한물이 넘다','한물이 지다'따위의 표현이 사람의 처지에 적용되어 \\"그 사람도 이제 한물갔어!\\"와 같이 쓰이게 된 것이다. 한편 한물의 때를 가리킬 때는 '한철'이라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401825&page=32","sourceTitle":"계절, 때와 관련된 순 우리말"},{"word":"해뜰참","meaning":"해가 돋을 무렵\\n해돋이는 해의 움직임을 나타내는 말이고 해뜰참은 '해돋이하는 때'를 말하는 것이다. '해돋이를 보다'라는 말은 맞지만 '해뜰참을 보다'라는 말은 맞지 않다. 또 '해돋이에 일터로 나가다'라는 말은 틀리다. '해뜰참에 일터로 나가다'라고 해야 한다. 해뜰참은 '해거름'에 맞서는 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401825&page=32","sourceTitle":"계절, 때와 관련된 순 우리말"},{"word":"개밥바라기","meaning":"해 진 뒤에 서쪽 하늘에 반짝이는 금성.\\n'바라기'는 작은 그릇을 말한다. 따라서 개밥바라기는 '개의 밥그릇'이다. 우리가 살고 있는 지구와 비교적 가까이 있는 행성으로, 지구의 바로 안쪽에서 태양의 주위를 돌며 저녁이나 새벽에 선명한 빛을 내뿜는 별이 바로 금성(金星)이다.\\n예) 저물녘 열구름 사이로 떠오른 개밥바라기 빛이 처연하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401720&page=32","sourceTitle":"별과 관련된 순 우리말"},{"word":"미리내","meaning":"남북으로 길게 강물처럼 분포한 항성의 무리. 은하수.\\n미리내는 불규칙한 모양을 가진 여러 항성들의 무리다. 많게는 수억 개의 별이 거대한 소용돌이 모양으로 어떤 질서를 이루고 있다. 따라서 이것의 측면을 지구에서 바라보면 거대한 띠, 혹은 거대하게 흐르는 강물처럼 보이는 것이다. 미리내의 '미리'는 '미르'에서 변천한 것으로 보이는데, '미르'는 용(龍)을 뜻하는 우리 옛말이다. 그러므로 미리내는 '용의 내[川]'라는 뜻이다.\\n예) 사람의 눈으로 볼 수 있는 것 중에서 가장 큰 것은 무엇일까. 그것은 바로 미리내다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401720&page=32","sourceTitle":"별과 관련된 순 우리말"},{"word":"별똥별","meaning":"'유성'의 우리말\\n유성(流星)을 우리말로 '별똥별'이라고 한다. 유성은 우주 공간의 먼지 덩어리가 지구의 대기권 안으로 들어와서 빠른 속도로 낙하하며 공기와 마찰하면서 빛을 내는 것을 말한다. 우리가 흔히 혜성이라고 부르는 꼬리별, 살별과는 다른 것이다. 한편 별똥별이 지구에 떨어진 것을 운석이라고 하는데, 이를 우리말로는 '별똘돌'이라고 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401720&page=32","sourceTitle":"별과 관련된 순 우리말"},{"word":"샛별","meaning":"새벽 동쪽 하늘에 반짝이는 금성.\\n해질녘에 보이는 금성을 '개밥바라기'라고 한 것처럼, 금성이 새벽하늘에 보일 때는 '샛별'이라고 부른다. '새벽의 별' 또는 '새로 난 별'이라는 의미를 줄인 말이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401720&page=32","sourceTitle":"별과 관련된 순 우리말"},{"word":"싸라기별","meaning":"싸라기처럼 아주 잘게 보이는 별. 잔별.\\n싸라기는 '쌀의 부스러기'를 말한다. 보통 '부스러기'는 작고 하찮은 것을 이르지만, 우리의 전통 정서에서 싸라기는 단순한 부스러기가 아니다. 쌀은 귀중한 식량이다. 그러니 쌀 한 톨뿐만 아니라 그 부스러기도 함부로 버릴 수 없다. 매우 귀한 물건을 '금싸라기'에 빗대는 것처럼, 싸라기는 '자잘하지만 매우 귀한 것'을 뜻한다. 그런 의미에서 우리 조상들은 무수히 흩어져 보이는 작은 별들을 단순히 잔별이라고 하지 않고 싸라기별이라고 부른 것이다. 이를 줄여서 '싸락별'이라고도 한다.\\n예) 저 하늘에 무수히 빛나는 싸라기별을 보아라. 그 가운데 이름을 가진 별이 몇이나 될까?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401720&page=32","sourceTitle":"별과 관련된 순 우리말"},{"word":"달가림","meaning":"'월식'의 순 우리말.\\n월식(月蝕)은 해와 지구와 달이 일직선으로 위치하여 지구의 그림자가 달을 덮어버리는 현상을 말한다. 일식(日蝕)은 반대로 달이 해를 가리는 것이다. 그런데 일식이나 월식에서 '식(蝕)'은 좀이 먹거나 썩어 들어간 상처를 뜻한다. 뜻이 별로 좋지 않은 한자말이다.\\n그것보다는 '해가림'이나 '달가림'이라는 말이 훨씬 느낌도 좋고 과학적이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401692&page=32","sourceTitle":"달과 관련된 순 우리말"},{"word":"달물결","meaning":"달빛이 은은히 비낀 물결.\\n달빛이 바다나 호수의 표면에 비껴드는 풍경 속에 홀로 서 있는 장면을 상상해보라. 어느 숲에선가 금방이라도 소복한 처녀귀신이 사뿐사뿐 걸어 나올 것 같다. 달물결은 자연이 만들어낸 가장 음산(陰散)한 풍경이라고 할 수 있다. 전통사사인 음양의 원리에 따르면 달과 물은 모두 음(陰)의 성질을 가지고 있다. 음의 기운이 강한 두 가지가 만났으니 음산함의 극치다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401692&page=32","sourceTitle":"달과 관련된 순 우리말"},{"word":"달안개","meaning":"달밤에 피어오르는 안개, 또는 달빛이 안개처럼 뿌옇게 보이는 것.\\n강의 어귀나 호수 주변에 피어오르는 안개와 달빛이 어우러진 말이다. 희뿌연 안개 사이로 푸르스름한 달빛이 비껴드는 장면이 떠올리면, 무섭고도 슬픈 전설의 배경이 연상된다. 달빛과 안개는 공포영화에 등장하는 단골 장면이기도 하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401692&page=32","sourceTitle":"달과 관련된 순 우리말"},{"word":"어스름달","meaning":"해가 진 다음이나 뜨기 전의 어슬녘에 뜨는 달.\\n'어스름'은 해가 진 다음이나 뜨기 전 얼마 동안 주위가 환한 상태를 말한다. 어둠과 밝음이 교차하는 시간이라 할 수 있다. 어스름달은 이렇듯 어스름할 무렵, 즉 '어슬녘'에 뜨는 달이다. 검기울어 가는 초저녁에 떠 있는 달이나, 해 뜨기 직전 동살이 들 무렵에 떠 있는 달 모두 어스름달이다. 달은 깜깜한 밤중일수록 더욱 선명하고 밝게 느껴진다. 그런 이치로 본다면 어스름달은 때가 조금 이르거나 늦은 달이라고 할 수 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401692&page=32","sourceTitle":"달과 관련된 순 우리말"},{"word":"지샌달","meaning":"먼 동이 튼 뒤 서쪽 하늘에 보이는 달.\\n밤을 지새우고 해가 뜬 뒤에도 서쪽 하늘에 아직 달이 떠 있는 것을 가끔 볼 수 있다. 이를 '지새는달' 또는 줄여서 '지샌달'이라고 한다. 밤을 지새운 다음에 떠 있는 달이라는 뜻이다. 지샌들은 어스름달의 한 가지다.\\n- 박남일의 '우리말 풀이사전' 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401692&page=32","sourceTitle":"달과 관련된 순 우리말"},{"word":"갓밝이","meaning":"새벽 동이 틀 무렵의 희끄무레한 상태. 지금 막 밝아진 때.\\n희미하게 날이 밝을 무렵을 흔히 '여명(黎明)'이라고 한다. 이것에 해당하는 우리말이 바로 '갓밝이'다. '금방'또는 '지금 막'이라는 뜻을 가진 꾸밈말 '갓'과 '밝다'의 명사형인 '밝이'가 붙어서 이루어진 말. '갓난아기'의 '갓'과 같은 이치이다.\\n예) 부지런하기로 소문난 김씨는 날마다 갓밝이에 벌써 쇠꼴을 한 바지게나 베어 짊어지고 사립짝을 밀고 들어온다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401594&page=33","sourceTitle":"해와 관련된 순 우리말"},{"word":"돋을볕","meaning":"해돋이 무렵 처음으로 솟아오르는 햇볕.\\n간밤의 어둠을 밀어내면서 부드럽게 세상을 비추는 돋을볕은 상서로운 기운을 느끼게 한다. 해돋이 때 처음 비쳐드는 빛을 '햇귀'라고도 하는데, 두 말의 느낌에 미묘한 차이가 있다.\\n돋을볕이 햇볕의 힘찬 움직임을 느끼게 하는 말이라면, 햇귀는 소중하고 존귀한 느낌을 주는 말이다.\\n예) 매 새해 첫날 해맞이를 하는 사람들은 기실 해돋이 때 뿜어져 나오는 돋을 볕을 보기 위해서 명산의 꼭대기나 동해 바닷가로 모여든다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401594&page=33","sourceTitle":"해와 관련된 순 우리말"},{"word":"해거름","meaning":"해가 서쪽으로 기울어질 무렵.\\n해거름은 '해'와 '거르다'가 결합된 말이다. '끼니를 거르다'라는 말처럼 '거르다'는 뭔가를 차례대로 해가다가 중간에 어느 자리를 빼고 넘기는 것을 말한다. 즉 해거름은 한 일도 없이 하루간 건너뛰듯 지나가 버린 것을 뜻한다. 해와 관련된 우리말을 자세히 보면 해가 떠 있는 동안의 시간의 흐름에 따라 세밀하게 구분되어 있음을 알 수 있다. 그 중에서 해거름은 해넘이보다 조금 앞선 때를 가리킨다. 해거름은 이미 해가 서쪽 산마루에 걸려 있어서 어떤 일을 새로 시작하는 것보다는 하던 일의 아귀를 지어야 할 때다.\\n예) 점심 먹고 바로 밭으로 온다던 서방님은 해거름이 다 되어서야 불콰한 낮을 하고는 갈지자걸음으로 나타났으니, 그 꼴을 본 아낙은 속이 끓어 어찌할 바를 몰랐다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401594&page=33","sourceTitle":"해와 관련된 순 우리말"},{"word":"해바라기","meaning":"양지바른 곳에서 햇볕을 쬐는 일.\\n따사한 햇살도 사시사철 무한정으로 모든 사람들의 머리 위를 비추지는 않는다. 흐린 날. 궂은 날 다 지나고 구름 걷힌 뒤에야 그 따뜻한 기운을 비로소 사람들에게 선사한다. 그래서 햇볕은 더욱 소중하고 고맙게 느껴진다. 해바라기는 해와 사람의 가장 직접적인 만남이다. 겨울을 지난 봄철에는 하루가 다르게 해가 길어지는 것을 보면서 사계절의 변화를 실감하게 된다. 따사한 봄볕이 내리쬐기 시작할 무렵 도심지 공원 한구석에서 해바라기하는 노인들을 종종 볼 수 있다. 볕뉘를 쬐면서 노인들은 무슨 생각을 하게 되는 것일까?\\n예) 날도 좋은데 드렇게 방 안에만 틀어박혀 있지 말고 옥상에 올라가서 해바라기라도 하렴!","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401594&page=33","sourceTitle":"해와 관련된 순 우리말"},{"word":"햇발","meaning":"사방으로 뻗친 햇살.\\n빗발, 눈발, 서릿발 등 날씨와 관련된 말 뒤에 붙는 '-발'은 당찬 기세를 뜻한다. 따라서 햇발은 기세 좋게 강하게 뻗치는 햇살을 나타낼 때 쓰는 말이다. 예컨대 구름 사이로 희미하게 내비치는 햇살을 햇발이라고 부르지는 않는다. 사방으로 펼쳐진 햇살만을 햇발이라고 부른다.\\n예) 우리가 탄 자동차는 노해에 떨어지는 따가운 햇발을 받으며 해변을 따라 달려갔다.\\n- '좋은 문장을 쓰기 위한 우리말 풀이사전' 중에서","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401594&page=33","sourceTitle":"해와 관련된 순 우리말"},{"word":"지질하다","meaning":"★ [형] 보잘것없고 변변하지 못하다. - '지질하다' 대신 '지질맞다'를 써도 좋다. 어찌씨는 '지질지질'인데, '지질지질'은 '물기가 많아서 조금 진 듯한 모양'을 가리키기도 한다. '지질하다'도 두 가지 뜻으로 쓰이는 말이엇 '싫증날 만큼 지루하다'는 의미를 갖기도 한다.\\n예)\\n▶섣불리 도망질을 치다가 붙들리는 날이면 지질한 목숨이나마 보전 못할 테니까….<홍명희, 임걱정>\\n▶지질한 서방 믿어 보며 사는 계집처럼 가련한 자도 없을 거라. <이문구, 장한몽>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401490&page=33","sourceTitle":"지질하다"},{"word":"곰비임비","meaning":"★연거푸. 자꾸자꾸. [양태]\\n@1. 일이나 물건이 거듭 모이는 모양\\n2. 물건이 거듭 쌓이거나 일이 겹치는 모양. 예) 병일은 곰비임비 술을 들이켰다(현진건의 『적도』에서)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401314&page=33","sourceTitle":"곰비임비"},{"word":"밑두리콧두리","meaning":"확실히 알기 위하여 자세히 자꾸 캐어묻는 근본.\\n예) 과부 할미는 밑두리콧두리 별것을 다 묻는다는 실뚱머룩한 표정으로 입을 삐죽거렸다.\\n<문순태, 타오르는 강>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401272&page=33","sourceTitle":"밑두리콧두리"},{"word":"다날","meaning":"원문에서 월요일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceTitle":"요일"},{"word":"부날","meaning":"원문에서 화요일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceTitle":"요일"},{"word":"무날","meaning":"원문에서 수요일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceTitle":"요일"},{"word":"남날","meaning":"원문에서 목요일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceTitle":"요일"},{"word":"쇠날","meaning":"원문에서 금요일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceTitle":"요일"},{"word":"흙날","meaning":"원문에서 토요일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceTitle":"요일"},{"word":"해날","meaning":"원문에서 일요일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401156&page=33","sourceTitle":"요일"},{"word":"하루","meaning":"원문에서 1일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"이틀","meaning":"원문에서 2일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"사흘","meaning":"원문에서 3일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"나흘","meaning":"원문에서 4일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"닷새","meaning":"원문에서 5일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"엿새","meaning":"원문에서 6일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"이레","meaning":"원문에서 7일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"여드레","meaning":"원문에서 8일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/s 01020&page=33","sourceTitle":"日"},{"word":"스물하루","meaning":"원문에서 21일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물이틀","meaning":"원문에서 22일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물사흘","meaning":"원문에서 23일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물나흘","meaning":"원문에서 24일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물닷새","meaning":"원문에서 25일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물엿새","meaning":"원문에서 26일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물이레","meaning":"원문에서 27일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물여드레","meaning":"원문에서 28일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"스물아흐레","meaning":"원문에서 29일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"서른날","meaning":"원문에서 30일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"그믐날","meaning":"원문에서 31일을 이르는 말로 소개하고 있어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=401020&page=33","sourceTitle":"日"},{"word":"해오름달","meaning":"1월: 새해 아침에 힘있게 오르는 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"시샘달","meaning":"2월: 잎샘추위와 꽃샘추위가 있는 겨울의 끝 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"물오름달","meaning":"3월: 뫼와 들에 물 오르는 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"잎새달","meaning":"4월: 물오른 나무들이 저마다 잎 돋우는 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"푸른달","meaning":"5월: 마음이 푸른 모든이의 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"누리달","meaning":"6월: 온 누리에 생명의 소리가 가득차 넘치는 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"견우직녀달","meaning":"7월: 견우직녀가 만나는 아름다운 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"타오름달","meaning":"8월: 하늘에서 해가 땅위에선 가슴이 타는 정열의 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"열매달","meaning":"9월: 가지마다 열매맺는달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"하늘연달","meaning":"10월: 밝달뫼에 아침의 나라가 열린달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"미틈달","meaning":"11월: 가을에서 겨울로 치닫는 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"매듭달","meaning":"12월: 마음을 가다듬는 한해의 끄트머리 달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400975&page=33","sourceTitle":"月"},{"word":"거섶","meaning":"[목재]\\n1. 물이 둑에 스쳐서 개개지 못하게 둑의 가에 말뚝을 박고 가로 결은 나뭇가지\\n2. 삼굿(삼을 벗기기 위하여 찌는 구덩이나 큰 솥) 위에 덮는 풀\\n3. 비빔밥에 섞는 나물.\\n예) … 겨우내 얼지 않고 흐르는 여우목이 있었으며, 발 벗지 않고도 건널 수 있게 고리삭아 가는 오리나무 서너 개를 걸쳐놓은 거섶이 있었다 (이문구의 소설 '관촌수필'에서)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400845&page=33","sourceTitle":"거섶"},{"word":"사리다","meaning":"1. 국수, 새끼, 실 따위를 동그랗게 포개어 감다.\\n▶ 다음에 쓰기 좋게 줄을 잘 사려 두어라.\\n2. 뱀 따위가 몸을 똬리처럼 동그렇게 감다.\\n▶ 그 신(神)은 몸을 사리면 팔 척 장신의 남자만큼 하여지지만, 그 몸을 늘이면 이 바다 안에 꽉 들어찰 만큼 크다. <한승원, 해일>\\n3. 짐승이 겁을 먹고 꼬리를 사리고 숨었다.\\n4. 박아서 나온 못을 꼬부려 붙이다.\\n5. 어떤 일에 적극적으로 나서지 않고 살살 피하며 몸을 아끼다.\\n▶ 그는 이번 일로 불이익이 있을까 몸을 사리는 눈치였다.\\n6. 정신을 바짝 가다듬다.\\n▶ 그는 새삼 마음을 굳게 사려 먹었다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400750&page=33","sourceTitle":"사리다"},{"word":"불땀","meaning":"[불] 화력의 세고 약한 정도.\\n▶ 그녀는 불땀이 좋은 바싹 마른 삭정이만을 골라 불을 지폈다. <조정래, 태백산맥>\\n♣ 썩은 장작은 불땀이 적고, 참나무 장작은 불땀이 세다. 나무가 자랄 때 남쪽으로 향하여, 햇볕을 많이 받아 불땀이 좋은 부분을 '불땀머리'라고 한다. 장작의 '불땀머리'를 치며 잘 쪼개진다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400635&page=33","sourceTitle":"불땀"},{"word":"가루비","meaning":"가루처럼 포슬포슬 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"잔 비","meaning":"가늘고 잘게 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"실 비","meaning":"실처럼 가늘게, 길게 금을 그으며 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"싸락비","meaning":"싸래기처럼 포슬포슬 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"날 비","meaning":"놋날(돗자리를 칠 때 날실로 쓰는 노끈)처럼 가늘게 비끼며 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"발 비","meaning":"빗발이 보이도록 굵게 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"작달비","meaning":"굵고 세차게 퍼붓는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"달구비","meaning":"달구(땅을 다지는 데 쓰이는 쇳덩이나 둥근 나무 토막)로 짓누르듯 거세게 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"여우비","meaning":"맑은 날에 잠깐 뿌리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"먼지잼","meaning":"먼지나 잠재울 정도로 아주 조금 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"개부심","meaning":"장마로 홍수가 진 후에 한동안 멎었다가 다시 내려, 진흙을 씻어 내는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"바람비","meaning":"바람이 불면서 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"도둑비","meaning":"예기치 않게 밤에 몰래 살짝 내린 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"누 리","meaning":"우박.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"궂은비","meaning":"오래 오래 오는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"보름치","meaning":"음력 보름 무렵에 내리는 비나 눈.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"그믐치","meaning":"음력 그믐께에 내리는 비나 눈.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"웃 비","meaning":"비가 다 그치지는 않고, 한창 내리다가 잠시 그친 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"해 비","meaning":"한쪽에서 해가 비치면서 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"꿀 비","meaning":"농사짓기에 적합하게 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"단 비","meaning":"꼭 필요할 때에 알맞게 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"목 비","meaning":"모낼 무렵에 한목 오는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"못 비","meaning":"모를 다 낼 만큼 흡족하게 오는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"약 비","meaning":"요긴한 때에 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"모다깃비","meaning":"뭇매를 치듯이 세차게 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"우레비","meaning":"우레가 치면서 내리는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"마른비","meaning":"땅에 닿기도 전에 증발되어 버리는 비","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"오란비","meaning":"장마의 옛말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"건들장마","meaning":"초가을에 비가 내리다가 개고, 또 내리다가 개곤 하는 장마.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"일 비","meaning":"봄비. 봄에는 할 일이 많기 때문에 비가 와도 일을 한다는 뜻으로 쓰는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"잠 비","meaning":"여름비. 여름에는 바쁜 일이 없어 비가 오면 낮잠을 자기 좋다는 뜻으로 쓰는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"떡 비","meaning":"가을비. 가을걷이가 끝나 떡을 해 먹으면서 여유 있게 쉴 수 있다는 뜻으로 쓰는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"술 비","meaning":"겨울비. 농한기라 술을 마시면서 놀기 좋다는 뜻으로 쓰는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"비 꽃","meaning":"비 한 방울 한 방울. 비가 시작될 때 몇 방울 떨어지는 비.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400517&page=34","sourceTitle":"<<비의 우리말 >>"},{"word":"모꼬지","meaning":"[놀이] 여러 사람이 놀이나 잔치 따위로 모이는 일.\\n▶ 혼인날에도 다른 제자보다 오히려 더 일찍이 와서 모든 일을 총찰하였고 모꼬지 자리에서도 가장 기쁜 듯이 술을 마시고 춤을 추고 즐기었다. <현진건, 무영탑>","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400412&page=34","sourceTitle":"모꼬지"},{"word":"안통","meaning":"①그릇이나 통 따위의, 테두리가 있는 물체의 속 넓이. ¶그 그릇은 보기보다 안통이 커서 쓸모가 많다.\\n② ‘속마음’을 속되게 이르는 말. ¶안통이 그렇게 좁아서 어디 같이 지내겠느냐?\\n③안으로 향한 부분이나 안에 있는 부분. =안쪽. ¶지리산 산자락이 한참 북쪽으로 흘러가다가 산자락 끝이 불쑥 솟아오른 그 안통 고원 지대가 운봉이었다.〈송기숙, 녹두 장군〉","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400376&page=34","sourceTitle":"안통"},{"word":"담빡","meaning":"깊은 생각 없이 가볍게 행동하는 모양.\\n'담빡'과 비슷한 말로, '덥석'또는 '냉큼'이라는 말이 있어요. 달려덜어 냉큼 움켜잡거나 할 때 '덥석 잡는다'라고 하잖아요. 이렇게 행동이 재빠를 때는 그 짧은 시간 동안 깊은 생각을 하지는 못하겠지요. 그럼 거의 후회할 짓을 하게 되고 말이에요. 성격 급한 친구들, '담빡'행동하지 말고 늘 먼저 생각하고 행동하세요.\\n예) 예쁜 꽃이 눈에 쏙 들어오기에 담빡 꺾어 왔지요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400277&page=34","sourceTitle":"담빡과 더펄더펄"},{"word":"더펄더펄","meaning":"들떠서 침착하지 못하고 가볍게 행동하는 모양.\\n'더펄더펄'도 '담빡'처럼 가볍게 행동한다는 뜻인데, 여기서 나온 말이 몇 개 있어요. 우선 '더펄이'는 붙임성이 있고 활발한 사람을 말해요. 본뜻과는 달리 그리 부정적인 사람을 일컫지는 않는 모양이에요. 또한 '더펄더펄'이 더부룩한 털이나 머리칼 같은 것이 출렁거리듯 흔들리는 모양을 가리키기도 하기 때문에 '더펄머리'라는 말도 있어요. 더펄더펄 날리는 더부룩한 머리털을 말하지요. 그리고 '더펄개'는 온몸에 털이 길게 나서 더펄거리는 개, 즉 삽살개를 말해요.\\n예) 꽃님이는 생긴 것과 다르게 더펄더펄 선머슴처럼 군다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400277&page=34","sourceTitle":"담빡과 더펄더펄"},{"word":"너스레","meaning":"남을 놀리려고 수다스럽게 늘어놓는 말\\n'너스레'는 원래 흙구덩이나 그릇, 또는 바닥에 물건이 빠지지 않게 하려고 걸쳐 놓는 막대기를 말해요. 지금은 그 뜻이 변해 '남을 놀리려고 수다스럽게 늘어놓는 말이나 말솜씨'를 말하지요.\\n'너스레을 놓다', '너스레를 떨다', '너스레를 부리다'로 쓰인답니다.\\n예) 너무 미안한 마음에 괜히 너스레를 떨며 웃어댔다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400115&page=34","sourceTitle":"너스레"},{"word":"모르쇠","meaning":"아는 것이나 모르는 것이나 다 모른다고 잡아떼는 일.\\n덮어놓고 모른다고 잡아떼는 일을 '모르쇠'라고 해요. 거의 들어보지 못했던 말이죠? 그래서인지 우리말을 맞추는 텔레비전 프로그램에서 10대 청소년들에게 이 말의 뜻을 추측해 보라고 했더니 '지능이 떨어지는 새'라고 대답했대요.\\n'모르쇠 잡다'의 모양으로도 쓰이는데, '전혀 알지 못하는 체한다'는 뜻이에요. 그런데 '모르다'라는 말이 어떻게 해서 생겨났는지 아나요? 아, 알지 못한다고요? 그래요. 맞았어요! 너무나 당연한 말이겠지만, '모르다'는 '알지 못하다'에서 나온 말이에요. 우리말의 어원도 가만 보면, 간단하고도 참 재미나지요?\\n그건 그렇고, 알면 안다고 할 것이지 왜 모른다고 잡아뗄까요? 대답하기 곤란해서? 아니면 책임지기 싫어서 나 몰라라 하려고? 어찌되었든 '모르쇠'는 좋은 뜻으로 쓰이는 예는 거의 없어요. 질문한 사람 속 터지게 '모르쇠'는 하지 말아요!\\n예) 유씨는 굳이 더 캐어물으려고 하지 않고 그쯤에서 짐짓 모르쇠를 해 버렸다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=400040&page=34","sourceTitle":"모르쇠"},{"word":"저지레","meaning":"'저지레'는 일을 그르치게 하거나 말썽을 부린다는 뜻으로, '저지르다'에서 비롯된 말이에요. '저지르다'는 '네가 기어이 일을 저질렀구나!' 처럼 탈이 나게 한다는 부정적인 의미로 쓰이는데, 대체로 아이들이 일으킨 말썽이나 문제를 가리킬 때 쓰인답니다. 뭐, 가끔은 호기심 많은 어린 아이들이 그르친 가벼운 '저지레'는 귀여울 때도 있지만 말이에요.\\n예) 네 저지레 때문에 내가 얼마나 혼난 줄 알아?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399951&page=34","sourceTitle":"저지레"},{"word":"갈무리","meaning":"물건을 잘 챙겨 간직함. 일을 마무리함.\\n'갈무리'는 주로 '저장'의 뜻으로 쓰이고, 일을 '마무리'한다는 의미로 쓰여요.\\n물건뿐 아니라 넘쳐 나는 정보들도 잘 갈무리해서 내 것으로 만들어","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399853&page=34","sourceTitle":"갈무리, 곰비임비"},{"word":"함초롬","meaning":"어떤 기운이 서리어 있거나 물기를 머금고 있어 차분하고 고운 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399720&page=34","sourceTitle":"함초롬, 해설피"},{"word":"해설피","meaning":"해가 질 때 빛이 약해진 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399720&page=34","sourceTitle":"함초롬, 해설피"},{"word":"케케묵다","meaning":"오래되어서 낡았다는 뜻의 '케케묵다'는 흔히 '켸켸묵다'나 '캐캐묵다'로 잘못 쓰이고 있어요.\\n'케케묵다'는 '켜이켜이 묵다'에서 비롯된 말이에요. '켜'는 '포개진 물건의 층'을 뜻하고, '켜켜이'는 '여러 켜마다'의 뜻이지요. 층층이 여러 켜마다 오래되었으니 얼마나 낡았을까요? 아무튼 이 말은 물건뿐 아니라 새로운 지식 같은 것을 받아들이지 못하는 고리타분한 생각 등을 가리키는 말로 쓰이기도 해요.\\n예) 그렇게 겸손하게 행동하면 이 젊은이들은 케케묵은 구닥다리라고 흉볼걸요?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399686&page=34","sourceTitle":"케케묵다"},{"word":"추레하다","meaning":"겉모양이 깨끗하지 못하고 생기가 없다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399559&page=35","sourceTitle":"추레하다, 후줄근하다"},{"word":"후줄근하다","meaning":"옷이나 피륙 따위가 젖거나 해서 추레한 모양. 몸이 지쳐 기운이 없다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399559&page=35","sourceTitle":"추레하다, 후줄근하다"},{"word":"암팡지다","meaning":"몸은 작아도 힘차고 다부지다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399469&page=35","sourceTitle":"암팡지다, 다부지다"},{"word":"다부지다","meaning":"벅찬 일을 치러 낼 힘이 있다.\\n'암팡지다'는 작은 몸이지만 힘차고 다부지다는 뜻이에요. '다부지다'는 벅찬 일을 치러 낼 힘이 있다는 뜻이지요. '작은 고추가 맵다'는 말이 생각나는 말이에요.\\n'다부지다'도 물론 '다부진 몸매', '다부진 각오', '다부진 꿈'처럼 꽉 차고 당차고 힘찬 이미지를 느끼게 하는 말이고요.\\n예) 당장이라도 한판 붙자는 듯 두 팔을 걷어붙인 그 모습은 암팡지고 다부지다 못해 오히려 귀여움을 느끼게 했다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399469&page=35","sourceTitle":"암팡지다, 다부지다"},{"word":"오붓하다","meaning":"아늑하고 정답다. '\\n오붓하다'는 그리 많지 않은 사람들이 다정하게 아늑한 시간을 갖게될 때 쓰이는 말이에요. 예) 자네하고 오붓하게 여행도 즐기고 문병도 하자는 게지. 그리고 '오붓하다'는 말은 '살림살이가 넉넉하다'는 뜻도 있어요.\\n예) 만일의 경우에 대비하여 미리 준비해 가지고 왔던 돈뭉치를 내흔드는 살림이 오붓한 집 아버지도 있었다. 하나의 낱말이 '다정하다'는 뜻과 '살림살이가 넉넉하다'는 뜻을 함께 쓴다는 게 조금 생뚱맞게 느껴지지만, 살림살이도 어느 정도는 넉넉해야 가족끼리 더욱 오붓할 수 있기 때문이겠지요?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399388&page=35","sourceTitle":"오붓하다, 조붓하다"},{"word":"조붓하다","meaning":"조금 좁은 듯하다.\\n'조붓하다'는 말은 설명하자니 퍼뜩 어떤 노래가 떠오르네요. '산 너머 조붓한 오솔길에 봄이 찾아온다고~'로 시작되는 '봄이 오는 길'이라는 경쾌한 노래예요. 그런데 왠지 넓은 길보다는 조금 좁더라도 '조붓한' 오솔길이 더 '오붓하게' 느껴지지요?\\n예) 언니와 나는 가끔 뒷산의 조붓한 길을 오붓하게 걷곤 했다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399388&page=35","sourceTitle":"오붓하다, 조붓하다"},{"word":"알토란같다","meaning":"쓸모 있고 야무져서 버릴 데가 없다.\\n'토란'이라는 푸성귀가 있어요. 소화를 돕고 양양가도 많아 국으로 많이 만들어 먹는 토란은 땅에서 캐내어 먹어요. 그런데 처음에 토란을 파내면 흙이 묻어 있고 잔뿌리도 많지요. 이렇게 지저분한 토란의 흙을 털어 내고 잔뿌리도 다듬어 깨끗하게 한 토란을 '알토란'이라고 해요. 당연히 보기 좋게 쓸모 있겠죠? 그래서 여기서 '알토란같다'는 말이 나왔어요. '모양이 깨끗하고 매끈하다', '야무지고 버릴데가 없다', '살림살이를 알뜰하게 한다'는 뜻으로 쓰인답니다.\\n예) 저 알토란같이 생긴 아이는 뉘 집 아들인고?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399245&page=35","sourceTitle":"알토란같다, 옹골차다"},{"word":"옹골차다","meaning":"야무지게 속이 꽉 차 있다.\\n'옹골차다'는 '알토란같다'와 마찬가지로 야무지게 속이 꽉 차 있다는 뜻이에요. '어떤 것이 가지고 있어야 할 내용에 조금도 모자람이 없는 상태'를 말하는 '옹글다'와 뜻이 비슷하면서 느낌이 더 강한 말이 바로 '옹골차다'예요. 여기서 '옹'은 '옹고집'에 쓰인 '옹'과 같은 말로, 대체로 작지만 단단하고 완고함을 뜻한답니다.\\n예) 병어는 버릴 부분이 거의 없는 옹골찬 생선이다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399245&page=35","sourceTitle":"알토란같다, 옹골차다"},{"word":"아리다","meaning":"혀끝을 똑 쏘는 것 같은 느낌이 있다. 아프다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399147&page=35","sourceTitle":"아리다, 아리땁다"},{"word":"아리땁다","meaning":"사랑스럽고 아름답다. '아리다'와 '아리땁다'의 설명은 우리 민족의 대표적인 민요 '아리랑'과 함께 해야 할 것 같아요.\\n오랜 옛날부터 우리나라 사람들의 사랑을 받으며 널리 불린 노래 '아리랑'은 무슨 뜻일까요? 아직까지 확실한 해석은 없지만 두 가지 정도로 추측할 수 있다고 해요.\\n첫 번째, '아리랑'에서 '아리'를 '아프다'는 뜻의 '아리다'로 보는 거예요. 마음의 상처를 받았을 때 '아리다'라는 말을 하니까 '아리'를 '아프게'로 풀이한다면 '아리랑'은 '마음이 아프도록 (그리운)님'이 되는 것이지요 ('랑'은 '님'이라는 뜻이에요).\\n두 번째로 '아리랑'의 '아리'를 '아리따운(아리+다운)'의 '아리',즉 '곱다', '아름답다'로 해석하는 거예요. 그러니까 '아리랑'의 두 번째 뜻은 '고운 님'이에요.\\n노래 가사에서도 그렇고, 사랑은 아픈 거라고 말하는 걸 보면 '아린' 사랑과 '아리따운 '사랑이 같은 말이라고 해도 지나친 말은 아니겠지요?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399147&page=35","sourceTitle":"아리다, 아리땁다"},{"word":"아름차다","meaning":"힘에 벅차다.\\n'아름차다'는 '힘에 겹다, 벅차다'는 뜻인데, 여기서 '아름'은 두 팔을 벌려 껴안은 둘레의 길이를 말해요. 흔히 나무의 둘레를 '아름'으로 표현하지요. 그래서 흔히 '한 아름'이라고 하면 넉넉하게 많다는 느낌으로 쓰여요. 무엇이든 간에, 두 팔로 감싸 안을 정도로 한 아름인 것이면 힘에 벅차기도 하겠죠?\\n예) 나에게는 오늘 꼭 해야 할 아름찬 과제가 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=399085&page=35","sourceTitle":"아름차다"},{"word":"심드렁하다","meaning":"마음에 들지 않아 관심이 없다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398933&page=35","sourceTitle":"심드렁하다, 시큰둥하다"},{"word":"시큰둥하다","meaning":"마음에 내키지 않아 말이나 하는 짓에 성의가 없다.\\n'심드렁하다'는 마음이나 입맛에 맞지 않아 관심이 없어서 서두르지 않을 때 쓰는 말이에요. '마음에 내키지 않아 말이나 하는 짓에 성의가 없다'는 '시큰둥하다'와 비슷한 뜻이지요.\\n예) 우리가 아무리 재롱을 떨어도 할머니의 심드렁하고 시큰둥한 표정은 변하지 않았다.\\n아무리 예쁜 얼굴이라도 항상 심드렁하고 시큰둥한 얼굴은 예뻐 보이지 않겠지요?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398933&page=35","sourceTitle":"심드렁하다, 시큰둥하다"},{"word":"슬밋하다","meaning":"거침새 없이 길고 곧다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398822&page=35","sourceTitle":"슬밋하다와 훤칠하다"},{"word":"훤칠하다","meaning":"길이가 길고 미끈하다. 소설가 현진건의 <불국사 기행> 이라는 글을 보면 '슬밋하다'는 말이 나와요. 불국사의 석굴암 벽 가운데에 병을 움켜쥐고 서 있는 '십이면관음보살'이 새겨져 있는데, 이 '십일면관음보살'의 허리를 '좁은 듯하면서도 슬밋한 허리'라고 표현했어요.\\n보살상의 허리를 보세요. 어때요, 거침새 없이 길고 곧은 '슬밋하다'의 뜻과 느낌을 알 것도 같지요? '훤칠하다'는 길고 미끈하거나 막힘없이 깨끗하고 시원스러운 것을 말해요. 키가 큰 것뿐 아니라 시원한 성격을 빗댈 때도 훤칠하다고 표현하지요.\\n'헌칠하다'는 말도 같이 쓰이기는 한데, 이 말은 키나 몸집이 보기 좋을 때만 쓴다는 점이 달라요. 다시 말해 '헌칠하다'보다는 '훤칠하다'가 더 넓은 뜻으로 쓰이는 거예요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398822&page=35","sourceTitle":"슬밋하다와 훤칠하다"},{"word":"스산하다","meaning":"몹시 어수선하고 쓸쓸하다.\\n'스산하다'는 '스산한 하늘'이나 '스산한 바람'처럼 날씨가 약간 흐리고 으스스할 때나 마음이 쓸쓸하거나 어수선할 때 쓰는 말이에요.\\n예) 안개가 짙게 깔려 있어서 혼자 걷는 새벽길이 더욱 스산하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398730&page=35","sourceTitle":"스산하다와 을씨년스럽다"},{"word":"을씨년스럽다","meaning":"날씨나 분위기 따위가 스산하고 쓸쓸하다.\\n'을씨년스럽다'는 스산함이 조금 더한 뜻인데요, 이 말은 '을사년'에서 유래되었을 가능성이 많아요. 일본이 우리나라를 빼앗기 위해 '을사년'인 1905년에 강제로 '을사 늑약'을 맺었어요. 우리나라로서는 아주 부끄럽고 분한 일이었고, 그래서 사람들 마음도 슬프고 허탈했겠지요. 이 일로 인해 마음이나 날씨가 어수선하고 흐린 것을 '을사년스럽다'고 했는데, 소리가 나는 대로 '을싸년스럽다'로 변했다가 '을씨년스럽다'가 되었다고 해요. 우리말에는 이렇게, 사람들의 감정이나 생활뿐 아니라 우리의 역사까지도 고스란히 담겨 있답니다.\\n예) 가을날 해 저문 후의 호수는 을씨년스러웠다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398730&page=35","sourceTitle":"스산하다와 을씨년스럽다"},{"word":"서름하다","meaning":"남과 가깝지 못하여 서먹하다. 사물에 익숙하지 못하다.\\n'서름하다'는 다른 사람과 친하지 않아 서먹서먹하다는 뜻이에요.\\n하지만 꼭 사람에게만 쓰는 말은 아니어서, 어떤 사물에 익숙하지 못할 때도 '서름하다'는 표현을 해요. 자주 들어 보지 못한 말이거나, 어쩌면 처음 들어봤을 '서름한'말이기는 하지만 잘 기억해 두세요.\\n예) 지도에서도 못 찾을 서름한 먼 나라에서 걸","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398629&page=35","sourceTitle":"서름하다, 시쁘다"},{"word":"생때같다","meaning":"몸이 튼튼하여 통 병이 없다.\\n흔히 아픈 데 없이 건강한 아이를 '생때 같은 자식'이라고 말해요. 그리고 듣기만 해도 참 안타까운 말이지만 '생때 같은 사람이 죽다'처럼 건강하던 사람이 갑자기 죽게 되었을 때 주로 이 표현을 많이 써요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398588&page=36","sourceTitle":"생때같다, 생뚱맞다"},{"word":"생뚱맞다","meaning":"하는 짓이나 말이 앞뒤가 서로 맞지 않고 엉뚱하다.\\n'상황에 맞지 않고 엉뚱하다'는 뜻인 '생뚱맞다'는 '쌩뚱맞죠?'라는 유행어 때문인지 참 재미나게 들리는 말이에요. 이렇게 말소리의 느낌마저 재미난 말 '생뚱맞다'는 어떻게 생겼을까요? '생뚱'의 '생'은 무리하거나 애매함을 이르는 말이에요. '생트집', '생사람' 등과 같이 쓰이지요. 그리고 '뚱'은 '엉뚱하다'의 '뚱'에서 온 것으로 보고요. 결국 '엉뚱하다'를 조금 더 강조한 뜻으로 생긴 말이 '생뚱맞다'인 샘이에요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398588&page=36","sourceTitle":"생때같다, 생뚱맞다"},{"word":"반지빠르다","meaning":"말이나 하는 짓이 얄밉다.\\n'반지빠르다'는 '말이나 하는 짓이 얄미울 정도로 약삭빠르다'는 뜻이에요. '교만스럽다'는 뜻으로도 쓰이는데, 겸손함 없이 잘난 체하고 버릇없다는 거예요. 자신이 잘났다고 생각하는 건 자유라고 해도 남을 깔보고 업신여기는건 바르지 않은 행동이겠지요?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398431&page=36","sourceTitle":"반지빠르다, 새되다"},{"word":"새되다","meaning":"소리가 높고 날카롭다.\\n'새되다'는 요즘 들어 '우스운 꼴이 됐다, 황당하다'는 뜻으로 사용되기도 하는데, 원래는 높고 날카로운 소리를 '새된'소리라고 해요. 다시 말해 '새되다'고 하면 소리나 목소리가 높고 날카롭다는 뜻이에요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398431&page=36","sourceTitle":"반지빠르다, 새되다"},{"word":"밍근하다","meaning":"미지근하다. 뜨겁지도 차갑지도 않은 미지근한 상태를 '밍근하다'고 해요.\\n작은 말은 '맹근하다'지요. 그런데 미지근한다는 건 대충 어느 정도의 온도를 말할까요? 사람의 기본 체온인 36.5도보다 높으면 뜨겁다고 느끼고, 낮으면 차갑다고 느낀다고해요. 그러니까 밍근한 물의 온도는 36도 정도가 될 거예요. 보기글 - 말린 표고버섯은 찬물보다 흡수가 빠른 밍근한 물에 불려야 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398343&page=36","sourceTitle":"밍근하다, 바투"},{"word":"바투","meaning":"두 물체 사이나 거리가 썩 가깝게, 시간이나 길이가 아주 짧게.\\n'시간이나 공간이 몹시 가깝게 붙어 있다.' 또는 '길이가 매우 짧다'는 뜻으로 '밭다'라는 말이 있어요. '바투'는 '밭다'에서 비롯된 말이에요. 보기글 - 손톱을 너무 바투 잘라 아프다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398343&page=36","sourceTitle":"밍근하다, 바투"},{"word":"무쪽같다","meaning":"사람의 생김새가 몹시 못나다.\\n커다랗고 하얀 무를 자르면 쩍쩍~ 잘 갈라져요. 그래서 어떤 일을 단칼에 거절할 때 '무쪽같이 자른다'고 하지요. 그런데 어쩌다 실수로 잘못 잘라진 무쪽은 울퉁불퉁하고 모양이 예쁘지 않아요. 이렇게 잘못 갈라진 무쪽을 못 생긴 여자에 빗대어 '무쪽같다'고 말하게 된 거예요. 하지만 아무리 '무쪽같이'생긴 여자라 할지라도 마음이 고우면 되지 않겠어요?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398293&page=36","sourceTitle":"무쪽같다, 미쁘다"},{"word":"미쁘다","meaning":"믿음성이 있다.\\n'미쁘다'는 '믿다'의 '믿'과 '브다'가 합쳐서 생긴 말인데, '믿음성이 있다'또는 '진실하다'는 뜻으로 쓰이기도 하지요. 물론, 진실하니 믿음이 생겼겠지만 말이에요. 어떤 대상에 대해 믿음이 간다는 것, 특히 사람이 사람을 믿는다는 것은 세상을 살아가는 데에 있어 가장 기본적이고 중요한 마음 자세라는 생각이 들어요. '진실하다, 믿음이 간다, 믿음직스럽다, 미덥다, 미쁘다 ‥‥‥.' 어때요, 말만 들어도 참 든든하죠? 친구들은 주변에 믿어도 될 만한 '미쁜' 사람이 몇 명이나 있나요?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398293&page=36","sourceTitle":"무쪽같다, 미쁘다"},{"word":"머쓱하다","meaning":"쑥스럽고 어색하다 무안을 당하거나 하여 기가 죽을 때 '머쓱하다'고 해요.\\n'쑥스럽고 어색하다', 또는 '멋쩍다'등으로 쓰는 말이지요. 같은 뜻의 사투리로 '뻘쭘하다'는 말도 있어요. 예) 내가 우스갯소리를 했는데도 웃지 않아서 정말 머쓱했다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398196&page=36","sourceTitle":"머쓱하다, 멀쑥하다"},{"word":"멀쑥하다","meaning":"멋없이 키가 크고 묽게 생기다.\\n'머쓱하다'가 어울리지 않게 키가 크다는 뜻도 있는데, 이것과 비슷해서 헷갈리기 쉬운 말로 '멀쑥하다'라는 말이 있어요. '멀쑥하다'는 '멋없이 키가 크다'는 뜻과 함께 '물기가 많아 묽다', '지저분하지 않고 멀끔하다'는 뜻을 함께 가지고 있어요. 예) 방금 빳빳하게 다린 것 같은 멀쑥한 정장을 입은 사람이 내게 말을 걸었다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398196&page=36","sourceTitle":"머쓱하다, 멀쑥하다"},{"word":"마뜩하다","meaning":"마음에 들다.\\n'마뜩하다'는 '마음에 들다', '마음에 마땅하다'는 뜻이에요. '마땅한' 것은 알맞거나 옳은 것이니까, 알맞게 내 마음에 쏙 드는 모양새를 생각하면 될거예요. 예: 그는 맡겨진 배역이 마뜩하지 않았지만, 그래도 열심히 해 보리라 다짐했다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398021&page=36","sourceTitle":"마뜩하다, 맵자하다"},{"word":"맵자하다","meaning":"모양이 체격에 어울려서 맵시가 있다.\\n자주 쓰는 말은 아니지만, 맵시 있게 옷을 차려 입었다든지 모양새가 아름다울 때 '맵자하다'고 해요. 줄임말은 '맵자다'인데, 이와 비슷한 말로 '맵짜다'가 있어요. 하지만 '맵짜다'는 음식 맛이나 바람, 또는 성미가 매섭게 독하거나 사납다는 뜻이어서 '맵자하다'와는 전혀 다른 말이지요. 예: 쭉 뻗은 직선과 부드러운 곡선이 조화를 이루는 한복은, 입었을 때 더욱 맵자하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=398021&page=36","sourceTitle":"마뜩하다, 맵자하다"},{"word":"깡똥하다","meaning":"겉에 입은 옷이 속이 드러날 정도로 매우 짧다.\\n귀엽고 재미난 발음의 '깡똥하다'는 '강동하다'의 센말이에요. 특히 속옷이나 아래옷이 드러날 만큼 겉옷이나 윗옷의 길이가 짧다는 뜻으로 쓰이지요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397969&page=36","sourceTitle":"깡똥하다, 꺼림하다"},{"word":"꺼림하다","meaning":"한 일이 마음에 걸려 편하지 못하다.\\n자기가 한 일이 후회되고 마음에 자꾸 걸려 편하지 못한 것을 '꺼림하다'고 해요. 매우 꺼림한 것은 '꺼림칙하다'고 하지요. 흔히 말하는 '꺼림직하다'는 잘못 쓰인 거예요. 어떤 일을 했는데, 꺼림하거나 끼림칙한 느낌이 든다면 참 신경 쓰일 거예요. 엎지른 물은 다시 주워 담을 수 없잖아요? 자신이 한 일이 뉘우쳐지지 않게 어떤 일을 할 때엔 한 번 더 생각하고 행동하도록 해야겠어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397969&page=36","sourceTitle":"깡똥하다, 꺼림하다"},{"word":"괴발개발","meaning":"글씨를 지저분하게 마구 갈겨 써 놓은 모양.\\n얼핏 괴상하게 들릴 수도 있는 '괴발개발'이라는 말은, '고양이의 발, 개의 발'에서 생겨난 말이에요. 여기서 '괴'는 고양이의 옛말이죠. 고양이나 개는 여기저기 가리지 않고 마구 쏘다니는 동물이라, 발에는 언제나 흙이나 더러운 것이 묻어 있어요. 그 발로 집 안에 들어오기라도 해 봐요. 참 지저분하고 정신없기도 하겠지요? 이렇게 개나 고양이의 발자국이 어지럽게 흩어져 있는 모양이나 마치 아무렇게나 써 놓은 글씨 같다고 해서 이런 말이 생겨난 거예요. 흔히들 '개발새발'썼다고 하는데, 이건 틀린 표현이에요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397850&page=36","sourceTitle":"괴발개발"},{"word":"곰살궂다","meaning":"싹싹하고 다정하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397737&page=36","sourceTitle":"곰살궂다, 살갑다."},{"word":"살갑다","meaning":"마음씨가 부드럽고 다정스럽다.\\n'곰살궂다'는 친절하고 다정다감함을 나타내는 말이에요. '곰살맞다'로 많이 쓰이지만 '곰살궂다'가 표준어예요. '살갑다'도 부드럽고 정이 많다는 뜻으로, '곰살궂다'와 거의 비슷하게 쓰일 수 있어요. 우리가 다른 사람을 대할 때 조그만 더 곰살궂고 살갑다면, 참 따뜨하고 살기 좋은 세상이 되겠지요?\\n● 이런 뜻도 있어요. '곰살궂다'는 '꼼꼼하고 자세하다.' '살갑다'는 '겉보기와는 달리 속이 넓다.'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397737&page=36","sourceTitle":"곰살궂다, 살갑다."},{"word":"고즈넉하다","meaning":"고요하고 아늑하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397648&page=36","sourceTitle":"고즈넉하다와 한갓지다"},{"word":"한갓지다","meaning":"한가하고 조용하다.\\n요즘 사람들은 온종일 자동차 소리, 갖가지 기계 소리, 발달된 대중매체에서 흘러나오는 소리 등 정말 셀 수 없이 많고복잡한 소리들 속에 묻혀 살고 있어요. 또 점점 그런 시끄러움에 아무렇지 않게 익숙해져 가고 있고요.\\n이런 이유 때문에 우리 주변에서는 호젓하고 아늑한 느낌의 '고즈넉한' 곳, 시끄럽지 않은 '한갓진'곳을 찾아내기가 쉽지 않지요.\\n자, 잠깐 눈을 감고 시골길이나 산길을 혼자 걷고 있다고 상상해 보세요. 들리는 소리라곤 정답게 지저귀는 새소리, 바람 소리, 발길에 차이는 돌멩이 소리뿐이라면‥‥‥.\\n잠시라도 마음이 편안한 시간이었지요!","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397648&page=36","sourceTitle":"고즈넉하다와 한갓지다"},{"word":"완자","meaning":"쇠고기를 잘게 다져 달걀, 두부 등을 섞고 둥글게 빚어 기름에 지진 음식. 흔히 '동그랑땡'이라고 불리는 음식이 바로 '완자'예요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397558&page=37","sourceTitle":"완자와 너비아니"},{"word":"너비아니","meaning":"쇠고기에 양념을 하여 구운 음식.\\n'너비아니'는 우리나라 고기구이 가운데 대표하고 할 수 있어요. 쇠고리의 가장 연하고 맛있는 부위인 등심이나 안심을 얇게 저며 갖은 양념에 재어 두었다가 석쇠에 구워 먹는 요리지요. '\\n너비아니'는 큼직큼직하게 '너붓너붓'썰어서 요리했다고 해서 붙인 이름이에요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397558&page=37","sourceTitle":"완자와 너비아니"},{"word":"알근달근하다","meaning":"맛이 조금 맵고도 달다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397440&page=37","sourceTitle":"알근달근하다와 칼칼하다."},{"word":"칼칼하다","meaning":"맵고 톡 쏘는 맛이 있다.\\n여러 가지 맛 중에서 '알근달근한' 맛이 궁금하다면, 매우면서도 달짝지근한 떡볶이를 먹어 봐요. 매운맛에 눈물이 쏙 빠져도, 단맛에 미소 짓게 될 걸요?\\n그리고 '칼칼하다'는 맵게 자극하는 맛이 있다는 뜻이에요.\\n그러니까 '칼칼한'맛은 '알근달근한' 맛과 달리 매운맛만 있고 단맛은 없는 거예요.\\n그리고 '칼칼하다'는 목이 마르다는 뜻도 함께 가지고 있어요.\\n그나저나 매운 정도나 맛이 조화에 따라 이렇게 갖가지 말을 만들어 낸 우리 조상님들은, 아무래도 맛을 느끼는 미각의 달인들이었나 ?","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397440&page=37","sourceTitle":"알근달근하다와 칼칼하다."},{"word":"시금털털하다","meaning":"맛이 조금 시면서도 떫다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397397&page=37","sourceTitle":"시금털털, 쌉싸래"},{"word":"쌉싸래하다","meaning":"조금 쓴 듯하다.\\n'시금털털하다'의 센말은 '시금떨떨하다'예요. 여기서 '시금'은 '시다, 시큼하다'는 뜻이고 '떨떨하다'는 떫다는 뜻이에요. 그러니까 '시금털털하다'는 신맛과 떫은맛을 동시에 나타낸 말이지요. 어떤 맛인지 궁금한가요? 그럼 덜 익은 감이나 살구를 한 입 베어 물어볼까여? 그럼 \\"으, 시금털털해!\\"라는 말이 절로 나올걸요? '쌉싸래하다'는 조금 쓴맛을 말해요. 완전히 쓴맛도 아닌 약간 쓰다는 표현을 그냥 말 그대로 '약간 쓰다'고 하지 않고, 약간의 여운이 감도는 이렇게 멋진 말을 만들어 냈어요. 그리고 쌉싸래한 맛보다 더 쓴맛, 그러니까 '쌉싸래하다'의 큰말은 '씁쓰레하다'예요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397397&page=37","sourceTitle":"시금털털, 쌉싸래"},{"word":"끼니","meaning":"늘 일정한 때에 먹는 밥.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397245&page=37","sourceTitle":"끼니와 주전부리"},{"word":"주전부리","meaning":"군것질. 끼니 외에 먹는 음식\\n'끼니'는 정해진 때에 먹는 아침, 점심, 저녁 식사를 말해요. 그리고 '주전부리'는 끼니 외에 먹는 군것질을 말하고요. '군것질'의 '군'은 '쓸데없는'이라는 뜻이에요. '군말'은 '하지 않아도 될 말', '군침'은 '음식을 먹지도 않았는데 흘러나오는 침'이라는 뜻이지요. 그러니까 끼니 외에 먹지 않아도 될 쓸데없는 음식을 먹는 '주전부리'는 바로 지금의 간식을 말하는 거예요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397245&page=37","sourceTitle":"끼니와 주전부리"},{"word":"꼬치미","meaning":"꼬챙에 꿴 음식.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397135&page=37","sourceTitle":"꼬치미와 코다리"},{"word":"코다리","meaning":"명태를 말려 코를 꿰어 놓은 것.\\n'꼬챙이'는 나무 따위의 가늘고 긴 막대기를 말해요. 줄임말은 '꼬치'인데, '꼬치미'는 이 '꼬치'에서 나온 말이에요. 고기 등을 꼬챙이에 꿰어서 구운 '산적'이나 곶감' 등도 모두 '꼬치미'라고 할 수 있어요.\\n'코다리'도 또 하나의 꼬치미예요.\\n겨울철에 잡히는 생선인 '명태'는 여러 가지 이름이 있어요. 바로 잡은 싱싱한 명태는 '생태', 꽁꽁 얼린 것은 '동태', 널어서 바람에 빨리 말린 것은 '북어', 얼리고 녹이는 걸 반복하면서 말린 것은 '황태'라고 해요.\\n그리고 '코다리'는 북어를 만들 때 나뭇가지 같은 것으로 북어의 코를 꿰어 매달아 놓는다고 해서 붙인 이름이에요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397135&page=37","sourceTitle":"꼬치미와 코다리"},{"word":"간간하다","meaning":"짭짤하여 먹기에 알맞을 정도로 간이 배어 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397062&page=37","sourceTitle":"간간하다와 밍밍하다"},{"word":"밍밍하다","meaning":"음식 따위가 제 맛이 나지 않고 싱겁다.\\n흔히 음식에 맛을 낼 때 '간'을 한다고 하죠? '간'은 음식에 짠맛을 내는 소금, 간장, 젓갈 등을 통틀어 이르는 말이에요. 그러니까 '간하다'고 하면, 여러 가지 맛 가운데 '짠맛'을 내는 걸 뜻하지요. '채소나 생선 따위의 음식물을 소금에 절이다'는 뜻으로도 쓰이고요. '간간하다'는 이렇게 '간하다'에서 나온 말로, 입맛이 당기고 먹기에 적당할 정도로 간이 배어 있는 걸 말해요.\\n'밍밍하다'는 '간간하다'와는 반대로 음식의 맛이 짜지 않고 싱거운 걸 뜻해요.\\n'덤덤하다'고도 표현하지요. 그런데 우리나라 사람들, '간간한' 음식 좋아하기로 유명하지요? 예로부터 찌개나 젓갈류 등을 계속 먹어 왔기 때문이에요. 하지만 간간한 것도 지나치면 건강에 좋지 않아요. 입맛이 돌 정도로만 간을 하고, 적당히 '밍밍한'맛에 길들여지도록 해야겠어요.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=397062&page=37","sourceTitle":"간간하다와 밍밍하다"},{"word":"꽃잠","meaning":"세상 모르게 '깊이 든 잠'","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396930&page=37","sourceTitle":"꽃잠, 덧거리, 눈썰미"},{"word":"덧거리","meaning":"정해진 양보다 더 많이 얹어서 주는 것. 더 넓은 뜻으로, '없는 사실을 보태어 말하는 것'을 이르기도 함","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396930&page=37","sourceTitle":"꽃잠, 덧거리, 눈썰미"},{"word":"눈썰미","meaning":"한번 보아 그대로 흉내낼 수 있는 재주","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396930&page=37","sourceTitle":"꽃잠, 덧거리, 눈썰미"},{"word":"누에늙은이","meaning":"누에가 늙은 것같이 말라 휘늘어진 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"뻗팔이","meaning":"꼬부라지지 않는 팔. 또는 그 팔을 가진 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"앉은뱅이","meaning":"안기는 해도 서지는 못하는 불구자.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"곱장다리","meaning":"무릎뼈는 밖을 향해 벌어지고 정강이는 안을 향해 휘어진 다리.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"덴둥이","meaning":"①불에 덴 사람. ②미운 사람을 욕으로 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"껑충이","meaning":"키가 껑충하게 크고 마음이 허황한 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"앙가발이","meaning":"①다리가 짧고 굵은 사람. ②잘 달라 붙은 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"제비턱","meaning":"밑이 두툼하고 넓직하게 생긴 턱. 또는 그러한 사람의 별명.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"함실코","meaning":"코가 쏙 빠져 입천장과 콧구멍이 맞뚫린 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"해귀당신","meaning":"얼굴이 해바라지고 푼더분하지 못하게 생긴 사람을 비유하는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"흑보기","meaning":"눈동자가 한쪽으로 몰려, 무엇을 정면으로 보지 못하고 언제나 흘겨보는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"곰보딱지","meaning":"얼굴이 몹시 얽은 사람을 놀리어 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"청맹과니","meaning":"보기에는 눈이 멀쩡하나 실지는 조금도 보지 못하는 눈. 또는 그런 사람. 당달봉사. (준말) 청맹.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"합죽이","meaning":"이가 빠져서 입과 볼이 합죽한 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"보름보기","meaning":"'애꾸눈이'를 조롱하는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396864&page=37","sourceTitle":"사람의 생긴 모양을 이르는 말"},{"word":"고리","meaning":"고리나 대오리로 엮어서 상자처럼 만든 그릇. 옷을 담는 데 쓰임.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"동고리","meaning":"버들로 둥글납작하게 만든 작은 고리짝.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"고비","meaning":"편지 같은 것을 꽂아 두는 물건. 종이로 주머니나 상자처럼 만들거나 종이오리로 '+'자 모양으로 만들어 벽에다 붙임.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"타래박","meaning":"대나 나무로 된, 긴 자루가 달린 두레박.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"둥주리","meaning":"짚으로 두껍고 크게 엮은 둥우리. 옛날에 밖을 지키던 사람이 추울 때 들어앉아서 망을 봤고, 또 말을 타고 길가는 사람이 말 등에 얹어서 타고 들어앉았음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"둥우리","meaning":"짚이나 대나 싸리 따위로 바구니 비슷하게 엮어 만든 그릇. 추녀나 서까래 밑에 네 귀를 매어 담.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"도래방석","meaning":"짚으로 둥그게 짠 방석. 주로 곡물을 널어 말리는 데에 쓰며, 방석으로 이용하기도 함.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"빗접","meaning":"빗, 빗솔, 빗치개 따위 같이 머리를 빗는 데 쓰는 도구를 넣어두는 작은 제구. 흔히 창호지 같은 것을 여러 겹 붙여 기름에 결어서 만듦.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"섬","meaning":"곡식을 담기 위하여 짚으로 엮어서 만든 멱서리.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"평미레","meaning":"말에 곡식을 담고 그 위를 평평하게 미는 방망이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"색대","meaning":"섬이나 가마니 속의 든 곡식이나 소금을 거죽으로부터 찔러서 빼내어 보는데 쓰는 제구.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396794&page=37","sourceTitle":"추억의 옛물건들 이름"},{"word":"들창코","meaning":"코끝이 들려서 콧구명이 드러나 뵈는 코, 또는 그런 코를 가진 사람을 놀림조로 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"생강손이","meaning":"손가락이 잘라져서 생강처럼 된 사람을 이르는 말. 새앙손이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"애꾸눈이","meaning":"'한쪽 눈이 먼 사람' 을 앝잡아 이르는 말. (준말0 애꾸. ◎ 말승냥이 - '키가 볼품없이 크고 사나운 사람'을 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"먹보","meaning":"귀가 먹은 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"몽구리","meaning":"㉠ 머리를 아주 바싹 깍은 머리 ㉡'중'을 얕잡아 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"밭장다리","meaning":"걸을 때 두 발의 끝이 밖으로 향하게 걷는 사람. (반대말) 안짱다리.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"사시랑이","meaning":"가늘고 약한 사람이나 물건.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"혹부리","meaning":"얼굴에 혹이 달린 사람을 놀림조로 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"콧벽장이","meaning":"콧구멍이 너무 좁아 숨을 못 쉬는 사람을 놀림조로 이는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"곱사등이","meaning":"곱사등인 불구자. 비타민 D의 결핍으로, 주로 어린이 때 이 병이 생김. 곱추","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"장구머리","meaning":"이마와 뒤통수가 쑥 내민 머리, 또는 그렇게 생긴 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"작다리","meaning":"키가 작은 사람을 농으로 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"난쟁이","meaning":"정상적인 보통 키보다 훨씬 작은 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"외팔이","meaning":"'한쪽 팔만 있는 사람'을 홀하게 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"점박이","meaning":"'얼굴이나 몸에 큰 접이 박힌 사람이나 짐승'을 이르는 말. 점둥이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"더더리","meaning":"말을 더덜거리는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"따라지","meaning":"보잘 것 없이 키와 몸이 작은 사람. 딸보.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396650&page=37","sourceTitle":"사람의 신체적 특징을 나타내는 말"},{"word":"명아주","meaning":"일년초로 큰 것은 2m 정도까지 자라며 거름터에서 높이 자라는 것을 볼 수 있고, 잎 뒤에는 은색 가루같은 것이 피어 있음. 그 줄기로 지팡이를 만드는데 그 지팡이를 청려장(靑藜杖)이라고 함.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"바랭이","meaning":"포아풀과이며 기어가서는 뿌리를 내리고 다시 기어가서는 뿌리를 내리는, 전답에서 가장 흔하고 무성한 잡초.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"메꽃","meaning":"나팔꽃과 닮은 덩굴성 다년초이나 꽃색이 나팔꽃보다 연하고 품위도 없어 보임.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"도꼬마리","meaning":"높이는 1m 내외의 일년초이며 특징은 길이 1cm 폭 8mm 정도의 둥글길쭉한 열매가 맺히는데 열매에는 갈고리 같은 가시가 나 있어 옷에 잘 붙음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"독말풀","meaning":"쓰레기장에 잘 나는 1m 이상으로 자라는 일년초. 8~9월에 연한 자줏빛이 도는 흰 꽃이 피고 열매는 가시가 돋은 길이 5~6cm 지름 2cm 정도임. 만지면 고약한 냄새가 남.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"망초","meaning":"높이는 1m 정도인데 곧게 자라며 작은 꽃 여럿이 모인 꽃은 6~7월에 피는데 속은 노라나 꽃잎은 하얀색인 귀화 식물.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"냉이","meaning":"높이 50cm 정도이나 겨울과 이른봄엔 채취하여 국을 끓여 먹음. 꽃은 5~6월에 흰 점처럼 피는데 이때 뿌리의 냄새를 맡으면 계피 냄새가 남.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"질경이","meaning":"다년초로 특징은 잎에서 평행하게 뻗은 다섯 개의 엽맥이 뚜렷함. 이 옆백을 당겨내면 섬유처럼 빠져 나오며 뿌리는 곧게 깊이 박혀 있음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"메귀리","meaning":"포아풀과의 풀로 귀리와 비슷하며 높이 1m쯤 되며 구황식물이고 잎과 줄기는 가축의 먹이로 이용됨.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396598&page=38","sourceTitle":"우리 농장의 잡초들"},{"word":"우렁이","meaning":"무논이나 웅덩이 등에 사는 암녹색 고둥. 식용함","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"생이","meaning":"담수 연못 등의 풀섶에 서식하는 몸길이 35mm 쯤 되는 새우. 생으로 젓을 담아 먹거나 말리어 먹음. 토하(土蝦)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"물방개","meaning":"몸길이 40mm 내외로 못이나 늪에 살며 몸은 타원형으로 납작하고 뒷다리에는 긴 털이 뭍어 있어 헤엄치기에 적당함. 성충과 유충은 모두 육식성임.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"게아재비","meaning":"몸길이 43mm 내외이고 몸은 가늘고 길며 회갈색 또는 황갈색임. 못이나 늪에서 어린 물고기나 곤충을 잡아먹음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"물자라","meaning":"몸길이 18~20mm 정도이고 물장군과 비슷함. 몸빛은 암황갈색이고 봄철에 암컷이 수컷의 등에 알을 낳으면 부화할 때까지 수컷이 알을 등에 지고 다님.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"물땅땅이","meaning":"물방개와 비슷하나 등이 좀 더 불룩함. 몸길이 32~35mm이고 몸빛은 광택 있는 칠흑색이고 앞가슴 한가운데 두 개의 점이 있음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"송장헤엄치게","meaning":"몸길이 12mm 정도이며 몸빛은 황갈색에 날개에는 세 개의 검은 얼룩무늬가 있음. 보통 배 쪽을 위로하여 송장헤엄을 치고 맑은 날에는 날아다님. 잔고기나 올챙이 등을 잡아 피를 빨아먹음.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"물둥구리","meaning":"타원형이고 날개가 있으며 몸 길이 11mm 정도이고 몸빛은 암갈색에 오갈색부가 있고 앞다리는 발톱 모양이며, 못에서 작은 물고기나 곤충을 포식함.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"물빈대","meaning":"물두구리와 비슷한데 몸길이 6~10mm이고, 몸은 원반상이며 납작하고,날개는 퇴화하여 흔적만 있고 계류에 서식하며 작은 물고기를 포식함.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396423&page=38","sourceTitle":"물에 사는 것들"},{"word":"다따가","meaning":"도중에 갑자기. 별안간.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396331&page=38","sourceTitle":"다따가, 쾌분잦하다, 가두기, 가데기, 난바다"},{"word":"쾌분잦하다","meaning":"꽤 북적거리며 어수선하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396331&page=38","sourceTitle":"다따가, 쾌분잦하다, 가두기, 가데기, 난바다"},{"word":"가두기","meaning":"가랑잎.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396331&page=38","sourceTitle":"다따가, 쾌분잦하다, 가두기, 가데기, 난바다"},{"word":"가둑잎","meaning":"가랑잎.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396331&page=38","sourceTitle":"다따가, 쾌분잦하다, 가두기, 가데기, 난바다"},{"word":"가데기","meaning":"쟁기.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396331&page=38","sourceTitle":"다따가, 쾌분잦하다, 가두기, 가데기, 난바다"},{"word":"난바다","meaning":"육지에서 멀리 떨어진 넓은 바다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396331&page=38","sourceTitle":"다따가, 쾌분잦하다, 가두기, 가데기, 난바다"},{"word":"가늘라","meaning":"갓난 아이, 어린이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceTitle":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름"},{"word":"난든집","meaning":"손에 익숙한 재주.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceTitle":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름"},{"word":"단백사위","meaning":"윷놀이의 마지막 판에 쓰이는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceTitle":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름"},{"word":"라온","meaning":"즐거운.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceTitle":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름"},{"word":"마음자리","meaning":"마음의 본바탕.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceTitle":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름"},{"word":"바닥쇠","meaning":"지방에서 오래 전부터 사는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceTitle":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름"},{"word":"아름아름","meaning":"한아름이 넘도록 뭉쳐지거나 뭉친 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396213&page=38","sourceTitle":"가늘라, 난든집, 단백사위, 라온, 마음자리, 바닥쇠, 아름아름"},{"word":"가녘","meaning":"가장자리. 여가리.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396122&page=38","sourceTitle":"가녘, 나쎄, 나쪼다, 다림방, 마득사리, 바사기, 사리사리, 아삼삼하다, 콩팔..."},{"word":"나쎄","meaning":"어느 정도로 먹은 나이.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=396122&page=38","sourceTitle":"가녘, 나쎄, 나쪼다, 다림방, 마득사리, 바사기, 사리사리, 아삼삼하다, 콩팔..."},{"word":"나쪼다","meaning":"어른 앞에 나오다.","sourceUrl" sub.php?menukey=223&mod=view&no=395964&page=38","sourceTitle":"코떼다, 아름차다, 다솜, 마음겹다, 나무거울, 가다리, 나풋나풋"},{"word":"나무거울","meaning":"겉으로는 그럴 듯 하나 실제로는 아무 소용도 없는 사람이나 물건을 가리키는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395964&page=38","sourceTitle":"코떼다, 아름차다, 다솜, 마음겹다, 나무거울, 가다리, 나풋나풋"},{"word":"가다리","meaning":"한 마지기에 얼마씩의 삯을 받고 모낼 논을 갈고 써레질을 해 주는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395964&page=38","sourceTitle":"코떼다, 아름차다, 다솜, 마음겹다, 나무거울, 가다리, 나풋나풋"},{"word":"나풋나풋","meaning":"가볍고 날렵하게 움직이는 모양. 또는,잇달아 가볍게 나부끼는 모양. <동의어> 나푼나푼","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395964&page=38","sourceTitle":"코떼다, 아름차다, 다솜, 마음겹다, 나무거울, 가다리, 나풋나풋"},{"word":"갖바치","meaning":"가죽신 만드는 것을 업으로 삼던 사람","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395813&page=38","sourceTitle":"직업과 관련된 우리말"},{"word":"거간꾼","meaning":"흥정을 붙이는 일을 업으로 삼던 사람","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395813&page=38","sourceTitle":"직업과 관련된 우리말"},{"word":"동산바치","meaning":"정원의 나무나 꽃 따위를 가꾸고, 순이나 가지를 잘라 예쁘게 손질하는 일을 업으로 삼는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395813&page=38","sourceTitle":"직업과 관련된 우리말"},{"word":"또드락장이","meaning":"귀금속으로 세공품을 만드는 일을 업으로 삼는 사람","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395813&page=38","sourceTitle":"직업과 관련된 우리말"},{"word":"모가비","meaning":"① 사당패나 선소리패를 이끄는 우두머리\\n② 인부나 광대 같은 낮은 패의 우두머리\\n③ 탈놀이에서 가독, 연출 그리고 어","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395813&page=38","sourceTitle":"직업과 관련된 우리말"},{"word":"가납사니","meaning":"1) 쓸데없는 말을 지껄이기 좋아하는 수다스러운 사람. 2) 말다툼을 잘하는 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395733&page=38","sourceTitle":"가납사니, 가래톳, 갈깃머리, 갈무리"},{"word":"가래톳","meaning":"허벅다리 윗부분의 림프절이 부어 생긴 멍울.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395733&page=38","sourceTitle":"가납사니, 가래톳, 갈깃머리, 갈무리"},{"word":"갈깃머리","meaning":"상투나 낭자, 딴머리 따위와 같이 머리를 묶어 모양을 만들 때 함께 묶이지 않고 아래로 처지는 머리털.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395733&page=38","sourceTitle":"가납사니, 가래톳, 갈깃머리, 갈무리"},{"word":"갈무리","meaning":"1) 물건 따위를 잘 정리하거나 간수함. 2) 일을 처리하여 마무리함.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395733&page=38","sourceTitle":"가납사니, 가래톳, 갈깃머리, 갈무리"},{"word":"섣달","meaning":"음력으로 한 해의 마지막 달. 음력 십이월. 극월(極月). ○○그믐날 흰떡 맞듯.(속담)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395699&page=38","sourceTitle":"섣달, 달구지, 동냥젖"},{"word":"달구지","meaning":"소 한 마리가 끄는 짐수레. ○○○를 타고 가던 옛 시절이 생각난다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395699&page=38","sourceTitle":"섣달, 달구지, 동냥젖"},{"word":"동냥젖","meaning":"남의 젖을 얻어먹는 일, 또는 그 젖. 심청이는 ○○○으로 자랐다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395699&page=38","sourceTitle":"섣달, 달구지, 동냥젖"},{"word":"갈무리","meaning":"물건을 잘 챙기어 간수함. ‘마무리’의 뜻도 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395585&page=39","sourceTitle":"갈무리, 이태, 벙거지"},{"word":"이태","meaning":"두 해. 2년","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395585&page=39","sourceTitle":"갈무리, 이태, 벙거지"},{"word":"벙거지","meaning":"지난날, 병졸이 머리에 쓰던 모자. 털로 검고 두껍게 갓처럼 만들었음. ‘모자’의 속된 말이기도 하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395585&page=39","sourceTitle":"갈무리, 이태, 벙거지"},{"word":"길처","meaning":"가는 길의 근처.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395494&page=39","sourceTitle":"길처, 둘하다 -"},{"word":"둘하다","meaning":"둔하고 미련하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395494&page=39","sourceTitle":"길처, 둘하다 -"},{"word":"푸하다","meaning":"속이 꽉 차지 아니하고 불룩하게 부풀어 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395334&page=39","sourceTitle":"푸하다, 뜨더귀 -"},{"word":"뜨더귀","meaning":"조각조각으로 뜯어 내거나 가리가리 찢어 내는 짓. 또는 그 조각.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395334&page=39","sourceTitle":"푸하다, 뜨더귀 -"},{"word":"더넘스럽다","meaning":"다루기에 버거운 데가 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395232&page=39","sourceTitle":"더넘스럽다, 스리 -"},{"word":"스리","meaning":"음식을 먹다가 볼을 깨물어 생긴 상처.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395232&page=39","sourceTitle":"더넘스럽다, 스리 -"},{"word":"서슬","meaning":"쇠붙이로 만든 연장이나 유리 조각 따위의 날카로운 부분.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395134&page=39","sourceTitle":"서슬, 길래 -"},{"word":"길래","meaning":"오래도록 길게.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395134&page=39","sourceTitle":"서슬, 길래 -"},{"word":"굻다","meaning":"담긴 것이 그릇에 그득 차지 아니하고 조금 비어 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395056&page=39","sourceTitle":"굻다, 기스락 -"},{"word":"기스락","meaning":"비탈진 곳의 가장자리.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=395056&page=39","sourceTitle":"굻다, 기스락 -"},{"word":"아늠","meaning":"볼을 이루고 있는 살.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394983&page=39","sourceTitle":"아늠, 안차다 -"},{"word":"안차다","meaning":"겁이 없고 야무지다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394983&page=39","sourceTitle":"아늠, 안차다 -"},{"word":"볼썽","meaning":"남에게 보이는 체면이나 태도.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394831&page=39","sourceTitle":"볼썽, 되통스럽다 -"},{"word":"되통스럽다","meaning":"미련하거나 찬찬하지 못하여 일을 잘 저지를 듯하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394831&page=39","sourceTitle":"볼썽, 되통스럽다 -"},{"word":"느껍다","meaning":"어떤 느낌이 마음에 북받쳐서 벅차다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php? ?menukey=223&mod=view&no=394125&page=40","sourceTitle":"삼삼하다, 넌더리 -"},{"word":"넌더리","meaning":"지긋지긋하게 몹시 싫은 생각.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394125&page=40","sourceTitle":"삼삼하다, 넌더리 -"},{"word":"바르집다","meaning":"숨겨진 일을 들추어내다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394070&page=40","sourceTitle":"바르집다, 보풀, 푼더분하다 -"},{"word":"보풀","meaning":"종이나 헝겊 따위의 거죽에 부풀어 일어나는 몹시 가는 털.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394070&page=40","sourceTitle":"바르집다, 보풀, 푼더분하다 -"},{"word":"푼더분하다","meaning":"여유가 있고 넉넉하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=394070&page=40","sourceTitle":"바르집다, 보풀, 푼더분하다 -"},{"word":"갓밝이","meaning":"날이 막 밝을 무렵.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393968&page=40","sourceTitle":"갓밝이, 설레설레, 마닐마닐하다 -"},{"word":"설레설레","meaning":"가만히 있지 아니하고 자꾸 움직이는 모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393968&page=40","sourceTitle":"갓밝이, 설레설레, 마닐마닐하다 -"},{"word":"마닐마닐하다","meaning":"음식이 씹어 먹기에 알맞도록 부드럽고 말랑말랑하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393968&page=40","sourceTitle":"갓밝이, 설레설레, 마닐마닐하다 -"},{"word":"안침","meaning":"안쪽으로 쑥 들어간 곳.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393879&page=40","sourceTitle":"안침, 밉광스럽다, 맞갖다 -"},{"word":"밉광스럽다","meaning":"보기에 매우 밉살스러운 데가 있다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393879&page=40","sourceTitle":"안침, 밉광스럽다, 맞갖다 -"},{"word":"맞갖다","meaning":"마음이나 입맛에 꼭 맞다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393879&page=40","sourceTitle":"안침, 밉광스럽다, 맞갖다 -"},{"word":"얼김","meaning":"어떤 일이 벌어지는 바람에 자기도 모르게 정신이 얼떨떨한 상태.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=393766&page=40","sourceTitle":"얼김, 도뜨다, 가시눈 -"},{"word":"도뜨다","meani Url":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392638&page=41","sourceTitle":"제비초리, 배냇머리, 시새, 진창 -"},{"word":"단골집","meaning":"굿을 할때 늘 정해놓고 불러다 쓰는 무당\\n☞ 항상 거래하는 장사집을 이름.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392574&page=42","sourceTitle":"단골집, 덮개, 돌팔이, 떠새, 고주망태 -"},{"word":"덮개","meaning":"불교에서 착한 마음을 덮어 가리는 탐욕이나 진심(嗔心)을 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392574&page=42","sourceTitle":"단골집, 덮개, 돌팔이, 떠새, 고주망태 -"},{"word":"돌팔이","meaning":"이리저리 돌아다니며 어설픈 기술을 파는 사람, 돌다와 팔다가 결합되다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392574&page=42","sourceTitle":"단골집, 덮개, 돌팔이, 떠새, 고주망태 -"},{"word":"떠새","meaning":"돈이나 세력을 믿고 젠체하며 억지를 쓰는 것.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392574&page=42","sourceTitle":"단골집, 덮개, 돌팔이, 떠새, 고주망태 -"},{"word":"고주망태","meaning":"고주는 술을 거르는 틀인데 여기에 망태를 올려 놓으면 술냄새가 베어 망태전체에서 술 냄새가 난다.\\n☞ 술을 너무 많이 마셔 정신을 차리지 못하는 상태.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392574&page=42","sourceTitle":"단골집, 덮개, 돌팔이, 떠새, 고주망태 -"},{"word":"개개다","meaning":"서로 맞 닿아서 해지거나 닳아지다.\\n☞ 성가시게 달라붙어 손해가 되다.\\n☞ 손해를 끼치다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392463&page=42","sourceTitle":"개개다, 개차반, 고뿔, 괄괄하다, 늦깍이 -"},{"word":"개차반","meaning":"개가 먹는 차반, 즉 '똥' 이란 뜻.\\n☞ 언행이 더럽고 막된 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392463&page=42","sourceTitle":"개개다, 개차반, 고뿔, 괄괄하다, 늦깍이 -"},{"word":"고뿔","meaning":"고뿔은 코와 불이 합쳐진 말로 감기에 들면 코에 불이 나는 것처럼 더운 김이 나온다 하여 유래.\\n☞ 감기를 일컫는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392463&page=42","sourceTitle":"개개다, 개차반, 고뿔, 괄괄하다, 늦깍이 -"},{"word":"괄괄하다","meaning":"이불호청이나 옷에 풀을 먹일때 풀기가 너무 세서 빳빳하게 된 상태.\\n☞ 풀기가 센 것 같이 급하고 억센 성품이나 목소리가 크고 거센 것을 이름.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392463&page=42","sourceTitle":"개개다, 개차반, 고뿔, 괄괄하다, 늦깍이 -"},{"word":"늦깍이","meaning":"늦게 머리깍은 중\\n☞ 세상 이치를 남보다 늦게 깨달은 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392463&page=42","sourceTitle":"개개다, 개차반, 고뿔, 괄괄하다, 늦깍이 -"},{"word":"고명딸","meaning":"고명은 음식의 모양과 맛을 더하기 위하여 음식위에 뿌리는 양념.\\n☞ 아들이 많은 집의 외딸을 의미.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392370&page=42","sourceTitle":"고명딸, 나리, 남세스럽다, 넋두리, 뇌까리다 -"},{"word":"나리","meaning":"옛날 왕자를 높여 부르던 말이었는데 시간이 흘러 정3품 이하의 당하관을 높여 부르는 말이 되었다.\\n☞ 일정한 지위에 있는 사람을 부르기도 하고 때로는 지위 높은 사람을 비아냥거리는 뜻으로 쓰이기도 한다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392370&page=42","sourceTitle":"고명딸, 나리, 남세스럽다, 넋두리, 뇌까리다 -"},{"word":"남세스럽다","meaning":"남에게 비웃음과 조롱거리가 될 만하다는 남우세스럽다가 준 말.\\n☞ 남의 비웃음을 받을만하다는 의미.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392370&page=42","sourceTitle":"고명딸, 나리, 남세스럽다, 넋두리, 뇌까리다 -"},{"word":"넋두리","meaning":"본래 무당이 죽은 이의 넋을 대신하여 하는 말.\\n☞ 원통한 일이나 억울한 일, 또는 불만이 있을 때, 두덜거리며 길게 늘어 놓는 말.\\n☞ 푸념","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392370&page=42","sourceTitle":"고명딸, 나리, 남세스럽다, 넋두리, 뇌까리다 -"},{"word":"뇌까리다","meaning":"뒤풀이 말한다는 의미를 가진 '뇌다' 에 접미사 '가리' 가 붙어서 된 말.\\n☞ 아무렇게나 마구 지껄이는 것.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392370&page=42","sourceTitle":"고명딸, 나리, 남세스럽다, 넋두리, 뇌까리다 -"},{"word":"가닥","meaning":"하나로 묶이어 있거나 하나에서 갈려 나온 하나하나의 올이나 줄기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392278&page=42","sourceTitle":"가닥, 검쓰다, 고불치다, 고지, 나달 -"},{"word":"검쓰다","meaning":"비위에 거슬릴 만큼 몹시 거세고 쓰다 ; 일 따위가 마음에 들지 아니하여 언짢고 씁쓰레하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392278&page=42","sourceTitle":"가닥, 검쓰다, 고불치다, 고지, 나달 -"},{"word":"고불치다","meaning":"꺽인 자리가 나게 접다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392278&page=42","sourceTitle":"가닥, 검쓰다, 고불치다, 고지, 나달 -"},{"word":"고지","meaning":"호박이나 가지 따위를 납작하게 썰거나 길게 오려서 말린 것","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392278&page=42","sourceTitle":"가닥, 검쓰다, 고불치다, 고지, 나달 -"},{"word":"나달","meaning":"날과 달을 이르는 말 ; 세월","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392278&page=42","sourceTitle":"가닥, 검쓰다, 고불치다, 고지, 나달 -"},{"word":"마누라","meaning":"조선시대에 이 말은 '대비 마노라' 와 같이 쓰이던 극존칭어였다. ; 신분제도가 무너지면서 중년이 넘은 여자를 속되게 이르는 변화. ; 아내를 허물없이 부르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392149&page=42","sourceTitle":"마누라, 무꾸리, 무텅이, 마디다, 망나니 -"},{"word":"무꾸리","meaning":"무당이나 판수에게 앞날의 길흉을 알아보는 일. ; 점치는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392149&page=42","sourceTitle":"마누라, 무꾸리, 무텅이, 마디다, 망나니 -"},{"word":"무텅이","meaning":"거친 땅에 논밭을 일구어서 곡식을 심는 일.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392149&page=42","sourceTitle":"마누라, 무꾸리, 무텅이, 마디다, 망나니 -"},{"word":"마디다","meaning":"닳거나 없어지는 동안이 오래다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392149&page=42","sourceTitle":"마누라, 무꾸리, 무텅이, 마디다, 망나니 -"},{"word":"망나니","meaning":"조선시대 사형수의 목을 베는 사형 집행인. ; 언행에 있어서 몹시 막되먹은 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392149&page=42","sourceTitle":"마누라, 무꾸리, 무텅이, 마디다, 망나니 -"},{"word":"감또개","meaning":"꽃과 함께 떨어진 어린 감","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392013&page=42","sourceTitle":"감또개, 울력, 숲정이, 엄전하다, 푸네기 -"},{"word":"울력","meaning":"여러 사람이 힘을 합해서 하는 일","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392013&page=42","sourceTitle":"감또개, 울력, 숲정이, 엄전하다, 푸네기 -"},{"word":"숲정이","meaning":"마을 근처에 있는 수풀","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392013&page=42","sourceTitle":"감또개, 울력, 숲정이, 엄전하다, 푸네기 -"},{"word":"엄전하다","meaning":"하는 짓이나 생긴 모양이 정숙하고 점잖다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392013&page=42","sourceTitle":"감또개, 울력, 숲정이, 엄전하다, 푸네기 -"},{"word":"푸네기","meaning":"가까운 제 살붙이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=392013&page=42","sourceTitle":"감또개, 울력, 숲정이, 엄전하다, 푸네기 -"},{"word":"매시근하다","meaning":"기운이 없고 나른하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391964&page=42","sourceTitle":"매시근하다, 드팀새, 설레발치다, 본치 -"},{"word":"드팀새","meaning":"틈이 생긴 기미나 정도.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391964&page=42","sourceTitle":"매시근하다, 드팀새, 설레발치다, 본치 -"},{"word":"설레발치다","meaning":"몹시 서두르며 부산하게 굴다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391964&page=42","sourceTitle":"매시근하다, 드팀새, 설레발치다, 본치 -"},{"word":"본치","meaning":"남의 눈에 띄는 태도나 겉모양.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391964&page=42","sourceTitle":"매시근하다, 드팀새, 설레발치다, 본치 -"},{"word":"갓밝이","meaning":"날이 막 밝을 무렵.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391886&page=42","sourceTitle":"갓밝이, 맞갖다,드레, 뒤퉁스럽다, 가시눈 -"},{"word":"맞갖다","meaning":"마음이나 입맛에 꼭 맞다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391886&page=42","sourceTitle":"갓밝이, 맞갖다,드레, 뒤퉁스럽다, 가시눈 -"},{"word":"드레","meaning":"임시로 남의 집 행랑에 붙어 지내며 그 집의 일을 도와줌. 또는 그런 사람.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391886&page=42","sourceTitle":"갓밝이, 맞갖다,드레, 뒤퉁스럽다, 가시눈 -"},{"word":"뒤퉁스럽다","meaning":"미련하거나 찬찬하지 못하여 일을 잘 저지를 듯하다.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391886&page=42","sourceTitle":"갓밝이, 맞갖다,드레, 뒤퉁스럽다, 가시눈 -"},{"word":"가시눈","meaning":"날카롭게 쏘아보는 눈을 비유적으로 이르는 말.","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=391886&page=42","sourceTitle":"갓밝이, 맞갖다,드레, 뒤퉁스럽다, 가시눈 -"},{"word":"마닐마닐하다","meaning":"음식이 씹어 먹기에 알맞도록 부드럽고 말랑말랑하다.","sourceUrl":"http
