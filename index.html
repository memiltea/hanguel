ceText":"복닥거리다\\n: 복잡한 곳에서 여러 사람이 떠들다\\n예) 장은 명절 준비를 하러 온 사람들로 복닥거렸다.\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁\\n네이버 사전","images":[]},{"word":"티격태격","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1879686","sourceText":"티격태격\\n: 서로 의견이 맞지 않아 시비를 따지는 모양\\n예) 신혼부부 같은데 벌써 티격태격하면 쓰나\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁","images":[]},{"word":"허룩하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1876049","sourceText":"허룩하다\\n: 많이 없어지다. 줄어들다\\n예) 모든 게 그대로 있는데 왜 가게가 허룩해 보일까?\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁","images":[]},{"word":"터줏대감","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1867486","sourceText":"터줏대감\\n: 일정한 마을이나 직장 등에서 가장 오래된 사람을 가리키는 말\\n예) 이 동네엔 옹기장이 터줏대감이 둘이나 있다네\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁","images":[]},{"word":"윤슬","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1854482","sourceText":"윤슬\\n: 햇빛이나 달빛에 비치어 반짝이는 잔물결\\n예) 저길 봐, 저 바다의 윤슬이 얼마나 아름다운지.\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁","images":[]},{"word":"출출하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1851040","sourceText":"출출하다\\n: 배가 고픈 느낌이 있다 또는 약간 시장하다는 뜻\\n예) 배는 안고프지만 조금 출출하네요\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"앵두장수","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1846514&page=2","sourceText":"앵두장수\\n: 잘못을 저지르고 자취를 감춘 사람을 뜻하는 말\\n참고)초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁","images":[]},{"word":"허울좋다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1842143&page=2","sourceText":"허울좋다\\n: 겉모습만 좋다 또는 내용과 달리 보기만 좋다\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"피장파장","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1838489&page=2","sourceText":"피장파장\\n: 서로 낫고 못함이 없는 비슷한 경우나 처지를 이르는 말\\n예) 피장파장인 주제에 나를 놀려!\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁","images":[]},{"word":"아기똥하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1835211&page=2","sourceText":"아기똥하다\\n: 말이나 행동 따위가 매우 거만하고 앙큼한 데가 있다는 말\\n또는 조금 틈이 나 있다는 뜻\\n예) 하는 짓이 아주 아기똥한 게 내가 알던 그 착한 효자가 아니라구!\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"꾀꾀로","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1828357&page=2","sourceText":"꾀꾀로\\n; 가끔 틈을 타서 살그머니\\n예) 다음 날부터 농부는 꾀꾀로 닭장을 들여다보며 황금알을 낳기가 바쁘게 집어 내곤 했습니다.\\n참고)초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁","images":[]},{"word":"허드렛일","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1823562&page=2","sourceText":"허드렛일\\n:중요하지 않고 허름한 일\\n(허드레- 그다지 중요하지 않고 허름하여 함부로 쓸 수 있는 허름한 물건 또는 일)\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"콩켸팥켸","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1806178&page=2","sourceText":"콩켸팥켸\\n: 사물이 뒤섞여 뒤죽박죽이 된 것을 이르는 말.\\n예) 시루떡이 콩켸팥켸가 돼 버렸다.\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"새수나다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1797974&page=2","sourceText":"새수나다\\n: 갑자기 좋은 수가 생기다\\n뜻밖에 재물이 생기다\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정. 그림 이혁","images":[]},{"word":"들무새","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1776855&page=2","sourceText":"들무새\\n: 뒷바라지에 쓰는 물건이나 어떤 일에 쓰는 재료.\\n예) 책상 밑에 받칠 들무새가 좀 있어야겠다.\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"자투리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1763557&page=2","sourceText":"자투리\\n: 자로 재어 팔거나 재단하다가 남은 천의 조각\\n어떤 기중에 미치지 못할 정도로 작거나 적은 조각\\n예) 여러 가지 자투리 천으로 조각보를 만들다\\n자투리 시간을 활용하여 취미 생활을 한다.\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"도닐다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1758870&page=3","sourceText":"도닐다\\n: 가장자리를 빙빙 돌며 거닐다. '돌다'라는 말과 '가다'라는 뜻의 옛말 '니다'가 합쳐서 생겨난 말\\n예) 민주 누나는 연못가를 도닐고 계신 할아버지를 모시러 나갔습니다\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"꾸미개","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1753293&page=3","sourceText":"꾸미개 : 무엇을 곱게 꾸미는 데 쓰는 물건.\\n예) 모두 같이 '희망 사항' 알림판 꾸미개를 만들어 보자!\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"딸따니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1748696&page=3","sourceText":"딸따니 : 어린 딸을 귀엽게 부는 말.\\n예) 우리 딸따니가 얼마나 씩씩하고 부지런한데!\\n참고) 초등학생이 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁","images":[]},{"word":"사슬돈","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1746765&page=3","sourceText":"사슬돈\\n: 꿰거나 싸지 않은 흩어진 쇠붙이 돈이란 뜻으로, ‘잔돈’을 이르는 말.\\n참고) 초등학생잉 꼭 알아야 할 아름다운 우리말\\n글 이정 그림 이혁\\n네이버사전","images":[]},{"word":"더부살이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1745059&page=3","sourceText":"더부살이\\n: 남의 집에서 먹고 자면서 일을 해주고 삯을 받는 일. 또는 그런 사람을 가리키는 말.\\n예) 삼촌 댁에서 더부살이로 지내는 것도 한두 달이지 더 이상은 못 있겠어요.\\n참고)초등학생이 꼭 알아야 할 아름다운 우리말 글 이정 그림 이혁\\n네이버 사전","images":[]},{"word":"새침데기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1738264&page=3","sourceText":"새침데기\\n:겉으로만 얌전한 체하는 사람\\n예) 새침데기 아가씨가 오늘은 웬일로 알은체를 했다.\\n참고)초등학생이 꼭 알아야 한 아름다운 우리말\\n글 이정 그림 이혁\\n네이버 사전","images":[]},{"word":"가온누리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1736095&page=3","sourceText":"가온누리: 어떠한 일이 있어도 세상의 중심이 되어 라는 뜻\\n참고) 네이버","images":[]},{"word":"볏","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1733414&page=3","sourceText":"볏: 닭이나 꿩 같은 새 종류의 머리에 세로로 붙어 있는 톱니 모양의 붉은 살 조각.\\n예) 닭 벼슬 →닭 볏\\n참고) 바른말 고운말 2 KBS2 한국어 연구회","images":[]},{"word":"자밤","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1681035&page=3","sourceText":"자밤: 양념뿐만 아니라 나물 같은 것을 손가락 끝으로 집을 만한 분량을 셀 때 쓸 수 있는 단위.\\n예) 소금 한 자밤\\n참고) 바른말 고운 말2 KBS한국어연구회","images":[]},{"word":"이파리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1669252&page=3","sourceText":"이파리: 나무나 풀의 살아 있는 날 잎을 가리키는 말.\\n예) 하얀 꽃 이파리 눈송이처럼 날리네\\n참고)바른말 고운말 2 KBS한국어연구회","images":[]},{"word":"오사리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1659429&page=4","sourceText":"오사리\\n: 이른 철의 사리 때 잡은 해산물을 말하는데, 이 외에도 이른 철에 농작물을 거두는 일이나 그 농작물을 가리키는 말.\\n참고)바른말 고운말 2 KBS한국어연구회","images":[]},{"word":"에구머니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1646928&page=4","sourceText":"에구머니\\n: 어이구머니의 준말. 깜짝 놀랄 때라든가 힘이 들 때 쓰는 표현\\n참고)바른말 고운말 2 KBS한국어연구회","images":[]},{"word":"애오라지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1641464&page=4","sourceText":"애오라지\\n-겨우\\n-오로지\\n예) 주머니엔 애오라지 동전 두 닢뿐이다.\\n애오라지 자식을 위하는 부모의 마음.\\n참고)바른말 고운말2 KBS 한국어 연구회","images":[]},{"word":"이드거니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1637250&page=4","sourceText":"이드거니- 충분한 분량으로 만족스러운 모양.\\n예) 바쁜 일정 때문에 부족했던 저녁 식사를 모처럼 이드거니 먹었다.\\n참고) 바른말 고운말 2 KBS 한국어 연구회","images":[]},{"word":"지그시","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1634663&page=4","sourceText":"지그시 -조용히 참고 견디는 모양.\\n예) 눈을 지그시 감다.\\n참고) 바르말 고운말 2\\nKBS 한국어 연구회","images":[]},{"word":"어물쩍","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1631844&page=4","sourceText":"어물쩍 -말이나 행동을 일부러 분명하게 하지 않고 적당히 살짝 넘기는 모양을 말합니다\\n예) 이번에도 어물쩍 넘어가려고 하지 마라.\\n참고) 바른말 고운말 2\\nKBS한국어연구회","images":[]},{"word":"송골송골","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1629013&page=4","sourceText":"송골송골 - 땀이나 소름 또는 물방울 같은 것이 살갗이나 표면에 잘게 많이 돋아나 있는 모양\\n예) 코에 땀이 송골송골 맺힌 걸 보니 맵기는 꽤 매운 모양이구나\\n참고)바른말 고운말 2\\nKBS 한국어 연구회","images":[]},{"word":"생채기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1622098&page=4","sourceText":"생채기 -손톱 같은 것으로 할퀴어지거나 긁혀서 생긴 작은 상처\\n(상채기→ 생채기)\\n참고) 바른말 고운말 2\\nKBS 한국어 연구회","images":[]},{"word":"새치름하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1616518&page=4","sourceText":"새치름하다.\\n- 조금 쌀쌀맞게 시치미를 떼는 태도가 있다\\n예) 아르바이트 학생은 표정이 새치름해서 말 걸기가 어렵다.\\n참고)바른말 고운말 2 KBS한국어연구회","images":[]},{"word":"사달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1610613&page=4","sourceText":"사달 - 사고나 탈\\n예) 일이 꺼림칙하게 되어 가더니만 결국 사달이 났다.\\n참고) 바른말 고운말 2 KBS한국어연구회\\n네이버사전","images":[]},{"word":"삐치다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1542087&page=5","sourceText":"삐치다 - 화가 나서 토라진다고 할 때 쓰는 표현\\n예) 수진이 하고 얘기다가 삐졌대\\n참고) 바른말 고운 말 KBS 한국어 편찬회","images":[]},{"word":"뭉그적거리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1537696&page=5","sourceText":"뭉그적거리다-나아가지 못하고 제자리에서 조금 큰 동작으로 자꾸 게으르게 행동하는 뜻\\n예) 불편한 앉음새를 고치려고 종술은 축축한 엉덩이를 한쪽으로 뭉그적거렸다\\n참고)바른말 고운말 2\\nKBS 한국어연구회","images":[]},{"word":"데면데면하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1514813&page=5","sourceText":"데면데면하다\\n:어색하거나 서먹서먹하고 또는 계면쩍게 느끼는 그런 경우를 표현할 때 쓰임\\n참고)바르고 고운말 2\\nKBS한국어연구회","images":[]},{"word":"덤터기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1502376&page=5","sourceText":"덤터기-남에게 넘겨씌우거나 남에게서 넘겨받은 허물이나 걱정거리.\\n예) 덤터기를 씌우지고 않고, 덤터기를 쓰지도 않는, 서로가 서로를 신뢰할 수 있는 그런 사회가 되었으면 좋겠습니다.\\n참고)바른말 고운말 2\\nKBS 한국어 연구회","images":[]},{"word":"넝쿨","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1497833&page=5","sourceText":"넝쿨: 벽을 타고 올라가는 식물을 가리켜 말할 때.\\n예) 찔레 넝쿨\\n참고)바른말 고운말 2\\nkbs한국어연구회","images":[]},{"word":"끄물끄물","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1494584&page=5","sourceText":"끄물끄물\\n: 날씨가 활짝 개지 않고 자꾸 흐려진다거나 불빛 같은 것이 밝게 비치지 않고 자꾸 침침해지는 것.\\n예) 하늘이 갑자기 끄물끄물 흐려진다.\\n참고)KBS아나운서와 함께 배우는 바른말 고운말2\\nKBS한국어연구회","images":[]},{"word":"거추장스럽다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1489599&page=5","sourceText":"거추장스럽다\\n:물건 같은 것이 크거나 무겁거나 해서 다루기가 거북하고 주체스럽다.\\n예) 옷이 두꺼워서 움직이기가 거추장스럽다.\\n참고)KBS 아나운서와 함께 배우는 바른말 고운말 2\\nKBS 한국어언구회","images":[]},{"word":"거방지다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1485431&page=5","sourceText":"거방지다: 매우 많아서 넉넉하다.\\n예) 일도 잘 끝나고 결과도 기대 이상으로 나왔으니 오늘 다 같이 거방지게 한번 놀아 볼까?\\n참고) KBS 아나운서와 함께 배우는 바른말 고운말 2\\nKBS 한국어연구회","images":[]},{"word":"손시늉","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1460967&page=5","sourceText":"손시늉 - 손으로 어떤 모양이나 움직임을 나타내는 모양.\\n예) 외국 사람이 길을 물어 손시늉을 해 가며 설명했다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"손부채","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1450154&page=5","sourceText":"손부채:손바닥을 펴서 부채 삼아 부치는 일.\\n예) 남자는 더운 듯 손부채를 부쳐 가며 땀을 닦았다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버 어학사전","images":[]},{"word":"손바로","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1447681&page=6","sourceText":"손바로: 손이 닿을 만한 가까운 데.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"다발","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1445023&page=6","sourceText":"다발- 꽃이나 푸성귀 따위의 묶음 단위.\\n예)그는 가방에서 돈을 다발로 꺼냈다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버","images":[]},{"word":"눈길","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1377810&page=6","sourceText":"눈길- 눈이 가는 곳. 또는 눈으로 보는 방향.\\n예) 눈길은 찐빵 접시에 가 있었습니다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"손바람","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1371669&page=6","sourceText":"손바람: 일을 치러 내는 솜씨나 힘\\n예) 하루 종일 손바람이 나게 뛴 보람이 있군.\\n참고) 이름씨가 아름다운 순우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"말다짐","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1357290&page=6","sourceText":"말다짐: 말로 굳게 다짐하는 일.\\n참고)이름씨가 아름다운 순우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"싸개통","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1348257&page=6","sourceText":"싸개통: 여러 사람이 둘러싸고 다투면 승강이를 하는 상황\\n예) 옥신각신 싸개통이 되었습니다.\\n참고) 이름씨가 아름다움 순 우리말 동화 이상배 편저 우지현 그림","images":[]},{"word":"옥신각신","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1342630&page=6","sourceText":"옥신각신: 서로 옳다 그르다 하며 다툼. 또는 그런 행위.\\n예)상인들이 물건값을 흥정하느라 옥신각신 떠들고 있다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버","images":[]},{"word":"퉁바리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1330318&page=6","sourceText":"퉁바리: 퉁명스러운 핀잔..\\n예) 진수는 괜히 나서는 민수가 얄미워 퉁바리를 주었다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버","images":[]},{"word":"익살꾼","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1310863&page=6","sourceText":"익살꾼: 남을 웃기는 우스운 말이나 행동을 아주 잘 하는 사람.\\n익살은 남을 웃기려고 일부러 하는 말이나 몸짓.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"벅벅이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1220794&page=6","sourceText":"벅벅이-그러하리라고 미루어 헤아려 보건대 틀림없이\\n예) 무엇인가 벅벅이 트집을 잡을 겁니다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"모종비","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1178868&page=7","sourceText":"모종비 : 모종하기에 알맞은 때에 내리는 비.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"멧부리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1173931&page=7","sourceText":"멧부리-산등성이나 산봉우리의 가장 높은 꼭대기.\\n예) 저 산의 멧부리가 높다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"구순하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1164942&page=7","sourceText":"구순하다:서로 사귀거나 지내는 데 사이가 좋아 화목하다.\\n예) 형제끼리 구순하게 지냈습니다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"우두망찰","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1159628&page=7","sourceText":"우두망찰 : 정신이 얼떨떨하여 어찌할 바를 모르다.\\n예) 우두망찰하여 슬피 울기만 하였습니다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"귀잠","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1152350&page=7","sourceText":"귀잠: 아주 깊이 든 잠\\n예) 모닥불 옆에서 귀잠이 들었습니다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"번죽거리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1135654&page=7","sourceText":"번죽거리다 : 얼굴이 번번하게 생긴 사림이 매우 얄밉게 이죽이죽하면서 느물거리는 모양.\\n예) 난 번죽거리는 성격의 남자는 딱 질색이다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버 사전","images":[]},{"word":"씨양이질","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1128970&page=7","sourceText":"씨양이질: 한창 바쁠 떄 쓸데없는 일로 남을 귀찮게 하는 짓.\\n예) 바쁜 사람 붙들고 씨양이질 그만 하고 어서 가보시오.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"시서늘하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1121091&page=7","sourceText":"시서늘하다: 음식 따위가 식어서 매우 차다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버","images":[]},{"word":"터알","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1116053&page=7","sourceText":"터알: 집의 울 안에 있는 작은 밭\\n예) 집에서 터알을 가꾸며 지내는 노인이 되었습니다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"다직하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1091272&page=7","sourceText":"다직하다 :기껏 한다고 하면, 기껏 많이 잡아서, 기껏 많다고 해야\\n예) 다직해야 집 앞의 넓은 마당을 한 바퀴 돌 뿐이었습니다.\\n참고)이름씨가 아름다운 순 우리말 동화 이상배 편저 우지현 그림","images":[]},{"word":"꽃자리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=1001519&page=8","sourceText":"꽃자리: 나무의 꽃이 떨어진 자국\\n예) 울긋불긋 꽃자리가 아름답다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"꽃맺이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=920384&page=8","sourceText":"꽃맺이 : 꽃이 진 뒤에 바로 맺히는 열매\\n참고 ) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"길마중","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=887543&page=8","sourceText":"길마중:올 사람을 기다리기 위하여 길에 나가 있는 일\\n예)장에 간 엄마 길마중을 나갔다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"땅고름","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=880226&page=8","sourceText":"땅고름: 땅바닥을 높낮이가 없이 바르고 판판하게 고르는 일.\\n예) 땅고름을 하고 일을 시작했습니다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"감숭감숭","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=874329&page=8","sourceText":"감숭감숭\\n: 잔털 따위가 드물게 나서 가무스름한 모양\\n예) 감숭감숭 난 수염이 제법 턱을 덮었다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버 사전","images":[]},{"word":"가물가물","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=867740&page=8","sourceText":"가물가물: 작고 약한 불빛 따위가 사라질 듯 말 듯 움직이는 모양\\n조금 멀리 있는 물체가 보일 듯 말 듯 희미하게 움직이는 모양.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"가랑가랑","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=860131&page=8","sourceText":"가랑가랑: 액체가 많이 담기거나 괴어 가장자리까지 거의 찰 듯한 모양. 눈에 눈물이 넘칠 듯이 가득 괸 모양.\\n예) 소나기가 지나가자 마당에 널린 화분마다 빗물이 가랑가랑 고였다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버 사전","images":[]},{"word":"주적거리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=847410&page=8","sourceText":"주적거리다\\n- 주책없이 잘난 체하며 자꾸 떠들다\\n- 처음 걸음을 걷기 시작하는 어린아이가 자꾸 비틀거리며 귀엽게 걷다\\n- 자꾸 느리게 어정어정 걷다\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림\\n네이버사전","images":[]},{"word":"버르적거리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=837317&page=8","sourceText":"버르적거리다-고통스러운 일이나 어려운 고비에서 벗어나려고 팔다리를 내저으며 몸을 자꾸 움직이다.\\n참고)이름씨가 아름다움 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"구쁘다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=829095&page=8","sourceText":"구쁘다:뱃속이 허전하여 자꾸 먹고 싶다.\\n예) 입 안에 군침이 돌며 뱃속이 구뻣습니다.\\n참고) '이름씨'가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"시쁜","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=825022&page=9","sourceText":"시쁜: 마음이 차지 아니하여 시들하다\\n예)승복이는 시쁘둥하게 대답했다 (시쁘둥하다-마음에 차지 아니하여 아주 시들한 기색이 있다)\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"조잔부리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=810368&page=9","sourceText":"조잔부리: 점잖지 않게 때를 가리지 않고 군음식을 자꾸 먹는 모양\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"자드락길","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=798349&page=9","sourceText":"자드락길 : 나지막한 산기슭의 비탈진 땅에 난 좁은 길\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"밥주머니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=792210&page=9","sourceText":"밥주머니\\n-밥을 담는 주머니\\n-아무 일도 하지 않고 밥이나 축내는 쓸모없는 사람을 낮잡아 이르는 말\\n-위를 속되게 이르는 말.\\n참고) 이름씨가 아름다운 순 우리말 동화 이상배 편저 우지현 그림\\n네이버 사전","images":[]},{"word":"덜렁쇠","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=787357&page=9","sourceText":"덜렁쇠: 침착하지 못하고 몹시 덤벙거리는 사람(덜렁꾼.덜렁이)\\n예) 영민이는 겉으론 덜렁쇠같이 보이지만, 실제론 꼼꼼하고 치밀하다.\\n참고)이름씨가 아름다운 순 우리말 동화 이상배 편저 우지현 그림\\n네이버 사전","images":[]},{"word":"굴퉁이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=780786&page=9","sourceText":"굴퉁이\\n:겉모양은 그럴듯하나 속은 보잘것 없는 물건이나 사람\\n:씨가 여물지 않은 늙은 호박\\n예)이것은 아무짝에도 쓸모없는 굴퉁이이다.\\n길가에서 굴퉁이 하나를 따고 저렇게 좋아한다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n네이버 사전","images":[]},{"word":"마당발","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=773810&page=9","sourceText":"마당발\\n: 볼이 넓고 바닥이 평평하게 생긴 발\\n: 인간관계가 넓어서 폭넓게 활동하는 사람.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n네이버","images":[]},{"word":"호르르 호르르","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=765767&page=9","sourceText":"호르르 호르르\\n-작은 새 따위가 날개를 가볍게 치며 날아가는 소리. 또는 그 모양\\n- 얇은 종이나 바싹 마른 검불 따위가 타오르는 소리. 또는 그 모양\\n참고)이름씨가 아름다운 순 우리말 동화 이상배편저 우지현 그림\\n네이버사전","images":[]},{"word":"살캉살캉","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=758516&page=9","sourceText":"살캉살캉: 설익은 곡식이나 열매 따위가 자꾸 가볍게 씹히는 소리, 또는 그 느낌\\n살강살강보는 거센 느낌\\n예)나는 물컹물컹하는 무른 고구마보다 살캉살캉하게 씹히는 것을 더 좋아한다.\\n참고) 이름씨가 아름다운 순 우리말 동화 이상배 편저 우지현 그림\\n네이버","images":[]},{"word":"쿵더쿵","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=744784&page=9","sourceText":"쿵더쿵: 방아확에 공이를 잇달아 내리칠 때 나는 소리, 또는 그 모양.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"가루다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=734834&page=10","sourceText":"가루다\\n자리를 함께 나란히 하다. 맞서 견주다.\\n참고)이름씨가 아름다운 순 우리말 동화\\n이상배 편저/우지현 그림","images":[]},{"word":"벼룻길","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=728737&page=10","sourceText":"벼룻길: 아래가 강가나 바닷가로 통한 벼랑길\\n예) 아름다운 강을 끼고 있는 벼룻길을 가벼운 마음으로 걷다.\\n참고) 이름씨가 아름다운 순 우리말 동화","images":[]},{"word":"곱소리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=716180&page=10","sourceText":"곱소리: 코끼리의 꼬리털 가늘고 부드러우며 망건. 탕건 따위를 만드는 데 쓴다.\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저","images":[]},{"word":"두렛일","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=694489&page=10","sourceText":"두렛일: 여러 사람이 두레를 짜서 하는 농사일.\\n두레는, 농사꾼들이 농사철에 서로 협력하기 위하여 이룬 모임\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저 우지현 그림","images":[]},{"word":"달각달각","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=686221&page=10","sourceText":"달각달각 -작고 단단한 물건이 자꾸 맞부딪치는 소리. 달가닥달가닥의 준말\\n참고-이름씨가 아름다운 순 우리말 동화\\n이상배 편저","images":[]},{"word":"우렁우렁","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=675542&page=10","sourceText":"우렁우렁\\n소리가 아주 크게 울리는 모양\\n참고) 이름씨가 아름다운 순 우리말 동화\\n이상배 편저","images":[]},{"word":"능소니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=667613&page=10","sourceText":"능소니: 곰의 새끼\\n참고) 네이버","images":[]},{"word":"마음결","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=663125&page=10","sourceText":"마음결:마음의 움직이는 바탕\\n-마음결이 비단같다\\n참조)이름씨가 아름다운 순 우리말 동화","images":[]},{"word":"뒷말","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=652642&page=10","sourceText":"뒷말\\n1, 계속되는 이야기의 뒤를 이음\\n3.일이 끝난 뒤에 뒷공론으로 하는 말\\n3.바로 뒤에 오는 말\\n출처) 네이버","images":[]},{"word":"구순하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=645339&page=10","sourceText":"구순하다- 서로 사귀거나 지내는 데 사이가 좋아 화목하다\\n출처)'이름씨'가 아름다운 순 우리말 동화 이상배 편저","images":[]},{"word":"막둥이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=636991&page=11","sourceText":"막둥이\\n1)막내를 귀엽게 이르는 말\\n2)잔심부름하는 사내아이\\n출처: 국립국어원 우리말샘","images":[]},{"word":"거드럭거리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=628191&page=11","sourceText":"거드럭거리다(동)\\n-거만스럽게 잘난 체하며 자꾸 버릇없이 굴다.\\n있을수록 거드럭거리지 말고 겸손해야 한다\\n<출처-네이버>","images":[]},{"word":"꾀","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423862&page=11","sourceText":"일은 잘 꾸며 내거나 해결해 내거나 하는 묘한 생각이나 수단.\\n싫증이 나 것을 뜻하기도 함.\\n이름씨가 아름다운 순 우리말 동화 이상배편저 우지현그림","images":[]},{"word":"일손","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423739&page=11","sourceText":"일하는 손, 또는 손을 놀려 하는 일. '일손이 부족하다.'\\n이름씨가 아름다운 순 우리말 동화 이상배편저 우지현그림","images":[]},{"word":"단박","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423625&page=11","sourceText":"단박\\n주로 '단박에'의 꼴로 쓰이며, 그 자리에서 바로 '단박에 먹어치우다'.\\n'이름씨,가 아름다운 순 우리말 동화 이상배 편저/ 우지현 그림","images":[]},{"word":"바투","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423530&page=11","sourceText":"두 대상이나 물체의 사이가 썩 가깝게 라는 뜻입니다.\\n엄마는 승민이에게 바투 다가앉았다.\\n※ 출처 - 이름씨가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"아름드리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423418&page=11","sourceText":"둘레가 한 아름이 넘는 것 을 나타내는 말입니다.\\n아름 은 두 팔을 둥글게 모아서 만든 둘레를 말합니다.\\n마을 어귀에 아름드리 느티나무가 서 있다.\\n※ 출처 - 이름씨가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"새경","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423324&page=11","sourceText":"머슴이 주인에게서 한해 동안 일한 대가로 받는 돈이나 물건\\n※ 출처 : 이름씨가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"배불뚝이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423265&page=11","sourceText":"배가 불뚝하게 나온 사람을 낮잡아 이르는 말\\n출처: '이름씨'가 아름다운 순우리말 동화 / 이상배 편저","images":[]},{"word":"댓바람","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=423111&page=11","sourceText":"일이나 때를 당하여 서슴지 않고 당장.\\n출처: '이름씨'가 아름다운 순우리말 동화","images":[]},{"word":"철모르다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422955&page=12","sourceText":"철모르다\\n사리를 분간할 줄 모르다. '철'은 사리를 분별할 줄 아는 힘.\\n출처: '이름씨'가 아름다운 순우리말 동화 / 이상배 편저","images":[]},{"word":"바스스","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422899&page=12","sourceText":"바스스\\n눕거나 앉았다가 조용히 일어나는 모양.\\n출처: '이름씨'가 아름다운 순우리말 동화 / 이상배 편저","images":[]},{"word":"엎어삶다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422768&page=12","sourceText":"엎어삶다\\n그럴듯한 말로 남을 속이어 자기의 뜻대로 되게 하다.\\n출처: '이름씨'가 아름다운 순우리말 동화 / 이상배 편저","images":[]},{"word":"뿔따구","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422684&page=12","sourceText":"뿔따구\\n불유쾌한 충동으로 왈칵 치미는 노여운 감정. \\"뿔따구'는 '성'의 속어. '성이 나서 얼굴을 붉히다.'\\n출처: '이름씨'가 아름다운 순우리말 동화 / 이상배 편저","images":[]},{"word":"채비","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422537&page=12","sourceText":"채비\\n갖추어 차림. 또는 그러는 일.\\n출처: '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"주먹다짐","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422476&page=12","sourceText":"주먹다짐\\n주먹으로 때리는 짓.\\n출처: '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"대갚음","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422322&page=12","sourceText":"대갚음\\n남에게 입은 은혜나 남에게 당한 원한을 잊지 않고 그대로 갚음.\\n출처: '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"삯","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422226&page=12","sourceText":"삯\\n일한 데 대한 보수로 주는 돈이나 물건.\\n출처: '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"흠칫","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422168&page=12","sourceText":"흠칫\\n놀라거나 겁이 나서 어깨나 목을 움츠리는 모양. 흠칫흠칫.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"다리쉬임","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=422034&page=12","sourceText":"다리쉬임\\n오랫동안 길을 걷거나 서서 일을 하다가 잠깐 다리를 쉬는 일. 다리쉼.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"등속","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421975&page=13","sourceText":"등속\\n앞의 물건과 비슷한 것들을 몰아서 이르는 말\\n'연필, 지우개 등속.'\\n출처: '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"길마","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421864&page=13","sourceText":"길마\\n짐을 싣거나 수레를 끌기 위하여 소나 말 따위의 등에 얹는 안장.\\n'길마를 지우다.'\\n출처: '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"때때신","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421682&page=13","sourceText":"때때신\\n알록달록하게 곱게 만든 아이의 신.=꼬까신.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"현명","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421441&page=13","sourceText":"현명\\n어질고 사리에 밝음.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"쌍심지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421378&page=13","sourceText":"쌍심지\\n몹시 화가 난 두 눈에 핏발이 서는 일.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"아귀차다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421296&page=13","sourceText":"아귀차다\\n마음이 굳세고 하는 일이 야무지다.\\n출처: '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"모다깃매","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421134&page=13","sourceText":"모다깃매\\n여럿이 한꺼번에 덤비어 때리는 매 = 몰매.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"털수세","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=421014&page=13","sourceText":"털수세\\n털이 많이 나서 험상궂게 보이는 수염.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"본새","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420935&page=13","sourceText":"본새\\n어떤 물건의 본디의 생김새. '본새는 곱다'.\\n어떤한 짓이나 버릇의 됨됨이. '어린 티는 나지만 본새는 의젓하다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"성의","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420897&page=13","sourceText":"성의\\n참되고 정성스러운 뜻. '성의를 다하다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"선심","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420741&page=14","sourceText":"선심\\n남에게 베푸는 후한 마음. '선심을 쓰다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"고루","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420630&page=14","sourceText":"고루\\n고르게. 두루두루 빼놓지 않고.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"다리품","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420510&page=14","sourceText":"다리품\\n길을 걷는 데 드는 노력. '괜히 다리품만 팔았다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"동무장사","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420465&page=14","sourceText":"동무장사\\n두 사람 이상이 같이 경영하는 장사.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"돌장이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420317&page=14","sourceText":"돌장이\\n석수를 이름. 돌을 다루어 물건을 만드는 사람. = 석공\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"물정","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420258&page=14","sourceText":"물정\\n세상의 형편이나 인심. '세상 물정에 어둡다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"돈꿰미","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420119&page=14","sourceText":"돈꿰미\\n엽전을 꿰는 꿰미. 또는 엽전을 꿰어 놓은 꿰미.\\n'돈꿰미를 차다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"헤프다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=420011&page=14","sourceText":"헤프다\\n말을 조심하지 않고 함부로 지껄이다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"처지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419998&page=14","sourceText":"처지\\n자기가 처해 있는 경우, 또는 환경.\\n'처지가 매우 딱하다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"배알","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419870&page=14","sourceText":"배알\\n지위가 높거나 존경하는 사람을 찾아가 뵘.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"뜬돈","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419771&page=15","sourceText":"뜬돈\\n어쩌다 우연희 생긴 돈.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"경","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419691&page=15","sourceText":"경\\n'불경'의 준말. 불경은 불교의 경전으로 부처님의 가르침을 기록한 책.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"궁리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419571&page=15","sourceText":"궁리\\n마음 속으로 이리저리 따져 깊이 생각함. 또는 그런 생각.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"할긋","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419421&page=15","sourceText":"할긋\\n곁눈으로 살짝 한 번 할겨 보는 모양. 눈에 얼씬 보이는 모양. 곁눈은, 얼굴은 돌리지 않고 눈알만 옆으로 굴려서 보는 눈.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"너럭바위","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419287&page=15","sourceText":"너럭바위\\n넓고 평평한 큰 돌.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"가물","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419151&page=15","sourceText":"가물\\n오래도록 비가 안 오는 날씨. 가뭄.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"어르신네","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=419013&page=15","sourceText":"어르신네\\n남의 아버지나 나이 많은 사람을 이르는말.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"아귀차다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418892&page=15","sourceText":"아귀차다\\n마음이 굳세고 하는 일이 야무지다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"해넘이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418757&page=15","sourceText":"해넘이\\n해가 막 넘어가는 때.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"처지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418679&page=15","sourceText":"처지\\n처하여 있는 사정이나 형편. '처지가 딱하다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"빚물이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418514&page=16","sourceText":"빚물이\\n남의 빚을 대신 갚아 주는 일.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"난바다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418420&page=16","sourceText":"난바다\\n육지에서 멀리 떨어진 넓은 바다. '난바다에 떠 있는 배'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"할금할금","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418316&page=16","sourceText":"할금할금\\n곁눈으로 살그머니 자꾸 할겨 보는 모양.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"퉁방울눈","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418273&page=16","sourceText":"퉁방울눈\\n퉁방울처럼 불거진 눈.\\n퉁방울은, 품질이 낮은 놋쇠로 만든 방울. '퉁방울처럼 눈이 휘둥그레지다'.\\n출처 : '이름씨'가 아름다운 순우리말 동화 / 이상배 편저","images":[]},{"word":"울력","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418170&page=16","sourceText":"욱력\\n'여러 사람이 힘을 합하여 일함. 또는 그런 힘' 을 뜻합니다.\\n예) '마을 사람들이 울력하여 김매기를 마쳤다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"온새미","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=418037&page=16","sourceText":"온새미\\n주로 '온새미로'의 꼴로 쓰이는 말로, '가르거나 쪼개지 않고 생긴 그대로의 상태'를 뜻합니다.\\n예) 치를 온새미로 한 마리 주시오'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"걱정꾸러기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417972&page=16","sourceText":"걱정꾸러기\\n'늘 걱정이 많은 사람' 을 낮잡아 이르는 말이고, '늘 남에게 걱정을 많이 듣는 사람'을 낮잡아 이르는 말이기도 합니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"말총","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417814&page=16","sourceText":"말총\\n'말의 갈기나 꼬리의 털'. '갈기'는, 말이나 사람의 목덜미에 난 긴 털을 말합니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"다저녁때","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417797&page=16","sourceText":"다저녁때\\n'저녁이 다 된 때'를 말합니다. '아침 나절에 온다고 하더니 다저녁때가 다 되어도 오지 않는구나'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"또바기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417676&page=16","sourceText":"또바기\\n'언제나 한결같이 꼭 그렇게'라는 뜻입니다.\\n예) '인사를 또바기 잘 한다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"트레바리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417522&page=17","sourceText":"트레바리\\n'이유 없이 남의 말에 반대하기를 좋아하는 성격. 또는 그런 성격을 지닌 사람'을 말합니다. '그 사람은 어느 자리에서나 트레바리이다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"먹음새","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417452&page=17","sourceText":"먹음새\\n'음식을 먹는 태도'를 뜻합니다. 비슷한 말로는 '먹새'가 있습니다. '먹음새가 좋아 살이 찐다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"온달","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417355&page=17","sourceText":"온달\\n'음력 보름날의 가장 둥근 달'을 말합니다. 보름달.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"아람치","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417215&page=17","sourceText":"아람치\\n'개인이 사사로이 차지하는 몫'을 뜻합니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"애면글면","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417160&page=17","sourceText":"애면글면\\n'몹시 힘에 겨운 일을 이루려고 갖은 애를 쓰는 모양' 을 뜻합니다. 애면글면하다. '애면글면 돈을 모아 부자가 되었다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"메숲","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=417048&page=17","sourceText":"메숲\\n'산에 나무가 우거진 숲'을 말합니다. '메숲지다'는, 산에 나무가 울창하다는 뜻입니다. '메숲에서 새들이 지저귄다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"허허바다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416940&page=17","sourceText":"허허바다\\n'끝없이 널고 큰 바다'를 말합니다. '난바다'는, 육지에서 멀리 떨어진 넓은 바다로 비슷한 뜻의 말이며, '허허벌판'은, 끝없이 넓고 큰 벌판을 말합니다. '허허바다에 떠 있는 배'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"도리머리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416816&page=17","sourceText":"도리머리\\n'머리를 좌우로 흔들어 싫다거나 아니라는 뜻을 표시하는 짓'을 말합니다. = 도리질.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"노량","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416799&page=17","sourceText":"노량\\n'느릿느릿'이란 뜻이며, '노량으로'는, 어정어정 놀면서 느릿느릿. '일을 그렇게 노량으로 하면 언제 끈내느냐'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"쭉신","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416660&page=17","sourceText":"쭉신\\n'해지고 쭈그러진 헌 신' 입니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"달구리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416582&page=18","sourceText":"달구리\\n'이른 새벽의 닭이 울 때'를 이르는 말입니다. '먼 길을 떠나기 위해 달구리에 일어나 채비를 하였다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"맨꽁무니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416483&page=18","sourceText":"맨꽁무니\\n'아무 밑천 없이 맨주먹으로 일을 함. 또는 그렇게 일을 하는 사람' 을 이르는 말입니다.\\n'그 사람은 돈도 기술도 없는 맨꽁무니이다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"찌그렁이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416370&page=18","sourceText":"찌그렁이\\n'남에게 무턱대고 억지로 떼를 쓰는 짓. 또는 그런 사람'을 이릅니다.\\n'찌그렁이 붙지 마라'. 또다른 뜻은 '제대로 여물지 못한 찌그러진 열매'입니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"구쁘다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416214&page=18","sourceText":"구쁘다\\n'뱃속이 허전하여 자꾸 먹고 싶다' 라는 뜻입니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"보드기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416173&page=18","sourceText":"보드기\\n'크게 자라지 못하고 마디가 많은 어린 나무'\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"시쁘다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=416058&page=18","sourceText":"시쁘다\\n'마음에 차지 아니하여 시들하다'의 뜻입니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"야지랑","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415956&page=18","sourceText":"야지랑\\n'얄밉도록 능청맞고 천연스러운 태도'를 말합니다.\\n'야지랑스럽다'는, 얄밉도록 능청맞고 천연스럽다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"아름드리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415845&page=18","sourceText":"아름드리\\n'둘레가 한 아름이 넘는 것'을 나타내는 말입니다.\\n'아름'은 두 팔을 둥글게 모아서 만든 둘레를 말합니다.\\n예) '마을 어귀에 아름드리 느티나무가 서 있다.'\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"용춤","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415788&page=18","sourceText":"용춤\\n남이 추어올리는 바람에 좋아서 시키는 대로 하는 짓.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"옹춘마니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415647&page=18","sourceText":"옹춘마니\\n'소견이 좁고 마음이 너그럽지 못한 사람'을 이릅니다.\\n예) '그는 마음이 콱 막힌 옹춘마니이다.'\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"풋바심","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415573&page=19","sourceText":"풋바심\\n'채 익기 전의 벼나 보리를 베어 미리 떨거나 훑는 일'이라는 뜻입니다.\\n'풋'은 새로운 것, 덜 익은 것의 뜻을 풋감, 풋고추, 풋곡식, 풋과일같이 덜 익은 것을 나타냅니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"업숭이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415440&page=19","sourceText":"업숭이\\n\\"하는 짓이 변변하지 못한 사람을 조롱하는 말\\" 입니다.\\n예) '쯧쯧, 하는 짓이 꼭 업숭이다.'\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"허풍","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415349&page=19","sourceText":"허풍은\\n거짓말에 순우리말입니다.","images":[]},{"word":"빙충맞다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415278&page=19","sourceText":"빙충맞다\\n\\"똘똘하지 못하고 어리석으며 수줍음을 타는 데가 있다. \\"\\n예) 젊은 사람이 씩씩하지 못하고 빙충맞다.\\"\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","images":[]},{"word":"마음자리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415110&page=19","sourceText":"마음자리\\n'마음의 본바탕'이라는 뜻입니다.\\n'마음보'는, 마음을 쓰는 속 바탕, '마음씨'는 마음을 쓰는 태도를 말합니다.\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","images":[]},{"word":"보짱","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=415066&page=19","sourceText":"보짱\\n\\"마음 속에 품은 꿋꿋한 생각이나 요량\\"을 뜻합니다.\\n예) '그 청년은 보짱이 크다.'\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","images":[]},{"word":"고래실","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414940&page=19","sourceText":"고래실\\n'바닥이 깊고 물길이 좋아 기름진 논' 이르는 뜻\\n예) 넓은 고래실에서 해마다 풍년이 든다.\\n<출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저>","images":[]},{"word":"고추바람","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414896&page=19","sourceText":"고추바람 : 살을 에는 듯 매섭게 부는 차가운 바람\\n눈위로 불어 오는 찬바람, 눈을 마구 휘날리는 바람은 '눈바람'입니다.\\n출처 : '이름씨'가 아름다운 순 위리말 동화 / 이상배 편저","images":[]},{"word":"괭이잠","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414791&page=19","sourceText":"괭이잠\\n'깊이 들지 못하고 자주 깨면서 자는 잠'을 이릅니다.\\n'노루잠'도 비슷한 뜻입니다.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배","images":[]},{"word":"틀거지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414654&page=19","sourceText":"틀거지\\n'튼실하고 위험이 있는 겉모양' 을 뜻함.\\n'튼실하다'는 튼튼하고 실하다는 뜻입니다.\\n예) '그 사람 틀거지가 만만치 않다'.\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"물초","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414531&page=20","sourceText":"물초\\n'온통 물에 젖음. 또는 그런 모양'을 말합니다.\\n예) '온몸이 물초가 되어 흐느적거렸다.'\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"어리보기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414416&page=20","sourceText":"어리보기\\n예) 난 세상 물정을 모르는 어리보기 일세\\n- 얼뜬사람, 둔한 사람을 뜻함.\\n출처 : '이름씨'가 아름다운 순 우리말 동화/ 이상배 편저","images":[]},{"word":"허릅숭이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414391&page=20","sourceText":"허릅숭이\\n'말과 행동이 착실하지 못하여 미덥지 못한 사람'을 이르는 말\\n출처 : '이름씨'가 아름다운 순 우리말 동화 / 이상배","images":[]},{"word":"소마소마","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414216&page=20","sourceText":"소마소마\\n'겁이 나거나 무서워서 마음이 초조한 모양'의 뜻입니다.\\n'소마소마 가슴을 졸이다.'\\n출처 : 이름씨가 아름다운 순 우리말 동화 / 이상배 편저","images":[]},{"word":"덴겁하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414175&page=20","sourceText":"덴겁하다\\n'뜻밖의 일을 당하거나 겁에 질려 어찌할 바를 모르고 허둥지둥함'을 이르는 말.\\n예) '도둑이 기침 소리에 덴겁하여 도망쳤다.'\\n<출처 : '이름씨'가 아름다운 순 우리말 동화, 이상배 편저>","images":[]},{"word":"애면글면","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=414053&page=20","sourceText":"애면글면: 몸시 힘에 겨운 일을 이루려고 갖은 애를 쓰는 모양.\\n낑낑. 끙끙. 힘에 겨워 괴롭게 자꾸 내는 소리입니다. 이렇게 낑낑, 끙끙 소리가 날 만큼 몹시 힘에 겨운 일을 이루려고 갖은 애를 쓰는 모양을 애면글면이라고 합니다. 무슨 사자성어 같기도 하죠?\\n애면글면 둘러봐도 나는 절대 못 찾을걸?\\n귀신이 나오는 공포 영화의 주인공들도 늘 애면글면하죠? 좀처럼 모습을 보이지 않는 귀신 때문에 겁에 질려 늘 힘들게 도망치곤 하니까요. 공포 영화속에서는 주인공이 들어간 방에는 분명히 아무도 없습니다. 하지만 금세 어디선가 새살거리는 소리가 들려와서 \\"이게 무슨 소리지? 누구 있어요?\\"하며 애면글면 찾아디니다가 결국….\\n애면글면 기른 자식들은 지금 어디 있는 걸까?\\n5월8일에만 부모님께 효도하시나요? 이 글을 읽는 지금, 부모님께 사랑을 담아 \\"저를 애면글면 기르시느라 애쓰셨어요. 고맙습니다\\"라고 한 마디 해보시는 건 어떨까요? 그 짧은 한마디 하는 게 뭐 그리 애면글면한가요?\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"해찰하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413949&page=20","sourceText":"해찰: 일에는 마음을 두지 아니하고 쓸데없이 다른 짓을 함.\\n해찰스럽다: 일에는 마음을 두지 아니하고 쓸데없는 다른 짓을 하려는 데가 있다.\\n채만식의 『소년은 자란다 』에 이런 내용이 있습니다. '조선어 시간에 아이들이 해찰을 부리거나….' 여기서 '해찰'은 좀처럼 집중하지 않고 쓸데없이 다른 짓을 한다는 뜻입니다.\\n아이들이란 자칫 한눈팔고 해찰하기 일쑤라서 가끔 주의를 환기할 필요가 있다.\\n'해찰'은 주로 아이들에게 쓰는 말인데요, 자기가 해야 할 일에는 마음을 두지 않고 쓸데없이 다른 짓을 하는 어른에게는 써도 괜찮습니다.\\n옆집 아이는 참 해찰궂은 아이야.\\n마음에 썩 내키지 않아 물건을 부질없이 이것저것 집적거려 해치는 버릇이 있을 때도 해찰궂다를 쓸 수 있습니다. '안에서 새는 바가지는 밖에서도 샌다'고 하니까 아이들이 남의 집에 가서 해찰궂게 굴지 않도록 집안에서부터 가르쳐야겠네요.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"데면데면","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413879&page=20","sourceText":"데면데면 ｜ 사람을 대하는 태도가 친밀감이 없이 예사로운 모양. 성질이 꼼꼼하지 않아 행동이 신중하거나 조심스럽지 않은 모양.\\n누군가 여러분께 '당신은 데면데면하군요'라고 말한다면 그건 무슨 뜻일까요? 그 말을 듣고 '그렇게 봐 주셔서 고맙습니다'라고 해야 할지, '저를 잘 못 보셨습니다'라고 되받아쳐야 할지 …. '데면데면'의 뜻, 알아 볼까요?\\n그는 누구를 만나도 데면데면 대한다.\\n데면데면은 사람을 대하는 태도가 친밀감이 없이 예사로운 모양을 뜻하는 말입니다. '당신은 데면데면하군요'라는 말은 '당신은 친밀감이 없이 예사롭게 구는군요'라는 뜻입니다. 그렇게 보이려고 의도한 게 아니었다면 친밀하게 보이도록 노력해 보세요.\\n일을 데면데면하게 하면 꼭 탈이 생기게 마련이다.\\n일을 신중하게 하지 않으면 탈이 생기게 마련입니다. 위 문장에서처럼 '데면데면'은 성질이 꼼꼼하지 않아 조심스럽지 않은 모양을 뜻하기도 합니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"숫접다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413733&page=20","sourceText":"숫접다 ｜ 순박하고 진실하다.\\n여러분 주위에 있는 사람 가운데 가장 순박하고 진실한 사람이 누구인지 떠롤려 보세요. 떠올리셨나요? 다음에 그 사람을 만나게 되면 이렇게 말하세요. '당신은 참 숫저운 사람입니다.'\\n나이도 먹을 만큼 먹었는데 어쩌면 저렇게 숫저울까?\\n숫접다는 순박하고 진실하다는 뜻의 우리말입니다. 순박하고 인정이 두텁다는 뜻의 숫지다, 순박하고 어수룩하다는 뜻의 숫하다도 있습니다.\\n가희는 곱게 생겼을 뿐 아니라 너무 숫져서 모두들 좋아했다.\\n'숫접다'와 '숫지다'를 설명해 주는 '순진하다'에는 두 가지 뜻이 있습니다. 마음이 꾸밈이 없고 순박한 걸 뜻하기도 하지만 세상 물정에 어두워 어수룩하다는 뜻도 갖고 있습니다. 여러분은 어떠세요? '그 사람은 순진해'라는 말, 어떻게 해석할까요? 그 사람은 꾸밈이 없다? 그 사람은 세상 물정에 어둡다\\" 아무리 세상이 각박해지더라도 '순진하다'고 하면 '꾸밈이 없다'를 먼전 생각하는 숫저움을 잃어 버리지 않았으면 좋곘습니다.\\n숫접다: 순박하고 진실하다.\\n숫지다: 순박하고 인정이 두텁다.\\n숫하다: 순박하고 어수룩하다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"직신직신","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413625&page=20","sourceText":"직신직신 ｜ 짓궂은 말이나 행동으로 자꾸 귀찮게 구는 모양. 지그시 힘을 주어 자꾸 누르는 모양.\\n직신직신[직씬직씬]. 발음이 좀 어렵죠? 흔히 짖궂은 말이나 행동 따위로 자꾸 귀찮게 하는 사람에게 지분거린다고 하는데요, '직신직신'은 이 '지분거리다'와 비슷한 말입니다.\\n나는 강아지의 배를 직신직신 건드려 봤다.\\n직신직신은 짓궂은 말이나 행동으로 자꾸 귀찮게 구는 모양을 뜻하는 우리말입니다. 또 다르게 지그시 힘을 주어 자꾸 누르는 모양을 뜻하기도 하는데요, 다음과 같이 쓸 수 있습니다.\\n그가 떨어뜨린 종이를 나도 모르게 직신직신 밟았다.\\n누가 모르고 떨어뜨린 종이는 직신직신 밟으면 안 되겠지만 방금 씨앗을 심은 기름진 땅은 작신작신 밟아 줘야겠죠? 작신작신? '직신직신'의 작은말이 '작신작신'입니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"몽짜/몽니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413590&page=21","sourceText":"몽짜 ｜ 음흉하고 심술궂게 욕심을 부리는 짓. 또는 그런 사람.\\n몽짜는 한마디로 심술을 부리는 성질을 뜻하는 말입니다. 왠지 표준어가 아닐 것 같기도 하죠? 하지만 당당히 사전에 표준어로 올라 있는 우리말, 몽짜는 음흉하고 심술궂게 욕심을 부리는 짓이나 그런 사람을 뜻합니다.'그 사람은 어쩐지 몽짜스러운 데가 있다'라는 건 그 사람은 어쩐지 음흉하고 심술궂게 구는 데가 있다는 뜻입니다. 이렇게 몽짜스레 행동하는 사람은 마음에 들지 않게 마련이니까 심술궂게 보이지 않도록 조심합시다!\\n예문)\\n몽짜를 치다.\\n몽니 ｜ 정당한 대우를 받지 못할 때 권리를 주장하기 위하여 심술을 부리는 성질.\\n몽짜와 비슷한 말에는 몽니도 있습니다. 몽니를 부리는 사람을 '몽니쟁이'라고 하는데요, 괜히 심술궂게 굴어서 주변 사람들에게 몽니쟁이나 몽짜로 불리지 말아야겠네요.\\n예문)\\n그것은 참으로 무책임한 발언으로 국민에 대한 몽니일 뿐이다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"말미","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413478&page=21","sourceText":"말미 ｜ 일정한 직업이나 일 따위에 매인 사람이 다른 일로 말미암아 얻는 겨를.\\n직장, 학교, 군대 따위의 단체에서, 일정한 기간 동안 쉬는 일을 '휴가休暇'라고 한다. 쉴 휴休 겨를 가暇. 말 그대로 '쉴 겨를'을 휴가라고 하는 건데, 우리 고유의 말 가운데도 이와 비슷한 뜻을 이르는 말이 있다.\\n말미를 얻다.\\n여름 휴가, 겨울 휴가, 출산 휴가, 제대 휴가, 월차 휴가 등등 휴가에는 종류도 참 많다. 이렇게 많은 휴가들. 앞으로는 휴가 대신 말미를 가 보는 건 어떨까? 말미는 일정한 직업이나 일 따위에 매인 사람이 다른 일로 말미암아 얻는 겨를을 뜻한다. 말미가 나다, 말미를 받다, 말미를 주다. 한자어 휴가休暇를 대신할 수 있는 순 우리말. '말미'입니다.\\n곧 말미를 내어 찾아뵙겠습니다.\\n순 우리말 말미는 일에 매인 사람이 다른 일로 말미암아 얻는 겨를을 뜻한다고 했는데, 한자어 말미末尾는 전혀 다른 뜻이다.\\n어떤 사물의 맨 끄트머리, 그러니까 '말단末端'을 이르는 말이 바로 말미末尾이다. 동음이의어, 말미와 말미末尾. 서로 다른 두 개의 뜻을 헷갈리지 않도록 주의해야겠다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"곰살궂다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413320&page=21","sourceText":"곰살궂다 ｜ 태도나 성질이 부드럽고 친절하다. 꼼꼼하고 자세하다.\\n사람의 성격을 나타내는 말 가운데 하나인 곰살궂다는 사람을 칭찬할 때 쓰면 좋은 말입니다. 칭찬은 고래도 춤추게 한다는데 곰살궂다는 말 한마디는 무엇을 춤추게 만들까요?\\n너는 참 곰살궂다\\n'너는 참 곰살궂다'는 말은 '너는 참 부드럽고 다정하구나'라는 뜻입니다.\\n발음에 주의하면서 읽어 볼까요? 바른 발음은 곰살궂다[곰:살굳따]로 '곰'을 조금 길게 발음합니다. 고옴~\\n아들아, 엄마 허리가 아프니까 이리 와서 곰살궂게 주물러 봐라.\\n곰살궂게 주물러 보라고 하신다고 해서 부드럽고 친절하게만 주무르면 안 됩니다. 우리말 '곰살궂다'에는 '꼼꼼하고 자세하다'는 뜻도 있기 때문에 그럴 때 '꼼꼼하고 자세하게' 주무르는 것이 더 적절하겠죠?\\n또 비슷한 뜻과 모양의 말, 곰살갑다도 있습니다. 성질이 보기보다 상냥하고 부드럽다는 뜻입니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"알음알음","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413221&page=21","sourceText":"'알음'은 사람끼리 서로 아는 일을 뜻하는 말이다. '알음알음'이란 말도 있는데요, 유명한 식당은 사람들의 입을 통해 '알음알음'으로 알려지게 마련이죠?\\n옆집의 수민과는 서로 알음이 있는 사이다.\\n옆집 아이와 서로 아는 사이일 때 알음이 있다고 합니다. 이 밖에도 '알음'은 지식이나 지혜가 있는 걸 뜻하기도 하는데요, 알음 있게 일을 잘했다라는 건 '지혜롭게 일을 잘했다'는 겁니다. 또 어떤 사정이나 수고에 대하여 알아주는 것도 알음이라고 합니다.\\n진정한 봉사는 다른 사람의 알음을 바라지 않는다.\\n'알음알이'란 말도 있습니다. 서로 가까이 아는 사람을 '알음알이'라고 하는데요, 봉사가 필요한 단체에서는 봉사자 알음알이가 많은 사람이 필요하겠네요. 알음알이의 비슷한 말에는 알이알이가 있습니다.\\n알음알이: 서로 가까이 아는 사람.\\n알음알음: 서로 아는 관계, 서로 가진 친분.\\n- 출처: 쓰면서도 잘 모르는 생활 우리말 나들이","images":[]},{"word":"지짐거리다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413158&page=21","sourceText":"지짐거리다 ｜ 조금씩 내리는 비가 자꾸 오다 말다 하며 자꾸 내리다.\\n빈대떡을 사투리로 지짐이라고 하죠? 또 비가 오면 괜히 이런 말을 합니다. '집에 가서 빈대떡이나 부쳐 먹어.' 비와 빈대떡의 이런 관계 때문일까요? '지짐거리다'는 추적추적 내리는 '비'와 관련된 말입니다.\\n비가 지짐거리는 오후\\n'지짐거리다'는 조금씩 내리는 비가 자꾸 오다 말다 하며 자주 내리는 걸 뜻하는 말입니다. '지짐거리다'는 '지짐대다'로도 쓸 수 있는데요, 밖에 나가야 하는데 지짐대면 우산을 가져가야 할지 말아야 할지 조금 고민되겠죠?\\n지금 밖은 지짐대고 있습니다.\\n우리 속담 가운데 '가랑비에 옷 젖는 줄 모른다'는 말이 있습니다. 가늘게 내리는 비는 조금씩 젖어 들기 때문에 옷이 젖는 걸 쉽게 깨닫지 못한다는 뜻으로 아무리 사소한 것이라도 거듬되면 무시 못 할 정도로 크게 됨을 비유하는 말입니다. 잊지 마세요. 지짐지짐 오는 비에도 옷은 젖습니다.\\n지짐거리다: 조금씩 내리는 비가 자꾸 오다 말다 하며 자주 내리다.\\n지짐지짐: 조금씩 내리는 비가 자꾸 오다 말다 하는 모양.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"친친하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=413037&page=21","sourceText":"친친하다 ｜ 축축하고 끈끈하여 불쾌한 느낌이 있다.\\n아기는 기저귀가 축축해져서 불쾌함을 느끼면 울음을 터트립니다. 또 악몽으로 밤새 땀을 흘렸거나 날씨가 더우서 옷이 흠뻑 젖었을 때도 젖은 기저귀를 찬 아기가 느낄 만한 그런 불쾌감을 느낍니다.\\n아기, 기저귀가 친친하게 젖었구나!\\n'친친하다'는 축축하고 끈끈하여 불쾌한 느낌이 있다는 뜻의 우리말입니다. 문학 작품에도 나오는 말인데요, 현진건의 『무영탑』에는 \\"웃옷을 벗는데 담이 어떻게 흘렀는지 속옷에서 웃옷에까지 친친하게 배어 나와 옷고름을 끄르는 대로 김이 물씬물씬 올라왔다\\"는 부분이 있습니다. 땀 때문에 김까지 물씬 올라오다니 정말 불쾌한 느낌이었겠네요.\\n눈에 눈물이 친친하게 고였다.\\n물기가 있어 조금 젖은 걸 흔히 '촉촉하다'또는 '축축하다'고 합니다. 이젠 '친친하다'도 알았으니까 눈물도 친친할 수 있겠죠? 눈물보다는 콧물이 더 친친하겠지만요. 에취!\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"사부작사부작","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412969&page=21","sourceText":"사부작사부작 ｜ 별로 힘들이지 않고 계속 가볍게 행동하는 모양\\n미니시리즈 4부작도 아니고, 사부작사부작? 이 말은 무슨 뜻일까요? 아는 만큼 보인다는 말이 있듯이 아는 만큼 들리기도 하겠죠? '사부작사부작'이란 말도 한번 알고 보면 여저기서 들리기 시작한답니다. 지나가던 할머니들의 대화 속에서, 무심코 듣고 잇던 라디오 속에서, 거나하게 취한 아저씨의 중얼거림 속에서도 들립니다.\\n그가 조금만 시부적시부적하면 쓸 만한 물건이 완성되곤 했다.\\n사부작사부작은 별로 힘들이지 않고 계속 가볍게 행동하는 모양을 뜻하는 말입니다. 이 '사부작사부작'의 큰말인 시부적시부적은 별로 힘들이지 않고 계속 거볍게 행동하는 모양인데요, '거볍게'는 잘못 쓴 게 아니라 '가볍다'의 큰말입니다. '사부작사부작'의 큰말이, '시부적시부적'인 것처럼 말이죠.\\n발음에도 신경 써 주세요! 사부작사부작[사부작싸부작], 시부적시부적[시부적씨부적]입니다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"발맘발맘","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412818&page=21","sourceText":"발맘발맘\\n1. 남의 뒤를 살피면서 한 발 한 발 뒤따르는 모양.\\n2. 한 발씩 또는 한 걸음씩 길이나 거리를 재는 모양.\\n아이의 뒤를 발맘발맘 따라나서다.\\n'발맘발맘'은 남의 뒤를 살피며 쫓아가는 모양을 뜻하는 말이다. 행동이 수상한 사람의 뒤를 발맘발맘 따라간다는 건 그 사람의 뒤를 잘 살피며 한 발 한 발 뒤따라 간다는 뜻이다.\\n피구를 하려면 바닥에 선을 그어야 하니까 발맘발맘 재어 보자.\\n거리를 잴 때도 '발맘발맘'을 쓸 수 있다. 손을 벌려 한 뼘씩 길이를 재듯이 팔이나 다리를 벌려 길이나 거리를 재는 모양도 '발맘발맘이다.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"저어하다","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412772&page=21","sourceText":"'저어하다'는 '염려하다'나 '걱정하다'와 바꿔 쓸 수 있는 말입니다.\\n그대에 대한 내 열정이 식을까 저어된다.\\n'저어하다'말고 저어되다도 있습니다. '저어하다'가 염려하거나 두려워하다는 뜻이니까 ''저어되다'는 염려되거나 두려워지다는 뜻이겠죠?\\n집에서만 은둔하는 사람들은 집 밖으로 나서기를 저어한다.\\n저어하다는 염려하거나 두려워하다는 뜻이지만 한자어 '저어齟齬하다'는 틀어져서 어긋나다, 익숙하지 않아 서름서름하다는 뜻입니다. 한자를 풀이해보니까 '齟(어긋날 저), 齬(어긋날 어)'이네요.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"암니옴니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412658&page=21","sourceText":"'암니옴니'\\n'암니옴니'는 쉽게 말해서 '앞니 어금니'이다.\\n앞니든 어금니든 다 같은 이인데 자질구레하게 따진다는 뜻이다.\\n시시콜콜과 비슷한 말이다.\\n이것저것 속속들이 캐묻는 모양을 듯하는 순 우리말, 암니옴니.\\n예문) 사소한 일까지 암니옴니 따지는 것은 딱 질색이다.\\n암니옴니는 뒤집어서 옴니암니라고 써도 맞다.\\n암니옴니=옴니암니\\n1. 다 같은 이인데 자질구레하게 어금니 앞니 따진다는 뜻으로, 아주 자질구레한 것을 이르는 말.\\n2. 자질구레한 일까지 좀스럽게 셈하거나 따지는 모양.\\n- 출처: 쓰면서도 잘 모르는 생활 속 우리말 나들이","images":[]},{"word":"마늘각시","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412597&page=22","sourceText":"마늘각시 ｜ 마늘 껍질을 벗겨 놓은 것처럼 피부가 하얗고 반반하게 생긴 여인\\n우리나라 옛날 여인들은 몸의 세 군데가 희면 미인이라고 했다. 첫째는 얼굴, 둘째는 이빨, 셋째는 눈동자가 희어야 한다고 했다. 왜냐하면 얼굴이 흰 사람은 피부가 말갛고 깨끗하며, 이빨이 희면 이가 건강하니, 온 몸이 건강하다는 표시이고, 눈동자가 흰 사람도 역시 온 몸이 건강하다는 증거니까 결국 건강한 모습이 미인의 조건이었다.\\n마늘각시란 마늘 껍질을 벗겨 놓은 것처럼 피부가 매끄럽고 하얀 미인을 나타내는 말이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"아름","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412494&page=22","sourceText":"아름 ｜ 두 팔을 둥글게 둘러서 한번에 잡히는 길이\\n'아름'이라는 말은 본디 \\"아기를 안다\\"처럼 '안다'에서 나온 말이다.\\n'아름'은 두팔을 둥글게 둘러 손을 맞잡을 수 있을 만큼의 길이 즉 한번에 안을 수 있는 정도의 크기를 말한다.\\n숲속의 나무가 얼마나 큰가를 따져 볼 때 두 팔로 벌려 안아보면 한아름이 가득 되기도 하고 또 어떤 나무는 혼자서는 안되고 친구들과 여럿이 끌어안아야 되는 수도 있는데 이 정도되는 커다란 나무를 아름드리라고 부른다.\\n아름답다라는 말은 두 팔을 벌려 안아줄 만하다 라는 뜻이다. 사랑스럽고 예쁘고 내 맘에 꼭 드는 사람이라야 안아주고 싶겠지? 그런 사람을 보고 아름답다라고 말한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"살피","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412340&page=22","sourceText":"살피 ｜ 두 땅의 경계를 나타내는 표, 또는 물건과 물건의 틈새를 구별하는 표\\n우리가 책을 읽다가 잠시 덮어 놓을 때, 읽던 곳을 표시하기 위해서 그 자리에 꽂아 놓은 물건을 책갈피라고 한다. 갈피라는 말은 일이나 물건의 부분과 부분이 구별되는 어름을 뜻하는 말이다. 어름은 틈새라는 말이고 그 자리는 책갈피이다. 그 갈피에 꽂아서 표시하는 것을 살피라고 한다.\\n농사를 지을 때 자기 논과 다른 사람의 논을 구분하는 경계선을 살피라고 한다. 경계선이 불분명해서 서로 싸움이 일어나면 그 싸움을 살피싸움이라고 했다.\\n앞으로 책 사이에 꽂아 놓는 표는 책갈피가 아니라 살피라고 부르자.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"방짜","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412283&page=22","sourceText":"방짜 ｜ 아주 알차고 훌륭한 물건\\n옛날에는 놋쇠를 이용하여 여러 가지 그릇을 만들어 사용했었다. 놋쇠라는 것은 구리와 아연이라은 두 종류의 쇠를 녹여서 만든 것인데 이 두 가지 쇠를 이용하여 밥그릇, 숟가락, 대접, 심지어 요강이나 여러 가지 방울 등을 만들었다.\\n지금도 민속촌에 가면 놋쇠로 그릇을 만드는 모습을 볼 수가 있다.\\n놋그릇을 만들 때 보통 사람들보다 아주 뛰어난 기술을 가진 사람이 훌륭하게 만든 물건을 방짜라고 불러서 귀하게 여긴단다.\\n본디 방짜라는 말은 아주 좋은 놋쇠를 녹여 부어 낸 다음 다시 여러차례 두드려서 만든 그릇의 이름이다.\\n옛날에는 그렇게 만들어 나오는 그릇마다 그릇바닥에 방이라는 글짜가 새겨 있었는데 이것은 방씨성을 가진 사람이 만들었다는 표시였단다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"보시기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412148&page=22","sourceText":"보시기 ｜ 김치 깍두기 등을 담는 작은 사발\\n그릇들은 생긴 모양이나, 크기 그리고 쓰는 용도가 조금씩 다르기 때문에 이에 따라 이름이 다르게 붙어 있는 거야.\\n먼저 밥을 먹을 때 쓰는 그릇에는 공기가 있지. 가장 많이 쓰는 말인데 공기에 밥을 담으면 공기밥이 되지. 우리가 식당에 가면 자주 볼 수 있는 말이다. 공기보다 조금 크고 도자기로 만든 그릇을 사발이라고 부른다. 김치 담는 그릇은 주발이라고 한다. 국그릇은 보통 대접이라고 부른다. 김치 담는 그릇은 보시기, 간장을 담는 작은 사기그릇은 종지라고 한다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","images":[]},{"word":"사리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=412014&page=22","sourceText":"사리 ｜ 국수나 새끼, 실 등을 동그랗게 감은 뭉치\\n냉면집이나 국수집에서 사리를 시키면 둥글게 말아 놓은 국수를 더 가져다 주는데 이렇게 국수나 새끼줄, 실 등을 말아 놓은 것을 사리라고 한다.\\n사리는 사리다라는 말에서 나온 것으로 실 같이 길고 잘 엉키는 물건을 동그랗게 포개어 감은 것을 말한다. \\"몸을 사린다\\"라는 말로 쓰일 때는 어렵고 지저분한 일을 살살 피하며 몸을 아낀다는 뜻도 있다.\\n그리고 비슷한 말에 타래라는 말이 있다. 타래, 또는 실타래라고도 하는데 실이나 고삐를 감아서 틀어 놓은 것을 말한다. 마치 꽈배기를 만들 듯이 틀어 놓은 것은 타래라고 하고 그냥 둘글게 둔 것은 사리라고 하는 것이다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","images":[]},{"word":"또아리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411974&page=22","sourceText":"또아리 ｜ 물건을 일 때 머리 위에 얹는 받침\\n자동차가 흔하지 않던 시절에 우리 할머니들은 아이들을 데리고 물건을 들고 다니는 것이 매우 힘드셨다. 등에는 작은 아이를 업고 한 손에는 큰 아이 손을 잡고 걸어갈 때, 커다란 보따리는 어찌 할 수가 없어서 머리에 이고 다니셨다. 또는 시장에 가서 찬거리를 사오실 때라든가 우물에서 물을 길어 올 때에도 장바구니나 물동이를 머리에 이고 다니셨다. 이렇게 무거운 물건을 머리에 얹어서 이고 다니면 머리가 아주 아프겠지? 그래서 짚이나 헝겊을 둥글게 말아 또아리를 만들어서 머리에 얹고 그 위에 물건을 이셨다.\\n또아리는 마치 도넛처럼 생겼어.\\n또아리는 둥글게 생겼다는 뜻을 가진 말인데 뱀이 자기의 몸을 둥글게 말고 있는 모양을 일러 \\"또아리 틀었다\\"고 한단다. 요새 대학생 언니 오빠들이 서로 모여서 동아리르 만들어 만나는데, 동아리란 말은 또아리와 같은 뜻의 말이야.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"매무시","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411885&page=22","sourceText":"매무시 ｜ 옷을 입을 때 옷차림이 바르게 되었는가를 정돈하여 살피는 일\\n매무시는 옷차림이 바르게 되었는지를 살피는 일인데 매무시를 잘 하려면 단추가 바르게 채워졌는지, 옷깃이 접힌 곳은 없는지? 혹시 더러운 것이 묻었거나 헤진 곳은 없는지 등을 잘 살펴서 항상 깔끔하고 단정하게 입는 것이 중요하다.\\n매무시와 비슷한 말로 매무새라는 말이 있다. 발음은 비슷하지만 뜻은 조금 다르다.\\n매무새는 옷을 입은 맵시를 가리키는 말이다. 그러니까 매무시를 잘해야 매무새가 나는 법이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"쾌","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411774&page=22","sourceText":"쾌 ｜ 북어 스무마리를 한 단위로 세는 말\\n시장에 가서 북어를 사려고 하면 싸리나무 가지에다 북어를 줄줄이 꿰어서 파는 것을 볼 수 있다. 보통 20마리를 한 줄에 꿰어서 파는데 이렇게 북어 스무마리를 한꺼번에 부를 때는 쾌라고 한다.\\n오징어 스무마리는 축 또는 죽이라고 하고, 조기 20마리는 두름, 바늘 24개는 쌈이라고 한다. 김은 100장을 한 묶음으로 하여 톳이라고 하고, 감이나 마늘 배추, 무 등 과일이나 채소류의 100개는 접이라고 부른다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"마중물","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411684&page=22","sourceText":"마중물 ｜ 펌프의 물을 이끌어 내기 위하여 처음에 붓는 물\\n예전에는 우물에서 두레박으로 물을 길어 썼다. 그러다가 차차 펌프를 박아서 물을 퍼 올려 식수나 생활용수로 쓰게 되었다. 그런데 펌프물은 처음부터 손잡이를 움직이면 물이 나오지 않는다.\\n펌프에서 물을 퍼 올리기 위해서는 일단 물을 한바가지 퍼 붓고 손잡이를 움직여야 땅에서 물이 나온다. 마치 처음에 부은 물이 땅 속에 있는 물을 마중하여 이끌어 오듯이 말이다. 그래서 펌프에 처음 퍼 붓는 물을 마중물이라고 한다.\\n요새는 어떤 일을 하기 위하여 시작하는 작은 일을 뜻하기도 한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"길라잡이","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411562&page=23","sourceText":"길라잡이 ｜ 나아갈 길을 인도하는 사람\\n길을 따라 여행을 할 때 앞으로 나아갈 길을 인도해 주는 사람을 길라잡이라고 한다. 훌륭한 길라잡이를 만나야 여행이 즐겁고 보람 있게 된다.\\n그리고 함께 길을 가는 사람은 길동무 또는 길벗이라고 하고 길을 지나가는 나그네는 길손이라고 부른다. 길품이라는 말은 이제는 거의 안 쓰이는 말이긴 한데 남이 갈 길을 대신 가 주고 돈을 받는 일을 말해. 퀵서비스 아저씨가 심부름을 해 주고 돈을 받는 것과 비슷하다. 품이라는 말은 어떤 일을 하는 수고를 말하는데 여기저기 부지런히 돌아디는 것을 발품을 판다고 말하고 품삯이라는 말은 남의 일을 대신해 주고 수고비를 받는 것을 말한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"길섶","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411424&page=23","sourceText":"길섶 ｜ 길의 가장자리\\n길섶은 본래 고속도로에 있는 갓길하고는 조금 다른 뜻이다. 길가의 가장자리를 가리키는 말이다.\\n길가에 작은 풀밭이 있고 예쁜 꽃들이 피어 있는 곳을 길섶이라고 하지. 옷의 가장자리를 옷섶이라고 하는 것과 같다.\\n섶이라는 말은 덩쿨식물이 잘 자라도록 받쳐주는 나무를 뜻하기도 하고 땔나무로 쓰이는 나무의 이름이기도 하다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"고샅","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411341&page=23","sourceText":"고샅 ｜ 마을의 좁은 골목길\\n마을의 초가집들 사이에 구불구불하게 이어지는 좁은 길을 고샅길이라고 한다. 보통은 골목길이라고도 하지. 본디는 고샅이라고 했는데 길이라는 말이 더 붙어서 고샅길이라고 부르게 되었다.\\n'샅'이라는 우리말은 두 물건의 사이를 나타내는 말 이다. 발가락 사이를 발샅이라고 하는데서 잘 알 수 있다.\\n샅샅이라는 말은 무엇을 찾을 때 아주 꼼꼼히 잘 찾아보라는 뜻으로 하는 말인데 샅이라는 말을 두 번 써서 만든 말이다. 그러니까 사이사이 또는 구석구석 잘 찾아보라는 말이다.\\n씨름을 할 때 허리와 허벅지 사이에 묶는 띠를 샅바라고 하는데 이 말은 샅, 바로 두 다리의 사이에 묶는 '바'라는 말이다. '바'는 무엇을 묶는 줄이라는 뜻의 우리말이다. 밧줄도 거기에서 나온 말이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"붓방아","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411248&page=23","sourceText":"붓방아 ｜ 글을 쓸 때 생각이 나지 않아 붓대만 바닥에 찧고 있는 모양\\n붓방아란 글을 쓰거나 공부를 할 때 생각이 나지 않아서 붓대를 바닥에 콩콩하고 찍고 있는 모양을 가리키는 말이다.\\n일기나 편지를 쓸 때 생각이 나지 않으면 연필을 만지작거리면서 멍하니 있을때가 있지? 바로 그런 것을 가리켜 붓방아만 찍고 있다고 말하는 것이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"시래기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411167&page=23","sourceText":"시래기 ｜ 무의 입과 줄기를 말린 나물\\n시래기는 무청, 그러니까 무의 잎과 줄기를 말린 것이다.\\n초겨울에 김장을 하면서 무의 잎과 줄기를 따로 잘라 새끼에 묶어 바람이 잘 통하는 그늘에 널어 말린 것이 시래기이다. 이 시래기를 넣어 국을 끓이면 시래깃국이 되고 삶아서 나물로 무치면 시래기무침이 된다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"맛배기","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=411095&page=23","sourceText":"맛배기 ｜ 맛으로 먹기 위하여 양을 적게 담아 주는 음식\\n배부르라고 먹는 것이 아니라 그냥 입맛을 다시기 위해서 양을 조금만 주는 음식을 맛배기라고 한다.\\n자장면을 시킬 때 곱배기를 달라고 하면 보통 음식보다 곱은 많이 준다. 곱이라는 말은 본디 있는 것보다 한번 더 보태는 것을 말한다.\\n수학시간에 배우는 곱하기가 바로 이 말에서 나온 것이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"보늬","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410930&page=23","sourceText":"보늬 ｜ 밤이나 은행, 땅콩 따위 과일의 속껍질\\n밤의 속껍질을 보늬라고 부른다. 보늬는 밤에만 있는 것이 아니라 은행에도 있고, 땅콩에도 있다. 요새 우리가 흔히 보는 땅콩의 얇은 껍질은 겉껍질이 아니라 속껍질이다.\\n보늬에서 알 수 있듯이 과일의 껍질은 속껍질과 겉껍질의 두겹으로 되어있는 때가 있다. 그렇게 두겹으로 된 껍질을 꺼풀이라고 부른단다. 양배추나 양파를 보면 여러 겹의 꺼풀을 볼 수 있지?\\n- 출처: 딸에게 들려 주는 아름다운 우리말","images":[]},{"word":"저냐","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410834&page=23","sourceText":"저냐 ｜ 생선이나 고기를 얇게 저며 저며 밀가루를 묻히고 둥글게 부친 음식\\n명절이나 생일처럼 식구들이 다 함께 모여 즐기는 좋은 날이되면 집집마다 맛있는 음식을 장만하느라 아주 바빠진다. 갖은 야채를 볶고 나물을 무치고, 국수를 삶고, 부침개를 부치고, 국과 찌개를 끓이고, 생선을 지지고, 떡을 찌고, 고기를 튀겨서 온갖 음식을 만든다.\\n어떤 집이든 잔치마다 빠지지 않고 등장하는 것이 저냐이다. 파저냐, 고기저냐, 생선저냐, 녹두저냐 등은 우리나라 사람들이 아주 좋아하는 음식들이다. 그런데 저냐가 뭐냐구?\\n저냐는 생선이나 고기를 얇게 저며 밀가루를 묻히고 둥글게 부친 음식을 말하는데 요새는 흔히 이 말을 줄여서 전이라고 하지. 또는 동그랑땡이라고 하는 것과도 비슷한 음식이다. 그러니까 생선전, 고기전 이라는 말의 옛 우리말이 생선저냐, 고기저냐라는 말이다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"진솔","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410789&page=23","sourceText":"진솔 ｜ 새로 지어 처음 입는 옷\\n새로 지은 옷, 또는 새로 산 옷을 진솔이라고 한다.\\n예전에 임금님은 언제나 진솔버선만을 신으셨다고 한다.\\n새로 빨래를 해서 잘 개켜 놓은 옷에서 나는 산뜻한 냄새를 새물내라고 한다.\\n반대로 옷을 빨아야 할 때가 지났는데도 구질구질하게 그냥 쳐 박아 놓아서 마치 썩은 것처럼 나는 냄새는 자릿내라고 한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"도톨밤","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410655&page=23","sourceText":"도톨밤 ｜ 도토리같이 동그랗고 작은 밤\\n우리가 먹는 밤도 종류에 따라 이름이 참 많다.\\n거칠거칠한 밤송이 속에 들어있는 밤은 송이밤이라고 하고, 그 속에서 꺼낸 밤은 알밤이라고 해.\\n밤 송이를 열어보면 보통은 알밤이 두 개가 들어 있어. 그 한 개를 부를 때 한 톨이라고 하는데, 밤송이 속에 알밤이 두 개가 들어 있으면 두톨밤이 된다. 그러면 알밤이 세 개가 들어 있으면 세톨밤이라고 하고, 하나 있으면 외톨밤이다.\\n도톨밤은 도토리처럼 동그랗고 작은 밤을 가리키는 말이고, 빈대밤은 빈대처럼 납작하게 생긴 밤을 말한다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","images":[]},{"word":"꼬투리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410514&page=24","sourceText":"꼬투리 ｜ 콩이나 팥과 같은 콩과식물의 씨가 들어 있는 껍질\\n콩이나 팥은 모두 한 개의 껍질 안에 여러 알갱이가 같이 들어 있다. 그 모습을 보면 마치 한 부모 밑에 여러 형제들이 다정하게 모여 사는 것과 비슷하다.\\n이렇게 여러 알갱이가 들어 있는 껍질 하나 하나를 꼬투리하고 한다.\\n이 꼬투리를 잘 잡아서 벗기면 그 속에 있는 모든 것을 가질 수 있게 된다. 그래서 어른들은 무슨 일을 감추는 사람의 속마음을 알게 되었을 때 \\"꼬투리를 잡았다\\"라고 말한다.\\n꼬투리를 벗겨내어 그 속에 들어있는 콩알맹이를 다 꺼내고 남은 꼬투리는 깍지라고 한다.\\n그러니까 콩이 들어있는 것은 꼬투리, 알맹이가 없는 것은 깍지다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"샘바리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410478&page=24","sourceText":"샘바리 ｜ 샘이 많아서 안달하는 사람\\n'남의 일이나 물건을 탐내거나 자기보다 나은 처지에 있는 사람을 미워하기도 한다.'\\n'샘'을 가리키는 말이다.\\n누구에게나 있는 마음이다. 그러나 그것이 지나치면 '샘이 많다'는 말을 듣는다. 주위에 좋은 인상을 주지 못한다.\\n그런데 여기에 더해 안달까지 하는 사람이 있다. 이런 사람을 가리켜 '샘바리'라고 한다. 샘이 많아서 안달하는 사람이다.","images":[]},{"word":"모듬","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410329&page=24","sourceText":"모듬｜ 사람이나 물건들의 모임\\n모듬이란 말은 물건이나 사물을 모아 놓았다는 말이다.\\n지금 우리가 '모으다' 또는 '모이다'라고 하는 말을 옛날 사람들은 '몯다'라고 했는데 이 말에서 만들어진 말이 모듬이라는 말이다.\\n이 말은 홀로는 잘 쓰이지 않고 다른 말과 합하여 쓰인다.\\n예를 들면 여러 가지 생선회를 하나의 접시에 담아놓으면 모듬회가 되고, 여러 가지 재료를 섞어서 찌개를 끓이면 모듬찌개가 된다. 이 밖에도 모듬냄비, 모듬전골 등이 있는데 그러고 보니 주로 먹는 음식에 모듬이 많이 쓰인다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"좀도리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410283&page=24","sourceText":"좀도리 ｜ 밥을 지을 때 조금씩 덜어서 모아 놓은 쌀\\n어느 집이고 집집마다 동전을 모으는 저금통들이 하나 둘 씩은 있게 마련이다. 온 식구들이 하루르 지내고 난 뒤 주머니에 남아있는 동전들을 저금통에 모아 두었다가 가득 모이면 통을 열어서 아이들 학용품도 사고, 은행에 저금도 하곤 한다. 작은 동전을 틈틈히 모으다 보면 정말 '티끌 모아 태산'이라는 옛말이 실감이 나게 된다.\\n옛날 어머니들은 식구들의 밥을 지을 때마다 한줌씩의 쌀을 덜어내어 단지에 모았었다. 이렇게 해서 모아진 쌀을 좀도리라고 하고 이 쌀을 담아 놓는 단지를 좀도리단지라고 불렀다. 좀도리단지에 쌀을 모으는 것은 아무리 재산이 많아도 흥청망청하지 말고 아끼고 절약하자는 마음에서 우러나온 풍속이다. 그리고 이 단지에 모인 쌀은 아낙네들이 꼭 필요한 물건을 사는데 쓰였다. 쌀 한톨이라도 귀하게 여기고 아낄 줄 알아야 무엇이든 소중하게 여기고 살아가게 되는 것이다.\\n요즘처럼 낭비가 심한 시절에는 옛날의 좀도리단지가 다시 되살아나서 집집마다 아끼고 절약하는 정신이 깃들이면 좋겠다.\\n- 출처: 딸에게 들려 주는 아름다운 우리말","images":[]},{"word":"꽃다지/무녀리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410152&page=24","sourceText":"꽃다지 ｜ 가지나 오이 따위의 맨 처음 열린 열매\\n농사를 지어서 처음으로 거둔 푸성귀나 나물, 과일들을 맏물이라고 한다. 형제들 사이에서 처음 태어난 아이릉 맏아들, 맏딸이라고 부르는 것과 같은 말이다.\\n그리고 그것들 가운데서 특히 오이나 가지 따위처럼 꽃이 피었다가 진 후에 열리는 첫 열매는 특별히 꽃다지라고 부른다. 또는 꽃이 피었다가 바로 맺힌 열매라서 꽃열매라고부르기도 해. 그리고 맏물의 반대말, 즉 열매가 가의 다 없어질 때 거두어 들인 것들은 끝물이라고 말한다.\\n무녀리 ｜ 짐승의 맨 처음 낳은 새끼 또는 알\\n개나 돼지처럼 여러 마리의 새끼를 낳을 때 가장 먼저 어미의 뱃속에서 나온 녀석을 무녀리라고 부른다.\\n그런데 무녀리들은 다른 새끼들에 비하여 몸집도 작고 아주 허약하다. 그래서 이 말은 처음에는 어미에게서 처음 태어난 새끼라는 뜻이었다가 나중에는 여러 새끼 가운데 유난히 작고 허약한 새끼라는 뜻으로 바뀌어 쓰인다.\\n출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"둠벙","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=410049&page=24","sourceText":"둠벙 ｜ 땅이 패어서 물이 고인 곳\\n둠이라는 말은 둥글게 만들어졌다는 뜻의 아주 오래된 우리말이다.\\n깊은 산속에 산이 빙 둘러쳐진 곳에 있는 마을을 두메산골이라고 하는데 이 말도 둠이라는 말이 변한 말이고, 시골 마을 이름 가운데 양지뜸, 윗뜸이라는 마을 이름에 나오는 뜸도 마찬가지야.\\n논 옆에 둥글게 땅이 패여서 물이 고여 있는 곳이 있지? 그곳을 둠벙이라고 해. 다른 말로는 웅덩이라고도 하지.\\n논가의 둠벙에는 미꾸라지도 살고 붕어도 살아. 그래서 가을철에는 동네 아저씨들이 둠벙의 물을 모두 퍼내고 그 속에 있는 고기들을 잡아 마을 잔치을 하곤 했었다.\\n둠벙 가운데 작은 것은 옹당이라고 부르고, 아주 작은 웅덩이의 이름을 움파리라고 해. 그러니까 비가 와서 학교 운동장에 잠시 생기는 웅덩이를 움파리라고 말하면 돼.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"여울","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409965&page=24","sourceText":"여울 ｜ 강의 바닥이 얕거나 폭이 좁아서 물살이 세게 흐르는 곳\\n여울은 넓은 강에서 유유히 흐르던 강물이 갑자기 강의 바닥이 얕아지거나 폭이 좁아져서 물살이 세게 흐르는 곳이다.\\n여울중에서도 아주 급하고 빠르게 물이 흐르는 곳은 살여울이라고 부르기도 하고 된여울이라고 부르기도 한다. 또 여울물이 턱을 이루고 흐르는 곳을 여울목이라고 부르고 여울가운데에도 비교적 물이 얕아서 건너기에 위험하지 않은 곳은 여울나들이라고 불러서 구별하기도 했다.\\n- 출처 : 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"는개(비 이름 중 하나)","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409821&page=24","sourceText":"는개 ｜ 안개보다 조금 굵고 이슬비보다 가는 비\\n비 가운데 가장 가느다란 비는 안개비\\n안개비보다 조금 더 물방울이 굵어서 비에 가까운 것을 는개\\n는개보다 더 굵어져서 제대로 비처럼 오는 것을 이슬비\\n이슬비가 굵어지면 가랑비\\n바람도 안 불고 소리없이 내리는 조용한 비는 보슬비\\n보슬비가 오랫동안 쉬임없이 내리면 부슬비\\n빗발이 아주 굵어져서 좍좍 쏟아지면 장대비\\n굵고 거세게 오는 비는 작달비\\n빗방울이 보일 정도로 오는 굵은 비는 발비\\n양동이로 퍼 붓듯이 세차게 오는 비는 억수\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"동살","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409721&page=24","sourceText":"동살 ｜ 해 뜨기 전 동이 트면서 푸르스름하게 비치는 햇살\\n해가 막 떠오르려고 할 때는 온 하늘이 붉은 기운으로 물들어서 마치 물감을 풀어 놓은 것 같아. 해가 조금씩 수평선 너머로 모습을 나타내며 수줍은 듯 붉은 햇살이 온 하늘에 피어올라. 이때 붉은 햇살 사이로 푸르스름한 기운이 퍼져나가는데 이것을 동살이라고 불러. 그러니까 새벽에 해가 뜨면서 본격적으로 넒게 퍼지는 햇빛을 동살이라고 한다.\\n그리고 해가 훤히 떠올라서 온 세상에 환하게 비추는 햇살을 볕살이라고 해.\\n하나 더 얘기해 줄까? 아침에 해가 떠오르는 것은 해돋이라고 말하는데 저녁에 해가 지는 것은 해넘이라고 부른다.\\n그리고 햇빛이 공기 속의 수증기에 비치어서 해의 둘레에 둥그런 테두리가 생기는 일이 있어. 마치 도넛처럼 둘러쳐지는 일이 있어. 비가 오려고 할 때 많이 나타나는데 이런 현상은 햇무리라고 한단다. 달의 주위에 이런 테두리가 만들어지면 달무리라고 하지.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"까치놀","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409678&page=24","sourceText":"까치놀 ｜ 석양을 받아 멀리 수평선 위에서 번뜩이는 물결\\n저녁놀은 붉게 물드는 하늘의 색깔도 아름답지만, 강가나 바닷가에서 물위에 비치는 놀의 모습은 훨씬 더 아름답게 느껴진다. 까치놀은 바닷가에 앉아서 저녁놀을 볼 때 멀리 수평선 위에서 하얗게 흔들려 보이는 물결의 이름이다. 붉게 물든 바닷 물결 위로 흰 물살이 치켜 올라가는 모습이 마치 까치가 하늘로 날아 올라가는 모습과 같아서 그렇게 부른단다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"제비초리","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409527&page=25","sourceText":"제비초리 ｜ 사람의 뒤통수나 앞 이마에 뾰족이 내민 머리털\\n초리는 꼬리의 옛말인데 지금은 잘 쓰지 않는 말이다. 그런데 옛날에는 쓰이다가 지금은 쓰이지 않는 말들이 때때로 다른 말들 속에 남아 있는 경우가 있다.\\n예를 들면, '초리'는 눈초리, 회초리, 제비초리 따위의 말에서 찾아 볼 수가 있다.\\n눈초리는 눈의 바깥쪽 가장자리다. 눈초리가 위로 치켜 올라가면 사나와 보이고 아래로 쳐지면 졸린듯이 보인다. 그 눈초리가 바로 눈 꼬리다.\\n제비초리는 뒤통수나 앞이마에 제비꼬리처럼 뾰족이 내민 머리털을 가리킨다.\\n그런데 이 말과 소리가 아주 비슷한 제비추리라는 말이 있다. 이 말은 소의 안심 부위에 붙은 고기를 가리키는 말인데, 그 고기의 생긴 모양도 제비꼬리와 비슷해서 붙여진 이름이다.\\n출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"고명딸","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409424&page=25","sourceText":"고명딸 ｜ 아들만 있는 집의 외딸\\n요즘 초등학교에는 여학생보다 남학생의 숫자가 훨씬 많아서 여학생과 짝을 하지 못하고 남자아이들끼리 짝을 하는 경우가 점점 많아진다는구나. 이것은 우리나라 부모님들이 전통적으로 딸이 많은 집을 보고 딸부잣집이라고 하지. 딸부잣집이 된 이유는 대부분 여자아이만 낳은 집에서 남자아이를 낳으려고 하다가 자꾸 여자아이만 낳아 그렇게 된 경우란다.\\n이런 경우와는 달리 아들이 여럿인데 딸은 하나만 있는 집이 있지. 이런 집의 외딸을 고명딸이라고 한단다.\\n고명이란 말은 음식의 모양과 맛을 돋우기 위하여 음식 위에 뿌리거나 얹은 것의 이름이야.\\n아들 많은 집의 외딸은 음식 위에 얹은 고명처럼 집에서 귀여움을 독차지하고, 집안 분위기를 부드럽고 명랑하게 만들어 주는 역할을 하기 때문에 고명딸이라고 부르게 되었단다.\\n-출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"고뿔","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409355&page=25","sourceText":"고뿔 ｜ 감기\\n감기는 한자로 씌어진 말인데 우리 토박이 말로는 뭔지 아니? 바로 고뿔이야.\\n'고'는 코의 옛말이고, '뿔'은 본래 불이라는 말인데 소리가 바뀌어서 고뿔이 되었단다.\\n말 그대로 고뿔은 코에 불이 붙었다는 뜻이고, 코에 불이 났으니 머리가 아프고 콧물이 나고 어지럽고 힘든 것은 당연하지. 어때! 아주 그럴 듯 하지 않아?\\n고가 코의 옛말이었다는 것은 고섶이라는 말을 살펴봐도 알 수 있단다.\\n고섶은 코앞에 있는 것처럼 가까운 곳을 뜻하는 말이야. 그리고 섶은 옷섶, 길섶에 쓰이는 말로 가장자리라는 말이니까 고섶이라는 말은 코의 가장자리라는 뜻이고, 길섶은 길가의 풀이 자라나는 곳을 말해.\\n없어진 물건을 찾느라고 수선을 피우다가 가까운 곳에서 찾게 되었을 때 \\"고섶에 두고 난리를 피웠군\\"이라고 한단다.\\n출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"발장단","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409236&page=25","sourceText":"발장단\\n뜻: 발을 까딱거리면서 장단을 맞추는 모양\\n설명: 발을 까딱거리거나 발끝으로 바닥을 두드리며 장단을 맞추는 것을 발장단이라고 한다. 또 발장구라는 말도 있다. 이 말은 헤엄칠 때나 어린 아이들이 엎드려 기어가려고 할 때 두 발을 들었다 놓았다 하는 짓을 말한다. 수영을 처음 배울 때 수영장 가장자리에 앉아서 두 발만 물 속에 넣고 발차기 연습을 하는 그 동작이 바로 발장구다. 때로는 물장구라고 하기도 한다.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"돋을볕과 돋을양지","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409118&page=25","sourceText":"돋을볕과 돋을양지\\n돋을볕: 해돋이 무렵 처음으로 솟아오르는 햇볕.\\n돋을양지: 돋을볕이 잘 드는 양지바른 곳.\\n해님이 살며시 이마를 내밀어요. 어둠을 밀어내고 돋을볕이 솟으면 햇살이 부챗살처럼 퍼지지요. 돋을볕을 '햇귀'라고도 합니다. 돋을볕은 힘차게 느껴지고, 햇귀는 매우 소중하게 느껴지지요.\\n한편, 돋을볕이 잘 드는 양지바른 곳을 돋을양지라고 합니다. 신라의 찬란한 유적인 석굴암은 돋을볕이 잘 드는 돋을양지에 자리하고 있어요. 아침이면 굴 안에 돋을볕이 들어 신비한 분위기가 느껴지요.\\n예문 - 돋을볕이 잘 드는 바닷가 언덕배기 돋을양지에 하얀 집을 지어서 살고 싶어요.\\n- 출처: 글 잘 쓰는 어린이를 위한 예쁜 우리말 사전","images":[]},{"word":"다리매","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=409062&page=25","sourceText":"다리매\\n미스 코리아 대회에 참가한 언니들은 몸매가 참 예쁘지? 키도 크고 다리도 길고, 눈매도 예쁘고 말이야. 그러나 아빠는 사람을 겉모양만 보고 평가해서는 안 된다고 생각해. 아빠가 미스 코리아 이야기를 하는 것은 몸과 관련된 우리말을 설명하기 위해서란다.\\n눈매, 몸매, 입매, 다리매 따위의 말들은 눈과 몸, 입, 다리의 생긴 모양을 나타내는 말이야.\\n그런데 사람들은 눈매나 몸매, 입매라는 말은 자주 사용하지만 다리매라는 말은 쓰지 않는 것 같아.\\n\\"눈매가 독수리처럼 날카로워\\", \\"저 아이는 눈매가 참 부드럽군\\", \\"언니는 몸매가 참 날씬해\\", \\"입매를 보니 참 야무진 성격이겠다.\\"…. 이렇게 눈매나 몸매라는 말을 살려서 쓰고 있는데 \\"다리매가 참 예쁘다\\"라는 말은 잘 하지 않거든.\\n다리매 대신에 각선미라는 한자말을 주로 쓰고있는데 이제부터는 아름다운 우리말을 쓰도록 하자.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"꽃멀미","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408939&page=25","sourceText":"꽃멀미\\n뜻: 꽃의 아름다움에 취해 일어나는 어지러움\\n설명: 멀미는 어지러운 증세를 말하는 것이야.\\n배를 탈 때 생기는 배멀미는 바람이 강하게 불어 파도가 많이 치는 날이면 더 심해진단다. 어떤 사람은 비행기를 탈 때도 멀미를 하곤 해. 엄마는 사람이 많은 시장이나 백화점엘 가면 너무 정신이 없어서 어지럽다고 하지? 그런 것은 사람멀미라고 하는 거야.\\n그러고 보니 멀미라는 말도 참 여러 가지로 쓰이네! 그런데 꽃멀미는 아름다운 꽃밭 속에서 꽃향기에 취해 어지러움을 느끼는 것을 말하니까 이건 참 행복한 멀미라는 생각이 드는구나.\\n- 출처: 딸에게 들려주는 아름다운 우리말","images":[]},{"word":"각다귀판","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408889&page=25","sourceText":"각다귀판\\n뜻: 서로 남의 것을 뜯어먹으려고 덤비는 판\\n설명: '각다귀'는 모기와 비슷하게 생긴 해충이다. 논밭에서 벼나 보리의 뿌리를 갉아먹고 산다. '판'은 '개판, 난장판' 등에 쓰인 '판'과 같이 '어떤 국면'을 지시한다.\\n'각다귀'들이 달려들어 이것저것 갉아먹는 어수선한 국면이 '각다귀판'이다. '모기판'이라는 단어가 없는 것을 보면 '각다귀'가 '모기'보다 훨씬 지독한 해충임을 짐작할 수 있다.\\n'각다귀판'은 그 본래의 의미보다는 '서로 남의 것을 뜯어먹으려고 덤비는 판'이라는 비유적의미로 더 많이 쓰인다.\\n\\"이건 시장이 아니라 완전히 각다귀판일세.\\"에 쓰인 '각다귀판'이 그와 같은 의미로 쓰인 것이다.\\n예문: 사람들이 서로 헐뜯고 싸우는데, 이건 완전히 각다귀판이었다.\\n- 출처: 좋은 글, 좋은 말을 위한 우리말 활용 사전","images":[]},{"word":"가재걸음","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408732&page=25","sourceText":"가재걸음 - 뒷걸음질하는 걸음\\n'가재, 게, 달팽이' 등이 걷는 모습은 아주 독특하다. '가재'는 뒤로 걷고, '게'는 옆으로 걸으며, '달팽이'는 천천히 걷는다.\\n'가재'처럼 슬금슬금 뒷걸음질하는 걸음을 '가재걸음', '게'처럼 옆으로 걷는 걸음을 '게걸음', '달팽이'처럼 '천천히 걷는 걸음'을 달팽이걸음'이라 한다.\\n'가재걸음'은 '뒤로 걷는 걸음'이라는 의미 이외에 '퇴보(退步)'라는 비유적 의미도 갖는다. 뒤로 가는 것은 발전이 아니라 퇴보이기 때문에 '가재걸음'에 그와 같은 의미가 생겨난 것이다.\\n'가재걸음을 치다(발전하지 못하고 도리어 뒤떨어지거나 못하게 되다)'라는 관용어에 쓰인 '가재걸음'도 '퇴보'라는 의미로 쓰인 것이다.\\n예) 하지만 그렇다고 일단 발을 들여놓은 이상 비겁하게 가재걸음을 칠 수 는 없는 일이었다. <김학철, 김학철 산문집>\\n- 출처: 좋은 글, 좋은 말을 위한 우리말 활용 사전","images":[]},{"word":"가납사니","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408660&page=25","sourceText":"가납사니 - 말다툼을 잘하는 사람\\n슬데없는 말을 많이 지껄이는 사람을 '수다쟁이'라고 한다. 이 '수다쟁이'와 의미가 같은 단어가 '가납사니'이다. 물론 '수다쟁이'에는 '낮춤'의 의미가 있고, '가납사니'에는 그것이 없다는 차이가 있다. 아울러 '가납사니'에는 '말다툼을 잘하는 사람'이라는 다른 의미가 있는 것도 '수다쟁이'와 차이점이 있다. 되는 소리 안 되는 소리 쓸데없이 지껄이다 보면 오해가 생기고 그로 인해 말다툼이 벌어질 수 있다. 그래서 '가납사니'에 '말다툼을 잘하는 사람'이라는 의미가 생겨난 것이다. '가납사니'는 '가납'과 '사니'가 결합된 어형인데, 가납의 어원은 분명하지 않다. 다만 '사니'는 '마사니(타작 마당에서 마름을 대신하여 곡식을 되는 사람), 욕사니(남에게 욕을 많이얻어먹는 사람)'등을 보면 '하찮은 사람'을 지시함을 알 수 있다.\\n예문 - 그녀가 보고 싶다. 가납사니 같은 인감 담당 최 여사. 늘 최주사님 왜 그렇게 사세요, 하며 같은 최씨라고 안쓰러워 하던 그녀가 불현듯 보고 싶다. <고병돌, 각시붕어>\\n- 출처: 좋은 글, 좋은 말을 위한 우리말 활용 사전","images":[]},{"word":"행동거지를 나타내는 말 5","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408553&page=26","sourceText":"★ 큰춤보다 - 자기를 위한 큰춤의 의식이 베풀어지는 영화를 누리다.\\n예) 자손을 직심스레 기르더니 드디어 큰춤보는 영광을 누리는구나.\\n★ 광치다 - ① 번쩍번쩍 빛을 내다. ② 남에게 드러내어 실상(實狀)을 이상으로 풍을 치다.\\n예) 저 사람은 타향에 가면 풍치고 다닌다.\\n★ 나부대다 - 철없이 가볍게 부스대다.\\n예) 남보다 좀 아는 게 있다고 분수없이 나부대면 따돌림받기 쉽다.\\n★ 퉁어리적다 - 옿은지 그른지도 모르고 아무 생각없이 행동하다.\\n★ 맨망떨다 - 요망스럽게 까불다.\\n★ 잘잘거리다 - 이리저리 채신없이 쏘대다.\\n예) 나이를 먹어서도 잘잘거리고 다닌다.\\n★ 호드득거리다 - ① 경망하게 연해 방정을 떨다. ② 콩이나 깨를 볶을 때에 톡톡 튀어 소리가 연해 나다. ③ 여러 개의 총포(銃砲)나 딱총 따위가 연해 터지며 소리가 나다.\\n★ 날바람잡다 - 바람이 들어서 너무 허무하게도 함부로 헤매고 돌아다니다.\\n예) 세상 물정도 모르고 날바람잡고 다니는 사람이 많다.\\n★ 괘방치다 - 비밀한 일을 드러내다.\\n★ 소양배양하다 - 나이가 젊어서 함부로 날뛰기만 하고 철이 아직 없다.\\n★ 판둥거리다 - 아무 일이 없이 빤빤스럽게 놀고만 있다.\\n예) 언제까지 그렇게 판둥거리고 살려느냐.\\n★ 어리칙칙하다 - 일부러 어리석은 체하다.\\n예) 겉으로는 어리칙칙학 굴면서 속엔 딴 생각을 품고 있다.\\n★ 군던지럽다 - 마음이나 행세가 추저분하다.\\n★ 근대다 - 성가시게 굴다. 귀찮은 느낌이 나도록 지근덕거리다.\\n예) 초등학교 남자 어린이가 여자 어린이를 자꾸 근대다.\\n★ 자근거리다 - ① 남이 싫어하도록 건드려서 괴롭게 굴다. ② 남이 귀찮아하도록 조르다. ③ 어떤 물건을 약한 힘으로 자꾸 눌러 깨뜨리다.\\n예) 입술을 자근거리다.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","images":[]},{"word":"행동거지를 나타내는 말 4","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408424&page=26","sourceText":"♣ 날밤새우다 - 공연히 뜬눈으로 밤을 지내다.\\n예) 날밤새운 덕으로 그 원고를 다 쓸 수가 있었다.\\n♣ 한둔 - 한데에서 밤을 지냄.\\n예) 이런 날씨에 한둔하면 몸에 나쁩니다.\\n♣ 조리치다 - 졸음이 올 때에 잠깐 졸고 깨다.\\n예) 남몰래 조리치는 재주 좀 배우고 싶다.\\n♣ 굴침스럽다 - 무엇을 억지로 하려고 애쓰는 태도가 있다.\\n예) 법과 대학 재학중에 사법고시에 합격하려고 굴침스럽게 공부를 한다.\\n♣ 길나다 - 행동이 한방면으로 터지다\\n예) 어려운 일도 자꾸 노력하면 끈내는 길나고 만다.\\n♣ 잔다리밟다 - 출세할 때에 낮은 데로부터 시작하여 차차 오르다.\\n예) 저 사람은 사환으로부터 잔다리밟아 장관까지 됐다.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","images":[]},{"word":"행동거지를 나타내는 말 3","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408357&page=26","sourceText":"♣ 알음장 - 눈치로 알리어 주는 것.\\n♣ 눈주다 - 가만히 약속의 뜻을 보이어 눈짓을 하다.\\n예) 그가 넌지시 눈주면서 먼저 자리를 떴다.\\n♣ 드레지다 - 사람됨이 틀거지가 있어서 가볍지 아니하다. 인격적으로 점잖아서 무게가 있다.\\n예) 그 사람의 태도에는 드레진 데가 있어 믿음직스럽다.\\n♣ 산드러지다 - 태도가 경쾌하다\\n♣ 씻가시다 - 씻어서 가시다. 그릇을 물로 깨끗이 씻어서 더러운 것이 없이 가시다.\\n♣ 어연번듯하다 - 세상에 드러내놓기에 아주 떳떳하고 번듯하다.\\n예) 자식을 혼자 손으로 어연번듯하게 키웠다.\\n♣ 통돌다 - 여러 사람의 뜻이 같이 되어 그리하기로 서로 알리어지다.\\n예) 동지끼리 통돈 약속을 어겨서야 되겠는가?\\n♣ 통짜다 - 여럿이 한 동아리가 되기를 약속하다\\n♣ 풀치다 - 맺혔던 생각을 돌리어 너그럽게 용서하다.\\n♣ 하청치다 - 절에서 재가 끝날 때에 여흥을 하다.\\n♣ 노박이로 - 줄곧 오래 붙박이로\\n예) 시험 때문에 노박이 도선관에 다녔다.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","images":[]},{"word":"행동거지를 나타내는 말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408245&page=26","sourceText":"♣ 누이바꿈 - 누이를 처남과 혼인시킴.\\n예) 어느 고장에서는 누이바꿈하는 사람을 보고 항아리 사돈이라고 한다.\\n♣ 섞바꾸다 - 섞어서 바꾸다.\\n예) 어른과 어린이가 섞바꾸어 앉다.\\n♣ 섞사귀다 - 지위와 환경이 다른 사람들끼리 서로 사귀다.\\n예) 그 애는 누구하고나 잘 섞사귄다.\\n♣ 손겪다 - 손님을 대접하다.\\n♣ 수세 - 이혼의 증서. 남자가 여자에게 줌.\\n예) 사람이 죽고 사는 판에 수세 따위가 무슨 소용이 있는가.\\n♣ 집알이 - 남이 새로 집을 들었을 때에 집 구경 겸 인사로 찾아보는 일.\\n예) 이사한 지 한 달이 지나도록 집알이를 못 갔으니 체면이 말이 아니다.\\n♣ 방나다 - 집안의 재물이 죄다 없어진다.\\n예) 그 아들 때문에 그 집은 방나고 말았다.\\n♣ 톡탁치다 - 올고 그름을 가릴 것이 없이 다 쓸어 없애다.\\n♣ 버성기다 - ① 벌어져서 틈이 있다. ② 두 사람의 사이가 탐탁하지 않다.\\n예) 점점 더 둘 사이가 버성겨서 큰일이다.\\n♣ 보쟁이다 - 부부가 아닌 남녀가 은밀히 관계를 연하여 맺다.\\n♣ 본치 - 남의 눈에 띄는 태도.\\n♣ 차깔하다 - 문을 굳게 닫아 잠가 두다.\\n♣ 폴짝 - 문을 갑작스레 열거나 닫는 모양.\\n- 출처 : 사전 속에서 잠자는 보배로운 우리말","images":[]},{"word":"행동거지를 나타내는 말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408128&page=26","sourceText":"♣ 나볏이 - 매우 떳떳하고 의젓하게. < 너볏이\\n예) 남자라면 세상을 나볏이 걸을 수 있어야지.\\n♣ 나수다 - ① 내어서 드리다. ② 높은 자리로 나아가게 하다\\n♣ 나쪼다 - 어른 앞에 나아오다\\n♣ 손심부름 - 몸 가까이 있는 일에 대한 잔심부름\\n예) 저 애는 내 곁에 두고 손심부름이나 시키고 싶다.\\n♣ 붙좇다 - 공경하는 마음이나 섬기는 뜻으로 가까이 하여 쫓다.\\n예) 평생 마음으로 붙좇고 있을 뿐입니다.\\n♣ 짓나다 - 흥겨워 멋을 부리다.\\n예) 아기가 젖을 먹고 나더니 한창 짓나서 재롱을 피운다.\\n♣ 가동이치다 - 가동질(어린 아이의 양쪽 겨드랑이를 치켜들고 올렸다 내렸다 할 때, 아이가 다리를 웅그렸다 폈다 하는 짓)을 힘치하게 하다.\\n♣ 간질밥 먹이다 - 남의 살을 간지럽게 일부러 건드리다.\\n예) 어린 아이를 간질밥 먹이지 마라.\\n♣ 가탈거리다 - 말의 걸음이 탄 사람에겍 불편을 자꾸 주다.\\n예) 말이 돌서덜길을 가탈 거리며 간다.\\n♣ 굽닐다 - 몸을 구부리다 일으키다 하다. 몸을 구부리고 일으키고 하여 일하다\\n예) 가을 논에 황금 물결이 굽닐다.\\n♣ 옴살 - 한몸같이 친밀한 터.\\n- 출처 : 사전 속에 잠자는 보배로운 우리말","images":[]},{"word":"언동(言動)에 관계 되는 순 우리말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=408043&page=26","sourceText":"♣ 하리놀다 - 남을 헐뜯어 웃사람에게 일러바치다.\\n♣ 자빡대다 - 아주 거절하다.\\n♣ 야스락거리다 - 입담이 있게 계속하여 말을 늘어놓다.\\n♣ 뎅걸뎅걸 - 벽이나 문을 사이에 두고 들리는 여러 사람의 떠드는 소리.\\n♣ 엉두덜거리다 - 원망이나 불만이 있어 중얼중얼하다.\\n♣ 게정 - 불평스럽게 떠드는 말과 행동.\\n♣ 살똥스럽다 - 말이나 하는 짓이 독살스럽고 당돌하다.\\n♣ 대받다 - 남의 말에 반항하여 들이대다.\\n♣ 말질 - 이러니 저러니 하고 시비를 말하는 짓.\\n♣ 막서다 - 싸울 것같이 함부로 대들다.\\n♣ 진대 - 남에게 기대어 억지를 쓰다시피 하여 괴롭히는 짓.\\n♣ 우세 - 남에게서 받는 비웃음.\\n♣ 쌩뚱같다 - 말이나 하는 짓이 앞뒤가 서로 맞지 아니하고 엉뚱하다.\\n♣ 으밀아밀 - 남모르게 비밀히 이야기하는 모양.\\n♣ 새잡다 - 남의 비밀을 엿듣다.\\n♣ 배참 - 윗사람에게 꾸지람을 듣고, 그 화풀이를 다른 데다 하는 일.\\n♣ 떠대다 - 거짓으로 꾸며 대답하다.\\n♣ 쇠 - 남을 낮추어서 일컫는 말.\\n♣ 남우세 - 남에게 웃음과 조롱을 받게 됨.\\n♣ 뒤받다 - 잘못을 꾸짖을 때에 도리어 반항하다.\\n♣ 울릉대다 - 힘이나 말로써 남을 위협하다.\\n♣ 조작거리다 - 지나치게 아는 체하며 떠들다.\\n♣ 가납사니 - 쓸데없는 말을 잘하는 사람.\\n♣ 타목 - 탁하고 쉰 목소리.\\n♣ 새청 - 날카로운 목소리.\\n♣ 들음들음 - 가끔 조금씩 들음.\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"언동(言動)에 관계 되는 순 우리말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407916&page=26","sourceText":"♧ 말곁 - 남이 말하는 옆에서 덩달아서 하는 말.\\n♧ 가납사니 같다 - 되는 소리 안 되는 소리로 입을 잘 놀리다.\\n♧ 게정내다 - 불평의 말과 행동을 나타내다.\\n♧ 고자누룩하다 - 떠들다가 잠잠하다.\\n♧ 괘꽝스럽다 - 말이나 행동이 예상밖으로 괴이하다.\\n♧ 말맛 - 말이 주는 느낌.\\n♧ 여짓거리다 - 말을 할 듯 할 듯 자꾸 머뭇거리다.\\n♧ 자냥스럽다 - 재잘거리는 소리가 듣기에 똑똑하다.\\n♧ 귀질기다 - 감각이 둔하고 말귀가 어둡다.\\n♧ 퍅퍅쏘다 - 입바른 말을 잘한다.\\n♧ 마구발방 - 법도 없이 함부로 하는 언행.\\n♧ 새롱거리다 - 경솔하고 방정맞게 야불야불 계속해서 지껄이다.\\n♧ 여겨듣다 - 자세히 듣다.\\n♧ 귀거칠다 - 듣기에 거북하다.\\n♧ 나다분하다 - 여럿이 수다스럽고 지저분하게 뒤섞여서 갈피를 잡기 어렵다.\\n♧ 넌덕 - 너털웃음을 치고 솜씨 있는 말을 늘어놓는 짓.\\n♧ 땀직하다 - 말이나 행동이 겉보기보다는 무게 있어 보이다.\\n♧ 물색없다 - 말이나 행동이 조리에 닿지 아니하다.\\n♧ 새살거리다 - 상글상글 웃으면서 재미있게 지껄이다.\\n♧ 속말 - 참된 정 또는 믿는 마음에서 우러나오는 말.\\n♧ 수수꾸다 - 실없이 장난말로 남을 부끄럽게 만들다.\\n♧ 비웃적거리다 - 비웃는 태도로 자꾸 빈정거리다.\\n♧ 숙설거리다 - 미친 사람처럼 실떡거리다.\\n♧ 시설거리다 - 싱글싱글 웃으면서 재미있게 지껄이다.\\n♧ 씨우적거리다 - 못마땅하여 입속으로 불평스럽게 말하다.\\n♧ 악장치다 - 악을 쓰며 싸우다.\\n♧ 왜장치다 - 띄워 놓고 헛되이 큰소리를 치다.\\n♧ 엉절거리다 - 잔소리로 원망하는 뜻을 나타내다.\\n♧ 여짓여짓 - 말이 나올 듯한 모양.\\n♧ 엉너리 - 남의 환심을 사기 위하여 어벌쩡하게 서두르는 짓.\\n♧ 연사질 - 교묘한 말로 남을 꾀어서 그 속마음을 떠보는 짓.\\n♧ 으드등거리다 - 불평스러운 말로 자꾸 으르렁거리다.\\n♧ 입찬소리 - 자기의 현재 지위나 능력을 믿고 자랑하는 장담.\\n♧ 잔주 - 술이 취한 뒤에 늘어놓는 잔말.\\n♧ 존조리 - 나무라는 뜻으로 조리 있고 친절하게\\n- 사전 속에 잠자 자는 보배로운 우리말 중에서 -","images":[]},{"word":"성격을 나타내는 순 우리말 2","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407620&page=26","sourceText":"♬ 불뚱이 - 걸핏하면 불뚱거리기를 잘하는 성질.\\n♬ 여낙낙하다 - 성미가 부드럽고 고우며 재빠르다.\\n♬ 수더분하다 - 성질이 순하고 소박하다.\\n♬ 숫지다 - 후하고 순박하다.\\n♬ 술명하다 - 수수하고 걸맞다.\\n♬ 숙부드럽다 - 심성이 뻣뻣하지 아니하고 부드럽다.\\n♬ 숫하다 - 순박하고 진실하다.\\n♬ 숫접다 - 순박하고 진실한 태도가 있다.\\n♬ 틀수하다 - 성질이 넓고 깊다.\\n♬ 살갑다 - 겉으로 보기보다는속이 너르다.\\n♬ 귀여리다 - 남의 말을 곧이듣기를 잘하다.\\n♬ 잔질다 - 마음이 굳세지 못하고 약하다.\\n♬ 잔작하다 - 나이보다 늦되고 용렬하다.\\n♬ 잔밉다 - 몹시 얄밉다.\\n♬ 잔부끄럼 - 부끄럼을 타지 아니할 만한 작은 일에도 부끄러워하는 마음.\\n♬ 의뭉 - 겉으로는 어리석은 것 같으나 속으로는 슬기가 있음.\\n♬ 개염 - 부러운 마음으로 샘을 내어 탐내는 욕심.\\n♬ 강새암 - 상대되는 이성이 다른 이성과 좋아함을 미워하는 새암.\\n♬ 트레바리 - 까닭없이 남의 일에 반대하기를 좋아하는 성격.\\n♬ 용퉁하다 - 소견머리가 없고 매우 미련하다.\\n♬ 쫍치다 - 활달하지 못하고 옹졸하게 만들다.\\n♬ 암띠다 - 비밀을 좋아하는 성질이 있다.\\n♬ 끼이다 - 사람을 싫어하다.\\n♬ 더펄이 - 성미가 꽁하지 아니하고 덥적덥적하여 활발한 사람.\\n♬ 헙헙하다 - 융통성이 있어 활발하다.\\n♬ 늡늡하다 - 속이 너그럽고 활달하다.\\n♬ 궁굴리다 - 너그러이 생각하다.\\n♬ 수련하다 - 마음이 순하고 곱다.\\n♬ 말짱말짱하다 - 사람의 성질이 물러서 만만하다.\\n♬ 올곧다 - 마음이 바르고 곧다.\\n♬ 똑하다 - 거짓이 없이 고지식하다.\\n♬ 무양무양하다 - 너무 고지식하여 주변성이 없다.\\n♬ 시망스럽다 - 몹시 짓궂다.\\n♬ 야당스럽다 - 매몰하고 사막스럽다.\\n♬ 걸쌈스럽다 - 남에게 지고자 아니하고 억척스럽다.\\n♬ 아망 - 아이들이 부리는 오기\\n- 사전 속에 잠자는 보배로운 우리말 중에서 -","images":[]},{"word":"성격을 나타내는 순 우리말 1","sourceUrl":"https://www.cbec.go.kr/hangeul/sub.php?menukey=223&mod=view&no=407535&page=27","sourceText":"♬ 마음자리 - 마음의 본바탕.\\n♬ 마음눈 - 사물의 참모습을 똑똑히 식별하는 마음의 힘.\\n♬ 소사스럽다 - 간사하고 좀스럽다.\\n♬ 가스러지다 - 성질이 온순하게 있지 못하고 거칠어지다.\\n♬ 사막하다 - 가혹하고 용서함이 없다.\\n♬ 사박스럽다 - 성질이 독살스럽고 당돌하여 대중없이 함부로 쏙쏙 내달아 간섭하기를 좋아하다.\\n♬ 양심 - 사막스럽고 암상스러우며 괴까닭스럽고 샘하는 마음.\\n♬ 데설궂다 - 성질이 털털하고 호방하여 꼼꼼하지 못하다.\\n♬ 떡심 - 억세고 질긴 심줄.\\n♬ 무작하다 - 무지하고 우악하다.\\n♬ 뒤넘스럽다 - 되지 못하게 건방지다.\\n♬ 새살스럽다 - 성질이 차분하지 못하고 실없이 수선부리기를 좋아하다.\\n♬ 가시세다 - 앙칼스럽고 고집이 세다.\\n♬ 목곧다 - 어거지가 세어 남에게 호락호락하게 굽히지 아니하다.\\n♬ 검세다 - 성질이 끈덕지고 억세다.\\n♬ 어기차다 - 성질이 매우 굳세다.\\n♬ 몽짜스럽다 - 보기에 겉으로는 어리석은 체하나, 속으로는 딴생각을 가지고 있다.\\n♬ 매욱하다 - 어리석고 둔하다.\\n♬ 해망적다 - 총명하지 못하고 아둔하다.\\n♬ 위양배양하다 - 요량이 적고 분수가 없어 아둔하다.\\n♬ 어물다 - 사람의 성질이 야무지지 못하다.\\n♬ 어리뜩하다 - 똑똑한 정도가 보통에 미치지 못하다
